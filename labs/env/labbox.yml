# A Linux shell on your Mac for the networking and operating systems lessons.
#   docker compose -f env/labbox.yml run --rm box        everyday box: strace, tcpdump, tc, cgroups
#   docker compose -f env/labbox.yml run --rm box-priv   privileged box: unshare, io_uring, mounts
# The labs folder is mounted at /labs, so files you edit on the Mac appear inside.
name: sfz-labbox
services:
  box:
    build: ./labbox
    image: sfz-labbox:1
    hostname: box
    working_dir: /labs
    volumes:
      - ..:/labs
    cap_add: [SYS_PTRACE, NET_ADMIN, NET_RAW]
    stdin_open: true
    tty: true
  box-priv:
    image: sfz-labbox:1
    hostname: box-priv
    working_dir: /labs
    volumes:
      - ..:/labs
    privileged: true
    security_opt: ["seccomp=unconfined"]
    stdin_open: true
    tty: true
