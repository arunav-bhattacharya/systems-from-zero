# OpenSearch 3.9, three nodes, for lesson nosql-18 (inside a search cluster: nodes, shards and replicas).
#   docker compose -f env/opensearch-cluster.yml up -d --wait     start it (healthy after one to two minutes)
#   sh env/opensearch-cluster/nosql-18-merchants.sh                the merchants index: 3 primaries, 1 replica, 12 merchants
#   curl -s 'localhost:9200/_cat/nodes?v'                          the three nodes, from the Mac (os1 on 9200, os2 on 9201, os3 on 9202)
#   docker compose -f env/opensearch-cluster.yml stop os3          take one node away (up -d --wait brings it back)
#   docker compose -f env/opensearch-cluster.yml down -v           stop all three and delete the data
# It uses port 9200 like env/opensearch.yml, so run one or the other.
#
# Every node is cluster-manager-eligible and holds data, which is fine for a lab. A production cluster
# usually has three dedicated cluster managers and separate data nodes. Each dotted name under
# `environment` is an opensearch.yml setting: the image passes it to OpenSearch as -Ename=value, and a
# list such as node.roles is comma-separated.
#
# Security is switched off: this is a lab cluster on 127.0.0.1 only, so plain http, no TLS between the
# nodes and no password. Never run a real cluster like this.
# Memory: a 512 MB heap per node under a 1 GB container limit, about 3 GB for the whole cluster.
# Checked on arm64 (Apple silicon); the image is multi-arch.
name: sfz-opensearch-cluster

x-node: &node
  image: opensearchproject/opensearch:3.9.0
  mem_limit: 1g
  # two CPUs per node: OpenSearch sizes its thread pools by the CPUs it sees, and fewer threads use less memory
  cpus: 2
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  healthcheck:
    # this node answers, and the cluster it sees has every primary assigned
    test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -q -E '\"status\":\"(green|yellow)\"'"]
    interval: 5s
    timeout: 10s
    retries: 60
    start_period: 20s

x-env: &env
  cluster.name: sfz-search
  node.roles: cluster_manager,data
  network.host: 0.0.0.0
  discovery.seed_hosts: os1,os2,os3
  # only read the very first time the cluster forms; ignored once it has a cluster state
  cluster.initial_cluster_manager_nodes: os1,os2,os3
  OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
  DISABLE_SECURITY_PLUGIN: "true"
  DISABLE_INSTALL_DEMO_CONFIG: "true"

services:
  os1:
    <<: *node
    environment:
      <<: *env
      node.name: os1
    ports: ["127.0.0.1:9200:9200"]
    volumes: [os1:/usr/share/opensearch/data]
  os2:
    <<: *node
    environment:
      <<: *env
      node.name: os2
    ports: ["127.0.0.1:9201:9200"]
    volumes: [os2:/usr/share/opensearch/data]
  os3:
    <<: *node
    environment:
      <<: *env
      node.name: os3
    ports: ["127.0.0.1:9202:9200"]
    volumes: [os3:/usr/share/opensearch/data]

volumes:
  os1:
  os2:
  os3:
