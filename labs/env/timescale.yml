# TimescaleDB 2.31 on PostgreSQL 18, for the time-series Try-it in lesson nosql-12.
# (Timescale, the company, renamed itself Tiger Data in 2025; the extension is still TimescaleDB.)
#   docker compose -f env/timescale.yml up -d --wait                  start it (healthy after a few seconds)
#   docker compose -f env/timescale.yml exec tsdb psql -U sfz         a psql prompt on database sfz
#   docker compose -f env/timescale.yml exec tsdb psql -U sfz -f /sfz/nosql-12-latency.sql
#                                                                     create the hypertable and one day of latencies
#   docker compose -f env/timescale.yml down -v                       stop it and delete the data
# No host port, so it never clashes with env/postgres.yml; use `exec`.
name: sfz-timescale
services:
  tsdb:
    image: timescale/timescaledb:2.31.0-pg18
    environment:
      POSTGRES_USER: sfz
      POSTGRES_PASSWORD: sfz
      POSTGRES_DB: sfz
      TIMESCALEDB_TELEMETRY: "off"
    mem_limit: 768m
    shm_size: 256m
    volumes:
      - ./timescale:/sfz:ro
    healthcheck:
      # over TCP: the temporary server that runs the init scripts listens only on a socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sfz -d sfz"]
      interval: 2s
      timeout: 3s
      retries: 30
