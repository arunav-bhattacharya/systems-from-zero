# RabbitMQ 4.4.0, one node, with the management plugin (web UI and HTTP API on localhost:15672, user guest/guest).
# Used by lesson 1 of the Messaging and logs track (queues and brokers). Run these from the labs folder:
#   docker compose -f env/rabbitmq.yml up -d --wait              start it and wait until it answers
#   docker compose -f env/rabbitmq.yml exec rabbitmq bash        a shell; rabbitmqadmin (v2) and rabbitmqctl are on the PATH
#   docker compose -f env/rabbitmq.yml down -v                   stop it and delete the data
# AMQP 0-9-1 and AMQP 1.0 clients on your Mac connect to localhost:5672.
name: sfz-rabbitmq
services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      # keep the Erlang VM small: one scheduler per core is plenty for a lab
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 2s
