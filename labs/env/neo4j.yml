# Neo4j 2026.10 Community for lesson nosql-11 (graph databases with Neo4j and Cypher).
#   docker compose -f env/neo4j.yml up -d --wait                          start it (healthy after about 20 seconds)
#   docker compose -f env/neo4j.yml exec neo4j cypher-shell                  a Cypher prompt (type :exit to leave)
#   docker compose -f env/neo4j.yml exec neo4j cypher-shell -f /sfz/nosql-11-fraud.cypher
#                                                                            load the fraud graph (deletes what is there first)
#   docker compose -f env/neo4j.yml down -v                                  stop it and delete the data
# Cypher files in env/neo4j/ are mounted read-only at /sfz.
# Authentication is off: this is a lab database on 127.0.0.1 only. Browser: http://localhost:7474
# Memory: a 384 MB heap and a 128 MB page cache, under a 1.5 GB container limit (cypher-shell runs inside too).
name: sfz-neo4j
services:
  neo4j:
    image: neo4j:2026.10.1
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
      # cypher-shell is a second JVM in the same container: keep its heap small too
      JAVA_OPTS: -Xmx128m
      NEO4J_dbms_usage__report_enabled: "false"
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    mem_limit: 1536m
    volumes:
      - ./neo4j:/sfz:ro
    healthcheck:
      # the Bolt port answers once the database is ready (no extra JVM for the check)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/7687' && wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s
