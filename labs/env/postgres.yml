# PostgreSQL 18 for the SQL and database internals lessons.
#   docker compose -f env/postgres.yml up -d
#   docker compose -f env/postgres.yml exec db psql -U sfz        a psql prompt
#   docker compose -f env/postgres.yml down -v                     stop and delete the data
# Scripts in env/postgres/initdb run once, in file-name order, when the data volume is new:
#   00-extensions.sql  pageinspect, pg_buffercache and pg_stat_statements in database sfz
#   10-course.sql      database "course" for the SQL track: the payments schema and its small seed,
#                      copies of labs/sql/src/test/resources/sfz/sql/support/{schema,seed}.sql
# The SQL track connects to it with:
#   docker compose -f env/postgres.yml exec db psql -U sfz -d course
# The large data set for the index and EXPLAIN lessons loads on demand, into schema "big":
#   docker compose -f env/postgres.yml exec db psql -U sfz -d course -f /seed/load-big.sql
name: sfz-postgres
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sfz
      POSTGRES_PASSWORD: sfz
      POSTGRES_DB: sfz
    # pg_stat_statements needs to be preloaded before its view returns rows;
    # track_io_timing adds read times to EXPLAIN (ANALYZE, BUFFERS)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    ports: ["5432:5432"]
    mem_limit: 1g
    shm_size: 256m
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres:/seed:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sfz -d sfz"]  # TCP: the image's first-start init server listens on the socket only
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
