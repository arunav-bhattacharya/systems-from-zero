# Apache Cassandra 5.0, one node, for the NoSQL lessons.
#   docker compose -f env/cassandra.yml up -d --wait          start it (healthy after about a minute)
#   docker compose -f env/cassandra.yml exec cassandra cqlsh  a CQL prompt
#   docker compose -f env/cassandra.yml down -v               stop it and delete the data
# CQL files in env/cassandra/ are mounted read-only at /sfz, so `cqlsh -f /sfz/<file>.cql` loads one.
name: sfz-cassandra
services:
  cassandra:
    image: cassandra:5.0.9
    environment:
      CASSANDRA_CLUSTER_NAME: sfz
      # left alone, Cassandra sizes its heap from the VM's memory; set both or neither
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports: ["9042:9042"]
    mem_limit: 1536m
    volumes:
      - ./cassandra:/sfz:ro
      - cassdata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
volumes:
  cassdata:
