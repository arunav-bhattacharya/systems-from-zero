# Redis 8.10 for the Caching and in-memory data lessons and the other lessons that use Redis (single node, default configuration).
#   docker compose -f env/redis.yml up -d
#   docker compose -f env/redis.yml exec redis redis-cli        a redis-cli prompt
#   docker compose -f env/redis.yml down -v                     stop and delete the data
# The port is published on 127.0.0.1 only: the image runs with no password and protected mode off.
#
# The eviction lesson (lesson 5 of the cache track) also uses a second, tiny server with a 4 MB memory limit. It starts only
# when you name its profile, so the commands above never start it:
#   docker compose -f env/redis.yml --profile small up -d redis-small
#   docker compose -f env/redis.yml exec redis-small redis-cli
#   docker compose -f env/redis.yml --profile small down -v      stops both servers
name: sfz-redis
services:
  redis:
    image: redis:8.10.3
    ports: ["127.0.0.1:6379:6379"]
    mem_limit: 256m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis-small:
    image: redis:8.10.3
    profiles: ["small"]
    # an empty server already uses about 1.4 MB, so 4 MB leaves room for about 2,000 values of 1 KB;
    # no snapshots: this server is for filling up and throwing away
    command: ["redis-server", "--maxmemory", "4mb", "--maxmemory-policy", "noeviction", "--save", ""]
    ports: ["127.0.0.1:6380:6379"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  redisdata:
