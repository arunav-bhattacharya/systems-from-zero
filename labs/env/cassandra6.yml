# Apache Cassandra 6.0-alpha2, one node, with Accord transactions switched on, for the optional
# Try-it in lesson txn-08. ALPHA software: the transaction syntax may change before 6.0 is released.
#   docker compose -f env/cassandra6.yml up -d --wait          start it (healthy after one to three minutes)
#   docker compose -f env/cassandra6.yml exec cassandra6 cqlsh -f /sfz/nosql-10-accord.cql
#                                                              create the two Accord tables and two balances
#   docker compose -f env/cassandra6.yml exec cassandra6 cqlsh a CQL prompt
#   docker compose -f env/cassandra6.yml down -v               stop it and delete the data
# No host port, so it never clashes with env/cassandra.yml; talk to it through `exec`.
# Accord is off by default in 6.0 (`accord.enabled: false`); the command below appends
# `accord: enabled: true` to cassandra.yaml before the node starts.
name: sfz-cassandra6
services:
  cassandra6:
    image: cassandra:6.0-alpha2
    entrypoint: ["bash", "-c", "printf 'accord:\\n  enabled: true\\n' >> /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"]
    environment:
      CASSANDRA_CLUSTER_NAME: sfz6
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    mem_limit: 1792m
    volumes:
      - ./cassandra:/sfz:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
