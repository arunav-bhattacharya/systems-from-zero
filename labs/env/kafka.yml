# Apache Kafka 4.4.0, one node in KRaft combined mode (broker and controller in one process).
# Used by the Kafka lessons. Run these from the labs folder:
#   docker compose -f env/kafka.yml up -d --wait                start it and wait until it answers
#   docker compose -f env/kafka.yml exec kafka bash             a shell; the Kafka tools are in /opt/kafka/bin
#   docker compose -f env/kafka.yml down -v                     stop it and delete the data
# Programs on your Mac connect to localhost:9092. Tools inside the container use the same address.
# Other containers in this file reach the broker on kafka:19092.
#
# Lesson 11 (schemas, Connect, change data capture) adds services behind profiles, so a plain `up` never starts them:
#   docker compose -f env/kafka.yml --profile schemas up -d --wait    + Schema Registry on localhost:8081
#   docker compose -f env/kafka.yml --profile cdc up -d --wait        + PostgreSQL 18 (localhost:5433, logical WAL)
#                                                                       and a Kafka Connect worker with Debezium (localhost:8083)
#   docker compose -f env/kafka.yml --profile schemas --profile cdc down -v   stop everything and delete the data
# Partition data lives in /var/lib/kafka/data inside the container (one directory per partition).
name: sfz-kafka
services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: 94a6CAJkQ-uAyBTD2cxL5A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for programs on your Mac, INTERNAL for the other containers of this file
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      # one node, so every internal topic gets one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # lab speed-ups, so retention and compaction show up in seconds instead of minutes:
      # check retention every 5 s (default 5 min) and let the log cleaner look for work every 2 s (default 15 s)
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_LOG_CLEANER_BACKOFF_MS: 2000
      # groups on the new protocol (group.protocol=consumer) hear about rebalances on their heartbeat:
      # every second here instead of every 5 s, so a rebalance shows up in a second or two
      KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS: 500
      KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    mem_limit: 1g
    healthcheck:
      # a small JVM of its own, so the check never borrows the broker's heap settings
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx96m /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
      start_interval: 3s

  # Lesson 11: Confluent Schema Registry 8.4 (it matches Kafka 4.4). It keeps every schema in the topic _schemas.
  schema-registry:
    profiles: ["schemas"]
    image: confluentinc/cp-schema-registry:8.4.0
    hostname: schema-registry
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    mem_limit: 512m
    healthcheck:
      # the image has no curl: ask for /subjects over bash's /dev/tcp and look for a 200
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
      start_interval: 3s

  # Lesson 11: the payment service's database. wal_level=logical lets Debezium (and pg_logical_slot_get_changes)
  # read committed changes from the write-ahead log. Tables: env/kafka/cdc-init.sql. psql: user and password sfz.
  postgres:
    profiles: ["cdc"]
    image: postgres:18
    hostname: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4", "-c", "shared_buffers=32MB"]
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: sfz
      POSTGRES_PASSWORD: sfz
      POSTGRES_DB: payments
    volumes:
      - ./kafka/cdc-init.sql:/docker-entrypoint-initdb.d/cdc-init.sql:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfz -d payments"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Lesson 11: one Kafka Connect worker (distributed mode) with the Debezium connectors installed. REST API on 8083.
  connect:
    profiles: ["cdc"]
    image: quay.io/debezium/connect:3.7.1.Final
    hostname: connect
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: sfz-connect                 # workers with the same group id form one Connect cluster
      CONFIG_STORAGE_TOPIC: connect-configs # connector configs
      OFFSET_STORAGE_TOPIC: connect-offsets # where each source connector got to (for Debezium: a WAL position)
      STATUS_STORAGE_TOPIC: connect-status
      # one broker, so Connect's own topics get one replica (the defaults, 3, need three brokers)
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
      start_interval: 3s
