# Seed for the three Sentinels in env/redis-ha.yml. Each Sentinel copies this file to /tmp at start,
# because a Sentinel rewrites its own config file as it learns about replicas, other Sentinels and failovers.
port 26379
# the servers are known by their Compose names, not by IP addresses
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
# watch the primary called "payments"; 2 of the 3 Sentinels must agree it is down
sentinel monitor payments primary 6379 2
# 3 seconds without a valid reply counts as down (the default is 30 seconds)
sentinel down-after-milliseconds payments 3000
sentinel failover-timeout payments 10000
sentinel parallel-syncs payments 1
