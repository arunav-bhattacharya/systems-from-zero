# DynamoDB Local v3 for the NoSQL lessons: the real DynamoDB API on your laptop, no AWS account.
#   docker compose -f env/dynamodb.yml up -d       start it on http://localhost:8000
#   docker compose -f env/dynamodb.yml down -v     stop it (the data lives in memory and is gone)
# Clients need SOME credentials and a Region; any values work (the demos use sfz / sfz, us-east-1).
# -sharedDb: every client sees the same tables, whatever access key or Region it sends.
name: sfz-dynamodb
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    # the image's entrypoint is `java`, so the command starts with JVM flags
    command: ["-Xmx256m", "-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb", "-disableTelemetry"]
    ports: ["8000:8000"]
    mem_limit: 512m
