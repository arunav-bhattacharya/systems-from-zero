# OpenSearch 3.9, one node, for the search Try-its in lesson nosql-12.
#   docker compose -f env/opensearch.yml up -d --wait     start it (healthy after about a minute)
#   curl -s localhost:9200                                 check it answers (from the Mac)
#   sh env/opensearch/nosql-12-merchants.sh                create the merchants index and load five merchants
#   docker compose -f env/opensearch.yml down -v          stop it and delete the data
# Security is switched off: this is a lab node on 127.0.0.1 only, so plain http and no password.
# Memory: a 512 MB heap under a 1.5 GB container limit.
name: sfz-opensearch
services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    mem_limit: 1536m
    volumes:
      - ./opensearch:/sfz:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -q -E '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
