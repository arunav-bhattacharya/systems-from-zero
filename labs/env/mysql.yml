# MySQL 8.4 LTS (InnoDB) for the Transactions track, to compare its isolation levels and locks
# with PostgreSQL's.
#   docker compose -f env/mysql.yml up -d --wait
#   docker compose -f env/mysql.yml exec db mysql course        a mysql prompt on database course
#   docker compose -f env/mysql.yml down -v                     stop and delete the data
# env/mysql/initdb/10-course.sql runs once, when the data volume is new: it creates database
# "course" with three small tables (accounts, room_bookings, settlements) and user sfz.
# env/mysql/client.cnf becomes root's ~/.my.cnf in the container, so `docker compose exec` clients
# log in as sfz without a password on the command line.
name: sfz-mysql
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sfz
      MYSQL_DATABASE: course
      MYSQL_USER: sfz
      MYSQL_PASSWORD: sfz
    # a small buffer pool: the tables hold a few thousand rows
    command: ["--innodb-buffer-pool-size=64M", "--skip-name-resolve"]
    ports: ["3306:3306"]
    mem_limit: 768m
    volumes:
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
      - ./mysql/client.cnf:/root/.my.cnf:ro
      - mysqldata:/var/lib/mysql
    healthcheck:
      # TCP, so the check fails while the image's first-start init server (socket only) is running
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  mysqldata:
