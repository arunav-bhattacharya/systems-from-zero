# PostgreSQL 18 with pgvector 0.8.7, for the vector search Try-it in lesson nosql-12.
#   docker compose -f env/pgvector.yml up -d --wait                   start it (healthy after a few seconds)
#   docker compose -f env/pgvector.yml exec pgv psql -U sfz           a psql prompt on database sfz
#   docker compose -f env/pgvector.yml exec pgv psql -U sfz -f /sfz/nosql-12-vectors.sql
#                                                                     create 100,000 vectors and 20 queries
#   docker compose -f env/pgvector.yml down -v                        stop it and delete the data
# No host port, so it never clashes with env/postgres.yml; use `exec`.
name: sfz-pgvector
services:
  pgv:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: sfz
      POSTGRES_PASSWORD: sfz
      POSTGRES_DB: sfz
    command: ["postgres", "-c", "maintenance_work_mem=256MB", "-c", "shared_buffers=256MB"]
    mem_limit: 1g
    shm_size: 256m
    volumes:
      - ./pgvector:/sfz:ro
    healthcheck:
      # over TCP: the temporary server that runs the init scripts listens only on a socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sfz -d sfz"]
      interval: 2s
      timeout: 3s
      retries: 30
