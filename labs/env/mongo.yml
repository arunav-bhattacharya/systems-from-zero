# MongoDB 9.0 for the NoSQL lessons: one member, run as a replica set named rs0 so that
# transactions and change streams work. The healthcheck initiates the set on first start.
#   docker compose -f env/mongo.yml up -d --wait          start it (healthy after a few seconds)
#   docker compose -f env/mongo.yml exec mongo mongosh sfz  a mongosh prompt on database sfz
#   docker compose -f env/mongo.yml down -v               stop it and delete the data
# Scripts in env/mongo/ are mounted read-only at /sfz, so `mongosh sfz /sfz/<file>.js` runs one.
# From the Mac, connect with mongodb://localhost:27017/?directConnection=true
name: sfz-mongo
services:
  mongo:
    image: mongo:9.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports: ["27017:27017"]
    mem_limit: 768m
    volumes:
      - ./mongo:/sfz:ro
      - mongodata:/data/db
    healthcheck:
      # rs.status() throws until the set exists; the first check creates it with this one member
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s
volumes:
  mongodata:
