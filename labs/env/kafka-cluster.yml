# Apache Kafka 4.4.0, three nodes in KRaft combined mode: each node is a broker and a controller voter.
# Used by the replication lesson. Bring it up only while you work through it; it needs about 2 GB.
# Run these from the labs folder:
#   docker compose -f env/kafka-cluster.yml up -d --wait
#   docker compose -f env/kafka-cluster.yml exec kafka-1 bash      a shell on node 1; tools are in /opt/kafka/bin
#   docker compose -f env/kafka-cluster.yml stop kafka-3            stop one node (start kafka-3 brings it back)
#   docker compose -f env/kafka-cluster.yml down -v                 stop everything and delete the data
# Programs on your Mac connect to localhost:29092,localhost:39092,localhost:49092.
# Tools inside a container use the internal listener: kafka-1:19092,kafka-2:19092,kafka-3:19092.
# Based on the official example docker/examples/docker-compose-files/cluster/combined/plaintext in apache/kafka.
name: sfz-kafka-cluster

x-node: &node
  image: apache/kafka:4.4.0
  mem_limit: 768m
  healthcheck:
    # a small JVM of its own, so the check never borrows the broker's heap settings
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx96m /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list > /dev/null 2>&1"]
    interval: 30s
    timeout: 20s
    retries: 10
    start_period: 90s
    start_interval: 3s

x-env: &env
  CLUSTER_ID: rCAfKEuEQVibTDqU5ooeSA
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m

services:
  kafka-1:
    <<: *node
    hostname: kafka-1
    ports: ["29092:9092"]
    environment:
      <<: *env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
  kafka-2:
    <<: *node
    hostname: kafka-2
    ports: ["39092:9092"]
    environment:
      <<: *env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
  kafka-3:
    <<: *node
    hostname: kafka-3
    ports: ["49092:9092"]
    environment:
      <<: *env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
