name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pygments
      - run: python3 site/validate.py --all
      - run: python3 site/build.py
      - name: Built site matches the committed web/ folder
        run: git diff --exit-code -- web/

  labs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [net, os, sql, nosql, internals, kafka, redis, bigdata]
    defaults:
      run:
        working-directory: labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the big data module's toolchain (Spark 4.1), 25 to run Gradle and everything else
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Reference solutions pass every test (Testcontainers uses the runner's Docker)
        run: ./gradlew :${{ matrix.module }}:solutionTest --console=plain
      - name: Exercises and demos compile
        run: ./gradlew :${{ matrix.module }}:testClasses :${{ matrix.module }}:demoClasses --console=plain

  deploy:
    needs: [content, labs]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare (skipped until the CLOUDFLARE_API_TOKEN secret exists)
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
