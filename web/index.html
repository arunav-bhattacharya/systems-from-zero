ed by <code>wait<\/code>. Exit 137 is <code>SIGKILL<\/code> and skips every shutdown hook; 143 is a handled <code>SIGTERM<\/code>.","Threads are kernel tasks that share memory. Each platform thread costs a stack and a slot in <code>pids.max<\/code>; virtual threads park on the heap and run on one carrier per CPU.","<code>nice<\/code> weights a CPU share only under contention; <code>cpu.max<\/code> is a hard budget per 100 ms period, and spending it early freezes every thread until the next period.","VSZ is what a process reserved, RSS what it has in RAM. Pages arrive on first touch (minor faults); major faults wait for the disk. Freed malloc memory and page cache both keep RSS or usage high without being leaks.","<code>OutOfMemoryError<\/code> is the JVM's heap limit, an exception you can see. A kernel OOM kill at <code>memory.max<\/code> is a <code>SIGKILL<\/code> of the biggest process, visible only as 137 and <code>oom_kill<\/code>.","<code>write()<\/code> reaches RAM, <code>fsync<\/code> reaches the disk. A journal keeps a file system's structure consistent, not your un-fsynced data. Replace files with temp file, <code>fsync<\/code>, <code>rename<\/code>, <code>fsync<\/code> of the directory.","A file is an inode; names point at it and descriptors reach it through open file descriptions, which <code>fork<\/code> shares. A deleted file lives until its last descriptor closes.","epoll lets one thread wait on thousands of sockets and is under Java's <code>Selector<\/code>, Netty and virtual threads. io_uring submits work and collects completions, and is often switched off for security.","A container is processes on the shared kernel: namespaces for what they see, a cgroup for what they use, capabilities and seccomp for what they may ask, an overlay for their files. The JVM sizes itself from the same cgroup files."],"quiz":[{"q":"A service reads <code>System.nanoTime()<\/code> and takes an uncontended <code>ReentrantLock<\/code> a million times each. <code>strace -f -c<\/code> shows almost no <code>clock_gettime<\/code> and almost no <code>futex<\/code> calls. Why?","options":["strace drops fast calls under load","Both stay in user space: clock reads go through the vDSO, and an uncontended lock is one compare-and-swap, with <code>futex<\/code> called only to sleep or wake","The JIT compiler removed both calls","The kernel batches them into one system call per second"],"answer":1,"why":"The vDSO maps code and data into every process so the C library can read the clock without a trap (lesson 1). A futex-based lock takes and releases its word with atomic instructions and enters the kernel only when a thread must wait (lesson 5). strace stops the program at every real system call, so it misses neither; there were none to see.","from":null},{"q":"One pod stops with exit code 143 and its log ends with \"offsets committed\". Another stops with 137 and its log ends mid-line. What's the difference?","options":["143 is an OOM kill; 137 is a clean stop","Both got <code>SIGTERM<\/code>; 137 just took longer","143: the JVM caught <code>SIGTERM<\/code> and ran its shutdown hooks. 137: something sent <code>SIGKILL<\/code>, which no process can catch, so no hook ran","137 means the JVM threw <code>OutOfMemoryError<\/code>"],"answer":2,"why":"An exit status after a signal is 128 plus the signal number: 143 is 15 (<code>SIGTERM<\/code>) and 137 is 9 (<code>SIGKILL<\/code>). <code>SIGTERM<\/code> can be handled, and the JVM runs shutdown hooks on it. <code>SIGKILL<\/code> comes from the grace period running out or the kernel's OOM killer; an uncaught <code>OutOfMemoryError<\/code> ends the JVM with status 1.","from":null},{"q":"A service in a pod with <code>pids.max<\/code> 512 starts a platform thread per request. Under load it logs <code>OutOfMemoryError: unable to create native thread<\/code>, with the heap 30% used. What fixes the cause?","options":["A bigger <code>-Xmx<\/code>","A bigger <code>-Xss<\/code>","More CPU","Fewer threads: a bounded pool, or virtual threads, which don't need a kernel task each"],"answer":3,"why":"Each platform thread is a kernel task, and <code>pids.max<\/code> counts tasks, so <code>clone<\/code> failed with <code>EAGAIN<\/code> and the JVM reported it under an <code>OutOfMemoryError<\/code> name (lesson 3). The heap has nothing to do with it, and bigger stacks make things worse. Virtual threads waiting on I/O park on the heap and run on a few carriers.","from":null},{"q":"The node is idle, yet a service with <code>cpu.max<\/code> = <code>50000 100000<\/code> shows 90 ms stalls every 100 ms when four threads get busy. A teammate suggests <code>renice -n -5<\/code>. Will it help?","options":["No: nice is a weight that only splits a CPU between competing tasks, while <code>cpu.max<\/code> is a budget that throttles the whole group once 50 ms are spent, idle node or not","Yes: a lower nice value gives the service more CPU","Yes, but only on EEVDF kernels","No: nice only applies to processes, not threads"],"answer":0,"why":"Weights matter only when tasks compete; on an idle node the service already gets every CPU it asks for. The stalls are throttling: four busy threads spend the 50 ms budget in about 12.5 ms and then all wait for the next period (lesson 4). <code>cpu.stat<\/code>'s <code>nr_throttled<\/code> shows it. Fewer busy threads or a bigger budget help.","from":null},{"q":"A JVM with <code>-Xmx4g<\/code> and 300 platform threads shows VSZ 7.9 GB and RSS 900 MB in <code>ps<\/code>. Which number is the container's memory limit compared with, and why is the other so large?","options":["VSZ; RSS only counts the heap","RSS; VSZ counts every reserved address, such as the whole 4 GB heap and 2 MB of stack per thread, most of it never touched","Both are counted, so the container needs 8.2 GB","Neither: the limit is compared with <code>-Xmx<\/code>"],"answer":1,"why":"VSZ adds up regions the process reserved; RAM is only spent on pages it touched, which RSS counts (lesson 6). The cgroup charges pages in RAM, page cache included. RSS includes more than the heap: thread stacks in use, metaspace, code cache and native memory that malloc keeps after <code>free<\/code> (lesson 8).","from":null},{"q":"A fraud service maps a 2 GB reference file and probes it at random. Right after a deploy, p99 latency is high for a minute; <code>ps -o min_flt,maj_flt<\/code> shows <code>maj_flt<\/code> climbing. A teammate points to the fresh heap's page faults. Who's right?","options":["The teammate: heap faults are major faults","Neither: page faults never cost more than a microsecond","The <code>maj_flt<\/code> count: probes of file pages that aren't in the page cache wait for the disk, while a fresh heap page is a minor fault filled from RAM","Both are minor faults, so it must be the JIT compiler"],"answer":2,"why":"A minor fault is resolved from RAM: a zeroed page on first touch of the heap, or a file page already cached, in about a microsecond (lesson 6). A major fault waits for storage, around 0.1 ms on an SSD and more on a network disk. A cold mapped file produces major faults until its pages are cached (lessons 7 and 9).","from":null},{"q":"Which evidence tells you the kernel killed the JVM for memory, and not the JVM running out of heap?","options":["An <code>OutOfMemoryError: Java heap space<\/code> stack trace and a heap dump","Exit code 1 and a full GC in the log","<code>Committed_AS<\/code> above <code>CommitLimit<\/code> in <code>/proc/meminfo<\/code>","Exit code 137, <code>OOMKilled<\/code> in the pod status and <code>oom_kill<\/code> in the cgroup's <code>memory.events<\/code>, with no Java exception"],"answer":3,"why":"The kernel acts at <code>memory.max<\/code> with <code>SIGKILL<\/code>, so nothing in the JVM runs: no exception, no heap dump, no hook, only the exit code and the counters (lesson 7). An <code>OutOfMemoryError<\/code> is the JVM's own <code>-Xmx<\/code> limit, thrown as an exception you can log and dump. With overcommit, <code>Committed_AS<\/code> above <code>CommitLimit<\/code> is normal and kills nothing.","from":null},{"q":"A ledger writer calls <code>write()<\/code> and replies \"saved\". ext4 is journaled. In which case can the record be gone afterwards?","options":["The JVM is killed with <code>kill -9<\/code> a second later","The machine loses power a second later","Both","Neither: the journal protects it"],"answer":1,"why":"After <code>write()<\/code> the record is a dirty page in the kernel's page cache. A dead process doesn't touch the page cache, so the kernel still writes it back (lesson 9). A power cut loses everything still dirty. ext4's journal keeps metadata consistent through a crash (lesson 10) but doesn't make un-fsynced data durable; only <code>fsync<\/code> before replying does.","from":null},{"q":"Which statement about epoll and io_uring is right?","options":["epoll tells you when a socket can be read without blocking; io_uring takes the read itself and tells you when it's done, for files as well as sockets","They're the same model; io_uring is just faster","epoll works on regular files and io_uring only on sockets","Java's <code>Selector<\/code> uses io_uring on Linux since JDK 21"],"answer":0,"why":"epoll is a readiness API: register sockets once, then <code>epoll_wait<\/code> returns the ready ones and you still make each read yourself. Regular files are always \"ready\", so epoll can't help with disk reads. io_uring is a completion API: submit operations into a shared ring, collect results from another. The JDK's <code>Selector<\/code> and virtual threads use epoll (lesson 11).","from":null},{"q":"A container has its own PID namespace and no <code>pids.max<\/code>. Which statement is true?","options":["The namespace limits it to 32,768 processes","The namespace's PID 1 stops forks it doesn't approve","Without <code>pids.max<\/code> the container can't start any process","A fork bomb inside it can still fill the host's task table: a namespace changes what processes see, and only a cgroup limits what they use"],"answer":3,"why":"Namespaces give the container its own view: PIDs numbered from 1, its own hostname and network. They never make a call fail for using too much. <code>pids.max<\/code>, <code>memory.max<\/code> and <code>cpu.max<\/code> in a cgroup do: <code>fork<\/code> fails with <code>EAGAIN<\/code>, the OOM killer runs, threads are throttled (lesson 12).","from":null}]},{"id":"sql","lab":"sql","title":"Relational databases and SQL","short":"The relational model, schema design, joins, window functions, recursive queries, indexes, EXPLAIN and isolation levels, all on PostgreSQL 18.","lessons":["sql-01","sql-02","sql-03","sql-04","sql-05","sql-06","sql-07","sql-08","sql-09","sql-10","sql-11","sql-12","sql-13","sql-14"],"intro":"<p>By the end of this track you can write the SQL a payments backend needs, from a NULL-safe filter and an anti join to a recursive walk of a referral tree, a running balance with the right window frame and a keyset-paged API. You can design tables whose constraints stop bad rows at the door, read an EXPLAIN plan and choose an index from it, say what each isolation level does about lost updates and write skew and when to lock rows instead, build a job queue that ten workers drain at once, and call PostgreSQL from Kotlin with a pool, prepared statements, batches and Flyway migrations, counting round trips instead of guessing.<\/p>\n<p>You need to be able to program; no SQL beyond <code>SELECT *<\/code> is assumed. Lesson 1 sets up the picture the whole track uses: a table is a bag of rows with no order, a query runs its clauses in a fixed logical order, and NULL means unknown. Every lesson works on one schema, a small card-payments company (customers, accounts, cards, merchants, payments, refunds, a double-entry ledger, logins and a job queue) on PostgreSQL 18. A hand-checkable seed of about 250 rows backs every example, and a generated large data set with a million payments backs the index and paging lessons. You use Oracle at work, so where Oracle behaves differently each lesson puts the two side by side.<\/p>\n<p>The Try-its run in psql against the Compose service, from the <code>labs<\/code> folder: <code>docker compose -f env/postgres.yml up -d --wait<\/code>, then <code>docker compose -f env/postgres.yml exec db psql -U sfz -d course<\/code>. The large data set loads once with <code>docker compose -f env/postgres.yml exec db psql -U sfz -d course -f /seed/load-big.sql<\/code> and is read after <code>SET search_path = big, public<\/code>. The isolation and locking lessons open two or three terminals at once, and lesson 14's Try-its are Kotlin demos in <code>labs/sql/src/demo<\/code>. Each lab is a <code>.sql<\/code> file in <code>labs/sql/src/main/resources/sfz/sql/lNN/<\/code> (or Kotlin, in lessons 12 and 14) that tests in package <code>sfz.sql.lNN<\/code> run against a PostgreSQL 18 container loaded with the same seed, so Docker must be running: <code>./gradlew :sql:test --tests 'sfz.sql.lNN.*'<\/code>. <code>./gradlew :sql:solutionTest<\/code> runs the same tests against the reference answers.<\/p>","cheatsheet":"<h2>The picture<\/h2>\n<p>A table is a <strong>bag<\/strong> of rows: duplicates stay and there is no order unless you write <code>ORDER BY<\/code>. A query runs its clauses in a fixed logical order, whatever order you type them in. NULL means unknown, and <code>WHERE<\/code> keeps only rows that are true. Underneath, PostgreSQL never overwrites a row: it writes new versions, each statement reads a snapshot of committed ones, B-tree indexes find rows without reading the table, and every statement from the JVM is a round trip.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>step<\/th>\n<th>clause<\/th>\n<th>what it sees<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><code>FROM<\/code>, <code>JOIN ... ON<\/code><\/td>\n<td>the tables; a join keeps the pairs <code>ON<\/code> makes true<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><code>WHERE<\/code><\/td>\n<td>single rows; no aggregates, no select aliases<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><code>GROUP BY<\/code><\/td>\n<td>folds rows into one per key<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><code>HAVING<\/code><\/td>\n<td>the groups; aggregates allowed<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>window functions<\/td>\n<td>the grouped rows, without folding them<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><code>SELECT<\/code>, <code>DISTINCT<\/code><\/td>\n<td>computes the output columns<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><code>ORDER BY<\/code><\/td>\n<td>may use select aliases; end it with a unique column<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><code>LIMIT<\/code> / <code>OFFSET<\/code> / <code>FETCH FIRST<\/code><\/td>\n<td>cuts the sorted result<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>NULL and counting (lesson 1)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>expression<\/th>\n<th>result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>NULL = NULL<\/code>, <code>x &lt;&gt; NULL<\/code><\/td>\n<td>NULL (unknown): <code>WHERE<\/code> drops the row<\/td>\n<\/tr>\n<tr>\n<td><code>NULL IS NULL<\/code>, <code>a IS NOT DISTINCT FROM b<\/code><\/td>\n<td>true or false, never NULL<\/td>\n<\/tr>\n<tr>\n<td><code>true OR NULL<\/code>, <code>false AND NULL<\/code><\/td>\n<td>true, false<\/td>\n<\/tr>\n<tr>\n<td><code>count(*)<\/code> / <code>count(col)<\/code> / <code>count(DISTINCT col)<\/code><\/td>\n<td>rows / non-NULL values / different non-NULL values<\/td>\n<\/tr>\n<tr>\n<td><code>sum(col)<\/code> over no rows<\/td>\n<td>NULL: wrap it in <code>coalesce(..., 0)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Time ranges are half-open: <code>created_at &gt;= '2026-03-01' AND created_at &lt; '2026-04-01'<\/code>. <code>BETWEEN<\/code> includes both ends.<\/p>\n<h2>Schema design (lesson 2)<\/h2>\n<ul>\n<li>A fact stored on many rows drifts. Find the dependencies with <code>GROUP BY x HAVING count(DISTINCT y) &gt; 1<\/code>, and move each to a table keyed by its left side.<\/li>\n<li>Every candidate key gets <code>PRIMARY KEY<\/code> or <code>UNIQUE<\/code>. A foreign key does <strong>not<\/strong> create an index on the referencing column.<\/li>\n<li>A <code>CHECK<\/code> passes on NULL: pair it with <code>NOT NULL<\/code>. <code>UNIQUE NULLS NOT DISTINCT<\/code> (PostgreSQL 15) allows one NULL.<\/li>\n<li>No overlapping periods: <code>PRIMARY KEY (merchant_id, valid_during WITHOUT OVERLAPS)<\/code> (PostgreSQL 18), or <code>EXCLUDE USING gist<\/code>.<\/li>\n<li>Keep a denormalized copy only for a measured read path, write it in the same transaction, and keep a reconciliation query.<\/li>\n<\/ul>\n<h2>Joins and subqueries (lessons 3 and 5)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>you want<\/th>\n<th>write<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>rows with at least one match<\/td>\n<td><code>WHERE EXISTS (SELECT 1 ...)<\/code>: a semi join, each row once<\/td>\n<\/tr>\n<tr>\n<td>rows with no match<\/td>\n<td><code>WHERE NOT EXISTS (...)<\/code>: a Hash Anti Join. Never <code>NOT IN<\/code> on a column that can hold NULL: one NULL empties the result<\/td>\n<\/tr>\n<tr>\n<td>unmatched left rows too<\/td>\n<td><code>LEFT JOIN<\/code>, with conditions on the right table in <code>ON<\/code>; in <code>WHERE<\/code> they undo the outer join<\/td>\n<\/tr>\n<tr>\n<td>a sum per parent across two child tables<\/td>\n<td>aggregate each child to one row per key first, then join; <code>sum(DISTINCT ...)<\/code> is not a fix<\/td>\n<\/tr>\n<tr>\n<td>one value<\/td>\n<td>a scalar subquery: no row gives NULL, two rows fail with 21000 at run time<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A correlated subquery runs per outer row (SubPlan) unless PostgreSQL turns it into a join. Qualify every column inside subqueries. A CTE used once is inlined (since PostgreSQL 12); <code>MATERIALIZED<\/code> and <code>NOT MATERIALIZED<\/code> override.<\/p>\n<h2>Grouping and windows (lessons 4, 7, 8)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>tool<\/th>\n<th>filters or folds<\/th>\n<th>example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>WHERE<\/code><\/td>\n<td>rows, before grouping<\/td>\n<td><code>WHERE status = 'succeeded'<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>HAVING<\/code><\/td>\n<td>groups, after grouping<\/td>\n<td><code>HAVING sum(amount_minor) &gt; 100000<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>agg(...) FILTER (WHERE ...)<\/code><\/td>\n<td>the rows one aggregate folds<\/td>\n<td><code>count(*) FILTER (WHERE status = 'failed')<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ROLLUP (a, b)<\/code><\/td>\n<td>adds subtotals: <code>GROUPING SETS ((a, b), (a), ())<\/code><\/td>\n<td>label them with <code>GROUPING(a)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>fn() OVER (PARTITION BY ... ORDER BY ...)<\/code><\/td>\n<td>nothing: keeps every row<\/td>\n<td>running totals, ranks, <code>lag<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ties 100, 90, 90, 80: <code>row_number<\/code> 1, 2, 3, 4; <code>rank<\/code> 1, 2, 2, 4; <code>dense_rank<\/code> 1, 2, 2, 3.<\/p>\n<p>With <code>ORDER BY<\/code> and no frame clause the frame is <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW<\/code>, so <strong>tied rows share one running total<\/strong>. <code>ROWS<\/code> counts rows, <code>RANGE<\/code> measures the ORDER BY value (<code>interval '6 days' PRECEDING<\/code>), <code>GROUPS<\/code> counts peer groups. Give <code>last_value<\/code> the frame <code>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING<\/code>. Filter on a window's result one query level up.<\/p>\n<p>Gaps and islands: <code>row_number() OVER (ORDER BY t) - row_number() OVER (PARTITION BY v ORDER BY t)<\/code> is constant within a run. For gaps in time, flag each start with <code>lag<\/code> and take a running sum of the flags.<\/p>\n<h2>Recursion (lesson 6)<\/h2>\n<pre class=\"code\" data-lang=\"sql\"><code><span class=\"k\">WITH<\/span><span class=\"w\"> <\/span><span class=\"k\">RECURSIVE<\/span><span class=\"w\"> <\/span><span class=\"n\">tree<\/span><span class=\"w\"> <\/span><span class=\"k\">AS<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">SELECT<\/span><span class=\"w\"> <\/span><span class=\"n\">customer_id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"w\"> <\/span><span class=\"k\">AS<\/span><span class=\"w\"> <\/span><span class=\"n\">depth<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nb\">ARRAY<\/span><span class=\"p\">[<\/span><span class=\"n\">customer_id<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"k\">AS<\/span><span class=\"w\"> <\/span><span class=\"n\">path<\/span><span class=\"w\"> <\/span><span class=\"k\">FROM<\/span><span class=\"w\"> <\/span><span class=\"n\">customers<\/span><span class=\"w\"> <\/span><span class=\"k\">WHERE<\/span><span class=\"w\"> <\/span><span class=\"n\">referred_by<\/span><span class=\"w\"> <\/span><span class=\"k\">IS<\/span><span class=\"w\"> <\/span><span class=\"k\">NULL<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">UNION<\/span><span class=\"w\"> <\/span><span class=\"k\">ALL<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">SELECT<\/span><span class=\"w\"> <\/span><span class=\"k\">c<\/span><span class=\"p\">.<\/span><span class=\"n\">customer_id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"n\">depth<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"n\">path<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"k\">c<\/span><span class=\"p\">.<\/span><span class=\"n\">customer_id<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">FROM<\/span><span class=\"w\"> <\/span><span class=\"n\">customers<\/span><span class=\"w\"> <\/span><span class=\"k\">c<\/span><span class=\"w\"> <\/span><span class=\"k\">JOIN<\/span><span class=\"w\"> <\/span><span class=\"n\">tree<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"k\">ON<\/span><span class=\"w\"> <\/span><span class=\"k\">c<\/span><span class=\"p\">.<\/span><span class=\"n\">referred_by<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"n\">customer_id<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"k\">SELECT<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"k\">FROM<\/span><span class=\"w\"> <\/span><span class=\"n\">tree<\/span><span class=\"w\"> <\/span><span class=\"k\">ORDER<\/span><span class=\"w\"> <\/span><span class=\"k\">BY<\/span><span class=\"w\"> <\/span><span class=\"n\">path<\/span><span class=\"p\">;<\/span>\n<\/code><\/pre>\n<p>The anchor runs once, the recursive term runs on the previous round's rows until a round returns nothing. PostgreSQL has no depth limit and does not detect cycles: use <code>CYCLE id SET is_cycle USING path<\/code> (PostgreSQL 14), a path check, or <code>UNION<\/code> on rows that repeat exactly.<\/p>\n<h2>Top N, LATERAL and paging (lesson 9)<\/h2>\n<ul>\n<li>Top N per group: <code>row_number()<\/code> in a subquery, <code>CROSS JOIN LATERAL (... ORDER BY ... LIMIT n)<\/code>, or <code>DISTINCT ON (key)<\/code> for N = 1. <code>LEFT JOIN LATERAL (...) ON true<\/code> keeps groups with no rows.<\/li>\n<li>OFFSET reads and discards every skipped row. Keyset pagination seeks past the last row sent:<\/li>\n<\/ul>\n<pre class=\"code\" data-lang=\"sql\"><code><span class=\"k\">WHERE<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">created_at<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">payment_id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"p\">(:<\/span><span class=\"n\">last_created_at<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"n\">last_payment_id<\/span><span class=\"p\">)<\/span>\n<span class=\"k\">ORDER<\/span><span class=\"w\"> <\/span><span class=\"k\">BY<\/span><span class=\"w\"> <\/span><span class=\"n\">created_at<\/span><span class=\"w\"> <\/span><span class=\"k\">DESC<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">payment_id<\/span><span class=\"w\"> <\/span><span class=\"k\">DESC<\/span>\n<span class=\"k\">LIMIT<\/span><span class=\"w\"> <\/span><span class=\"mi\">20<\/span><span class=\"w\">                       <\/span><span class=\"c1\">-- index on (created_at, payment_id)<\/span>\n<\/code><\/pre>\n<h2>JSONB, upserts and MERGE (lesson 10)<\/h2>\n<ul>\n<li><code>-&gt;<\/code> returns jsonb, <code>-&gt;&gt;<\/code> returns text: cast before comparing numbers. <code>metadata @&gt; '{\"channel\": \"web\"}'<\/code> can use a GIN index; <code>-&gt;&gt;<\/code> conditions cannot.<\/li>\n<li>Check-then-insert races. The unique index is the referee: <code>INSERT ... ON CONFLICT (payment_uid) DO NOTHING<\/code>, or <code>DO UPDATE SET x = EXCLUDED.x WHERE ...<\/code>.<\/li>\n<li><code>MERGE<\/code> (PostgreSQL 15; <code>NOT MATCHED BY SOURCE<\/code> and <code>RETURNING<\/code> since 17, <code>old<\/code> and <code>new<\/code> in <code>RETURNING<\/code> since 18) syncs a table with a source. For concurrent inserts of the same new key, use <code>ON CONFLICT<\/code>.<\/li>\n<\/ul>\n<h2>Indexes and EXPLAIN (lesson 11)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>plan node<\/th>\n<th>reads<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Seq Scan<\/td>\n<td>every page of the table<\/td>\n<\/tr>\n<tr>\n<td>Index Scan<\/td>\n<td>a few index pages, then one table page per matching row<\/td>\n<\/tr>\n<tr>\n<td>Index Only Scan<\/td>\n<td>the index alone, for pages the visibility map marks all-visible; <code>Heap Fetches<\/code> counts the rest (VACUUM fixes it)<\/td>\n<\/tr>\n<tr>\n<td>Bitmap Index Scan + Bitmap Heap Scan<\/td>\n<td>collects row addresses, then reads each table page once<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Read <code>EXPLAIN (ANALYZE, BUFFERS)<\/code> from the most indented node up; <code>rows<\/code> is per loop, so multiply by <code>loops<\/code>; compare estimated and actual rows. Multicolumn index: equality columns first, then the range or sort column; <code>INCLUDE<\/code> adds columns for an Index Only Scan. The index cannot be searched when the query wraps the column in a function or cast (<code>created_at::date<\/code>, a numeric bind on a bigint), and a condition that matches most rows is rightly a Seq Scan. Every index costs on every write.<\/p>\n<h2>Transactions and isolation (lesson 12)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>PostgreSQL<\/th>\n<th>Read Committed (default)<\/th>\n<th>Repeatable Read<\/th>\n<th>Serializable<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>snapshot taken<\/td>\n<td>per statement<\/td>\n<td>at the first statement<\/td>\n<td>at the first statement<\/td>\n<\/tr>\n<tr>\n<td>non-repeatable read, phantom<\/td>\n<td>yes<\/td>\n<td>no<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td>lost update (read, compute, write)<\/td>\n<td>yes<\/td>\n<td>error 40001<\/td>\n<td>error 40001<\/td>\n<\/tr>\n<tr>\n<td>write skew<\/td>\n<td>yes<\/td>\n<td>yes<\/td>\n<td>error 40001<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>On 40001 or 40P01, roll back and run the <strong>whole<\/strong> transaction again. Without retries: write relative updates (<code>SET x = x - 1000<\/code>), lock the rows the rule reads with <code>SELECT ... FOR UPDATE<\/code>, or lock a parent row everyone must touch.<\/p>\n<h2>Row locks and queues (lesson 13)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>requested \\ held<\/th>\n<th>KEY SHARE<\/th>\n<th>SHARE<\/th>\n<th>NO KEY UPDATE<\/th>\n<th>UPDATE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FOR KEY SHARE (foreign-key checks)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>waits<\/td>\n<\/tr>\n<tr>\n<td>FOR SHARE<\/td>\n<td><\/td>\n<td><\/td>\n<td>waits<\/td>\n<td>waits<\/td>\n<\/tr>\n<tr>\n<td>FOR NO KEY UPDATE (plain UPDATE)<\/td>\n<td><\/td>\n<td>waits<\/td>\n<td>waits<\/td>\n<td>waits<\/td>\n<\/tr>\n<tr>\n<td>FOR UPDATE (DELETE, key change)<\/td>\n<td>waits<\/td>\n<td>waits<\/td>\n<td>waits<\/td>\n<td>waits<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre class=\"code\" data-lang=\"sql\"><code><span class=\"k\">UPDATE<\/span><span class=\"w\"> <\/span><span class=\"n\">jobs<\/span><span class=\"w\"> <\/span><span class=\"k\">SET<\/span><span class=\"w\"> <\/span><span class=\"n\">status<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s1\">'running'<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">locked_by<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"n\">worker<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">locked_at<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">now<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">attempts<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">attempts<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span>\n<span class=\"k\">WHERE<\/span><span class=\"w\"> <\/span><span class=\"n\">job_id<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"k\">SELECT<\/span><span class=\"w\"> <\/span><span class=\"n\">job_id<\/span><span class=\"w\"> <\/span><span class=\"k\">FROM<\/span><span class=\"w\"> <\/span><span class=\"n\">jobs<\/span><span class=\"w\"> <\/span><span class=\"k\">WHERE<\/span><span class=\"w\"> <\/span><span class=\"n\">status<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s1\">'queued'<\/span><span class=\"w\"> <\/span><span class=\"k\">AND<\/span><span class=\"w\"> <\/span><span class=\"n\">run_after<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;=<\/span><span class=\"w\"> <\/span><span class=\"n\">now<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">ORDER<\/span><span class=\"w\"> <\/span><span class=\"k\">BY<\/span><span class=\"w\"> <\/span><span class=\"n\">run_after<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">job_id<\/span><span class=\"w\"> <\/span><span class=\"k\">LIMIT<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"w\"> <\/span><span class=\"k\">FOR<\/span><span class=\"w\"> <\/span><span class=\"k\">UPDATE<\/span><span class=\"w\"> <\/span><span class=\"n\">SKIP<\/span><span class=\"w\"> <\/span><span class=\"n\">LOCKED<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">RETURNING<\/span><span class=\"w\"> <\/span><span class=\"n\">job_id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">kind<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">payload<\/span><span class=\"p\">;<\/span>\n<\/code><\/pre>\n<p><code>FOR UPDATE<\/code> waits, <code>NOWAIT<\/code> fails at once (55P03), <code>SKIP LOCKED<\/code> takes the next free row. Deadlocks come from opposite lock orders: lock rows in ascending key order. <code>lock_timeout<\/code> bounds a wait; advisory locks (<code>pg_try_advisory_xact_lock<\/code>) serialize things that are not rows.<\/p>\n<h2>From the JVM (lesson 14)<\/h2>\n<ul>\n<li>A connection is a socket plus a server process: open it once. Pool size near (cores × 2) + spindles for the database as a whole; short <code>connectionTimeout<\/code>; borrow in <code>use { }<\/code>; <code>leakDetectionThreshold<\/code> finds leaks.<\/li>\n<li><code>PreparedStatement<\/code> with <code>?<\/code> for every value; identifiers from a fixed list. New ids: <code>prepareStatement(sql, arrayOf(\"payment_id\"))<\/code>.<\/li>\n<li><code>addBatch<\/code> / <code>executeBatch<\/code> cut round trips; <code>reWriteBatchedInserts=true<\/code> cuts statements. Stream big results with autocommit off and <code>fetchSize<\/code>.<\/li>\n<li>N+1 queries: replace the loop with a join, <code>LATERAL<\/code>, or <code>= ANY (?)<\/code>; find it by <code>calls<\/code> in <code>pg_stat_statements<\/code>.<\/li>\n<li>Flyway: versioned scripts, a checksum per applied version in <code>flyway_schema_history<\/code>. Never edit an applied migration; test migrations on tables with rows.<\/li>\n<\/ul>\n<h2>SQLSTATEs worth knowing<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>code<\/th>\n<th>meaning<\/th>\n<th>what to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>23505 / 23503 / 23514 / 23502 / 23P01<\/td>\n<td>unique, foreign key, check, not null, exclusion violated<\/td>\n<td>fix the data or the request<\/td>\n<\/tr>\n<tr>\n<td>21000<\/td>\n<td>a scalar subquery returned two rows<\/td>\n<td>fix the query<\/td>\n<\/tr>\n<tr>\n<td>40001<\/td>\n<td>serialization failure<\/td>\n<td>retry the whole transaction<\/td>\n<\/tr>\n<tr>\n<td>40P01<\/td>\n<td>deadlock detected<\/td>\n<td>retry, and fix the lock order<\/td>\n<\/tr>\n<tr>\n<td>55P03<\/td>\n<td>lock not available (NOWAIT, lock_timeout)<\/td>\n<td>fail fast or retry later<\/td>\n<\/tr>\n<tr>\n<td>57014<\/td>\n<td>statement cancelled (statement_timeout)<\/td>\n<td>make the query cheaper<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>PostgreSQL and Oracle<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>PostgreSQL 18<\/th>\n<th>Oracle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>''<\/code><\/td>\n<td>an empty string<\/td>\n<td>NULL<\/td>\n<\/tr>\n<tr>\n<td>row limit<\/td>\n<td><code>LIMIT<\/code> or <code>FETCH FIRST<\/code><\/td>\n<td><code>FETCH FIRST<\/code> (old code: <code>ROWNUM<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>upsert<\/td>\n<td><code>INSERT ... ON CONFLICT<\/code><\/td>\n<td><code>MERGE<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>SERIALIZABLE<\/code><\/td>\n<td>SSI: catches write skew<\/td>\n<td>snapshot isolation: allows it<\/td>\n<\/tr>\n<tr>\n<td>DDL<\/td>\n<td>transactional<\/td>\n<td>commits each statement<\/td>\n<\/tr>\n<tr>\n<td>filter on a window<\/td>\n<td>a subquery<\/td>\n<td><code>QUALIFY<\/code> (26ai)<\/td>\n<\/tr>\n<tr>\n<td>claim with a limit<\/td>\n<td><code>LIMIT 1 FOR UPDATE SKIP LOCKED<\/code><\/td>\n<td><code>FETCH FIRST<\/code> with <code>SKIP LOCKED<\/code> only since 26ai<\/td>\n<\/tr>\n<tr>\n<td>deadlock<\/td>\n<td>40P01, the transaction is aborted<\/td>\n<td>ORA-00060, the statement is rolled back<\/td>\n<\/tr>\n<tr>\n<td>JDBC fetch default<\/td>\n<td>the whole result at once<\/td>\n<td>10 rows per round trip<\/td>\n<\/tr>\n<tr>\n<td><code>RETURN_GENERATED_KEYS<\/code><\/td>\n<td><code>RETURNING *<\/code><\/td>\n<td>the ROWID<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","recap":["A SQL table is a bag with no order, a query runs FROM, WHERE, GROUP BY, HAVING, windows, SELECT, ORDER BY, LIMIT in that order, and any comparison with NULL is unknown, which WHERE drops.","Store each fact once, let constraints guard every writer (a CHECK passes on NULL, a foreign key indexes nothing), and keep a denormalized copy only with a reconciliation query.","Joins multiply rows by matches: use EXISTS and NOT EXISTS for semi and anti joins, never NOT IN over a nullable column, and aggregate each child table before joining it.","Window functions keep every row. Rank ties on purpose, remember that the default frame includes tied rows, and filter on a window's result one level up.","LATERAL runs a subquery per row; with LIMIT and a matching index it gives a cheap top N per group. Page with a keyset cursor, not OFFSET.","An index is a sorted copy of some columns with row addresses. Read EXPLAIN from the inside out, put equality columns first, and keep functions off indexed columns.","Each statement reads a snapshot. Read Committed allows lost updates and write skew, Repeatable Read stops lost updates, Serializable stops both; a 40001 means retry the whole transaction.","Row locks make writers wait, SKIP LOCKED lets queue workers pass each other, foreign-key checks take the weak KEY SHARE, and a fixed lock order prevents deadlocks.","From the JVM, count connections and round trips: pool a few connections, bind every value, batch writes, replace N+1 loops with one query, and change the schema only through versioned migrations."],"quiz":[{"q":"You want the merchants whose succeeded March payments add up to more than 100,000. Where does each condition go?","options":["Both in WHERE: <code>WHERE status = 'succeeded' AND sum(amount_minor) &gt; 100000<\/code>","The status and the March range in WHERE, <code>sum(amount_minor) &gt; 100000<\/code> in HAVING","Both in HAVING, after GROUP BY merchant_id","The status in HAVING, the sum in WHERE"],"answer":1,"why":"WHERE filters single rows before grouping, so it can drop failed payments and other months, but it runs before any sum exists: an aggregate in WHERE is an error. HAVING filters the folded groups, so it is where the sum's condition goes. Putting <code>status = 'succeeded'<\/code> in HAVING fails too, because status is neither grouped nor aggregated (lessons 1 and 4).","from":null},{"q":"To list customers who never referred anyone, a report runs <code>WHERE customer_id NOT IN (SELECT referred_by FROM customers)<\/code>. It returns no rows, though six customers never referred anyone. Why?","options":["NOT IN needs DISTINCT in the subquery","NOT IN is slower than NOT EXISTS, and the query timed out","Five customers have NULL in referred_by, so <code>x NOT IN (..., NULL)<\/code> is never true; write NOT EXISTS with a correlated subquery","NOT IN compares the ids as text"],"answer":2,"why":"<code>x NOT IN (a, b, NULL)<\/code> means <code>x &lt;&gt; a AND x &lt;&gt; b AND x &lt;&gt; NULL<\/code>, and the last part is unknown for every x, so no row is ever true. NOT EXISTS asks whether a matching row exists, which NULLs cannot spoil, and it plans as a Hash Anti Join. Duplicates in the subquery change nothing here (lessons 3 and 5).","from":null},{"q":"A statement shows account 900's running balance with <code>sum(amount_minor) OVER (ORDER BY created_at)<\/code>. Its first four ledger entries share one created_at. What do those four rows show?","options":["Each one adds its own amount: four different running totals","An error, because the ORDER BY is not unique","The first row's amount on all four","The same total on all four, which already includes all four amounts"],"answer":3,"why":"With ORDER BY and no frame clause the frame is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, and in RANGE mode the current row brings all its peers, the rows with the same created_at. So all four tied rows see the same sum. Write ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW and add a unique tiebreaker such as entry_id to the ORDER BY to get one step per row (lessons 7 and 8).","from":null},{"q":"An admin API pages through a million payments newest first, 20 per page, with an index on (created_at, payment_id). What changes when page 5,001 uses <code>WHERE (created_at, payment_id) &lt; (:c, :id)<\/code> instead of <code>OFFSET 100000<\/code>?","options":["PostgreSQL seeks to the cursor in the index and reads about 20 entries instead of about 100,020, and new payments no longer shift rows between pages","Nothing: OFFSET also seeks straight to entry 100,001 through the index","It reads fewer rows, but a payment can now appear on two pages","It only helps when the index is on payment_id alone"],"answer":0,"why":"OFFSET has to produce and throw away every skipped row, so its cost grows with the page number, and inserts between requests shift rows across page boundaries. The row comparison is an Index Cond on the matching index: one descent to the cursor, then the next 20 entries, the same work on page 2 and page 5,001. The sort key must be unique, which is why payment_id is in it (lessons 9 and 11).","from":null},{"q":"Two withdrawals of 8,000 each read the sum of Ivy's two accounts (10,000) and then update different accounts. At REPEATABLE READ both commit and her total ends at -6,000. What does SERIALIZABLE do instead?","options":["The same: both are snapshot isolation","The second transaction waits at its SELECT until the first commits","It aborts one of them with SQLSTATE 40001; the application retries it from BEGIN, and the retry sees 2,000 and refuses","It aborts both, and neither withdrawal happens"],"answer":2,"why":"Repeatable Read is snapshot isolation: it only reports two transactions that change the same row, and these changed different rows, so the write skew goes through. PostgreSQL's SERIALIZABLE also tracks what each transaction read, sees the cycle (each read what the other wrote), and aborts one. Nobody waits, because SSI's predicate locks never block. Oracle's SERIALIZABLE is snapshot isolation and lets the skew through (lesson 12).","from":null},{"q":"A refund handler must check a payment's refunds so far before inserting a new refund, and a background worker must claim the next queued job. Which locking clause belongs where?","options":["SKIP LOCKED in both, so neither ever waits","Plain FOR UPDATE on the payment row in the refund handler, FOR UPDATE SKIP LOCKED in the job claim","SKIP LOCKED in the refund handler, plain FOR UPDATE in the job claim","NOWAIT in both"],"answer":1,"why":"The refund check needs that one payment row: if another refund holds it, the handler must wait and then read the new total, which is what plain FOR UPDATE does. SKIP LOCKED there would skip the very row the check is about and see nothing. A worker can take any due job, so stepping over locked rows is exactly right for the claim, and plain FOR UPDATE would make the workers queue behind each other (lessons 12 and 13).","from":null},{"q":"EXPLAIN shows <code>Index Only Scan using ledger_account_created_idx ... Heap Fetches: 4980<\/code> for a statement query. What does that mean, and what fixes it?","options":["Many of the table's pages are not marked all-visible yet, so PostgreSQL had to check those rows in the table; a VACUUM updates the visibility map","The index is missing columns; add them with INCLUDE","It is an ordinary Index Scan that EXPLAIN labels oddly","The index is corrupt and needs REINDEX"],"answer":0,"why":"An Index Only Scan answers from the index alone, but the index does not know whether a row version is visible to this snapshot. PostgreSQL may skip the table only for pages the visibility map marks all-visible, and Heap Fetches counts the rows it still checked in the table. VACUUM sets those bits. A missing column would give an Index Scan, not an Index Only Scan (lesson 11).","from":null},{"q":"A recursive CTE follows money from account to account, and accounts 101 and 102 send money to each other. The recursive term uses UNION ALL and carries a depth column that grows by one each round. What happens, and what stops it?","options":["PostgreSQL detects the repeated account and stops the loop","Switching to UNION stops it, because the rows repeat","It loops until statement_timeout or memory runs out; stop it with the CYCLE clause or a check that the next account is not already on the path","It stops after 100 rounds, PostgreSQL's recursion limit"],"answer":2,"why":"PostgreSQL has no depth limit and does not detect cycles. UNION removes only rows that repeat exactly, and the growing depth makes every round's rows new, so UNION does not help here. <code>CYCLE account_id SET is_cycle USING path<\/code> (PostgreSQL 14) or <code>WHERE next &lt;&gt; ALL (path)<\/code> stops the walk at the first repeat (lesson 6).","from":null},{"q":"Two Kafka consumers receive the same payment message at the same moment and both try to store it. Which statement stores it exactly once, with no error, under that race?","options":["A SELECT for the payment_uid, then an INSERT if it found nothing, in one transaction","<code>MERGE INTO payments ... WHEN NOT MATCHED THEN INSERT ...<\/code>","An INSERT with a CHECK constraint on payment_uid","<code>INSERT INTO payments ... ON CONFLICT (payment_uid) DO NOTHING<\/code>"],"answer":3,"why":"Both consumers can run the SELECT before either inserts, so check-then-insert stores the payment twice when there is no unique constraint, and fails with 23505 when there is one. MERGE decides MATCHED or NOT MATCHED before it writes, so two concurrent MERGEs of the same new key can both insert, and the second fails with 23505. ON CONFLICT asks the unique index in the same step as the write, and the loser does nothing. A CHECK sees one row and cannot compare rows (lessons 2 and 10).","from":null},{"q":"A dashboard endpoint loads 2,500 merchants and then runs one query per merchant for its latest payment. Each query takes 0.2 ms on the server and a round trip takes 1 ms. About how long does the endpoint spend on SQL, and what is the fix?","options":["About 0.5 s; add an index on payments (merchant_id, created_at)","About 3 s, mostly waiting for 2,501 round trips; fetch everything in one query with LEFT JOIN LATERAL, or two with <code>merchant_id = ANY (?)<\/code>","About 3 s; send the queries with addBatch","About 3 s; give the pool more connections so the queries run in parallel"],"answer":1,"why":"2,501 queries at 1 ms of round trip plus 0.2 ms of work each is about 3 seconds, and an index cannot remove the round trips. Batching is for statements whose results you do not need one by one, such as inserts. More connections let more requests run, but this request still waits for its own 2,501 answers in order. One LATERAL query moves the loop into the server: one round trip (lessons 9 and 14).","from":null}]},{"id":"dbi","lab":"internals","title":"Database internals","short":"Build the pieces of a storage engine yourself: a log-structured store, slotted pages, a buffer pool, a B+tree, an LSM tree, a WAL, MVCC, a query executor and Raft.","lessons":["dbi-01","dbi-02","dbi-03","dbi-04","dbi-05","dbi-06","dbi-07","dbi-08","dbi-09","dbi-10","dbi-11","dbi-12"],"intro":"<p>By the end of this track you can follow a payment from your service's <code>COMMIT<\/code> down to the bytes on disk and back out to a replica. You will know when a write is really durable, how a table becomes 8 KB slotted pages, how the buffer pool decides what stays in memory, why an index is a short, wide B+tree and when an LSM tree is the better fit, how the write-ahead log lets a database crash at any moment, how MVCC and locks keep concurrent transactions apart, how a plan runs and how the planner chooses it, why analytics engines store columns, and how Raft keeps copies on several servers in agreement. More useful in practice: you can read <code>EXPLAIN (ANALYZE, BUFFERS)<\/code>, <code>pg_stats<\/code>, <code>pg_locks<\/code> and pageinspect output and say what the database is doing and why.<\/p>\n<p>You need to read and write Kotlin and know basic SQL (the SQL track helps, but each lesson reminds you of what it uses). Install JDK 25 and Docker. The labs compile with release 21, so JDK 21 or newer runs them.<\/p>\n<p>Each lesson has a lab in <code>labs/internals<\/code>, package <code>sfz.internals.l01<\/code> to <code>l12<\/code>: you build one piece of a storage engine in plain Kotlin, a log-structured store, a slotted page, a buffer pool, a B+tree, an LSM store with Bloom filters, a WAL with crash recovery, an MVCC store, a lock manager, a Volcano executor, a cardinality estimator with a join orderer, a compressed column chunk and the core of Raft. The labs need no Docker and their tests are deterministic, including the crash simulations and the Raft cluster, which runs on a simulated clock and network. Run <code>./gradlew :internals:test --tests 'sfz.internals.l05.*'<\/code> from <code>labs/<\/code> for one lesson; the reference answers live in <code>src/solution<\/code>. The Try its run PostgreSQL 18 from <code>labs/env/postgres.yml<\/code> (and Cassandra in lesson 5), plus small demos, one of which runs DuckDB inside the JVM.<\/p>","cheatsheet":"<h2>The track on one page<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Lesson<\/th>\n<th>The problem<\/th>\n<th>The mechanism<\/th>\n<th>Remember<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Bytes, pages and durability<\/td>\n<td><code>write<\/code> returns before the data is on disk<\/td>\n<td>append-only log, <code>force<\/code> (fsync), a CRC per record, an index in RAM<\/td>\n<td>reply OK only after the force; a crash can tear only the last record<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Pages, tuples and heap files<\/td>\n<td>rows of any length in fixed 8 KB pages<\/td>\n<td>slotted page: line pointers at the front, rows at the back; ctid = (page, slot)<\/td>\n<td>DELETE and plain VACUUM don't shrink the file<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>The buffer pool<\/td>\n<td>a disk read costs far more than a memory read<\/td>\n<td>frames, page table, pins, dirty flags, clock sweep, ring buffers for big scans<\/td>\n<td>a pinned page is never evicted; <code>shared_buffers<\/code> near 25% of RAM<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>B+trees<\/td>\n<td>one row out of millions in a few reads<\/td>\n<td>wide sorted tree of pages; a split copies or pushes a key up<\/td>\n<td>3 or 4 levels; equality on leading columns, then one range<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>LSM trees<\/td>\n<td>random inserts dirty whole pages<\/td>\n<td>memtable, immutable sorted SSTables, Bloom filters, compaction<\/td>\n<td>about 10 bits per key for 1% false positives; leveled compaction writes data 10 or more times<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Write-ahead logging<\/td>\n<td>pages are written long after the commit<\/td>\n<td>log before page, force the log at commit, page LSN, redo from a checkpoint<\/td>\n<td><code>synchronous_commit = off<\/code> may lose the last commits; <code>fsync = off<\/code> may corrupt<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>MVCC<\/td>\n<td>readers and writers waiting for each other<\/td>\n<td>row versions with <code>xmin<\/code>/<code>xmax<\/code>, snapshots, VACUUM, freezing<\/td>\n<td>one long transaction holds back VACUUM everywhere<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Concurrency control<\/td>\n<td>lost updates, deadlocks, write skew<\/td>\n<td>strict 2PL, waits-for graph, SSI<\/td>\n<td>retry on 40001 and 40P01, from the start of the transaction<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Query execution<\/td>\n<td>running a plan without holding whole results<\/td>\n<td>iterators (<code>open<\/code>, <code>next<\/code>, <code>close<\/code>), nested loop, hash and merge joins, vectors<\/td>\n<td>actual rows x loops = total rows<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Query optimization<\/td>\n<td>dozens of plans for three tables<\/td>\n<td>cost model, cardinality estimates, dynamic programming over sets of tables<\/td>\n<td>a bad plan usually means a bad estimate<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Column stores<\/td>\n<td>an analytics scan reads every column<\/td>\n<td>column layout, dictionary, run-length, bit-packing, zone maps<\/td>\n<td>zone maps need data sorted by the filter column<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Replication and Raft<\/td>\n<td>one server loses data; two primaries split it<\/td>\n<td>terms, votes, AppendEntries, commit on a majority<\/td>\n<td>3 or 5 servers; a leader commits only entries of its own term by counting<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Numbers to keep<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PostgreSQL page<\/td>\n<td>8 KB; heap row header 24 bytes, line pointer 4 bytes<\/td>\n<\/tr>\n<tr>\n<td>B+tree<\/td>\n<td>hundreds of keys per page, so 3 or 4 levels for any table<\/td>\n<\/tr>\n<tr>\n<td>Bloom filter<\/td>\n<td>10 bits per key and 7 hash functions: about 1% false positives<\/td>\n<\/tr>\n<tr>\n<td>Planner cost units<\/td>\n<td>sequential page 1.0, random page 4.0, row 0.01, operator 0.0025<\/td>\n<\/tr>\n<tr>\n<td>ANALYZE<\/td>\n<td>30,000 sampled rows, 100 MCVs and 100 histogram buckets at the default target of 100<\/td>\n<\/tr>\n<tr>\n<td>Join estimate<\/td>\n<td>rows(R) x rows(S) / max(distinct R.x, distinct S.y)<\/td>\n<\/tr>\n<tr>\n<td>Transaction ids<\/td>\n<td>32-bit; autovacuum forces freezing at 200 million of age<\/td>\n<\/tr>\n<tr>\n<td><code>deadlock_timeout<\/code><\/td>\n<td>1 s before PostgreSQL looks for a cycle<\/td>\n<\/tr>\n<tr>\n<td>Hash table memory<\/td>\n<td><code>work_mem<\/code> (4 MB) x <code>hash_mem_multiplier<\/code> (2)<\/td>\n<\/tr>\n<tr>\n<td>DuckDB<\/td>\n<td>row groups of 122,880 rows, vectors of 2,048 values<\/td>\n<\/tr>\n<tr>\n<td>BRIN<\/td>\n<td>one min and max per 128 pages by default<\/td>\n<\/tr>\n<tr>\n<td>Raft<\/td>\n<td>random election timeout, 150 to 300 ms in the paper; heartbeats well inside it; 2f + 1 servers survive f failures<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Easy to confuse<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>One<\/th>\n<th>The other<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>B+tree vs LSM tree<\/td>\n<td>updates pages in place; a read follows one path down; a random insert dirties a whole page<\/td>\n<td>appends to a memtable and writes sorted files; writes are sequential; a read may check several files, and compaction rewrites data<\/td>\n<\/tr>\n<tr>\n<td>WAL vs MVCC versions<\/td>\n<td>a log of changes, written before the pages, read after a crash and by replicas, recycled after checkpoints<\/td>\n<td>old copies of rows inside the table, kept for snapshots that may still see them, removed by VACUUM<\/td>\n<\/tr>\n<tr>\n<td>Buffer pool vs OS page cache<\/td>\n<td>the database's own cache: it knows pins, dirty pages and the WAL rule<\/td>\n<td>the kernel's cache of file data; PostgreSQL reads through it too, so a page can be cached twice<\/td>\n<\/tr>\n<tr>\n<td>2PL vs SSI<\/td>\n<td>locks held to commit; conflicting transactions wait; deadlocks are possible<\/td>\n<td>reads take no blocking locks; read-write dependencies are tracked and one transaction fails with 40001<\/td>\n<\/tr>\n<tr>\n<td>Nested loop vs hash join<\/td>\n<td>outer x inner work, or one index lookup per outer row; any condition; best for few outer rows<\/td>\n<td>outer + inner work; equality only; needs memory for the build side<\/td>\n<\/tr>\n<tr>\n<td>Row store vs column store<\/td>\n<td>whole rows together: cheap inserts and single-row reads<\/td>\n<td>each column together: cheap scans of few columns, compresses well, slow single-row changes<\/td>\n<\/tr>\n<tr>\n<td>Zone map (BRIN) vs B+tree<\/td>\n<td>min and max per block range: tiny, helps only columns that follow the row order<\/td>\n<td>an entry per row: precise in any order, much bigger<\/td>\n<\/tr>\n<tr>\n<td>Async replication vs Raft<\/td>\n<td>commit first, ship the log later: the last commits can be lost; failover is decided outside<\/td>\n<td>commit after a majority stores it; the leader is elected inside the protocol<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Looking inside PostgreSQL<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>To see<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>the rows and line pointers of a page<\/td>\n<td><code>SELECT * FROM heap_page_items(get_raw_page('t', 0))<\/code> (pageinspect)<\/td>\n<\/tr>\n<tr>\n<td>what is cached<\/td>\n<td><code>pg_buffercache<\/code>, and <code>Buffers: shared hit / read<\/code> in <code>EXPLAIN (ANALYZE, BUFFERS)<\/code><\/td>\n<\/tr>\n<tr>\n<td>an index's pages<\/td>\n<td><code>bt_metap<\/code>, <code>bt_page_items<\/code> (pageinspect)<\/td>\n<\/tr>\n<tr>\n<td>the WAL<\/td>\n<td><code>pg_current_wal_lsn()<\/code>, <code>pg_waldump<\/code><\/td>\n<\/tr>\n<tr>\n<td>versions and snapshots<\/td>\n<td><code>xmin<\/code>, <code>xmax<\/code>, <code>pg_current_snapshot()<\/code>, <code>pg_stat_user_tables.n_dead_tup<\/code><\/td>\n<\/tr>\n<tr>\n<td>who waits for whom<\/td>\n<td><code>pg_locks<\/code>, <code>pg_blocking_pids(pid)<\/code><\/td>\n<\/tr>\n<tr>\n<td>what a plan did<\/td>\n<td><code>EXPLAIN (ANALYZE)<\/code>: estimated <code>rows=<\/code> against <code>actual rows=<\/code>, times <code>loops<\/code><\/td>\n<\/tr>\n<tr>\n<td>what the planner knows<\/td>\n<td><code>pg_stats<\/code>, <code>pg_stats_ext<\/code>; fix correlated columns with <code>CREATE STATISTICS<\/code><\/td>\n<\/tr>\n<tr>\n<td>zone maps<\/td>\n<td><code>CREATE INDEX ... USING brin (created_at)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>When something goes wrong, ask first<\/h2>\n<ul>\n<li>Data lost after a crash: was the OK sent before a force, or with <code>synchronous_commit = off<\/code>, or from an async replica after failover?<\/li>\n<li>Table or index keeps growing: is a long transaction or an <code>idle in transaction<\/code> session holding back VACUUM?<\/li>\n<li>Query got slow: in EXPLAIN ANALYZE, which is the lowest node whose estimated and actual rows differ by 10x or more?<\/li>\n<li>Errors 40001 or 40P01: does every transaction have a retry loop that starts again from the beginning?<\/li>\n<li>Analytics hurts the primary: can the scan move to a copy in a column store, loaded in batches and sorted by the filter column?<\/li>\n<\/ul>","recap":["A write is durable only after <code>force<\/code> (fsync) returns. Logs make that cheap: append sequentially, force once per batch, and check a CRC per record after a crash.","Tables are files of 8 KB slotted pages; a row's address is (page, slot). The buffer pool caches pages with pins, dirty flags and a clock sweep, on top of the OS page cache.","A B+tree reads one page per level, three or four in all, and updates pages in place. An LSM tree turns random writes into sequential files and pays with compaction and multi-file reads.","The write-ahead log is forced at commit and always reaches disk before the pages it describes. Recovery replays it from the last checkpoint, and page LSNs make replay safe to repeat.","MVCC keeps old row versions so readers never wait for writers. Writers still lock rows, VACUUM removes versions no snapshot can see, and a long transaction blocks it.","Strict 2PL holds locks until commit and must break deadlocks. SERIALIZABLE in PostgreSQL is SSI, which aborts with 40001 instead of blocking, so every transaction needs a retry loop.","A plan is a tree of iterators. Nested loops cost outer x inner (or a lookup per outer row), hash joins outer + inner; vectorized engines pass a thousand or more values per call.","The planner picks the cheapest plan for its estimates. Estimates come from sampled per-column statistics and assume independence, so correlated columns need <code>CREATE STATISTICS<\/code>.","Column stores keep each column together, compress it with dictionaries, runs and bit-packing, and skip chunks with zone maps, which only work on columns that follow the row order.","Raft keeps a log on a majority of 2f + 1 servers: one leader per term, elected by votes that go only to up-to-date logs, and an entry is committed once a majority stores it."],"quiz":[{"q":"A fraud service inserts 50,000 events a second keyed by random UUIDs and reads them back by key, rarely by range. Why might an LSM tree suit it better than a B+tree, and what does it pay?","options":["The LSM tree writes sorted files sequentially instead of dirtying a random page per insert; it pays with compaction rewrites and reads that may check several files","The B+tree appends random UUIDs at the end of its last leaf, so it wins on writes too","The LSM tree wins on writes and on reads, with no cost","The B+tree is better, because Bloom filters make its range scans fast"],"answer":0,"why":"Random keys land on random leaf pages, so a B+tree dirties (and logs) a whole 8 KB page for a small insert. An LSM tree buffers writes in a memtable and flushes them as one sorted file, then merges files in the background: write amplification from compaction, and point reads that may look in several files, which Bloom filters make cheaper. Only ascending keys fill a B+tree's last leaf; Bloom filters belong to LSM trees and don't help range scans.","from":"dbi-05"},{"q":"In PostgreSQL an UPDATE changes a balance from 100 to 70 and commits. Where does the old value 100 live afterwards, and what removes it?","options":["Only in the WAL, which keeps it until VACUUM runs","In the heap page as an old row version with <code>xmax<\/code> set, until VACUUM removes it once no snapshot can see it; the WAL record of the change is recycled after later checkpoints","Nowhere: the update overwrote it in place, and readers that need it wait","In an undo log, which purge clears at commit"],"answer":1,"why":"PostgreSQL's MVCC writes a new version and stamps the old one's <code>xmax<\/code>; both stay in the table for snapshots that may still see the old one, and VACUUM reclaims it later. The WAL is a different thing: a log of changes for crash recovery and replicas, not a store of old values for readers. Undo logs are how InnoDB and Oracle keep old versions.","from":"dbi-07"},{"q":"<code>EXPLAIN (ANALYZE, BUFFERS)<\/code> shows <code>Buffers: shared read=8000<\/code> for a query that finished in 30 ms, and the disks show no reads at all. How?","options":["EXPLAIN counts reads it planned, not reads it did","The pages were in the buffer pool after all; <code>read<\/code> is a rounding error","<code>read<\/code> means the pages weren't in <code>shared_buffers<\/code>; PostgreSQL asked the kernel, which had them in the OS page cache","The query ran on a replica"],"answer":2,"why":"PostgreSQL's buffer pool sits on top of the kernel's page cache, and it reads files through it. A miss in <code>shared_buffers<\/code> is counted as <code>read<\/code> even when the kernel serves the page from memory in microseconds. That double caching is why <code>shared_buffers<\/code> starts near 25% of RAM rather than most of it.","from":"dbi-03"},{"q":"Two transfers each check that a pair of accounts keeps a combined balance above zero, then each debits a different account. Under REPEATABLE READ both commit and the rule breaks. What does PostgreSQL's SERIALIZABLE do differently?","options":["It takes exclusive locks on every row read, so the second transfer waits until the first commits","It tracks that each transaction read what the other wrote, and aborts one of them with 40001; the reads never block","It runs transactions one at a time","Nothing: write skew is allowed at every level"],"answer":1,"why":"PostgreSQL's SERIALIZABLE is serializable snapshot isolation: reads leave non-blocking SIREAD notes, and a pattern of read-write dependencies in both directions makes it abort one transaction with 40001, which the application retries. Strict two-phase locking would make readers block writers instead, which is what <code>SELECT ... FOR UPDATE<\/code> gives you by hand.","from":"dbi-08"},{"q":"A screen shows the 10 newest payments with their merchant names; <code>merchants.id<\/code> has a primary-key index. A nightly report joins all 2 million payments with 10,000 merchants. Which join suits each?","options":["Hash join for both","Nested loop for both","Index nested loop for the screen (10 index lookups), hash join for the report (each table read once)","Merge join for both, because the primary key is sorted"],"answer":2,"why":"With 10 outer rows, one index lookup per row touches a handful of pages; building a hash table of 10,000 merchants first would cost more. For 2 million rows, a nested loop would do 2 million lookups or 20 billion comparisons, while a hash join builds a table of the merchants once and probes it per payment.","from":"dbi-09"},{"q":"A ledger service writes each entry with <code>FileChannel.write<\/code> and replies OK at once. The machine loses power a millisecond later. What may have happened to the entry?","options":["Nothing: <code>write<\/code> returned, so the bytes are on disk","It may be lost: <code>write<\/code> only copied it into the kernel's page cache, and only <code>force<\/code> waits for the drive","It is half-written, and the next start fails","It is safe if the file was opened in append mode"],"answer":1,"why":"<code>write<\/code> returns once the kernel has the bytes in memory. They reach the drive later, unless <code>force<\/code> (fsync) is called and returns first. A torn last record is possible too, which is why logs carry a CRC per record, but the main point is that the OK went out before the data was durable.","from":"dbi-01"},{"q":"VACUUM compacts a heap page, moving the surviving rows to close the gaps. Why don't the table's indexes need to change?","options":["Indexes store the row's values, not where it is","Index entries point to (page, slot); the slot number stays the same, and only the offset inside the line pointer changes","VACUUM rebuilds every index at the same time","Rows never move inside a page"],"answer":1,"why":"A slotted page puts an array of line pointers in front of the rows. Indexes and ctids name the line pointer, not the byte offset, so compaction can move a row's bytes and update its line pointer without touching any index. That indirection is the point of the slotted page.","from":"dbi-02"},{"q":"Settlement records from 40 acquirers are written to Parquet in arrival order. A reconciliation query filters on <code>acquirer_id = 17<\/code> and one settlement day, and the reader still reads every row group. What lets it skip most of them?","options":["Bigger row groups, so there are fewer to read","zstd compression on top of the encodings","Sorting each file by acquirer and settlement day before writing it, so each row group's min and max cover a narrow range","A B+tree index stored next to the file"],"answer":2,"why":"Readers skip a row group when its column statistics, the min and max, rule out the condition. In arrival order every row group holds most acquirers and days, so nothing can be ruled out. Sorted data gives each row group a narrow range that most queries miss. Compression and bigger groups make reads cheaper but don't skip anything.","from":"dbi-11"},{"q":"Which statement about PostgreSQL's planner is true?","options":["It always finds the fastest plan, given an index","It runs the candidate plans on a sample and keeps the fastest","It picks the cheapest plan for its row estimates, which come from sampled per-column statistics and assume conditions on different columns are independent","It learns correlations between columns from multicolumn indexes"],"answer":2,"why":"The planner prices plans with a cost model fed by cardinality estimates, then searches join orders by dynamic programming. The search is exact for its inputs, so when the plan is bad it is usually because an estimate is far off, often from correlated columns. Only <code>CREATE STATISTICS<\/code> gives it cross-column statistics; indexes don't.","from":"dbi-10"},{"q":"A three-server Raft group is spread over two data centres, two servers in one and one in the other. The data centre with two servers loses power. What happens?","options":["The remaining server becomes leader and keeps taking writes","The remaining server can't win a majority (2 of 3), so no leader is elected and no write commits until a server comes back","The cluster keeps working read-write, because Raft needs only one copy","The remaining server commits writes and reconciles them later"],"answer":1,"why":"A leader needs votes from a majority, 2 of 3, and an entry commits only on a majority. One server alone can do neither, which is what keeps a cut-off minority from accepting writes that could conflict. Spread three or five servers over three failure domains so that losing one domain still leaves a majority.","from":"dbi-12"}]},{"id":"nosql","lab":"nosql","title":"NoSQL databases","short":"Key-value, document, wide-column, graph, search and vector stores, and the distributed ideas under them: partitioning, quorums, consistency and conflicts.","lessons":["nosql-01","nosql-02","nosql-03","nosql-04","nosql-05","nosql-06","nosql-07","nosql-08","nosql-09","nosql-10","nosql-11","nosql-12"],"intro":"<p>This track takes you from \"NoSQL is the database without SQL\" to a working model of how distributed stores keep data. You start with the two papers almost every store descends from, Google's Bigtable and Amazon's Dynamo, and then build the ideas under them one at a time: keys designed from access patterns, partitioning on a hash ring, replication with N, R and W, consistency models and conflicts, and transactions across partitions. Along the way you meet one lead store per data model (DynamoDB, Cassandra, MongoDB, Neo4j) and the specialized stores for search, time-series and vectors. At the end you can design keys for a payments service in any of them, predict what a read sees while replicas disagree, and choose a store, or no new store, for a new access pattern.<\/p>\n<p>You need to program, and you need nothing else, but two earlier tracks make this one easier. The database internals track explains the pieces these stores are made of: B+trees, LSM trees, MVCC, locking and Raft. The SQL track's lessons on isolation levels and recursive queries come back in lessons 9 to 11. Every lesson reminds you of what it borrows in a sentence.<\/p>\n<p>The labs live in <code>labs/nosql<\/code>, in Kotlin. About half of them are models you build in plain Kotlin and test in a second: a mini Bigtable, a hash ring, a quorum store, vector clocks and CRDTs, Paxos, an inverted index. The others run against real stores that Testcontainers starts for you (DynamoDB Local, MongoDB 9.0, Neo4j 2026.10), so they need Docker. The Try-its use Compose files in <code>labs/env<\/code>, one store at a time: start it, try it, and stop it with <code>down -v<\/code>. Run everything from the <code>labs<\/code> folder, and <code>./gradlew :nosql:test --tests 'sfz.nosql.lNN.*'<\/code> runs one lesson's lab.<\/p>","cheatsheet":"<h2>Families: what you store decides what you can ask<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Family<\/th>\n<th>You find data by<\/th>\n<th>Lead store<\/th>\n<th>Built in<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Key-value<\/td>\n<td>its key, or a sorted run in one partition<\/td>\n<td>DynamoDB<\/td>\n<td>lessons 3, 4<\/td>\n<\/tr>\n<tr>\n<td>Wide-column<\/td>\n<td>partition key, then a slice of clustering columns<\/td>\n<td>Cassandra 5.0<\/td>\n<td>lesson 7<\/td>\n<\/tr>\n<tr>\n<td>Document<\/td>\n<td>any indexed field of a JSON-like document<\/td>\n<td>MongoDB 9.0<\/td>\n<td>lesson 8<\/td>\n<\/tr>\n<tr>\n<td>Graph<\/td>\n<td>a start node, then a walk along relationships<\/td>\n<td>Neo4j 2026.10<\/td>\n<td>lesson 11<\/td>\n<\/tr>\n<tr>\n<td>Search<\/td>\n<td>words, through an inverted index, ranked by BM25<\/td>\n<td>OpenSearch 3.9<\/td>\n<td>lesson 12<\/td>\n<\/tr>\n<tr>\n<td>Time-series<\/td>\n<td>a time range, through chunks and rolled-up buckets<\/td>\n<td>TimescaleDB 2.31<\/td>\n<td>lesson 12<\/td>\n<\/tr>\n<tr>\n<td>Vector<\/td>\n<td>nearest neighbours of an embedding, through HNSW<\/td>\n<td>pgvector 0.8.7<\/td>\n<td>lesson 12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Two placement answers sit under them (lesson 1): Bigtable sorts keys and cuts them into ranges; Dynamo hashes keys onto a ring and copies each to N nodes. Cassandra is Dynamo's ring with Bigtable's storage. DynamoDB is not Dynamo: each partition has a Multi-Paxos leader.<\/p>\n<h2>Keys come from the questions (lessons 2, 3, 7)<\/h2>\n<ul>\n<li>Write every access pattern down with its rate before choosing a key.<\/li>\n<li>Partition key: <code>=<\/code> on all its parts; it picks the partition (hashed). Sort key or clustering columns: sorted inside the partition; <code>=<\/code> on leading parts, then one range, no gaps.<\/li>\n<li>Every query is a key lookup, a range read or a scan. A filter runs after the read and pays for everything read.<\/li>\n<li>A question the key can't answer gets another copy: a GSI, another Cassandra table, another MongoDB index. Each copy costs a write on every insert, and a DynamoDB GSI lags and can't be read strongly consistently.<\/li>\n<\/ul>\n<h2>Numbers worth remembering<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DynamoDB per partition<\/td>\n<td>3,000 reads and 1,000 writes a second; read unit 4 KB, write unit 1 KB<\/td>\n<\/tr>\n<tr>\n<td>DynamoDB transaction<\/td>\n<td>up to 100 items, 4 MB, two writes per item, client token remembered 10 min<\/td>\n<\/tr>\n<tr>\n<td>Cassandra hints<\/td>\n<td>kept for <code>max_hint_window<\/code>, 3 h<\/td>\n<\/tr>\n<tr>\n<td>Cassandra tombstones<\/td>\n<td>kept <code>gc_grace_seconds<\/code>, 10 days; warn at 1,000 per read, fail at 100,000<\/td>\n<\/tr>\n<tr>\n<td>MongoDB election<\/td>\n<td>after <code>electionTimeoutMillis<\/code>, 10 s; typically done within 12 s<\/td>\n<\/tr>\n<tr>\n<td>MongoDB transaction<\/td>\n<td>60 s default lifetime; needs a replica set<\/td>\n<\/tr>\n<tr>\n<td>Cassandra LWT (Paxos v1)<\/td>\n<td>4 round trips per write; v2 needs 2<\/td>\n<\/tr>\n<tr>\n<td>BM25 defaults<\/td>\n<td>k1 = 1.2, b = 0.75<\/td>\n<\/tr>\n<tr>\n<td>pgvector HNSW defaults<\/td>\n<td>m = 16, ef_construction = 64, ef_search = 40<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Replication and quorums (lessons 6, 8)<\/h2>\n<ul>\n<li>Leader-based (DynamoDB, MongoDB): one copy orders writes; failover needs an election. Leaderless (Dynamo, Cassandra): every write goes to all N replicas, W must acknowledge, a read asks R.<\/li>\n<li>R + W &gt; N: every read set overlaps every acknowledged write set. N = 3, QUORUM = 2.<\/li>\n<li>Catch-up: hinted handoff (short outages), read repair (keys that get read), anti-entropy with Merkle trees (everything else).<\/li>\n<li><code>Unavailable<\/code>: too few replicas alive, nothing tried. <code>WriteTimeout<\/code> or a <code>wtimeout<\/code>: tried, outcome unknown, may have landed.<\/li>\n<li>MongoDB <code>w: 1<\/code> can be rolled back after a failover; <code>w: \"majority\"<\/code>, the default since 5.0, survives it.<\/li>\n<\/ul>\n<h2>Consistency and conflicts (lesson 9)<\/h2>\n<ul>\n<li>Ladder: linearizable, sequential, causal, session guarantees (read your writes, monotonic reads, monotonic writes, writes follow reads), eventual.<\/li>\n<li>CAP: during a partition, a replica answers (A) or refuses (C). PACELC: else, latency or consistency, every day.<\/li>\n<li>Last write wins keeps one concurrent write and drops the other by clock. Vector clocks detect concurrency and return siblings. CRDTs merge in any order (G-Counter: max per slot; OR-Set: remove the tags you saw).<\/li>\n<\/ul>\n<h2>Transactions (lessons 4, 10)<\/h2>\n<ul>\n<li>Across partitions: every participant promises (prepare), one decision is recorded durably, then commit. That's two-phase commit.<\/li>\n<li>DynamoDB: a rejected prepare is <code>TransactionConflict<\/code>; nothing waits; retry with backoff and the same idempotency key.<\/li>\n<li>MongoDB: snapshot per transaction; first writer wins; <code>TransientTransactionError<\/code> means rerun the whole transaction; set <code>snapshot<\/code> and <code>majority<\/code>.<\/li>\n<li>Cassandra LWT: Paxos on one partition (prepare, read, propose, commit), <code>[applied]<\/code> in the reply. Accord in 6.0 (alpha): <code>BEGIN TRANSACTION<\/code> across partitions.<\/li>\n<li>Prefer one document, one conditional write, or a saga of single-partition steps when the business can see \"pending\".<\/li>\n<\/ul>\n<h2>Graphs and specialized stores (lessons 11, 12)<\/h2>\n<ul>\n<li>Cypher: <code>MATCH (a:Account {id: $id})-[:USES]-&gt;(x)&lt;-[:USES]-(b)<\/code>; repeat with <code>((...)){1,3}<\/code>; <code>-[:TRANSFERRED_TO]-&gt;{3,6}<\/code> for cycles. Start from an index, bound every walk, keep supernodes out.<\/li>\n<li>Search: analyzer, posting lists, BM25. Time-series: chunks, <code>time_bucket<\/code>, keep count and sum, drop old chunks. Vectors: exact is a full comparison; HNSW walks layers with a beam of <code>ef_search<\/code>; measure recall@k.<\/li>\n<li>Every extra store is a copy: feed it from an outbox through Kafka, never by dual writes, and watch its lag.<\/li>\n<\/ul>\n<h2>Pairs people mix up<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>This<\/th>\n<th>Is not<\/th>\n<th>The difference<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CAP<\/td>\n<td>PACELC<\/td>\n<td>CAP is only about a network partition; PACELC adds the latency or consistency trade on normal days<\/td>\n<\/tr>\n<tr>\n<td>Quorum (R + W &gt; N)<\/td>\n<td>Consensus (Paxos, Raft)<\/td>\n<td>a quorum makes reads overlap writes; consensus makes replicas agree on one order or one value<\/td>\n<\/tr>\n<tr>\n<td>Last write wins<\/td>\n<td>Vector clocks<\/td>\n<td>LWW silently keeps the later timestamp; vector clocks notice concurrent writes and hand both back<\/td>\n<\/tr>\n<tr>\n<td>Embed<\/td>\n<td>Reference<\/td>\n<td>embed what is read and changed together and bounded; reference what grows without limit<\/td>\n<\/tr>\n<tr>\n<td>Partition key<\/td>\n<td>Clustering column<\/td>\n<td>the partition key picks the machine and needs <code>=<\/code>; clustering columns order rows inside it and allow one range<\/td>\n<\/tr>\n<tr>\n<td>Base table read<\/td>\n<td>GSI read<\/td>\n<td>the table can be read strongly consistently; a GSI lags and can't be<\/td>\n<\/tr>\n<tr>\n<td><code>Unavailable<\/code><\/td>\n<td><code>WriteTimeout<\/code><\/td>\n<td>not attempted, against attempted with an unknown outcome<\/td>\n<\/tr>\n<tr>\n<td>Lightweight transaction<\/td>\n<td>Accord transaction<\/td>\n<td>one partition, Paxos, Cassandra 5.0; many partitions and tables, 6.0 alpha<\/td>\n<\/tr>\n<tr>\n<td>Exact nearest neighbours<\/td>\n<td>Approximate (HNSW)<\/td>\n<td>always right and reads everything; reads a little and may miss a neighbour<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","recap":["Bigtable sorts keys into ranges, Dynamo hashes them onto a ring with N copies; nearly every NoSQL store uses one, the other or both. DynamoDB kept Dynamo's name, not its leaderless design.","Design keys from the access patterns: the partition key picks the partition and needs <code>=<\/code>, the sort key or clustering columns give cheap slices. Anything the key can't answer needs another copy of the data, which costs a write and may lag.","Consistent hashing with virtual nodes spreads keys evenly and moves few of them when nodes join, but it balances keys, not requests: hot keys need write sharding or a cache.","Leaderless replicas agree only as far as R + W &gt; N makes reads and writes overlap. Hints, read repair and Merkle-tree repair converge them; timeouts mean \"unknown\", not \"failed\".","Cassandra appends cells and merges on read; deletes are tombstones that must be repaired within <code>gc_grace_seconds<\/code>. MongoDB writes one document atomically, and <code>w: \"majority\"<\/code> is what survives a failover.","Name the consistency you need per piece of data. CAP covers partitions, PACELC the daily latency trade. Last write wins drops a concurrent write; vector clocks detect it; CRDTs merge without losing one.","Transactions exist in every store now, at a price: prepare and commit across partitions, write conflicts and retries, four Paxos ro
