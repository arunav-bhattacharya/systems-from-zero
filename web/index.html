til the disk itself holds a file's data, instead of only the kernel's page cache."},{"term":"Replication ID and offset","plain":"A random name for a primary's history and a count of bytes in its stream; together they name one exact version of the data."},{"term":"Replication backlog","plain":"The newest part of the replication stream kept in the primary's memory for replicas that reconnect."},{"term":"Partial resync","plain":"A reconnecting replica gets only the bytes it missed, from the backlog, instead of a full snapshot."},{"term":"Sentinel","plain":"A separate process that watches a primary and, with the other Sentinels, promotes a replica when the primary is down."}],"remote":true},"redis-11":{"id":"redis-11","track":"redis","n":11,"title":"Redis Cluster and production operations","ready":true,"minutes":40,"goal":"By the end you can predict which node of a Redis Cluster holds a key, keep the keys that change together in one slot, explain what a client does on MOVED and ASK, and find the command, fork or key behind a latency spike.","quiz":[{"q":"A cluster of 3 primaries holds 30 million keys. You add a fourth primary and rebalance so that each holds a quarter of the slots. About how many keys move?","options":["None: every key keeps its slot","About 7.5 million: only the keys in the 4,096 slots handed to the new node","About 22.5 million, as with hash mod N","All 30 million, because the slot table changes"],"answer":1,"why":"A key's slot never changes; what changes is the owner of 4,096 slots, about 1,365 taken from each old node. The keys in those slots, a quarter of all keys, move with them. With hash mod N, going from 3 servers to 4 moves three keys in four. The first option is half right: the slots stay, but some change owner, and their keys go along.","from":null},{"q":"A Lua script from lesson 6 reads <code>{merchant:7}:balance<\/code> and writes <code>audit:merchant:7<\/code>. On a cluster it fails with CROSSSLOT. Why, and what fixes it?","options":["<code>audit:merchant:7<\/code> has no braces, so its whole name is hashed and lands in another slot; name it <code>{merchant:7}:audit<\/code>","Scripts can't run on a cluster; move the logic into the client","The script must first be loaded with SCRIPT LOAD on every node","Only the first key's slot counts; swap the order of the keys"],"answer":0,"why":"Only the part in braces is hashed, and only if the key has braces. <code>audit:merchant:7<\/code> hashes all its characters (slot 513) while <code>{merchant:7}:balance<\/code> hashes <code>merchant:7<\/code> (slot 10890). A script, like a MULTI, must have all its keys in one slot so that one node can run it atomically. Loading the script everywhere doesn't change where the keys live, and every key counts, not just the first.","from":"redis-06"},{"q":"During a classic resharding of slot 9055 from node 2 to node 3, your client sends <code>GET {payment:42}:refund<\/code> to node 2 and gets <code>ASK 9055 127.0.0.1:7003<\/code>. What should it do?","options":["Map slot 9055 to node 3 and send every later slot-9055 command there","Retry on node 2 until the key shows up","Send ASKING and then the GET to node 3, this once, and keep sending other slot-9055 commands to node 2","Send the GET to node 3 without ASKING"],"answer":2,"why":"ASK means the slot is on its way: this key is no longer, or not yet, on node 2, but other keys of the slot still are. So only this command goes to node 3, preceded by ASKING, which tells node 3 to serve a slot it is importing but doesn't own yet. Without ASKING, node 3 answers MOVED back to node 2. Updating the table is what MOVED asks for, once the move is finished.","from":null},{"q":"Every service's p99 on one Redis jumps from 1 ms to 140 ms for a moment, about every 5 minutes. The slow log shows nothing. What do you check next?","options":["Lower <code>slowlog-log-slower-than<\/code> to 1 ms so that smaller commands are logged too","Turn on io-threads","Replace KEYS with SCAN everywhere","The latency monitor and <code>latest_fork_usec<\/code>: a BGSAVE fork from the save points pauses the main thread, and the slow log only times commands"],"answer":3,"why":"The slow log times command execution. The fork behind a BGSAVE (lesson 10) pauses the main thread outside any command, and the default save points fire every few minutes on a busy server. <code>INFO stats<\/code> shows <code>latest_fork_usec<\/code>, and with <code>latency-monitor-threshold<\/code> set, <code>LATENCY LATEST<\/code> records <code>fork<\/code> events. A lower threshold logs more commands, but still only commands, and I/O threads neither run commands nor fork.","from":"redis-10"},{"q":"A clean-up job must delete 2 million <code>tmp:*<\/code> keys from a production Redis that holds 30 million keys. Which approach keeps other clients fast?","options":["SCAN with <code>MATCH tmp:* COUNT 1000<\/code>, and UNLINK each page of keys it returns","<code>KEYS tmp:*<\/code>, then DEL them in batches of 1,000","One Lua script that calls KEYS and DEL","FLUSHDB ASYNC"],"answer":0,"why":"KEYS walks all 30 million keys in one command and blocks every client for seconds, whether a client or a script calls it. SCAN does the same walk in small steps with other commands served in between, and UNLINK frees each value on a background thread. FLUSHDB would delete the other 28 million keys too.","from":null}],"cards":[{"front":"How does Redis Cluster pick a key's slot?","back":"<p>CRC16 (XMODEM) of the key, or of its hash tag, modulo 16,384.<\/p>"},{"front":"MOVED versus ASK?","back":"<p>MOVED: the slot lives elsewhere now, so update your table. ASK: the slot is moving, so send this one command to the target after ASKING, and keep your table.<\/p>"},{"front":"When is only part of a key hashed?","back":"<p>When it has a <code>{<\/code>, a later <code>}<\/code>, and at least one character between: only the part between the first <code>{<\/code> and the next <code>}<\/code> is hashed.<\/p>"},{"front":"What does CROSSSLOT mean?","back":"<p>A command, transaction or script named keys in more than one slot. No node can run it as one step.<\/p>"},{"front":"What does the slow log measure?","back":"<p>Time a command spent executing on the main thread, for commands over <code>slowlog-log-slower-than<\/code> (10 ms by default). Not network time, not queueing, not forks.<\/p>"},{"front":"Why SCAN instead of KEYS?","back":"<p>KEYS walks the whole keyspace in one command and blocks every client. SCAN walks it in small steps with other commands in between, at the price of possible duplicates.<\/p>"},{"front":"What does a high <code>mem_fragmentation_ratio<\/code> mean after big deletes?","back":"<p>RSS stayed while used memory fell: freed pieces are stuck in pages that still hold live values. Active defrag compacts them.<\/p>"}],"terms":[{"term":"Hash slot","plain":"One of 16,384 buckets; a key's slot is CRC16 of the key (or its hash tag) mod 16384."},{"term":"Slot table","plain":"The map of which primary owns each slot; every node and every cluster-aware client keeps a copy."},{"term":"MOVED","plain":"A node's reply naming the slot's owner: the slot lives elsewhere, so ask there and update your table."},{"term":"ASK","plain":"A node's reply during a slot move: send just this command to the target, after ASKING."},{"term":"Hash tag","plain":"The part of a key between <code>{<\/code> and <code>}<\/code>; when present, only it is hashed, so related keys share a slot."},{"term":"Slow log","plain":"The last 128 commands that ran longer than a threshold on the command thread, with their arguments."},{"term":"Big key","plain":"A single key holding so many elements or bytes that commands on it, or moving it, block the server."},{"term":"Hot key","plain":"A single key receiving a large share of the traffic, so one node's thread does most of the work."}],"remote":true},"data-01":{"id":"data-01","track":"data","n":1,"title":"Why big data systems exist, and when you don't need one","ready":true,"minutes":40,"goal":"By the end you can estimate how long a full scan takes from bytes and bandwidth, name the two levers that make it faster (more readers, fewer bytes), and decide whether a workload needs a cluster at all.","quiz":[{"q":"A nightly job reads 600 GB of Parquet files from object storage (a file service reached over the network, such as Amazon S3). The VM pulls 1.5 GB/s from storage and decodes Parquet at 4 GB/s. Roughly how long does the scan take?","options":["About 2.5 minutes","About 7 minutes","About 10 minutes","About 40 minutes"],"answer":1,"why":"The slowest stage sets the bandwidth, and here that's storage: 600 GB at 1.5 GB/s is 400 seconds, about 7 minutes. The tempting 2.5 minutes uses the decode speed, but the CPU can only decode bytes that have arrived.","from":null},{"q":"A 2 GB file is stored in 128 MiB blocks, one task per block. You run a scan on a cluster with 50 idle machines. How many machines do any work?","options":["50","16","15","1"],"answer":2,"why":"2,000,000,000 / 134,217,728 = 14.9, so the file has 15 blocks and the scan has 15 tasks. The other 35 machines wait. The tempting 16 comes from dividing by 128,000,000 instead of 128 MiB, and 50 assumes work splits as finely as you like.","from":null},{"q":"A table has 40 columns of similar width. A query needs 4 of them. You move the table from CSV to a columnar format that compresses 4 times. Roughly how many fewer bytes does the query read?","options":["4 times fewer","10 times fewer","40 times fewer","No change, because a query reads whole rows either way"],"answer":2,"why":"Reading 4 of 40 columns cuts the bytes 10 times, and compression cuts them 4 times more: 40 times fewer. \"10 times\" forgets compression. A columnar format exists exactly so that a query doesn't read whole rows.","from":null},{"q":"You double the machines on a scan job and the run time barely changes. Which explanation fits best?","options":["Startup or one slow machine already dominated the time","The data is compressed","The files are in a columnar format","Each machine now reads fewer blocks"],"answer":0,"why":"Doubling machines halves only the part of the job that splits: the reading. Startup is paid once, and the job waits for its slowest machine, so if those dominate, more machines don't help. Fewer blocks per machine is what should have made it faster; it just wasn't the bottleneck.","from":null},{"q":"A team stores 300 GB of payment events. Analysts query the last 7 days, about 6 GB, a few times an hour. What should they try first?","options":["A 20-node Spark cluster, so queries stay fast as the data grows","Keep the CSV files and buy a machine with more cores","Load everything into a Kafka topic with long retention","Partition by day in a columnar format and query it with a single-machine engine such as DuckDB"],"answer":3,"why":"The queries read about 6 GB, less after column pruning and compression. One machine scans that in seconds. A cluster adds startup, cost and operations for a problem that isn't there yet. More cores help CSV a little, but reading fewer bytes helps far more.","from":null}],"cards":[{"front":"What is your first estimate for a full scan's time?","back":"<p>Bytes read divided by the bandwidth of the slowest stage (disk, network or CPU decoding). 1 TB at 500 MB/s is 2,000 s.<\/p>"},{"front":"Why can't 10,000 machines scan a 1 TB HDFS file faster than 7,451 machines can?","back":"<p>Work comes in 128 MiB blocks, one task each. 1 TB is 7,451 blocks, so extra machines have nothing to read.<\/p>"},{"front":"What does scale-out cost besides the extra machines?","back":"<p>Startup and coordination that don't shrink, waiting for the slowest machine, and re-running work when a machine fails.<\/p>"},{"front":"A query needs 3 of 30 equally wide columns and the format compresses 5x. What fraction of a 1 TB row scan does it read?","back":"<p>1/10 x 1/5 = 1/50, about 20 GB.<\/p>"},{"front":"Why is the second run of a scan on your laptop often much faster than the first?","back":"<p>The OS page cache keeps the file in RAM, so the second run reads memory instead of the SSD.<\/p>"},{"front":"What did Tigani report about BigQuery query sizes?","back":"<p>Among customers spending over $1,000 a year, 90% of queries processed less than 100 MB.<\/p>"}],"terms":[{"term":"Full scan","plain":"Reading every row of a table (or of the part a query needs), as analytics queries do."},{"term":"Bandwidth","plain":"How many bytes per second a stage can move: a disk, a network link, or a CPU decoding a file."},{"term":"Scale-up","plain":"Making one machine bigger: more cores, memory and disks."},{"term":"Scale-out","plain":"Adding machines and splitting the work between them."},{"term":"Straggler","plain":"The slowest machine or task in a parallel job. The job can't finish before it does."},{"term":"Columnar layout","plain":"Storing each column's values together, so a query reads only the columns it names."},{"term":"Page cache","plain":"Memory where the operating system keeps recently read file data, so the next read skips the disk."}],"remote":true},"data-02":{"id":"data-02","track":"data","n":2,"title":"HDFS and MapReduce: the ideas that survived","ready":true,"minutes":40,"goal":"By the end you can trace a MapReduce job through map, partition, shuffle and reduce, say when a combiner is safe and what it saves, and point at where each of these ideas lives on in Spark.","quiz":[{"q":"A MapReduce job has 4 reducers. The key <code>merchant-17<\/code> appears in the output of 200 of its 1,000 map tasks. How many reducers receive values for <code>merchant-17<\/code>?","options":["1","4","200","1,000"],"answer":0,"why":"The partitioner maps a key to one reducer, the same one from every map task, so all 200 tasks send <code>merchant-17<\/code> to one place. That is what lets a single reduce call see every value for the key. Four would mean the key was spread out and needed a second merge step.","from":null},{"q":"A worker dies after its map task finished, but before the reducers fetched that task's output. What does MapReduce do?","options":["Nothing: map output is replicated in HDFS","Re-runs the map task on another machine that holds a copy of the input block","Fails the whole job","Tells the reducers to skip that block"],"answer":1,"why":"Map output lives on the map machine's local disk, not in HDFS, so it died with the machine. The input block still has copies elsewhere, and map is deterministic, so running it again gives the same output. Finished reduce output is the part that sits in HDFS.","from":null},{"q":"Which job can safely reuse its reducer as the combiner?","options":["Average transaction amount per merchant","Median latency per endpoint","The first status each payment reached","The largest single transaction per card"],"answer":3,"why":"Max is associative and commutative, so taking the max of per-task maxes gives the true max, however many times the combiner runs. An average of averages is wrong when tasks see different row counts, a median can't be built from medians, and \"first\" depends on the order data arrives.","from":null},{"q":"A Spark plan shows <code>HashAggregate(keys=[word], functions=[partial_count(1)])<\/code> just below <code>Exchange hashpartitioning(word, 200)<\/code>. What is <code>partial_count<\/code> doing?","options":["Sampling rows to pick partition boundaries","Counting the files the scan will read","Counting each word within one partition before the shuffle, like a combiner","Checking that the shuffle lost no rows"],"answer":2,"why":"The partial aggregate runs on each input partition before data moves, so each partition sends one row per distinct word instead of one per occurrence. The <code>Exchange<\/code> above it is the shuffle, and the final <code>count<\/code> above that is the reduce.","from":null},{"q":"From the previous lesson: 1,000 map tasks each read one 128 MiB block at 100 MB/s, spread over 250 machines. Ignoring startup, about how long does the map phase take?","options":["About 1.3 seconds","About 5.4 seconds","About 22 minutes","About 2 minutes"],"answer":1,"why":"1,000 tasks on 250 machines is 4 blocks for each machine. One block is 134,217,728 bytes, 1.34 s at 100 MB/s, so four take about 5.4 s. 1.3 s is a single block, and 22 minutes is one machine reading all 1,000 blocks.","from":"data-01"}],"cards":[{"front":"HDFS defaults for block size and replication?","back":"<p>128 MB blocks (<code>dfs.blocksize<\/code>) and 3 copies (<code>dfs.replication<\/code>). GFS used 64 MB chunks.<\/p>"},{"front":"What does the HDFS NameNode store?","back":"<p>Only metadata: which blocks make up each file and which DataNodes hold each block. File data flows directly between clients and DataNodes.<\/p>"},{"front":"Hadoop's default partitioning function?","back":"<p><code>(key.hashCode() &amp; Integer.MAX_VALUE) % numReduceTasks<\/code><\/p>"},{"front":"Why are finished map tasks re-run when their machine dies?","back":"<p>Map output sits on the map machine's local disk, so it is lost with the machine. Reduce output is in HDFS, so finished reduce tasks are not re-run.<\/p>"},{"front":"When is a combiner safe?","back":"<p>When the operation is associative and commutative (sum, count, min, max), so the answer doesn't depend on how many times or in what grouping it runs.<\/p>"},{"front":"Where does the combiner show up in a Spark physical plan?","back":"<p>As a partial aggregate (<code>partial_count<\/code>, <code>partial_sum<\/code>, <code>partial_avg<\/code>) in a <code>HashAggregate<\/code> below the <code>Exchange<\/code>.<\/p>"}],"terms":[{"term":"Block","plain":"A large fixed-size piece of a file (128 MB in HDFS), stored and replicated as a unit."},{"term":"NameNode","plain":"The HDFS server that keeps the file-to-block map and where each block's copies live."},{"term":"DataNode","plain":"An HDFS server that stores blocks as files on its local disks and serves them to clients."},{"term":"Data locality","plain":"Running a task on a machine that already stores its input, so the data doesn't cross the network."},{"term":"Partitioner","plain":"The function that picks which reducer owns a key, usually hash(key) mod R."},{"term":"Shuffle","plain":"Moving map output across the network so every value for a key reaches that key's reducer, then sorting it."},{"term":"Combiner","plain":"Reduce logic run on one map task's output before the shuffle, to send fewer records."},{"term":"Lineage","plain":"The recorded chain of transformations that produced a dataset, which Spark uses to recompute lost partitions."}],"remote":true},"data-03":{"id":"data-03","track":"data","n":3,"title":"Hive: SQL on files, partitions and the metastore","ready":true,"minutes":40,"goal":"By the end you can lay out a table as Hive-style <code>dt=<\/code> directories, explain how the metastore turns a filter on <code>dt<\/code> into a short list of directories, and spot the cases where pruning silently stops working.","quiz":[{"q":"A table is partitioned by <code>dt<\/code> and holds 90 days. Which query opens files in only one day's directory?","options":["<code>WHERE created_at &gt;= '2026-11-03' AND created_at &lt; '2026-11-04'<\/code>","<code>WHERE dt = '2026-11-03'<\/code>","<code>WHERE to_date(created_at) = '2026-11-03'<\/code>","<code>WHERE amount_cents &gt; 0 ORDER BY dt LIMIT 10<\/code>"],"answer":1,"why":"Only a filter on the partition column itself can be matched against directory names. The two <code>created_at<\/code> filters select the same rows but force a read of every file. Ordering by <code>dt<\/code> doesn't filter anything.","from":null},{"q":"A job wrote <code>dt=2026-11-08/<\/code> into a table's location an hour ago. A dashboard query for that day returns zero rows, and the files are there. What is the likely cause?","options":["The metastore has no partition for 2026-11-08, so the engine never lists that directory","The files are still being compressed","Parquet files need an index before they can be read","The dashboard cached yesterday's result"],"answer":0,"why":"The engine asks the metastore which partitions match, and only lists the directories it gets back. A directory written without <code>ADD PARTITION<\/code> (or a later <code>MSCK REPAIR TABLE<\/code>) doesn't exist as far as queries are concerned. A cached result would show yesterday's numbers, not zero rows for a new day.","from":null},{"q":"Someone runs <code>DROP TABLE payments<\/code> on an external Hive table. What happens to its files?","options":["They are deleted","They move to a trash folder for a while","They stay; only the metadata is removed","They are rewritten into the warehouse directory"],"answer":2,"why":"External means Hive doesn't own the data. Dropping the table deletes its description from the metastore and leaves the files alone. Deleting (or moving to trash) is what happens to a managed table.","from":null},{"q":"A streaming job writes a small file into each hourly partition every 30 seconds. A month later queries are slow, though the table holds only 20 GB. Why?","options":["20 GB is too much for Parquet","The metastore can't store more than 1,000 partitions","Hourly partitions turn off pruning","There are about 86,000 tiny files, and each one costs a listing entry, an open and a footer read"],"answer":3,"why":"120 files an hour for 720 hours is 86,400 files of about 230 KB each. The per-file costs dominate, especially on S3 where each file is a request. Compacting each hour into a few large files fixes it. Pruning still works on hourly partitions; it just can't help a query that needs many of them.","from":null},{"q":"From the previous lesson: a MapReduce job writes its output with 50 reducers. How many data files does it put in its output directory?","options":["1","50","One per map task","One per distinct key"],"answer":1,"why":"Each reducer writes one output file, <code>part-00000<\/code> to <code>part-00049<\/code>. That is also why Hive tables filled by MapReduce jobs got one file per reducer per partition. The number of tasks that write a table decides how many files it ends up with.","from":"data-02"}],"cards":[{"front":"Where does the value of a Hive partition column live?","back":"<p>In the directory name, like <code>dt=2026-11-03/<\/code>. Spark's <code>partitionBy<\/code> removes the column from the files it writes.<\/p>"},{"front":"What does the Hive Metastore store for a table?","back":"<p>Columns and types, file format, location, and one entry per partition with its directory. It is a Thrift service (port 9083) in front of a relational database.<\/p>"},{"front":"A new <code>dt=<\/code> directory appears in storage, but queries can't see it. Why, and what fixes it?","back":"<p>The metastore has no partition for it. Run <code>ALTER TABLE ... ADD PARTITION<\/code> for that day, or <code>MSCK REPAIR TABLE<\/code> to add every missing one.<\/p>"},{"front":"Managed vs external table: what does DROP TABLE delete?","back":"<p>Managed: the metadata and the files. External: only the metadata; the files stay.<\/p>"},{"front":"What does \"schema on read\" mean?","back":"<p>Files aren't checked when they land. Their types are checked against the table's schema only when a query reads them.<\/p>"},{"front":"Why does a filter on <code>created_at<\/code> not prune a table partitioned by <code>dt<\/code>?","back":"<p>Engines prune by matching filters against directory names. They can't know <code>created_at<\/code> and <code>dt<\/code> agree, so they open every file.<\/p>"}],"terms":[{"term":"Schema on read","plain":"Checking data against the table's schema when it is read, not when it is written."},{"term":"Hive-style partition","plain":"A subdirectory named <code>column=value<\/code> that holds the rows with that value."},{"term":"Partition pruning","plain":"Skipping whole partitions (directories) that can't match a query's filter, before reading any file."},{"term":"Hive Metastore (HMS)","plain":"A service over a relational database that stores table schemas, locations and partition lists for Hive, Spark and Trino."},{"term":"External table","plain":"A table whose files the catalog doesn't own: dropping it removes only the metadata."},{"term":"MSCK REPAIR TABLE","plain":"A command that lists a table's location and adds partitions found on storage but missing from the metastore."},{"term":"Small files problem","plain":"Slow reads caused by many tiny files, because each file has fixed costs to list, open and parse."}],"remote":true},"data-04":{"id":"data-04","track":"data","n":4,"title":"Columnar files: Parquet internals and pushdown","ready":true,"minutes":40,"goal":"By the end you can read a Parquet file's layout from its footer, predict which row groups and columns a filter lets a reader skip, and spot the filters and files where pushdown silently does nothing.","quiz":[{"q":"A Spark job writes one Parquet file per day with default settings. Analysts filter on <code>created_at<\/code> for one hour and see every row group read. The plan shows <code>GreaterThanOrEqual(created_at, ...)<\/code> in <code>PushedFilters<\/code>. What is the most likely cause?","options":["Snappy compression hides the statistics","Spark writes <code>INT96<\/code> timestamps by default, and the footer has no min or max for them","Parquet can't store statistics for more than 128 MB of rows","The filter needs a <code>dt<\/code> partition column to be pushed"],"answer":1,"why":"<code>spark.sql.parquet.outputTimestampType<\/code> defaults to <code>INT96<\/code>, and parquet-java keeps no min or max for that type, so the pushed filter has nothing to compare with. <code>TIMESTAMP_MICROS<\/code> fixes it (and sorting by time helps further). Compression happens below the statistics and doesn't hide them. A <code>dt<\/code> filter would prune directories, but it isn't needed for row group skipping.","from":null},{"q":"A file has 10 columns of similar size in 8 row groups. A query reads 2 columns, and its filter lets the reader skip 6 of the 8 row groups. About what fraction of the data does it fetch?","options":["20%","25%","5%","75%"],"answer":2,"why":"Column pruning keeps 2 of 10 columns (20%), and row group skipping keeps 2 of 8 row groups (25%). The two multiply: 0.2 x 0.25 = 5%. The tempting answers take only one of the two savings.","from":null},{"q":"Which <code>status<\/code> column chunk is smallest, for the same 100,000 rows and 4 distinct values?","options":["Plain strings, compressed with Zstd","Dictionary encoded, rows in random order","Dictionary encoded, rows sorted by status","Plain strings, rows sorted by status, no compression"],"answer":2,"why":"A dictionary turns each value into a 2-bit code (about 25 KB), and sorting turns the codes into four long runs that run-length encoding stores in a few bytes (99 bytes in the demo). Sorting plain strings without any encoding or compression leaves every string in full. Zstd on plain strings helps, but it can't beat four runs.","from":null},{"q":"A query filters <code>WHERE merchant_id = 42<\/code> on files sorted by <code>created_at<\/code>. <code>PushedFilters<\/code> contains <code>EqualTo(merchant_id,42)<\/code>. What does the reader skip?","options":["Every row group except the one holding merchant 42","Nothing, because the filter wasn't pushed","About half the row groups","Probably nothing: every row group's merchant_id range covers 42"],"answer":3,"why":"The filter is pushed, but the rows are sorted by time, so each row group holds a mix of all merchants and its min and max for <code>merchant_id<\/code> span 0 to 499. Statistics can only rule a row group out when its range excludes 42. Being in <code>PushedFilters<\/code> and skipping data are different things.","from":null},{"q":"From lesson 3: a table is partitioned by <code>dt<\/code>, and each day's files are sorted by <code>merchant_id<\/code>. A query filters <code>WHERE dt = '2026-11-05' AND merchant_id = 4711<\/code>. What does each filter do?","options":["<code>dt<\/code> picks one directory from the metastore's partition list; <code>merchant_id<\/code> skips row groups inside that day's files using their min and max","Both filters prune directories","<code>merchant_id<\/code> prunes directories, <code>dt<\/code> skips row groups","Only <code>dt<\/code> helps; Parquet statistics need a partition column"],"answer":0,"why":"Partition pruning works on directory names, so only the partition column <code>dt<\/code> can skip directories, before any file is opened. Inside the remaining files, the footer's min and max for the sorted <code>merchant_id<\/code> column let the reader skip most row groups. The two mechanisms stack: one prunes directories, the other prunes inside files.","from":"data-03"}],"cards":[{"front":"What are the last 8 bytes of a Parquet file?","back":"<p>A 4-byte little-endian integer with the footer's length, then the magic bytes <code>PAR1<\/code>. The file also starts with <code>PAR1<\/code>.<\/p>"},{"front":"Why is the Parquet footer at the end of the file?","back":"<p>The writer only knows each chunk's offset and statistics after writing it. Putting the metadata last lets it write the file in one pass.<\/p>"},{"front":"Row group vs column chunk vs page?","back":"<p>A row group is a slice of rows. Inside it, each column's values form one column chunk. A chunk is stored as pages, the unit that gets encoded, compressed and decompressed.<\/p>"},{"front":"When can a reader skip a row group for <code>WHERE x &gt; 100<\/code>?","back":"<p>When the footer says the chunk of <code>x<\/code> in that row group has max &lt;= 100. On unsorted data the max is almost always above, so nothing is skipped.<\/p>"},{"front":"What is Spark's default Parquet timestamp type, and why does it matter?","back":"<p><code>INT96<\/code> (<code>spark.sql.parquet.outputTimestampType<\/code>). parquet-java keeps no min/max for it, so time filters can't skip row groups. Use <code>TIMESTAMP_MICROS<\/code>.<\/p>"},{"front":"What do <code>ReadSchema<\/code> and <code>PushedFilters<\/code> in a Spark FileScan line mean?","back":"<p><code>ReadSchema<\/code>: the columns the reader decodes (column pruning). <code>PushedFilters<\/code>: the filters offered to the reader for skipping, not proof that it skipped anything.<\/p>"}],"terms":[{"term":"Row group","plain":"A horizontal slice of a Parquet file's rows, stored column by column."},{"term":"Column chunk","plain":"All the values of one column inside one row group, stored together as one byte range."},{"term":"Footer","plain":"The metadata at the end of a Parquet file: schema, and for every column chunk its offset, size, encoding and min/max statistics."},{"term":"Dictionary encoding","plain":"Storing each distinct value once and a small integer code per row instead of the value."},{"term":"Column pruning","plain":"Reading only the column chunks of the columns a query uses."},{"term":"Predicate pushdown","plain":"Handing a query's filter to the file reader, which uses statistics to skip row groups that can't match."},{"term":"INT96","plain":"An old, non-standard Parquet timestamp type that Spark still writes by default and that has no min/max statistics."}],"remote":true},"data-05":{"id":"data-05","track":"data","n":5,"title":"The Spark execution model","ready":true,"minutes":40,"goal":"By the end you can look at a DataFrame query and say, before running it, how many jobs, stages and tasks Spark will run and where the stage boundaries fall, and explain how Spark recovers when a task dies.","quiz":[{"q":"A job reads 6 input partitions, filters, groups by merchant with <code>spark.sql.shuffle.partitions = 10<\/code>, then filters the totals and calls <code>collect()<\/code>. AQE is off. How many stages and tasks run?","options":["1 stage, 6 tasks","2 stages, 16 tasks","3 stages, 26 tasks","2 stages, 12 tasks"],"answer":1,"why":"Only the groupBy is wide, so there's one <code>Exchange<\/code> and two stages. Stage 1 runs 6 tasks (read, filter, partial sum), stage 2 runs 10 (final sum, then the second filter, which is narrow and joins stage 2). The second filter doesn't add a stage: filters never need rows from other partitions.","from":null},{"q":"A job's log shows that <code>val big = payments.where(...)<\/code> took 3 ms and <code>big.write().parquet(out)<\/code> took 40 minutes. Where did Spark spend the filtering time?","options":["In the <code>where<\/code> line, which was just fast","In a background thread started by <code>where<\/code>","Inside <code>write<\/code>, which ran the whole plan: read, filter and write","Nowhere: the filter was pushed into Parquet and cost nothing"],"answer":2,"why":"<code>where<\/code> is a transformation, so it only added a step to the plan. <code>write<\/code> is an action, and it ran everything: reading, filtering and writing. Pushdown may make the filter cheaper by skipping row groups, but the rows that remain are still filtered by tasks during the write.","from":null},{"q":"A stage has 40 tasks of about one minute each. The cluster has 3 executors with 4 cores each. About how long does the stage take?","options":["1 minute","4 minutes","10 minutes","40 minutes"],"answer":1,"why":"3 x 4 = 12 slots. 40 tasks on 12 slots is ceil(40 / 12) = 4 waves, so about 4 minutes. The last wave has only 4 tasks, so 8 slots idle during it. Splitting the input into 48 partitions would take the same 4 waves with no idle slots.","from":null},{"q":"Which of these steps adds a stage boundary?","options":["<code>withColumn(\"amount_eur\", ...)<\/code>","<code>where(col(\"status\").equalTo(\"CAPTURED\"))<\/code>","<code>select(\"merchant_id\", \"amount_cents\")<\/code>","<code>distinct()<\/code>"],"answer":3,"why":"<code>distinct()<\/code> must bring equal rows from every partition together, which needs a shuffle, so it's wide and ends a stage. <code>withColumn<\/code>, <code>where<\/code> and <code>select<\/code> each work on one partition at a time; they're narrow and run inside the current stage's tasks.","from":null},{"q":"From lesson 2: when a MapReduce worker died, even its finished map tasks ran again, because their output sat on its local disk. In Spark, an executor dies after its stage 1 tasks finished but before stage 2 fetched their output. What happens?","options":["The job fails; Spark doesn't recover from executor loss","Spark re-runs only the lost stage 1 tasks from their lineage, then stage 2 fetches again","Spark restores the shuffle files from HDFS replicas","Spark re-runs the whole job from the start"],"answer":1,"why":"Spark kept MapReduce's idea. Shuffle files live on the executor's local disk, so losing the executor loses them. Stage 2's fetches fail, and the scheduler re-runs just the map tasks whose output was lost, recomputing their partitions from lineage. There are no HDFS copies of shuffle files, and the rest of the job's work is kept.","from":"data-02"}],"cards":[{"front":"Transformation vs action in Spark?","back":"<p>A transformation (<code>where<\/code>, <code>groupBy<\/code>, <code>join<\/code>) returns a new DataFrame describing work and runs nothing. An action (<code>collect<\/code>, <code>count<\/code>, <code>write<\/code>) runs the plan and starts one or more jobs.<\/p>"},{"front":"What decides how many tasks a stage has?","back":"<p>Its number of partitions: input splits for the first stage, <code>spark.sql.shuffle.partitions<\/code> (200 by default) for a stage after a shuffle, unless AQE merges them.<\/p>"},{"front":"What makes a stage boundary?","back":"<p>A shuffle (<code>Exchange<\/code> in the plan), caused by a wide step such as groupBy, join, distinct, orderBy or repartition. For one input, stages = Exchanges + 1.<\/p>"},{"front":"What does <code>local[2,4]<\/code> mean?","back":"<p>Run Spark inside this JVM with 2 task slots (threads) and up to 4 attempts per task. Plain <code>local[2]<\/code> gives each task one attempt.<\/p>"},{"front":"How does Spark recover a lost partition?","back":"<p>It recomputes it from its lineage, the chain of parent RDDs and functions that produced it. Tasks must be deterministic for that to work.<\/p>"},{"front":"With AQE on, why does one groupBy run as two jobs?","back":"<p>AQE runs each stage that ends in a shuffle as its own job, measures the shuffle output, then re-plans and runs the rest.<\/p>"}],"terms":[{"term":"Driver","plain":"The JVM running your main(): it builds plans and schedules tasks."},{"term":"Executor","plain":"A JVM on a worker machine that runs tasks in threads, one per slot (core)."},{"term":"Task","plain":"One partition of data processed through one stage's steps, on one slot."},{"term":"Stage","plain":"A run of narrow steps between shuffles, executed as one task per partition."},{"term":"Job","plain":"All the stages Spark runs for one action."},{"term":"Narrow and wide transformations","plain":"Narrow: each output partition needs one input partition. Wide: it needs data from all of them, so a shuffle."},{"term":"Lineage","plain":"The recorded chain of parent datasets and functions that produced a partition, used to recompute it."}],"remote":true},"data-06":{"id":"data-06","track":"data","n":6,"title":"The shuffle, partitioning and joins","ready":true,"minutes":40,"goal":"By the end you can explain what a shuffle writes and reads, choose between hash, range and round-robin partitioning and <code>coalesce<\/code>, size <code>spark.sql.shuffle.partitions<\/code>, and read a join's plan to pick (and force) a broadcast or sort-merge join.","quiz":[{"q":"A job runs an expensive UDF over 2 TB and ends with <code>.coalesce(1).write().parquet(out)<\/code>. It takes hours, and the Spark UI shows one busy task. Why?","options":["<code>coalesce<\/code> is narrow, so the whole last stage, UDF included, ran as one task","Writing a single file to S3 is slow","<code>coalesce(1)<\/code> shuffles all 2 TB to one executor","The driver writes the output file itself"],"answer":0,"why":"<code>coalesce<\/code> doesn't add a stage boundary; it joins the stage before it, so that stage runs with 1 task and the UDF runs on one core. <code>repartition(1)<\/code> would add a shuffle: the UDF stage would keep its parallelism and only the final write would run alone. <code>coalesce<\/code> never shuffles, and executors write files, not the driver.","from":null},{"q":"<code>groupBy(merchant_id).agg(sum(amount_cents))<\/code> reads 8 input partitions, and each partition holds payments from all 1,000 merchants. How many records does the map side write to shuffle files?","options":["1,000","8","8,000","every payment"],"answer":2,"why":"Spark sums inside each map task first (the partial aggregate, lesson 2's combiner), so each of the 8 map tasks writes one record per merchant it saw: 8 x 1,000 = 8,000. Without the partial aggregate it would be every payment. 1,000 is what the reduce side produces after combining.","from":null},{"q":"You join 2 TB of authorizations with 3 TB of captures on <code>auth_id<\/code>. Which join should Spark use?","options":["Broadcast hash join, broadcasting the captures","Broadcast hash join, with a hint on the authorizations","Sort-merge join, shuffling both sides by <code>auth_id<\/code>","A cross join followed by a filter"],"answer":2,"why":"Neither side is small enough to copy to every executor: broadcasting terabytes would overflow the driver and every executor. Both sides must be partitioned by <code>auth_id<\/code> so matching rows meet, which is the sort-merge join's shuffle. A cross join of these sizes would be astronomically large.","from":null},{"q":"<code>spark.sql.shuffle.partitions<\/code> is 200 and AQE is off. A groupBy produces 50 KB of totals. How many reduce tasks run?","options":["1","4","200","as many as there were input partitions"],"answer":2,"why":"With AQE off, Spark uses the setting as given: 200 reduce tasks, most of them handling a few hundred bytes. With AQE on (the default), it would measure the 50 KB and merge the partitions into one. The input partition count only decides the map side.","from":null},{"q":"From lesson 5: a plan has a <code>SortMergeJoin<\/code> with an <code>Exchange<\/code> under each side, and a <code>groupBy<\/code> after the join adds a third <code>Exchange<\/code>. AQE is off. How many stages does the job run?","options":["2","3","4","6"],"answer":2,"why":"Each <code>Exchange<\/code> cuts the plan tree once, and three cuts make four pieces: a stage reading payments, a stage reading merchants, a stage that joins and pre-sums, and the final sum. <code>JoinDemo<\/code> showed exactly that: tasks per stage <code>[4, 2, 4, 4]<\/code>. Lesson 5's rule, stages = Exchanges + 1, holds for a tree of inputs too.","from":"data-05"}],"cards":[{"front":"What does one map task leave on disk after a shuffle?","back":"<p>One <code>.data<\/code> file with a block per reduce partition, written back to back, and an <code>.index<\/code> file with the N + 1 offsets of those blocks, in <code>spark.local.dir<\/code>.<\/p>"},{"front":"Which partitioner does <code>orderBy<\/code> use, and what extra cost does it bring?","back":"<p>Range partitioning. Spark first runs a sampling job to choose the range boundaries, so an <code>orderBy<\/code> runs an extra job.<\/p>"},{"front":"<code>repartition(n)<\/code> vs <code>coalesce(n)<\/code>?","back":"<p><code>repartition(n)<\/code> shuffles every row round robin into n equal partitions. <code>coalesce(n)<\/code> merges existing partitions without a shuffle, can only reduce, and runs the stage before it with n tasks.<\/p>"},{"front":"What is the default of <code>spark.sql.shuffle.partitions<\/code>, and what does AQE do with it?","back":"<ol start=\"200\">\n<li>With AQE on, Spark measures the shuffle output and merges small partitions toward 64 MB each, so a high starting value is safe.<\/li>\n<\/ol>"},{"front":"When does Spark broadcast a join side by itself?","back":"<p>When its size estimate is below <code>spark.sql.autoBroadcastJoinThreshold<\/code> (10 MB by default). <code>broadcast(df)<\/code> or <code>/*+ BROADCAST(t) */<\/code> forces it.<\/p>"},{"front":"What does a broadcast hash join avoid, and what does it cost?","back":"<p>It avoids shuffling the big side and sorting. It costs collecting the small side to the driver and holding a copy in every executor's memory.<\/p>"}],"terms":[{"term":"Shuffle file","plain":"A file a map task writes to local disk, holding one block of rows per reduce partition, with an index of where each block starts."},{"term":"Hash partitioning","plain":"Choosing a row's partition as hash(key) mod N, so equal keys always meet."},{"term":"Range partitioning","plain":"Giving each partition a contiguous range of keys, chosen by sampling, so sorted partitions form a total order."},{"term":"coalesce","plain":"Merging neighbouring partitions without a shuffle; it can only reduce their number."},{"term":"Sort-merge join","plain":"A join that shuffles both sides by key, sorts each partition and merges the two sorted streams."},{"term":"Broadcast hash join","plain":"A join that copies the small side to every executor as a hash table and joins the big side in place."},{"term":"spark.sql.shuffle.partitions","plain":"The number of reduce partitions for joins and aggregations; 200 by default."}],"remote":true},"data-07":{"id":"data-07","track":"data","n":7,"title":"The optimizer, AQE, skew and caching","ready":true,"minutes":40,"goal":"By the end you can read Catalyst's four plans and say which rule moved what, predict what AQE will change at a stage boundary, find and fix a skewed join with AQE or salting, and decide when <code>cache()<\/code> pays for itself.","quiz":[{"q":"You write <code>payments.join(merchants, \"merchant_id\").where(col(\"card_country\").equalTo(\"NL\"))<\/code>. Where does <code>card_country = 'NL'<\/code> run in the physical plan?","options":["After the join, as written, because Spark keeps the order of your calls","Below the join on the payments side, and pushed into the Parquet scan","On both sides of the join","Only in the Parquet reader, with no Filter node left in the plan"],"answer":1,"why":"PushDownPredicates moves a filter below a join to the side whose columns it uses; <code>card_country<\/code> is a payments column, so the filter lands on that side, and the planner then hands it to the scan as a pushed filter. The <code>Filter<\/code> node stays above the scan too, because Parquet statistics can only skip row groups, never prove each row matches (lesson 4). The order of your method calls doesn't fix the order of execution.","from":null},{"q":"AQE is on with default settings. A sort-merge join's hot partition is 40 MB and the median partition is 2 MB. What does AQE do about the skew?","options":["Splits it, because 40 MB is more than 5 times the median","Converts the join to a broadcast hash join","Raises the number of shuffle partitions and re-runs the map stage","Nothing: the partition is under the 256 MB threshold"],"answer":3,"why":"Both conditions must hold: more than <code>skewedPartitionFactor<\/code> (5) times the median AND more than <code>skewedPartitionThresholdInBytes<\/code> (256 MB). 40 MB passes the first and fails the second, so AQE leaves it alone; that's why the lab lowers the threshold. AQE switches to a broadcast only when a whole side is under the broadcast threshold, and it never re-runs a finished map stage with more partitions.","from":null},{"q":"A job calls <code>df.cache()<\/code>, then runs exactly one action on <code>df<\/code>, then ends. Compared with no cache, the job is:","options":["Faster, because the action reads from memory","The same, because <code>cache()<\/code> is lazy","Slower, because the one action also encodes and stores every row it computes","Faster only if <code>df<\/code> fits in memory"],"answer":2,"why":"<code>cache()<\/code> is lazy, but the first action fills the cache as it computes, which costs extra work: building compressed column batches and storing them. Nothing ever reads them, so the job pays and gets nothing back. The demo measured a single report with a cache as slower than without one.","from":null},{"q":"To fix a skewed join you salt the big side with <code>rand() * 8<\/code> and explode the small side 8 times. Results are right on your laptop. On the cluster, a few payments sometimes vanish from the output. Why?","options":["A retried task draws different random salts, so some payments are re-sent with a salt whose shuffle block was already fetched","<code>rand()<\/code> collides more often on a cluster","Exploding the small side drops merchants with null ids","AQE merges the salted partitions back together"],"answer":0,"why":"Spark recovers from failures by re-running tasks from their lineage, and that's only safe when a task gives the same output every time (lesson 5). With <code>rand()<\/code>, a re-run map task may send a payment to a different salt, and therefore a different reduce partition, than the first attempt did, so it can be lost or duplicated. Compute the salt from the data, for example <code>pmod(payment_id, 8)<\/code>.","from":null},{"q":"From lesson 6: with AQE off, a sort-merge join of payments and merchants shows an <code>Exchange<\/code> under each side. AQE is now on and switches the join to a broadcast hash join at run time. How many payments went through a shuffle write?","options":["None: the broadcast join never shuffles the big side","All of them: the payments' map stage had already written its shuffle files before AQE switched","Only the payments of merchants in the broadcast table","Half, because AQE stops the map stage when it decides"],"answer":1,"why":"AQE decides at a stage boundary, after the map stages have run, and both join sides' map stages run before the join stage. So the payments were shuffled to local disk just as in lesson 6's sort-merge join; AQE then reads those files in place with a local shuffle reader, skipping the sort and the network fetch. Only a broadcast planned up front, with a <code>broadcast()<\/code> hint or a good estimate, avoids the write.","from":"data-06"}],"cards":[{"front":"What are Catalyst's four plans, in order?","back":"<p>Parsed (unresolved names), analyzed (names and types resolved against the catalog), optimized (rewritten by rules), physical (operators that will run). <code>explain(\"extended\")<\/code> prints all four.<\/p>"},{"front":"What does PushDownPredicates do to a filter above a join?","back":"<p>It splits the condition at each AND and moves each part below the join, to the side whose columns it uses.<\/p>"},{"front":"When does AQE get to change a plan?","back":"<p>At a stage boundary: when a query stage (the map side of a shuffle, or a broadcast) finishes and its real output size is known.<\/p>"},{"front":"When does AQE treat a shuffle partition as skewed?","back":"<p>When it is more than 5 times the median partition (<code>skewedPartitionFactor<\/code>) and more than 256 MB (<code>skewedPartitionThresholdInBytes<\/code>). Only for sort-merge joins.<\/p>"},{"front":"How do you salt a join?","back":"<p>Add a salt column computed from data (0 to N-1) on the big side, copy each small-side row N times with salts 0 to N-1, and join on (key, salt).<\/p>"},{"front":"What does <code>cache()<\/code> do, and when?","back":"<p>Nothing at the call. The first action stores the result's partitions in executor memory as column batches; later plans containing the same subplan read <code>InMemoryTableScan<\/code>.<\/p>"},{"front":"When does <code>cache()<\/code> not pay, even for a result two reports reuse?","back":"<p>When the result is cheap to rebuild, such as a filtered Parquet scan: reading Parquet with pushdown can be as fast as reading the cache, and filling the cache costs extra.<\/p>"}],"terms":[{"term":"Catalyst","plain":"Spark SQL's optimizer: it represents a query as a tree and rewrites it with pattern-matching rules."},{"term":"Rule","plain":"A function from a plan tree to a plan tree that matches one pattern, such as a filter above a join, and rewrites it."},{"term":"Adaptive query execution (AQE)","plain":"Running a plan stage by stage and re-optimizing the rest after each shuffle, using the real sizes of the shuffle output."},{"term":"Query stage","plain":"The piece of an adaptive plan below one Exchange; it runs as its own job, and its output statistics feed the next re-plan."},{"term":"Skew","plain":"Some keys having far more rows than others, so the task that owns them does most of a stage's work."},{"term":"Salting","plain":"Splitting a hot key into several sub-keys by adding a salt column, copying the other side's matching rows once per salt."},{"term":"InMemoryTableScan","plain":"The plan node that reads a cached DataFrame's stored column batches instead of recomputing it."}],"remote":true},"data-08":{"id":"data-08","track":"data","n":8,"title":"Spark 4 for JVM engineers: Connect, ANSI and VARIANT","ready":true,"minutes":40,"goal":"By the end you can explain what a Spark Connect client sends and what it can't do, fix a job that Spark 4's ANSI mode stopped without switching ANSI off, store and query JSON as VARIANT, and pick the Kotlin API style that keeps Catalyst able to optimize.","quiz":[{"q":"A service uses the Spark Connect JVM client. A teammate adds <code>spark.sparkContext().broadcast(lookup)<\/code>. What happens?","options":["It works, but the broadcast goes through the server","It fails: a Connect client has no SparkContext","It works only if the lookup is smaller than 10 MB","It silently does nothing"],"answer":1,"why":"The SparkContext lives in the driver, on the server. The client only builds and sends plans, so <code>sparkContext()<\/code> throws <code>UNSUPPORTED_CONNECT_FEATURE.SESSION_SPARK_CONTEXT<\/code>, as the demo showed. Use the DataFrame <code>broadcast()<\/code> hint in a join instead; it's part of the plan.","from":null},{"q":"On Spark 4 with default settings, <code>SELECT sum(amount_cents) FROM payments<\/code> overflows a BIGINT. What do you get?","options":["A negative number, as in Java","NULL","An error, ARITHMETIC_OVERFLOW, and the job fails","The sum, automatically widened to DECIMAL"],"answer":2,"why":"ANSI mode is on by default since Spark 4.0, so overflow raises <code>ARITHMETIC_OVERFLOW<\/code>. The negative number is what Spark 3 returned with ANSI off. <code>try_sum<\/code> returns NULL instead of failing; for money, casting to <code>DECIMAL(38, 0)<\/code> before summing avoids the overflow altogether.","from":null},{"q":"Fraud-vendor events are stored in Parquet as a JSON STRING column. A query reads <code>get_json_object(body, '$.risk.score')<\/code> and <code>get_json_object(body, '$.card.country')<\/code> for 300 million rows. What does moving to VARIANT change?","options":["The text is parsed once, on write; reads navigate the binary encoding to the two fields","Nothing, both parse the JSON text on every read","VARIANT stores each field as its own Parquet column, always","VARIANT turns the JSON into a fixed STRUCT schema"],"answer":0,"why":"<code>parse_json<\/code> runs once when the data is written, and stores a dictionary of field names and a binary value with offsets, so <code>variant_get<\/code> jumps to a field instead of re-tokenizing the text for each call. Storing frequent fields as separate Parquet columns is shredding, an optional layout (generally available in Spark 4.1), not something every variant gets. The schema stays open: a new field needs no change.","from":null},{"q":"Which of these does Catalyst push into the Parquet scan?","options":["<code>ds.filter(FilterFunction { it.status == \"CAPTURED\" })<\/code> on a typed Dataset","A UDF <code>isCaptured(status)<\/code> registered from Kotlin","All three, since they mean the same thing","<code>df.where(col(\"status\").equalTo(\"CAPTURED\"))<\/code>"],"answer":3,"why":"Only a column expression is something Catalyst can read, rewrite and hand to the file reader. A lambda or a UDF is compiled JVM code that Spark can call but can't look inside, so the plan keeps a <code>Filter<\/code> over every row and the scan's <code>PushedFilters<\/code> stay empty, as the Kotlin API demo showed.","from":null},{"q":"From lesson 7: a Spark Connect client runs <code>payments.join(merchants, \"merchant_id\")<\/code> and calls <code>explain()<\/code>. Where were the optimizer's rules applied, and who decided between a broadcast and a sort-merge join?","options":["In the client JVM, before the plan was sent","On the server, after it resolved the client's plan; the client only prints the result","Half in the client (logical) and half on the server (physical)","Nowhere: Connect plans run without Catalyst"],"answer":1,"why":"The client sends an unresolved plan. Analysis needs the catalog, and the catalog, Catalyst and AQE all live with the driver on the server, so every rule from lesson 7 runs there; <code>explain()<\/code> is a request to the server, which sends back the plan text. That's also why AQE works unchanged with Connect.","from":"data-07"}],"cards":[{"front":"What does a Spark Connect client send, and what comes back?","back":"<p>An unresolved logical plan, encoded as protobuf, over gRPC (default port 15002). Results come back as Arrow record batches.<\/p>"},{"front":"Name two things a Connect client can't do.","back":"<p>Use the SparkContext, and use RDDs. Lambdas and UDF classes must also be uploaded first (<code>registerClassFinder<\/code>, <code>addArtifact<\/code>).<\/p>"},{"front":"What did Spark 4.0 change about <code>CAST('12,50' AS INT)<\/code>?","back":"<p>ANSI mode became the default, so the malformed cast fails with <code>CAST_INVALID_INPUT<\/code> instead of returning NULL. <code>try_cast<\/code> returns NULL on purpose.<\/p>"},{"front":"Which try_ functions cover arithmetic?","back":"<p><code>try_add<\/code>, <code>try_subtract<\/code>, <code>try_multiply<\/code>, <code>try_divide<\/code>, <code>try_mod<\/code>, and <code>try_sum<\/code> and <code>try_avg<\/code> for aggregates.<\/p>"},{"front":"What is inside a VARIANT value?","back":"<p>Two byte arrays: metadata, a dictionary of field names, and value, a typed binary encoding with offsets. Object fields are sorted by name.<\/p>"},{"front":"<code>variant_get<\/code> vs <code>try_variant_get<\/code>?","back":"<p>Both read a path and cast it to a type. <code>variant_get<\/code> fails on a value it can't cast; <code>try_variant_get<\/code> returns NULL.<\/p>"},{"front":"Why don't typed-Dataset lambdas get predicate pushdown?","back":"<p>Catalyst sees a lambda as opaque code: it can call it per row but can't read or rewrite it, so nothing reaches the file scan.<\/p>"}],"terms":[{"term":"Spark Connect","plain":"Spark's client-server protocol: a thin client sends unresolved plans over gRPC to a server that hosts the driver."},{"term":"gRPC","plain":"A remote call protocol over HTTP/2 with messages encoded as protobuf; Connect uses it on port 15002 by default."},{"term":"Apache Arrow","plain":"A columnar in-memory format; Connect streams query results to the client as Arrow record batches."},{"term":"ANSI mode","plain":"Spark SQL behaving like standard SQL: invalid casts, overflow and division by zero raise errors. On by default since Spark 4.0."},{"term":"try_ functions","plain":"Variants of casts and arithmetic (<code>try_cast<\/code>, <code>try_add<\/code>, ...) that return NULL where the plain version would raise an error."},{"term":"VARIANT","plain":"A Spark 4 data type for semi-structured data such as JSON, parsed once into a binary form that keeps every field."},{"term":"Pipe syntax","plain":"SQL written as a chain of steps joined by <code>|&gt;<\/code>, in the order the data flows; it builds the same plan as classic SQL."}],"remote":true},"data-09":{"id":"data-09","track":"data","n":9,"title":"Lakehouse tables with Apache Iceberg","ready":true,"minutes":40,"goal":"By the end you can explain why a table format exists, walk an Iceberg table's metadata from the pointer to the Parquet files, describe a commit as a compare-and-swap with retries, and use snapshots, time travel, schema evolution and hidden partitioning from Spark.","quiz":[{"q":"A Spark job is halfway through an <code>INSERT INTO<\/code> an Iceberg table when another query reads the table. What does the reader see?","options":["The rows from the data files written so far","Nothing new: the new files aren't in any committed snapshot until the pointer swap","An error, because the table is locked during writes","A random mix, depending on which files the reader lists first"],"answer":1,"why":"Readers find files through the current snapshot's manifests, never by listing folders. The writer's new files exist on disk but no committed snapshot names them until the single pointer swap at the end, so the reader sees the table exactly as it was. Iceberg takes no read locks; the AtomicCommitDemo's reader only ever saw whole commits.","from":null},{"q":"Two jobs append to the same Iceberg table at the same moment, both starting from v7. What happens?","options":["The second commit overwrites the first one's snapshot","Both write v8.metadata.json and the table is corrupt","One swap wins and makes v8; the other's swap fails, it re-applies its append on top of v8 and commits v9","The second job waits on a lock until the first finishes"],"answer":2,"why":"A commit is a compare-and-swap: replace v7 with my new metadata only if the pointer still says v7. The loser gets a commit failure, reloads v8, re-applies its change (for an append, it just adds its manifest again; the data files are reused) and swaps again. That's optimistic concurrency: no lock, a check at the end.","from":null},{"q":"An Iceberg table is <code>PARTITIONED BY (days(created_at))<\/code>. Which query skips the other days' files?","options":["<code>WHERE created_at &gt;= '2026-11-03' AND created_at &lt; '2026-11-04'<\/code>","Only <code>WHERE created_at_day = '2026-11-03'<\/code>","Neither, because Iceberg doesn't prune on timestamps","Only a query that names the partition directory"],"answer":0,"why":"With hidden partitioning, Iceberg knows the partition value is <code>day(created_at)<\/code>, so it turns a range on <code>created_at<\/code> into a range of days and skips manifests and files outside it. Queries filter on the real column; there's no <code>dt<\/code> column to remember, which is the trap lesson 3 showed for Hive tables.","from":null},{"q":"You rename <code>amount_cents<\/code> to <code>amount_minor<\/code>, then add a new column called <code>amount_cents<\/code>. What do rows written before the rename show in the new <code>amount_cents<\/code>?","options":["Their old amounts, because the Parquet files still have a column of that name","An error, because the name was already used","NULL, because the new column has a new field id that no old file contains","Zero"],"answer":2,"why":"Iceberg matches columns to file columns by field id, not by name. The renamed column keeps id 5 (say), and the new <code>amount_cents<\/code> gets a fresh id, so old files have nothing for it and readers return NULL. A system that matched by name, like plain Parquet in a folder, would resurrect the old values under the new column: a quiet correctness bug.","from":null},{"q":"From lesson 3: in a Hive table, a job writes <code>dt=2026-11-08/<\/code> straight to storage and no query finds the data until someone runs <code>MSCK REPAIR TABLE<\/code>. Why can't that happen with an Iceberg table?","options":["Iceberg scans the folder on every query","Iceberg tables have no partitions","Iceberg runs MSCK REPAIR automatically after each write","The writer can't produce files without also committing a snapshot that lists them; readers only look at what snapshots list"],"answer":3,"why":"In Hive the metastore lists partitions and the folder lists files, and the two can disagree. In Iceberg the snapshot is the only list: a writer that goes through the table commits a snapshot that names its files, and files nobody committed are invisible orphans, not hidden data. That's also why copying files into the folder by hand does nothing.","from":"data-03"}],"cards":[{"front":"What are the levels of Iceberg's metadata tree, top to bottom?","back":"<p>Catalog pointer, table metadata file (<code>vN.metadata.json<\/code>), manifest list (one per snapshot), manifests (one row per data file, with stats), data files.<\/p>"},{"front":"What makes an Iceberg commit atomic?","back":"<p>A single compare-and-swap of the table pointer from the old metadata file to the new one. In a Hadoop catalog that's a rename that fails if the target exists.<\/p>"},{"front":"What happens to a writer whose commit loses the swap?","back":"<p>It reloads the new current metadata, checks its change still makes sense, re-applies it and tries the swap again.<\/p>"},{"front":"What does <code>VERSION AS OF &lt;id&gt;<\/code> read?","back":"<p>The files listed by that snapshot's manifest list, with that snapshot's schema, as long as the snapshot hasn't been expired.<\/p>"},{"front":"Why is renaming a column safe in Iceberg?","back":"<p>Columns are matched by field id, stored in the Parquet files too, so a rename only changes the name in the metadata.<\/p>"},{"front":"What is hidden partitioning?","back":"<p>Partitioning by a transform of a column, such as <code>days(created_at)<\/code> or <code>bucket(16, merchant_id)<\/code>; queries filter on the column and Iceberg derives which partitions can match.<\/p>"},{"front":"What did Iceberg format v3 add?","back":"<p>Deletion vectors, the VARIANT type, geometry and geography types, default column values, row lineage and nanosecond timestamps.<\/p>"}],"terms":[{"term":"Table format","plain":"A specification for metadata files that list a table's data files, schema and history, so engines can read and commit to it safely."},{"term":"Snapshot","plain":"The complete set of a table's data files at one commit, with an id, a parent and a summary."},{"term":"Manifest","plain":"An Avro file listing data files with their partition values, row counts and per-column min and max."},{"term":"Manifest list","plain":"An Avro file per snapshot listing its manifests, with the range of partition values in each."},{"term":"Optimistic concurrency","plain":"Writers work without locks and check at commit time that nobody changed the table; if someone did, they retry."},{"term":"Hidden partitioning","plain":"Partition values computed from a column by a transform, so queries never name a partition column."},{"term":"Field id","plain":"The permanent number Iceberg gives each column; files store it, so names can change safely."}],"remote":true},"data-10":{"id":"data-10","track":"data","n":10,"title":"Row-level changes, compaction and catalogs","ready":true,"minutes":40,"goal":"By the end you can explain how a table of files that never change still takes UPDATE, DELETE and MERGE, choose copy-on-write or merge-on-read for a workload, keep a table fast and small with compaction and snapshot expiry, and say what a catalog does and which kind to use.","quiz":[{"q":"A CDC feed applies about 200 changed payments every 5 minutes to an Iceberg table whose data files are around 512 MB. The changes are spread over 50 files. Which setup fits?","options":["Copy-on-write, so that reads stay simple","Merge-on-read, plus a scheduled compaction of the touched partitions","Append every change as a new row and deduplicate in every query","Copy-on-write with a smaller target file size of 1 MB"],"answer":1,"why":"Copy-on-write would rewrite up to 50 files of 512 MB every 5 minutes to change 200 rows: hundreds of gigabytes an hour. Merge-on-read writes a few small files per batch, and the scheduled compaction pays back the reader's cost. Shrinking the files to 1 MB trades the write cost for the small-files problem.","from":null},{"q":"After the team ran <code>rewrite_data_files<\/code> on a large table, the bucket got bigger, not smaller. Why?","options":["Compaction writes each file twice for safety","The new files are less compressed than the old ones","Older snapshots still list the old files, so nothing is deleted until those snapshots expire","Compaction failed halfway and left orphan files"],"answer":2,"why":"Compaction commits a new <code>replace<\/code> snapshot that lists the new files, but every earlier snapshot still lists the old ones, and Iceberg keeps them for time travel. The space comes back only when <code>expire_snapshots<\/code> removes those snapshots and deletes the files no remaining snapshot uses. Orphans are possible after a failure, but a normal compaction explains it without one.","from":null},{"q":"Someone schedules <code>remove_orphan_files<\/code> with a cut-off of 10 minutes ago to save space faster. What can go wrong?","options":["Nothing: an orphan file is by definition safe to delete","It deletes files of old snapshots, so time travel breaks","It deletes data files that a job running right now has written but not committed yet, so that job's commit points at missing files","It deletes the current snapshot's delete files, so deleted rows come back"],"answer":2,"why":"A write puts its data files down first and commits them last. Until the commit, those files look exactly like orphans: no snapshot lists them. With a 10-minute cut-off, a long job's files can vanish before it commits, and the table then lists files that don't exist. That's why the default is 3 days and Iceberg's Spark procedure refuses less than 24 hours.","from":null},{"q":"Two jobs commit to the same table through an Iceberg JDBC catalog at the same moment, both starting from metadata file 00007. What does the catalog's database see?","options":["Two <code>UPDATE ... WHERE metadata_location = '&lt;00007&gt;'<\/code>; the first changes one row, the second changes zero rows and its job gets <code>CommitFailedException<\/code>","A row lock held by the first job for its whole run, so the second waits","Two updates, and the last one wins","Two inserts, one row per job, merged at read time"],"answer":0,"why":"The JDBC catalog's commit is a conditional update: set the pointer to my new file only where it still names the file I started from. The first update matches and moves the pointer to 00008. The second finds no row that still says 00007, changes nothing, and Iceberg turns the zero row count into <code>CommitFailedException<\/code>; the job can reload and retry. No lock is held while the jobs run, which is the optimistic concurrency of lesson 9.","from":null},{"q":"From lesson 6: Spark runs a <code>MERGE INTO<\/code> of 40 corrections against a payments table of 2 billion rows as a join on <code>payment_id<\/code>. Which join plan do you want to see?","options":["A sort-merge join, because the table is huge","A broadcast hash join that sends the 40 corrections to every executor, so the big table isn't shuffled","A cartesian product, because MERGE compares every pair","No join: MERGE looks rows up by an index"],"answer":1,"why":"With one tiny side, the broadcast hash join copies the 40 rows into a hash table on every executor and streams the big table past it, with no shuffle of 2 billion rows. A sort-merge join would shuffle both sides by key. Iceberg tables have no row index, so the join is how MERGE finds the rows, helped by partition and min/max pruning when the corrections carry <code>created_at<\/code>.","from":"data-06"}],"cards":[{"front":"What does copy-on-write do for an UPDATE on an Iceberg table?","back":"<p>Rewrites every data file that holds a changed row, and commits a snapshot that swaps the old files for the new ones. It's the default.<\/p>"},{"front":"What is a position delete file?","back":"<p>A file of (data file path, row position) pairs that mark rows as deleted. Merge-on-read writes them in format v2; readers skip those positions.<\/p>"},{"front":"What is a deletion vector?","back":"<p>Format v3's replacement for position delete files: one bitmap of deleted positions per data file, stored in a Puffin file. New deletes merge into it.<\/p>"},{"front":"What does <code>rewrite_data_files<\/code> commit?","back":"<p>A <code>replace<\/code> snapshot: the same rows in fewer, larger files, with deletes applied. The old files stay until their snapshots expire.<\/p>"},{"front":"Why won't Iceberg remove orphan files younger than 24 hours?","back":"<p>Files written by a job that hasn't committed yet look like orphans. Deleting them would break that job's commit.<\/p>"},{"front":"What is an Iceberg JDBC catalog's commit, in SQL?","back":"<p><code>UPDATE iceberg_tables SET metadata_location = :new ... WHERE ... AND metadata_location = :old<\/code>. Zero rows changed means someone else committed first.<\/p>"},{"front":"What does a REST catalog commit send?","back":"<p>A POST with requirements (for example, the current snapshot id it expects) and updates. The server applies them atomically or answers 409 Conflict.<\/p>"}],"terms":[{"term":"Copy-on-write","plain":"A row-level change that rewrites every data file holding a changed row."},{"term":"Merge-on-read","plain":"A row-level change that writes new rows and delete files; readers merge them in."},{"term":"Position delete","plain":"A record that row N of a given data file is deleted."},{"term":"Deletion vector","plain":"A bitmap of deleted row positions for one data file (Iceberg format v3)."},{"term":"Compaction","plain":"Rewriting many small files, and their deletes, into fewer large files with the same rows."},{"term":"Snapshot expiry","plain":"Removing old snapshots from the metadata and deleting the files only they used."},{"term":"Orphan file","plain":"A file in the table's folder that no snapshot lists, usually left by a failed job."},{"term":"Catalog","plain":"The service or database that maps table names to their current metadata file and swaps that pointer on commit."}],"remote":true},"data-11":{"id":"data-11","track":"data","n":11,"title":"Streaming: Structured Streaming and watermarks","ready":true,"minutes":40,"goal":"By the end you can explain why a stream must be grouped by event time, predict when a windowed count with a watermark writes a window and which late events it drops, pick an output mode for a sink, and say what makes a pipeline from Kafka to an Iceberg table exactly once.","quiz":[{"q":"A stream counts authorizations in 5-minute event-time windows with a 10-minute watermark. The latest event so far is 14:32. An event stamped 14:21 arrives. What happens?","options":["Counted: its window [14:20, 14:25) ends after the watermark, 14:22","Dropped: it is 11 minutes late, more than the 10 minutes allowed","Counted in the current window, [14:30, 14:35)","The query fails, because the event is older than the watermark"],"answer":0,"why":"The watermark is 14:32 minus 10 minutes, 14:22. Spark drops a late event only when its window has already closed, and [14:20, 14:25) ends at 14:25, after 14:22, so the window is open and the event is counted. Being older than the delay isn't the test. An event is never moved to another window, and late data never fails the query.","from":null},{"q":"A team's streaming count runs in update mode with no <code>withWatermark<\/code>. Tests pass. What happens in production over the following weeks?","options":["Nothing: update mode writes each change, so it doesn't need state","Late events get dropped after the default 10-minute watermark","Every window of every merchant stays in the state store forever, so state and checkpoint time grow until executors run short of memory","Spark refuses to start the query"],"answer":2,"why":"Without a watermark Spark can never decide a window is final, so it keeps every count in case a late event arrives. Update mode still needs state to know the new count. There is no default watermark. Spark refuses append mode for an aggregation without a watermark, but update and complete start fine, which is why this slips through tests.","from":null},{"q":"Which sink gives exactly-once results when Spark replays a batch after a crash?","options":["<code>foreachBatch<\/code> that runs <code>INSERT INTO ledger_counts SELECT * FROM batch<\/code>","The Kafka sink","The Iceberg sink, or a <code>foreachBatch<\/code> that MERGEs on (window, merchant)","Any sink, because the checkpoint guarantees exactly once by itself"],"answer":2,"why":"After a crash Spark reruns the last uncommitted batch with the same offsets and state. Iceberg records the query and batch id in each snapshot and skips a batch it already committed; a MERGE keyed on the window just overwrites the same values. A plain INSERT appends the batch twice, and Spark's Kafka sink is at-least-once. The checkpoint makes the replay deterministic, but the sink decides whether the replay duplicates.","from":null},{"q":"A dashboard must show the current count of the open 5-minute window and change as events arrive. The sink is a key-value store keyed by (merchant, window). Which output mode?","options":["Append, because it is exactly once","Update, because it writes each changed window right away and the sink can overwrite by key","Complete, because the dashboard needs every window","Any: output modes only change performance"],"answer":1,"why":"Append writes a window only after the watermark closes it, which is minutes too late for a live count. Update writes each window whenever its count changes, and a keyed store turns each write into an overwrite. Complete would rewrite every window ever seen on every batch and never clean state.","from":null},{"q":"From lesson 5: Structured Streaming runs each micro-batch as Spark jobs. The windowed count groups by (window, merchant). Where does a stage boundary fall in each micro-batch, and why?","options":["Nowhere: streaming runs one task per event","Before the aggregation: an <code>Exchange<\/code> hash-partitions rows by the grouping key, so each task owns the state of its keys","After the sink write, so the commit log is a stage","Between every two micro-batches only"],"answer":1,"why":"Grouping is a wide transformation, so the plan has an <code>Exchange<\/code> that hash-partitions rows by (window, merchant) and ends a stage, just as in a batch <code>groupBy<\/code>. The state store is split the same way: the task that receives a key's rows owns that key's running count. That's why the number of state partitions follows <code>spark.sql.shuffle.partitions<\/code> and can't change after the first run without resetting the checkpoint.","from":"data-05"}],"cards":[{"front":"What is event time?","back":"<p>The time the event happened, carried in the event (for a payment, when the card was authorized), as opposed to when a consumer read it.<\/p>"},{"front":"How does Spark compute the watermark?","back":"<p>The latest event time seen so far minus the delay given to <code>withWatermark<\/code>. It only moves forward, and a new value applies from the next micro-batch.<\/p>"},{"front":"When is a window final?","back":"<p>When the watermark reaches its end. Then append mode writes it once and Spark deletes its state.<\/p>"},{"front":"Which late events does Spark drop?","back":"<p>Events whose window has already closed (window end at or before the watermark). An event older than the delay is still counted if its window is open.<\/p>"},{"front":"What does each output mode write?","back":"<p>Append: rows once, when final. Update: rows changed in this batch. Complete: the whole result table every batch, with no state cleanup.<\/p>"},{"front":"What three things make a stream exactly once end to end?","back":"<p>A replayable source (Kafka offsets), a checkpoint (offsets, commits, state), and an idempotent or transactional sink.<\/p>"},{"front":"Why doesn't a replayed batch duplicate rows in an Iceberg sink?","back":"<p>Each snapshot records the query id and batch (epoch) id, and the sink skips a batch it has already committed.<\/p>"}],"terms":[{"term":"Event time","plain":"When the event happened, as stamped in the event itself."},{"term":"Processing time","plain":"When the streaming job reads or processes the event."},{"term":"Tumbling window","plain":"Fixed, non-overlapping time buckets, such as every 5 minutes from 10:00."},{"term":"Micro-batch","plain":"One run of the streaming query over the input that arrived since the last run."},{"term":"State store","plain":"Per-key running values (such as counts per window) kept between micro-batches and saved in the checkpoint."},{"term":"Watermark","plain":"Latest event time seen minus an allowed delay; windows that end before it are final."},{"term":"Output mode","plain":"Which result rows each micro-batch writes: append, update or complete."},{"term":"Checkpoint","plain":"The folder where a query records offsets, completed batches and state, so a restart resumes exactly."}],"remote":true},"data-12":{"id":"data-12","track":"data","n":12,"title":"Choosing an engine: DuckDB, Spark, Trino and friends","ready":true,"minutes":40,"goal":"By the end you can size a query by the bytes it reads after pruning and route it to one machine or the right kind of cluster with numbers, explain why DuckDB beats Spark on one machine and where that flips, place Trino, ClickHouse and Flink, and sketch a lakehouse for a payments company.","quiz":[{"q":"A 6 TB payments table covers 2 years (730 daily partitions) with 50 similar columns. A report reads 5 columns of the last 7 days. One laptop scans at 2 GB/s. Roughly how long does the scan take?","options":["About 50 minutes: 6 TB at 2 GB/s","About 30 seconds: one week of the table","About 3 seconds: 5.8 GB at 2 GB/s","Less than a millisecond, because Parquet has an index"],"answer":2,"why":"6 TB x 7 / 730 = 57.5 GB for a week, x 5 / 50 = 5.8 GB for the columns, / 2 GB/s = about 3 seconds. The 50 minutes ignores pruning entirely; 30 seconds prunes partitions but reads all 50 columns. Parquet's statistics skip row groups, but nothing turns a scan of 5.8 GB into a lookup.","from":null},{"q":"Thirty analysts open the same dashboard at 9:00. Each query reads 10 GB, and the b
