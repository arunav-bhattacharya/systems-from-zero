llot","plain":"The ever-growing number a Paxos proposer uses; replicas refuse anything lower than what they promised. Cassandra uses a time-based UUID."},{"term":"Lightweight transaction (LWT)","plain":"Cassandra's compare-and-set on one partition, <code>IF NOT EXISTS<\/code> or <code>IF col = ...<\/code>, run with Paxos. The reply's <code>[applied]<\/code> says whether it happened."},{"term":"Saga","plain":"A long operation made of local atomic steps, each with a compensating step, driven to the end by a durable workflow instead of one transaction."}],"remote":true},"nosql-11":{"id":"nosql-11","track":"nosql","n":11,"title":"Graph databases with Neo4j and Cypher","ready":true,"minutes":40,"goal":"By the end you can explain why a question that follows relationships gets harder with every hop in tables and is a walk in a graph store, write Cypher patterns with fixed, quantified and variable-length paths to find a fraud ring and money cycles, and make a query start from an index instead of a scan.","quiz":[{"q":"A walk from a flagged account reaches 3 accounts at step 2 and 4,800 at step 3. What is the most likely cause?","options":["Neo4j is missing an index on the relationships","Step 3 passed through an identifier that thousands of accounts share, a supernode","The query used the older <code>*<\/code> syntax, which is slower","Cycles in the graph make the walk count accounts twice"],"answer":1,"why":"A walk pays for the paths it explores, and one node with thousands of relationships multiplies them at once. Relationships don't need an index to be followed, and the syntax doesn't change what is matched. Distinct accounts can't be double-counted by cycles. Filter the identifier by a property, cap its degree, or don't model it.","from":null},{"q":"Which pattern returns the accounts that sent money TO A-1001?","options":["<code>(a:Account {id: 'A-1001'})-[:TRANSFERRED_TO]-&gt;(other)<\/code>","<code>(a:Account {id: 'A-1001'})-[:TRANSFERRED_TO]-(other)<\/code>","<code>(a:Account {id: 'A-1001'})&lt;-[:TRANSFERRED_TO]-(other)<\/code>","<code>(other)-[:TRANSFERRED_TO]-&gt;{1,6}(a:Account {id: 'A-1001'})<\/code>"],"answer":2,"why":"The arrow points from sender to receiver, so a relationship pointing into A-1001 comes from a sender. The first pattern finds the accounts A-1001 paid, the second finds both directions, and the last also finds accounts that paid someone who eventually paid A-1001, up to six transfers away.","from":null},{"q":"<code>PROFILE<\/code> of a ring query shows <code>NodeByLabelScan<\/code> reading 10 million <code>Account<\/code> nodes, then <code>Filter<\/code> keeping one. What fixes it?","options":["A uniqueness constraint (or an index) on <code>Account.id<\/code>, so the plan starts with an index seek","An index on the <code>USES<\/code> relationship type","Adding <code>LIMIT 1<\/code> to the query","Switching to the older <code>*1..3<\/code> syntax"],"answer":0,"why":"The scan is how the query finds its start node. An index on the property the pattern starts from turns it into <code>NodeUniqueIndexSeek<\/code> (with a uniqueness constraint) or <code>NodeIndexSeek<\/code>. Following relationships after that needs no index. <code>LIMIT<\/code> cuts the output, not the scan that finds the start.","from":null},{"q":"<code>MATCH p = (a:Account)-[:TRANSFERRED_TO]-&gt;{3,6}(a) RETURN p<\/code> returns 7 rows for a graph with one 3-transfer cycle and one 4-transfer cycle. Why 7?","options":["Neo4j counts each relationship as a separate path","Each cycle is matched once from every account on it: 3 plus 4","The query also matched the two-transfer cycle between two friends","The 4-cycle contains the 3-cycle"],"answer":1,"why":"A cycle has no first node, so the pattern matches it starting from each of its accounts. The friends' cycle has length 2, below the lower bound of 3. To keep each cycle once, keep only the rotation that starts at the smallest id: <code>WHERE all(n IN nodes(p) WHERE a.id &lt;= n.id)<\/code>.","from":null},{"q":"From lesson 2: why is \"accounts within three shared identifiers of a flagged account\" a poor fit for DynamoDB, even with an index keyed by identifier?","options":["DynamoDB can't store an account's identifiers","Global secondary indexes can't be keyed by identifier","It isn't one key lookup or one range read: each step is another round of Queries whose number grows with the fan-out, run by your code","DynamoDB transactions can't span three items"],"answer":2,"why":"Lesson 2's rule was that every access pattern should be one key lookup or one range read. A three-step walk is many rounds of lookups whose count multiplies at each step, with the application holding the frontier between rounds. A graph store runs the whole walk next to the data. The data can be stored and indexed by identifier just fine.","from":"nosql-02"}],"cards":[{"front":"What is index-free adjacency?","back":"<p>Each node's record leads to its relationships, and each relationship names its two nodes, so following a relationship is a pointer read, not an index search.<\/p>"},{"front":"Node vs relationship in a property graph?","back":"<p>Node: an entity with labels and properties. Relationship: connects two nodes, has exactly one type, a direction and its own properties.<\/p>"},{"front":"What does <code>((:Account)-[:USES]-&gt;(x)&lt;-[:USES]-(:Account)){1,3}<\/code> mean?","back":"<p>A quantified path pattern: the step account, identifier, account repeated 1 to 3 times. <code>x<\/code> becomes a list, one identifier per step.<\/p>"},{"front":"Why does a cycle query return each cycle several times?","back":"<p>A cycle is matched from each of its nodes. Keep one rotation with <code>WHERE all(n IN nodes(p) WHERE a.id &lt;= n.id)<\/code>.<\/p>"},{"front":"<code>NodeByLabelScan<\/code> vs <code>NodeUniqueIndexSeek<\/code>?","back":"<p>Scan: read every node with the label and filter. Seek: jump straight to the node through a uniqueness constraint's index. Only the start of a walk needs an index.<\/p>"},{"front":"What is a supernode, and three ways to handle it?","back":"<p>A node with a huge number of relationships (a shared kiosk). Filter it out in the pattern, cap the degree, or don't create those relationships.<\/p>"},{"front":"What is GQL?","back":"<p>ISO/IEC 39075:2024, the standard graph query language, published April 2024. Its pattern matching grew out of Cypher.<\/p>"}],"terms":[{"term":"Property graph","plain":"A data model of nodes and relationships, where both carry properties (key-value pairs)."},{"term":"Label","plain":"A tag on a node that says what kind of thing it is, such as <code>:Account<\/code> or <code>:Device<\/code>. A node can have several."},{"term":"Relationship type","plain":"The one name every relationship has, such as <code>USES<\/code> or <code>TRANSFERRED_TO<\/code>, plus a direction."},{"term":"Index-free adjacency","plain":"Storing a node's relationships with it, so a hop is a pointer read whatever the size of the graph."},{"term":"Quantified path pattern","plain":"A piece of a Cypher pattern in brackets followed by <code>{min,max}<\/code>, matched that many times in a row."},{"term":"Supernode","plain":"A node with so many relationships that any walk through it reaches a large part of the graph."},{"term":"MERGE","plain":"Cypher's match-or-create. Safe against duplicates under concurrency only with a uniqueness constraint."},{"term":"GQL","plain":"Graph Query Language, ISO/IEC 39075:2024: the ISO standard for querying property graphs."}],"remote":true},"nosql-12":{"id":"nosql-12","track":"nosql","n":12,"title":"Search, time-series and vector stores, and how to choose","ready":true,"minutes":40,"goal":"By the end you can explain the one special index behind a search engine (posting lists ranked by BM25), a time-series store (time buckets, rollups and dropped chunks) and a vector store (an HNSW graph walked approximately), measure what each gives up, and choose a store, or no new store, for a payments access pattern.","quiz":[{"q":"A merchant named \"City Bike Rental\" doesn't show up for the query \"bikes\" in an index that uses OpenSearch's <code>standard<\/code> analyzer. Why?","options":["The document hasn't been refreshed yet","The standard analyzer doesn't stem, so <code>bike<\/code> and <code>bikes<\/code> are different terms with different posting lists","BM25 gave it a score of zero because the name is short","Single-word queries need fuzzy matching"],"answer":1,"why":"Matching happens on terms, and the standard analyzer only splits and lower-cases. <code>bikes<\/code> has its own posting list, which doesn't contain M-0044. A stemming analyzer such as <code>english<\/code>, used at both index and query time, maps both to <code>bike<\/code>. BM25 only ranks documents that matched; it never zeroes a match out.","from":null},{"q":"Two merchants contain \"northwind\" once each. One name is 2 tokens long, the other 7, and the average is 4.2. With BM25's defaults, which ranks first?","options":["The 7-token name, because it has more words to match","They tie, because tf and idf are equal","The 2-token name, because b = 0.75 makes a match in a short field count more","Whichever was indexed first"],"answer":2,"why":"tf and idf are the same, but the denominator <code>tf + k1 x (1 - b + b x length / average)<\/code> is smaller for the short name, so its term scores higher: 0.506 against 0.313 in the Try-it. A word in a 2-word name says more about the merchant than the same word in a long description.","from":null},{"q":"A latency table holds 13 months of raw points, and you must keep only 30 days of raw data. Why does a time-series store drop chunks instead of running <code>DELETE ... WHERE time &lt; now() - interval '30 days'<\/code>?","options":["DELETE isn't allowed on a hypertable","Dropping a chunk removes a whole file in one step; DELETE marks hundreds of millions of rows dead and leaves the cleanup to VACUUM","DELETE would also remove the continuous aggregate","Chunks are compressed, so rows can't be found"],"answer":1,"why":"Because data is partitioned by time, everything older than the cutoff sits in whole chunks, and dropping one is a file deletion. A row-by-row DELETE writes a dead version per row, which VACUUM must clean up later, as in lesson 7 of the database internals track. DELETE does work on a hypertable; it's just the expensive way.","from":null},{"q":"Your pgvector HNSW index returns recall@10 of 0.90 at <code>hnsw.ef_search = 10<\/code>. What does raising it to 100 do?","options":["Recall goes up, and each query computes more distances and takes longer","Nothing until the index is rebuilt with a bigger <code>m<\/code>","Recall goes down, because the beam picks up more far-away vectors","Queries become exact, like a sequential scan"],"answer":0,"why":"<code>ef_search<\/code> is the size of the beam in the bottom layer: more candidates kept, more neighbours explored, more true neighbours found, at more cost. It's a query-time setting, so no rebuild is needed. It never makes the search exact; the Try-it reached 1.0 at 40 on its data, but only an exact scan guarantees it.","from":null},{"q":"From lesson 9: a merchant is created in Oracle, and the OpenSearch copy is fed through an outbox and Kafka. The agent who created it searches for it at once and gets nothing. Which guarantee does the copy lack?","options":["Atomicity","Durability","Monotonic writes","Read your writes: the search copy is eventually consistent and a moment behind"],"answer":3,"why":"The write is safe in Oracle, and the copy will converge once the relay, the consumer and the index refresh catch up. Until then a read from the copy misses the writer's own write, the read-your-writes session guarantee from lesson 9. The fix is to read the just-created merchant from the system of record, or show it from the response, rather than to dual-write.","from":"nosql-09"}],"cards":[{"front":"What is a posting list?","back":"<p>For one term, the list of documents that contain it, with how often (term frequency). An inverted index is a dictionary of terms to posting lists.<\/p>"},{"front":"BM25, in one line?","back":"<p>Sum over query terms of <code>idf x tf / (tf + k1 x (1 - b + b x len / avglen))<\/code>, with k1 = 1.2 and b = 0.75 by default.<\/p>"},{"front":"Why must the analyzer be the same at index and query time?","back":"<p>Matching is on terms. If the index stemmed <code>bikes<\/code> to <code>bike<\/code> and the query didn't, or the other way round, the terms never meet.<\/p>"},{"front":"What do a hypertable's chunks buy you?","back":"<p>Queries over a time range open only the chunks for that range, and retention drops whole chunks instead of deleting rows.<\/p>"},{"front":"Why keep count and sum in a time bucket, not the average?","back":"<p>Counts and sums add up when buckets roll up into wider ones; averages of averages weight a quiet bucket like a busy one.<\/p>"},{"front":"What do <code>m<\/code>, <code>ef_construction<\/code> and <code>ef_search<\/code> control in pgvector's HNSW?","back":"<p>m: links per vector (16). ef_construction: beam while building (64). ef_search: beam while querying (40); higher means better recall, slower queries.<\/p>"},{"front":"What is polyglot persistence, and its main risk?","back":"<p>Several stores, each a copy shaped for one question. Copies lag and can disagree; feed them from a log (outbox, Kafka), never by dual writes.<\/p>"}],"terms":[{"term":"Inverted index","plain":"A map from each term to the documents that contain it; the core of every search engine and of PostgreSQL's GIN index."},{"term":"Analyzer","plain":"The steps that turn text into terms: split, lower-case, maybe drop stop words and stem (<code>bikes<\/code> to <code>bike<\/code>)."},{"term":"BM25","plain":"The usual ranking formula: rare terms count more, repeats saturate, long documents count less."},{"term":"Hypertable","plain":"TimescaleDB's time-partitioned table: one table to queries, one chunk per time interval underneath."},{"term":"Continuous aggregate","plain":"A materialized summary per time bucket that TimescaleDB keeps up to date as new rows arrive."},{"term":"Embedding","plain":"A vector of numbers a model produces for a text or image, placed so that similar meanings are close."},{"term":"HNSW","plain":"Hierarchical navigable small world: a layered graph of vectors searched greedily from the top layer down, with a beam at the bottom."},{"term":"Recall@k","plain":"The share of the true k nearest neighbours an approximate search returns; 1.0 means it found them all."}],"remote":true},"kafka-01":{"id":"kafka-01","track":"kafka","n":1,"title":"The log: Kafka's one big idea","ready":true,"minutes":40,"goal":"By the end you can describe a Kafka partition as an append-only log with offsets, read it from any offset with assign and seek in Java or Kotlin, and explain why reading never deletes a record.","quiz":[{"q":"A partition holds offsets 0 to 799. Retention then deletes the oldest 300 records, and a producer sends one new record. Which offset does it get?","options":["300","500","800","0, because the log is empty enough to start again"],"answer":2,"why":"Offsets are never reused. The next record always gets the end offset, 800, however much old data retention removed. 500 is the tempting answer if you think of an offset as a position among the records that are left.","from":null},{"q":"Three consumer groups read partition 0 of <code>payments<\/code>, whose end offset is 1,250. Their committed offsets are 1,200 (group A), 900 (group B) and 40 (group C). Which statement is true?","options":["Records 0 to 39 can be deleted now, because every group has read them","Group C's lag is 1,210, and its slowness does not hold back groups A and B","Kafka slows the producer down until group C catches up","Group A's commit hides records below 1,200 from the other groups"],"answer":1,"why":"Lag is the end offset minus the committed offset: 1,250 minus 40 is 1,210. Groups never share positions, and consumers put no back-pressure on producers. Reads delete nothing either: retention decides when records go.","from":null},{"q":"Your code calls <code>assign<\/code> for partition 0, then <code>seek(tp, 50)<\/code>, then a single <code>poll(Duration.ofMillis(10))<\/code>. Offsets 50 to 99 exist, but the poll returns no records. What is the most likely reason?","options":["<code>seek<\/code> failed silently and the consumer is back at offset 0","A poll returns only what arrived within its timeout; 10 ms was too short for the first fetch, so poll again in a loop","Offsets 50 to 99 were deleted when another consumer read them","<code>assign<\/code> only works when <code>group.id<\/code> is set"],"answer":1,"why":"<code>poll<\/code> returns whatever the client has received when the timeout runs out. On the first call the client still has to find the partition leader and send its first fetch, which can take longer than 10 ms. Correct code polls in a loop until it has what it needs or a deadline passes. Reading deletes nothing, and <code>assign<\/code> needs no group.","from":null},{"q":"A team says: \"We can't add the new fraud-model service. It would consume the payments and the ledger service would miss them.\" What do you tell them?","options":["Give the new service its own consumer group: each group reads every record and keeps its own offsets","They're right: copy the topic for the new service first","Put both services in one consumer group so they share the records","Only one consumer can ever read a partition, so add partitions first"],"answer":0,"why":"Reading doesn't consume. A new group gets its own committed offsets and reads every record without touching the ledger group. Putting both services in one group is the real mistake: within a group each partition goes to one member, so each service would see only part of the data. The last option mixes up one member per partition inside a group with one reader per partition overall.","from":null},{"q":"Kafka keeps no cache of records on its JVM heap. Why do most consumers still get their data from memory rather than disk?","options":["The JIT compiler keeps hot records in CPU registers","Each consumer keeps a full local copy of the partition","The broker loads every partition into its heap at start-up","The kernel's page cache holds recently written file pages, and most consumers read near the end of the log"],"answer":3,"why":"Kafka writes segment files and lets the operating system cache them. A consumer near the tail reads pages that were just written and are still in RAM. A consumer far behind reads cold pages from disk, which is why one lagging job can slow down a broker.","from":null}],"cards":[{"front":"What is an offset in Kafka?","back":"<p>A record's position in one partition's log: 0 for the first record, then 1, 2, 3. The broker assigns it, and it never changes.<\/p>"},{"front":"What is a partition's end offset?","back":"<p>The offset the next appended record will get. A partition holding offsets 0 to 4 has end offset 5.<\/p>"},{"front":"What does a consumer group store for each partition?","back":"<p>One number, its committed offset: the offset of the next record it will read. It lives in the <code>__consumer_offsets<\/code> topic.<\/p>"},{"front":"What happens to a record after every consumer group has read it?","back":"<p>Nothing. It stays until retention deletes its segment (by default after 7 days).<\/p>"},{"front":"How do you read partition 0 from offset 50 without a consumer group?","back":"<p><code>consumer.assign(List.of(tp))<\/code>, then <code>consumer.seek(tp, 50)<\/code>, then <code>poll<\/code> in a loop until you have enough or a deadline passes.<\/p>"},{"front":"What is consumer lag?","back":"<p>For one partition: the end offset minus the group's committed offset. The number of records the group still has to read.<\/p>"}],"terms":[{"term":"Log","plain":"An ordered sequence of records that only grows at the end. Each Kafka partition is one."},{"term":"Offset","plain":"A record's number within one partition, assigned by the broker: 0, 1, 2 and so on. Never changed, never reused."},{"term":"End offset","plain":"The offset the next record will get. The tools call it the log end offset."},{"term":"Committed offset","plain":"The position a consumer group has saved for a partition: the offset of the next record it will read."},{"term":"Consumer group","plain":"A set of consumers that share the reading of a topic, with one committed offset per partition."},{"term":"Lag","plain":"End offset minus committed offset: how many records a group still has to read."},{"term":"Page cache","plain":"Memory the kernel uses to keep file contents. Kafka relies on it instead of caching records on the heap."}],"remote":true},"kafka-02":{"id":"kafka-02","track":"kafka","n":2,"title":"Partitions and segments on disk: retention and compaction","ready":true,"minutes":40,"goal":"By the end you can explain how a partition is stored as segment files, predict what retention will delete (whole segments, never single records) and say what compaction keeps.","quiz":[{"q":"A topic has <code>retention.ms<\/code> of 7 days and the default 1 GiB <code>segment.bytes<\/code>, but it receives only a few megabytes a day. How long can its oldest records stay readable?","options":["Exactly 7 days","7 days plus up to 5 minutes for the next retention check","Up to about 14 days: the segment rolls on <code>segment.ms<\/code> after 7 days, then waits until its newest record is 7 days old","Forever, because a segment under 1 GiB never rolls"],"answer":2,"why":"The segment never fills 1 GiB, so it rolls on time, after <code>segment.ms<\/code> (7 days). Its newest record is then almost 7 days younger than its oldest, and the file goes only when that newest record passes 7 days. The last option forgets <code>segment.ms<\/code>; the first two forget that retention works on whole files.","from":null},{"q":"A consumer group was stopped for 9 days on a topic that keeps 7. When it starts again, its committed offset points into a deleted segment. The consumer uses the client defaults. What happens?","options":["It fails to start with an OffsetOutOfRangeException","It resumes from the earliest offset still on disk","The broker restores the deleted segment from a replica","It jumps to the end of the partition and skips everything in between, without an error"],"answer":3,"why":"When the committed offset no longer exists, <code>auto.offset.reset<\/code> decides, and the client default is <code>latest<\/code>. The consumer moves to the end and the records in between are skipped silently. <code>earliest<\/code> would give the second option and <code>none<\/code> the first; replicas delete the same segments, so there is nothing to restore.","from":null},{"q":"A compacted topic <code>card-status<\/code> has these records in closed segments: offset 10 card-7=active, 11 card-8=active, 12 card-7=frozen, 13 card-7=null. The cleaner runs, well within <code>delete.retention.ms<\/code>. What can a consumer read from these offsets afterwards?","options":["11 card-8=active and 13 card-7=null","11 card-8=active and 12 card-7=frozen","11 card-8=active only","All four records, renumbered as offsets 0 to 3"],"answer":0,"why":"Only the last record per key survives: 11 for card-8, and 13, the tombstone, for card-7. The tombstone stays for <code>delete.retention.ms<\/code> so that consumers learn about the delete; the third option is what you get after that window. Offsets never change.","from":null},{"q":"You want the latest balance per account kept, and you also want anything older than 30 days removed, even if it is the latest record for its key. Which topic setting does that?","options":["<code>cleanup.policy=delete<\/code> with <code>retention.ms<\/code> of 30 days","<code>cleanup.policy=compact,delete<\/code> with <code>retention.ms<\/code> of 30 days","<code>cleanup.policy=compact<\/code> with <code>delete.retention.ms<\/code> of 30 days","<code>cleanup.policy=compact<\/code> plus a consumer that deletes old keys"],"answer":1,"why":"<code>compact,delete<\/code> keeps only the last value per key and also deletes segments past retention. Plain <code>delete<\/code> keeps every old balance for 30 days. <code>delete.retention.ms<\/code> only controls how long tombstones stay; it never expires a live value.","from":null},{"q":"From the previous lesson: a reconciliation job calls <code>assign<\/code>, then <code>seek(tp, 50)<\/code>, on a partition whose earliest offset is now 104 after retention. The consumer has <code>auto.offset.reset=none<\/code>. What happens?","options":["<code>seek<\/code> throws at once, because offset 50 is gone","<code>seek<\/code> succeeds, and the next <code>poll<\/code> throws OffsetOutOfRangeException","The next <code>poll<\/code> silently starts at 104","The next <code>poll<\/code> returns offsets 50 to 103 from a replica"],"answer":1,"why":"<code>seek<\/code> only sets a number inside the client, so it cannot fail on a missing offset. The fetch for offset 50 fails on the broker, and with <code>auto.offset.reset=none<\/code> the consumer throws <code>OffsetOutOfRangeException<\/code> from <code>poll<\/code>. The lab's broker test checks exactly this. With <code>earliest<\/code> it would quietly start at 104 instead.","from":"kafka-01"}],"cards":[{"front":"What is a segment?","back":"<p>One file of a partition's log, named after its first (base) offset, such as <code>00000000000000000208.log<\/code>. Only the newest, the active segment, takes appends.<\/p>"},{"front":"When does a segment roll?","back":"<p>When the next batch would push it past <code>segment.bytes<\/code> (1 GiB by default), or when it is older than <code>segment.ms<\/code> (7 days) as a new record arrives.<\/p>"},{"front":"Which record does time-based retention look at to decide whether a segment goes?","back":"<p>The segment's newest record. The whole file is deleted once that record is older than <code>retention.ms<\/code>.<\/p>"},{"front":"Why can records outlive <code>retention.ms<\/code>?","back":"<p>They share a segment with newer records, and segments are deleted whole.<\/p>"},{"front":"What is a tombstone?","back":"<p>A record with a key and a null value. On a compacted topic it deletes the key, and it stays for <code>delete.retention.ms<\/code> (1 day by default) after the cleaner first reaches it.<\/p>"},{"front":"Does compaction change offsets or order?","back":"<p>No. Survivors keep their offsets and their order, so a compacted partition has gaps.<\/p>"},{"front":"What is the smallest <code>segment.bytes<\/code> in Kafka 4.x?","back":"<p>1 MiB (1,048,576 bytes). Kafka 4.0 raised it from 14 bytes.<\/p>"}],"terms":[{"term":"Segment","plain":"One file of a partition's log, plus its index files, named after the offset of its first record."},{"term":"Active segment","plain":"The newest segment of a partition, the only one that takes appends. Compaction never touches it."},{"term":"Base offset","plain":"The offset of a segment's first record. It is also the segment's file name, padded to 20 digits."},{"term":"Retention","plain":"Deleting old data by age (<code>retention.ms<\/code>) or size (<code>retention.bytes<\/code>), a whole segment at a time."},{"term":"Earliest offset","plain":"The oldest offset a partition still holds, also called the log start offset. Retention moves it forward in jumps."},{"term":"Log compaction","plain":"Cleaning a partition so that at least the last record for every key remains, with offsets unchanged."},{"term":"Tombstone","plain":"A record with a key and a null value: on a compacted topic, the way to delete a key."}],"remote":true},"kafka-03":{"id":"kafka-03","track":"kafka","n":3,"title":"The cluster: KRaft, replicas and the ISR","ready":true,"minutes":40,"goal":"By the end you can explain what the KRaft controllers do, how a leader, its followers, the ISR and the high watermark decide when a write is committed, and what <code>acks=all<\/code> and <code>min.insync.replicas<\/code> really guarantee.","quiz":[{"q":"A cluster runs 4 controllers. How many of them can fail before the metadata quorum stops accepting changes?","options":["1","2","3","None, because an even number of controllers cannot elect a leader"],"answer":0,"why":"Raft needs a majority, 3 of 4, so the quorum survives one failure: the same as 3 controllers, for one more machine. That is why controller counts are odd. Four controllers can still elect a leader, so the last option is wrong.","from":null},{"q":"Partition 0 has ISR {1, 2, 3}. Log end offsets: leader 1 at 500, follower 2 at 500, follower 3 at 470. What is the highest offset a caught-up consumer can have read?","options":["499","469","470","500"],"answer":1,"why":"The high watermark is the smallest LEO in the ISR, 470, and consumers read only below it, so 469. Offsets 470 to 499 exist on the leader but are not committed until follower 3 has them or leaves the ISR. 499 is the tempting answer if you think consumers read the leader's log end.","from":null},{"q":"A topic has replication factor 3 and <code>min.insync.replicas=2<\/code>. Two of the brokers holding <code>payments-0<\/code> are fenced. One producer sends with <code>acks=1<\/code>, another with <code>acks=all<\/code>. What happens?","options":["Both writes are refused","Both writes are accepted, because a leader is still up","The <code>acks=all<\/code> write gets NOT_ENOUGH_REPLICAS and is retried until it times out; the <code>acks=1<\/code> write is accepted","The <code>acks=1<\/code> write is refused, and the <code>acks=all<\/code> write waits until the brokers return"],"answer":2,"why":"<code>min.insync.replicas<\/code> is checked only for <code>acks=all<\/code>. With one replica left in the ISR, the leader refuses those writes, and the producer retries the retriable error until <code>delivery.timeout.ms<\/code>. An <code>acks=1<\/code> write needs only the leader, so it goes through, on one disk.","from":null},{"q":"A follower's broker is alive and heartbeating, but its disk is so slow that the follower falls further and further behind. <code>replica.lag.time.max.ms<\/code> is the default. What do <code>acks=all<\/code> producers on that partition see?","options":["Immediate NOT_ENOUGH_REPLICAS errors","Nothing at all: a slow follower never affects producers","Writes stall until the follower's disk recovers","Writes can stall for up to about 30 seconds, then succeed once the leader drops the slow follower from the ISR"],"answer":3,"why":"While the slow follower is in the ISR it holds the high watermark back, and <code>acks=all<\/code> producers wait. Once it has not caught up for 30 seconds, the leader removes it, the HW moves on and the waiting writes are acknowledged. The ISR still has two members, so <code>min.insync.replicas=2<\/code> is met and nothing is refused.","from":null},{"q":"From lesson 1: the leader of <code>payments-0<\/code> has log end offset 1,250, but a slow follower holds the high watermark at 1,200. A consumer group has committed offset 1,000. Which statement is right?","options":["The group can read up to offset 1,249 right now","The group can read offsets 1,000 to 1,199; the rest become readable once they are committed","The group cannot read anything until the follower catches up","The group's committed offset jumps to 1,200 on its own"],"answer":1,"why":"A consumer reads only committed records, those below the high watermark, so the end of the partition as consumers see it is 1,200, and lag is measured against that. Offsets 1,200 to 1,249 appear as soon as the ISR has them. A committed offset moves only when the group commits.","from":"kafka-01"}],"cards":[{"front":"What do KRaft controllers store, and where?","back":"<p>The cluster metadata (live brokers, topics, partition leaders, ISRs) as records in the one-partition <code>__cluster_metadata<\/code> log, replicated with Raft.<\/p>"},{"front":"What is the ISR?","back":"<p>A partition's in-sync replicas: the leader plus the followers that have reached the leader's end within <code>replica.lag.time.max.ms<\/code> (30 s by default).<\/p>"},{"front":"What is the high watermark?","back":"<p>The smallest log end offset in the ISR. Records below it are committed and visible to consumers.<\/p>"},{"front":"What does <code>acks=all<\/code> wait for?","back":"<p>Every replica currently in the ISR. If the ISR is only the leader, the leader alone.<\/p>"},{"front":"What does <code>min.insync.replicas<\/code> do?","back":"<p>Sets the smallest ISR size at which the leader accepts <code>acks=all<\/code> writes; below it they get NOT_ENOUGH_REPLICAS. The default is 1.<\/p>"},{"front":"How does a producer handle NOT_ENOUGH_REPLICAS?","back":"<p>It is retriable: the producer retries until <code>delivery.timeout.ms<\/code> (2 minutes) runs out, then fails the send with a TimeoutException.<\/p>"},{"front":"What is an unclean leader election?","back":"<p>Making a replica outside the ISR the leader. It can lose committed records, so it is off by default (<code>unclean.leader.election.enable=false<\/code>).<\/p>"}],"terms":[{"term":"KRaft","plain":"Kafka's built-in Raft protocol for storing cluster metadata. The only mode since Kafka 4.0, which removed ZooKeeper."},{"term":"Controller","plain":"A node that keeps the cluster metadata. One controller is active (the Raft leader); a majority must agree on each change."},{"term":"Fenced broker","plain":"A broker the controller no longer treats as alive, usually after 9 seconds without heartbeats. It loses its leaderships and ISR places."},{"term":"Replication factor","plain":"How many brokers hold a copy of each partition of a topic."},{"term":"Leader and follower","plain":"The leader replica takes all reads and writes for a partition; followers fetch from it to keep their copies current."},{"term":"ISR","plain":"In-sync replicas: the leader plus the followers that keep up with it."},{"term":"High watermark","plain":"The smallest log end offset in the ISR. Records below it are committed."},{"term":"min.insync.replicas","plain":"The smallest ISR size at which a partition accepts <code>acks=all<\/code> writes."}],"remote":true},"kafka-04":{"id":"kafka-04","track":"kafka","n":4,"title":"Producers I: keys, partitions and ordering","ready":true,"minutes":40,"goal":"By the end you can compute the partition the Java producer picks for a key, say exactly which order Kafka keeps and which it doesn't, and choose a key and a partition count for a payments topic.","quiz":[{"q":"A Go service built on librdkafka (default settings) and a Java service both write to <code>payments<\/code> with the account id as the key. What happens?","options":["Nothing goes wrong: the broker hashes the key, so every client agrees","One account can end up in two partitions, because librdkafka hashes with CRC32 by default; set <code>partitioner=murmur2_random<\/code> in the Go service","The broker rejects records whose key hash doesn't match the Java rule","Only records with a null key differ between the two clients"],"answer":1,"why":"Partitioning happens in each client, so two clients with different hash functions disagree about keyed records. librdkafka's default <code>consistent_random<\/code> uses CRC32; <code>murmur2_random<\/code> matches the Java producer. The first option is the common belief, and it fails because the broker never sees a hash: it receives a record already addressed to a partition.","from":null},{"q":"<code>settlements<\/code> has 12 partitions and 12 consumers in one group, keyed by merchant id. One merchant brings 40% of all payments. What do you see?","options":["An even load: murmur2 spreads keys uniformly","The broker splits the merchant's records over several partitions once one gets busy","One consumer handles at least 40% of all records and lags while the others idle, and adding consumers doesn't help","The producer moves the merchant's records to faster partitions (adaptive partitioning)"],"answer":2,"why":"Every record with that key goes to one partition, and one consumer per group reads it. murmur2 spreads distinct keys evenly, but it can't split one key. Adaptive partitioning only steers records without a key; a keyed record always goes to its hash partition.","from":null},{"q":"A producer sends 100-byte records with no key, as fast as it can, with <code>batch.size=16384<\/code>. How are they spread over 6 partitions?","options":["In runs: a few hundred records (16 to 32 KB) to one partition, then a switch to another, favouring partitions with short queues","One record to each partition in turn, round robin","All to partition 0 until it is full","By a hash of the record's value"],"answer":0,"why":"Since Kafka 3.3 the producer sticks to one partition until it has sent between <code>batch.size<\/code> and twice <code>batch.size<\/code> bytes there, then picks another, weighted against long queues. Round robin was the behaviour before Kafka 2.4. Partitions are never \"full\", and the value is never hashed.","from":null},{"q":"From lesson 2: <code>payments<\/code> (keyed by account) grows from 6 to 8 partitions while its consumers are a minute behind. Which can happen?","options":["Nothing changes for existing accounts: keys keep their partition once assigned","Kafka moves the old records of each account to its new partition","The topic is unavailable until every consumer has caught up","An account's new records land in a different partition and are processed before its older, still unread records"],"answer":3,"why":"The partition is recomputed from the hash and the new count for every record; nothing remembers an old assignment. About three keys in four move, while their old records stay where they were, in a partition whose consumer is still behind. Kafka never moves records between partitions: lesson 2 showed each partition is a separate log, and partitions can be added but not merged or removed.","from":"kafka-02"},{"q":"You send <code>ProducerRecord(\"payments\", 3, \"acct-17\", value)<\/code> to a 6-partition topic. <code>acct-17<\/code> hashes to partition 2. Where does the record go?","options":["Partition 2: the key always wins","Partition 3: an explicit partition skips the partitioner, and the key is still stored with the record","Both partitions, one copy each","The send fails because the key and the partition disagree"],"answer":1,"why":"The producer checks for an explicit partition first and only calls the partitioner when there is none. The key is still written with the record, so compaction and consumers see it. Mixing explicit partitions with hashed keys on one topic splits that key over two partitions, so do it only on purpose.","from":null}],"cards":[{"front":"How does the Java producer pick the partition for a keyed record?","back":"<p><code>(murmur2(serialized key bytes) &amp; 0x7fffffff) % numberOfPartitions<\/code>.<\/p>"},{"front":"Why <code>&amp; 0x7fffffff<\/code> and not <code>Math.abs<\/code> for the hash?","back":"<p>The producer clears the sign bit. <code>Math.abs<\/code> gives a different partition for most negative hashes, and <code>Math.abs(Integer.MIN_VALUE)<\/code> is negative.<\/p>"},{"front":"What order does Kafka guarantee?","back":"<p>Order within a partition: records with the same key keep the order in which they reached the leader. There is no order across partitions.<\/p>"},{"front":"Where do records with no key go, since Kafka 3.3?","back":"<p>In sticky runs: one partition until about <code>batch.size<\/code> (up to twice that) bytes, then another, chosen at random and weighted against long queues (KIP-794).<\/p>"},{"front":"What happens to keys when a topic grows from 6 to 8 partitions?","back":"<p>About three in four move to a new partition, and their older records stay in the old one, so per-key order can break.<\/p>"},{"front":"What does <code>partitioner.ignore.keys=true<\/code> do?","back":"<p>The producer spreads keyed records like unkeyed ones. The key is still stored, but per-key order is gone.<\/p>"},{"front":"Which librdkafka setting matches the Java producer's partitioning?","back":"<p><code>partitioner=murmur2_random<\/code>. The default, <code>consistent_random<\/code>, hashes with CRC32.<\/p>"}],"terms":[{"term":"Partitioner","plain":"The code in the producer that picks a partition for each record."},{"term":"Key","plain":"An optional value sent with a record. The default partitioner hashes it to pick the partition; you choose what it is."},{"term":"murmur2","plain":"The fast 32-bit hash function the Java producer applies to the key's bytes."},{"term":"Per-key ordering","plain":"Records with the same key land in one partition, so they are read in the order they reached the leader."},{"term":"Sticky partitioning","plain":"For records without a key: send a run of records to one partition, then switch, so batches fill up."},{"term":"Hot key","plain":"A key that carries a large share of the traffic, so its one partition and that partition's consumer get far more work than the rest."}],"remote":true},"kafka-05":{"id":"kafka-05","track":"kafka","n":5,"title":"Producers II: batching, acks and idempotence","ready":true,"minutes":40,"goal":"By the end you can explain what happens between <code>send()<\/code> and the broker's answer, tune <code>linger.ms<\/code> and <code>batch.size<\/code> from metrics, read a <code>TimeoutException<\/code> correctly, and say what the idempotent producer prevents and what it doesn't.","quiz":[{"q":"From lesson 3: <code>payments<\/code> has replication factor 3 and <code>min.insync.replicas=2<\/code>. Two followers drop out of the ISR for 40 seconds, then return. An idempotent producer with default settings sends during that time. What happens to its sends?","options":["They fail at once with NotEnoughReplicasException","They are written to the leader alone and acknowledged","The producer retries the NOT_ENOUGH_REPLICAS errors; the sends succeed once the ISR is back, well inside the 2-minute delivery.timeout.ms","They are dropped silently because the ISR is too small"],"answer":2,"why":"<code>NOT_ENOUGH_REPLICAS<\/code> is retriable, so the producer keeps retrying with backoff, and 40 seconds is inside the 2-minute <code>delivery.timeout.ms<\/code>. Once the followers rejoin the ISR, the next attempt is accepted. Only if the outage outlasted the deadline would the send fail, and then with a <code>TimeoutException<\/code>, not <code>NotEnoughReplicasException<\/code>. The second option is what <code>acks=1<\/code> would do.","from":"kafka-03"},{"q":"To cut latency, a team sets <code>acks=1<\/code> on its payment producer and changes nothing else. What else changed?","options":["Idempotence is now off, silently, so retries can duplicate and reorder records","Nothing else: idempotence stays on by default","The producer fails at start-up with a ConfigException","Retries are disabled"],"answer":0,"why":"Idempotence requires <code>acks=all<\/code>. When you don't set <code>enable.idempotence<\/code> yourself, a conflicting setting turns it off without a warning; the lab's broker test shows the leader tracking no producer id afterwards. The ConfigException only happens when you also set <code>enable.idempotence=true<\/code> explicitly, which is why payment producers should.","from":null},{"q":"A producer has <code>batch.size=16384<\/code> and <code>linger.ms=50<\/code>. A burst of 1,000 records of 100 bytes arrives within a millisecond, for one partition. What does the sender do?","options":["Waits 50 ms, then sends all 1,000 records in one batch","Sends 1,000 one-record requests","Waits 50 ms, then sends 7 batches","Sends 6 full batches of 163 records at once; the last 22 records wait up to 50 ms"],"answer":3,"why":"A batch can't exceed <code>batch.size<\/code>, so 163 records of 100 bytes fill one, and a full batch may leave without waiting for <code>linger.ms<\/code>. Only the last, partly filled batch lingers. The first option ignores <code>batch.size<\/code>, and <code>linger.ms<\/code> never delays a full batch.","from":null},{"q":"Your code catches a <code>TimeoutException<\/code> from <code>send()<\/code> and calls <code>send()<\/code> again with the same payment. Idempotence is on. The first attempt was in fact written. What does the log hold?","options":["One copy: the idempotent producer recognises the resend","Two copies: the second <code>send()<\/code> is a new record with a new sequence number","One copy: the broker compares the values and drops the second","No copy: the broker removes the first record when the producer times out"],"answer":1,"why":"Idempotence covers the producer's own retries of one batch, which reuse its sequence number. A second <code>send()<\/code> call creates a new record with the next sequence number, so the leader appends it. The broker never compares values. That is why the consumer needs an idempotency key.","from":null},{"q":"Your producer runs at 50 records a second per partition with <code>linger.ms=5<\/code>. You raise it to 100 to get bigger batches. What happens?","options":["Batches grow to about 5 records, and every record waits up to 100 ms longer","Batches fill to <code>batch.size<\/code> and latency drops","Nothing changes, because linger.ms only applies under heavy load","Throughput doubles and latency stays the same"],"answer":0,"why":"At 50 records a second, 100 ms collects about 5 records, a few kilobytes, nowhere near 16 KB. The batches are slightly bigger and each record waits up to 100 ms longer. <code>linger.ms<\/code> matters most at moderate traffic; here it buys little and costs latency.","from":null}],"cards":[{"front":"What does <code>send()<\/code> do before it returns?","back":"<p>Serializes key and value, picks the partition, appends the record to that partition's batch in the accumulator, and returns a Future. The sender thread does the network work.<\/p>"},{"front":"When does a batch leave the accumulator?","back":"<p>When it is full (<code>batch.size<\/code>, 16,384 bytes by default) or when it has waited <code>linger.ms<\/code> (5 ms by default since Kafka 4.0), whichever comes first.<\/p>"},{"front":"What does <code>delivery.timeout.ms<\/code> bound?","back":"<p>The whole time from <code>send()<\/code> returning to the final answer: batching, waiting, every retry. 2 minutes by default; then the send fails with a TimeoutException.<\/p>"},{"front":"A send fails with a TimeoutException. Is the record in the log?","back":"<p>Maybe. The producer stopped waiting; the broker may have written it. Treat it as unknown and retry with the same idempotency key.<\/p>"},{"front":"How does the leader spot a retried batch from an idempotent producer?","back":"<p>By producer id and sequence numbers: it remembers the last 5 batches per producer and answers a repeat with the original offset, writing nothing.<\/p>"},{"front":"What silently turns idempotence off?","back":"<p>A conflicting setting (<code>acks<\/code> other than all, <code>retries=0<\/code>, more than 5 in-flight requests) when <code>enable.idempotence<\/code> was not set explicitly.<\/p>"},{"front":"What doesn't the idempotent producer protect against?","back":"<p>Your code calling <code>send()<\/code> twice, a restarted producer (new producer id), or anything beyond one partition. Those need idempotency keys or transactions.<\/p>"}],"terms":[{"term":"Record accumulator","plain":"The producer's buffer of batches, one queue per partition. <code>send()<\/code> appends to it; the sender thread drains it."},{"term":"Batch","plain":"Records for one partition that travel and are stored together, and are compressed as one unit."},{"term":"linger.ms","plain":"How long a batch may wait for more records before it leaves. 5 ms by default since Kafka 4.0."},{"term":"batch.size","plain":"The most bytes a batch may hold. A full batch leaves without waiting for <code>linger.ms<\/code>."},{"term":"Retriable error","plain":"A broker error that may pass on its own, such as NOT_LEADER_OR_FOLLOWER; the producer retries it automatically."},{"term":"delivery.timeout.ms","plain":"The deadline for a record, from <code>send()<\/code> to the final answer, covering all retries. 2 minutes by default."},{"term":"Idempotent producer","plain":"A producer whose retries can't duplicate or reorder records in a partition, thanks to a producer id and sequence numbers. On by default since Kafka 3.0."},{"term":"Sequence number","plain":"The number an idempotent producer gives each record it sends to a partition: 0, 1, 2 and so on. Batches carry the number of their first record."}],"remote":true},"kafka-06":{"id":"kafka-06","track":"kafka","n":6,"title":"Consumers: the poll loop, offsets and delivery guarantees","ready":true,"minutes":40,"goal":"By the end you can write a poll loop that commits after processing and stops cleanly, explain the position and the committed offset, predict what a crash costs under each commit order, and make a payment consumer apply every payment exactly once with an idempotency key.","quiz":[{"q":"From lesson 5: the idempotent producer is on. Your producer code got a <code>TimeoutException<\/code> for pay-0042 and sent it again, and both records reached the log. What keeps the ledger from crediting it twice?","options":["The idempotent producer: the leader recognises the resend","The consumer's commit: it skips a value it has already seen","The consumer's idempotency check on the payment's key, done in the same transaction as the credit","Log compaction, which keeps only one record per key"],"answer":2,"why":"Idempotence covers the producer's own retries, which reuse a sequence number; a second <code>send()<\/code> is a new record with a new sequence and a new offset, so the leader writes it. Offsets and commits know nothing about values. Only the consumer can see that pay-0042's key was already applied. Compaction is not about duplicates and never runs on the active segment.","from":"kafka-05"},{"q":"A consumer polls offsets 200 to 299 of a partition. The committed offset is 200. It applies 200 to 249 and the process is killed. Where does the next consumer of the group start, and what happens to 200 to 249?","options":["At 250; nothing is repeated","At 300; 250 to 299 are lost","At 200; 200 to 249 are delivered and processed again","At 0, because the position was lost"],"answer":2,"why":"Only the committed offset survives, and it is still 200. The position (300) and the progress inside the batch lived in the dead process. So the batch is replayed from 200, and 200 to 249 arrive a second time: at-least-once. The idempotency check makes that harmless.","from":null},{"q":"You deploy a new consumer group <code>settlement<\/code> on a <code>payments<\/code> topic that holds 3 days of records, with default consumer settings. What does it read first?","options":["Only records written after it started, because <code>auto.offset.reset<\/code> defaults to <code>latest<\/code>","The oldest record still kept, offset 0 or later","Wherever the <code>ledger<\/code> group has committed","Nothing until you commit an offset by hand"],"answer":0,"why":"A new group has no committed offset, so <code>auto.offset.reset<\/code> decides, and its default is <code>latest<\/code>: the end of each partition. Three days of payments are silently skipped. Set <code>earliest<\/code> when the history matters. Groups never share committed offsets.","from":null},{"q":"A consumer takes 1 second per record and uses <code>max.poll.records=500<\/code> with the default <code>max.poll.interval.ms<\/code>. What happens?","options":["Nothing: heartbeats keep it in the group","Each batch takes about 500 s, longer than 5 minutes, so the consumer leaves the group mid-batch and its commit fails","The broker slows down its fetches to match","Kafka splits each batch over the other consumers"],"answer":1,"why":"Heartbeats prove the process is alive, but <code>max.poll.interval.ms<\/code> (300 s) checks that the loop calls <code>poll<\/code>. 500 records at 1 s each is 500 s, so the client leaves the group, the partition moves to another member and the eventual commit fails with <code>CommitFailedException<\/code>, so the batch is processed again. Lower <code>max.poll.records<\/code> (say 100) or speed up processing.","from":null},{"q":"A loop polls a batch, processes records until the first one that fails validation, logs it and <code>break<\/code>s, then calls <code>commitSync()<\/code> with no arguments. What is wrong?","options":["Nothing: <code>commitSync()<\/code> commits only processed records","It commits the position, past the whole batch, so the failed record and everything after it are never processed","It commits nothing, because the loop broke","It commits offset 0"],"answer":1,"why":"<code>commitSync()<\/code> without arguments commits the current positions, which already cover everything <code>poll<\/code> returned. The unprocessed tail of the batch is skipped for good. When a loop can stop part-way, commit explicit offsets: the offset of the first unprocessed record. Lesson 8 of this track handles the failing record itself.","from":null}],"cards":[{"front":"What is a consumer's position?","back":"<p>The offset of the next record <code>poll<\/code> will return, per partition. It lives in memory and moves as soon as <code>poll<\/code> returns records.<\/p>"},{"front":"What is the committed offset, and where is it stored?","back":"<p>The group's saved bookmark per partition, in <code>__consumer_offsets<\/code>. It moves only when you commit, and it is where a restarted or new consumer starts.<\/p>"},{"front":"Which offset do you commit after processing offsets 40 to 49?","back":"<p>50: the next record to read, last processed plus one.<\/p>"},{"front":"Commit before processing, then crash: what is the guarantee?","back":"<p>At-most-once: the rest of the batch is never processed.<\/p>"},{"front":"When is auto-commit safe?","back":"<p>When every record from a <code>poll<\/code> is fully processed before the next <code>poll<\/code> or <code>close<\/code>. Handing records to other threads breaks it.<\/p>"},{"front":"What does <code>auto.offset.reset=latest<\/code> (the default) do for a new group?","back":"<p>Starts at the end of each partition, so records already in the topic are skipped.<\/p>"},{"front":"What makes at-least-once safe for payments?","back":"<p>An idempotency key per payment, checked and stored in the same database transaction as the effect, before the offset commit.<\/p>"}],"terms":[{"term":"Poll loop","plain":"The consumer's main loop: poll a batch, process it, commit, repeat. Your code writes it; one thread runs it."},{"term":"Position","plain":"The next offset <code>poll<\/code> will return for a partition, kept in the consumer's memory."},{"term":"Committed offset","plain":"The offset a group saved for a partition: the next record to read after a restart."},{"term":"auto.offset.reset","plain":"Where a group starts when it has no committed offset: <code>latest<\/code> (default), <code>earliest<\/code> or <code>none<\/code>."},{"term":"At-most-once","plain":"Commit before processing. A crash can lose records but never repeats one."},{"term":"At-least-once","plain":"Commit after processing. A crash can repeat records but never loses one."},{"term":"Idempotency key","plain":"A unique id given to a business operation once, so a consumer can recognise and skip a repeat."},{"term":"max.poll.interval.ms","plain":"The longest gap allowed between two <code>poll<\/code> calls (5 minutes) before the consumer leaves its group."}],"remote":true},"kafka-07":{"id":"kafka-07","track":"kafka","n":7,"title":"Consumer groups and rebalancing","ready":true,"minutes":40,"goal":"By the end you can explain how a consumer group divides partitions among its members, hand a partition's bookmark over cleanly when it moves, say what eager, cooperative and the new KIP-848 protocol each stop during a rebalance, and pick the settings that decide when a member is thrown out.","quiz":[{"q":"From lesson 6: c1 commits after each batch of 500. It has applied 300 records of a batch on partition 4 when a rebalance moves partition 4 to c2. c1 has no rebalance listener. What does c2 do?","options":["It starts after the 300, because the group tracks c1's progress","It starts at the last committed offset, so up to 300 records are applied a second time","It waits until c1 finishes the batch, then starts after it","It starts at the log end, so the rest of c1's batch is skipped"],"answer":1,"why":"The new owner can only start where the group's bookmark is, and c1 last committed before this batch. Kafka knows nothing about c1's in-memory progress, which is lesson 6's position versus committed offset. A commit in <code>onPartitionsRevoked<\/code> closes the gap; the idempotent ledger makes the replay harmless when the gap can't be closed, as after a crash.","from":"kafka-06"},{"q":"A payments topic has 8 partitions. The ledger group runs 10 instances. What happens?","options":["Each instance gets 0.8 of a partition's records","Kafka adds two partitions to the topic","Two partitions get two owners each","Two instances own no partitions and sit idle until another member leaves"],"answer":3,"why":"In a consumer group a partition has exactly one owner, so parallelism stops at the partition count. The two extra members are spare capacity: they take over if a member dies. Kafka never adds partitions by itself, and two owners on one partition would break per-key order.","from":null},{"q":"A group of three uses the classic protocol with <code>CooperativeStickyAssignor<\/code>. A fourth member joins. Which partitions stop being processed during the rebalance?","options":["All of them, until the new assignment arrives","None at all","Only the partitions that move to the new member, while they move","Only the partitions of the group leader"],"answer":2,"why":"Cooperative rebalancing lets members keep their partitions while they rejoin; only the owners of partitions that must move revoke them, and a second round hands them to the new member. The first option is eager rebalancing, which is what the default assignor list gives you.","from":null},{"q":"A consumer's batches sometimes take 7 minutes because of a slow downstream API. Its heartbeats are fine. With default settings, what happens?","options":["After 5 minutes without a <code>poll<\/code>, the client leaves the group; the partitions move, the batch is processed again by the new owner, and the old member's commit fails","Nothing: heartbeats prove it is alive","The session timeout expires and the coordinator removes it","The broker slows down its fetches"],"answer":0,"why":"Heartbeats only prove the process is running; <code>max.poll.interval.ms<\/code> (300,000 ms) checks that the loop calls <code>poll<\/code>. Past it the client leaves on its own, which causes a rebalance and duplicate processing, and the late commit fails with <code>CommitFailedException<\/code>. The fix is a smaller <code>max.poll.records<\/code> or faster processing, not a longer session timeout.","from":null},{"q":"The ledger runs six pods with static membership (<code>group.instance.id<\/code>) and the default 45-second session timeout. One pod's node fails and the pod never comes back. What happens to its partitions?","options":["They move to the other members at once","They are unprocessed for about 45 seconds, then the coordinator gives them to other members","They stay unprocessed until the pod comes back","The whole group stops until an operator removes the member"],"answer":1,"why":"A static member's partitions are kept for it until the session timeout passes, because it might be restarting. That is what makes a rolling deploy cheap, and it is the price here: the partitions wait out the full timeout, and lag builds on them. Then the coordinator removes the member and reassigns them as usual.","from":null}],"cards":[{"front":"How does a consumer group divide a topic?","back":"<p>By partition: each partition has exactly one owner in the group at a time, and the group keeps one committed offset per partition.<\/p>"},{"front":"What does the default classic <code>partition.assignment.strategy<\/code> do on a rebalance?","back":"<p>It is <code>[RangeAssignor, CooperativeStickyAssignor]<\/code> and uses Range, which is eager: every member hands back all its partitions first.<\/p>"},{"front":"How do you opt in to the KIP-848 protocol, and what must you remove?","back":"<p>Set <code>group.protocol=consumer<\/code>. Remove <code>session.timeout.ms<\/code>, <code>heartbeat.interval.ms<\/code> and <code>partition.assignment.strategy<\/code>: the client rejects them.<\/p>"},{"front":"What should <code>onPartitionsRevoked<\/code> do, and what must <code>onPartitionsLost<\/code> not do?","back":"<p>Revoked: commit the next offset to read of each partition you processed. Lost: don't commit, the partitions already belong to someone else.<\/p>"},{"front":"Which failure does <code>max.poll.interval.ms<\/code> catch that heartbeats can't?","back":"<p>A loop that is stuck or too slow: heartbeats come from a background thread, so they keep flowing. Default 5 minutes.<\/p>"},{"front":"What does <code>group.instance.id<\/code> change?","back":"<p>The member is static: a restart within the session timeout gets the same partitions back without a rebalance.<\/p>"}],"terms":[{"term":"Consumer group","plain":"Consumers with the same <code>group.id<\/code> that share a topic's partitions, one owner per partition, with one committed offset per partition."},{"term":"Group coordinator","plain":"The broker that manages a group's membership and stores its committed offsets."},{"term":"Assignor","plain":"The algorithm that maps partitions to members: range, round robin, sticky, or the broker's <code>uniform<\/code>."},{"term":"Rebalance","plain":"Moving partitions between members because a member joined, left or was thrown out."},{"term":"Eager rebalancing","plain":"Every member hands back all its partitions before the new assignment, so the whole group stops."},{"term":"Cooperative rebalancing","plain":"Members keep their partitions during a rebalance and hand back only those that move."},{"term":"Rebalance listener","plain":"Callbacks the consumer runs inside <code>poll<\/code> when partitions are assigned, revoked or lost."},{"term":"Static membership","plain":"A member with a fixed <code>group.instance.id<\/code>, whose partitions wait for it during a restart."}],"remote":true},"kafka-08":{"id":"kafka-08","track":"kafka","n":8,"title":"Failure handling: poison pills, retries and dead letters","ready":true,"minutes":40,"goal":"By the end you can explain why one bad record stops its partition, tell transient from permanent failures, build bounded retries and a dead-letter topic whose headers say where each record came from, and keep one account's payments in order while you do it.","quiz":[{"q":"From lesson 6: to go faster, a consumer sends dead letters with <code>send()<\/code> and doesn't wait for the result, then commits. The DLT's partition leader is down for a minute, and the pod crashes during that minute. What happens to a poison pill it dead-lettered just before the crash?","options":["It is in the DLT: <code>send()<\/code> returned without an error","It is processed again after the restart","It may be lost: the commit moved past it while its dead letter was still unsent, and the crash dropped the dead letter","The producer's idempotence keeps it safe"],"answer":2,"why":"<code>send()<\/code> only puts the record in the producer's buffer (lesson 5). The commit is what makes the consumer never read it again. If the buffered dead letter dies with the process after the commit, the record is in neither place. Waiting for <code>send(...).get()<\/code> before the commit keeps the at-least-once order from lesson 6. Idempotence prevents duplicates from retries; it doesn't save unsent records.","from":"kafka-06"},{"q":"Which of these should the ledger consumer retry in place?","options":["A <code>java.net.http.HttpTimeoutException<\/code> from the card issuer","A <code>NumberFormatException<\/code> parsing the amount","An <code>IllegalArgumentException<\/code> for currency \"XXX\"","A <code>NullPointerException<\/code> in the payment mapper"],"answer":0,"why":"A timeout says nothing is wrong with the payment, so the same call can succeed a moment later. The other three fail the same way for the same input every time: retrying them only holds up the partition. They belong in the DLT on the first failure, and the <code>NullPointerException<\/code> also needs a code fix.","from":null},{"q":"A partition has been stuck on one record for 20 minutes; the handler throws <code>IllegalArgumentException<\/code> every time. A colleague suggests raising <code>max.poll.interval.ms<\/code> to 30 minutes. What does that change?","options":["It fixes it: the consumer gets more time to process the record","Nothing useful: the record fails the same way however long you wait; it needs to go to a DLT","It moves the record to another consumer","It makes Kafka skip the record"],"answer":1,"why":"<code>max.poll.interval.ms<\/code> only decides when a slow loop is thrown out of the group (lesson 7). A deterministic failure isn't slow, it is wrong, and more time changes nothing. The record has to leave the partition: a dead-letter topic, with headers so it can be fixed and replayed.","from":null},{"q":"Your consumer catches <code>RecordDeserializationException<\/code> from <code>poll<\/code>, logs it, and calls <code>poll<\/code> again. What happens?","options":["The next poll returns the records after the bad one","The broker deletes the bad record","The consumer switches to <code>read_uncommitted<\/code>","The next poll throws the same exception again, because the position is still on the bad record"],"answer":3,"why":"The consumer's position doesn't move past a record it couldn't deserialize. Every <code>poll<\/code> reaches it again and throws again. Save the raw bytes from the exception (<code>keyBuffer()<\/code> and <code>valueBuffer()<\/code>) to a DLT, then <code>seek(e.topicPartition(), e.offset() + 1)<\/code>.","from":null},{"q":"acct-7's capture went to the DLT, and the consumer parks acct-7 in an in-memory set. Then a deploy restarts the pod. acct-7's next payment, a refund, arrives. What happens?","options":["It is parked, because the DLT remembers acct-7","It is applied: the new process starts with an empty parked set, so the refund overtakes the failed capture","It is rejected by the broker","The consumer replays the DLT on start-up"],"answer":1,"why":"Nothing reads the DLT back automatically, so after a restart (or a rebalance that moves the partition) an in-memory set is empty. Keep parked keys where they survive, a database table or a compacted topic keyed by account, and load them when the partition is assigned.","from":null}],"cards":[{"front":"What is a poison pill?","back":"<p>A record that fails every time it is processed. Without special handling it stops its partition: the committed offset can never pass it.<\/p>"},{"front":"Transient or permanent: how do you decide, and what do you do with each?","back":"<p>By exception type. Transient (timeouts, 503s, lock waits): retry a few times with backoff. Permanent (bad data, bugs): dead-letter at once.<\/p>"},{"front":"Which headers should a dead letter carry?","back":"<p>The original topic, partition and offset, and the exception's class and message. Keep the producer's own headers too.<\/p>"},{"front":"In which order do you write the dead letter and commit?","back":"<p>Send the dead letter and wait for the ack, then commit. A failed DLT write must leave the record uncommitted.<\/p>"},{"front":"What does <code>poll<\/code> do after a <code>RecordDeserializationException<\/code>?","back":"<p>It throws again on every call: the position stays on the bad record until you <code>seek<\/code> to offset + 1.<\/p>"},{"front":"Why park a key?","back":"<p>A DLT or retry topic takes a record out of its partition, so later records of the same key would overtake it. Parking sends them after it.<\/p>"}],"terms":[{"term":"Poison pill","plain":"A record that fails every time it is processed, so it blocks its partition."},{"term":"Transient failure","plain":"A failure caused by something briefly wrong around the record, such as a timeout; a retry can succeed."},{"term":"Permanent failure","plain":"A failure caused by the record or the code; the same input fails the same way every time."},{"term":"Exponential backoff","plain":"Waiting longer before each retry, for example 100, 200, then 400 ms."},{"term":"Dead-letter topic (DLT)","plain":"A topic where a consumer puts records it gave up on, with headers saying where they came from and why."},{"term":"Record header","plain":"A named byte value attached to a Kafka record next to its key and value."},{"term":"Retry topic","plain":"A topic that holds failed records for a fixed delay before another consumer tries them again."},{"term":"Parking a key","plain":"Sending all later records of a failed key after it, so the key's records stay in order."}],"remote":true},"kafka-09":{"id":"kafka-09","track":"kafka","n":9,"title":"Transactions and exactly-once","ready":true,"minutes":40,"goal":"By the end you can explain why consume-transform-produce duplicates output after a crash, make the outputs and the offset commit one Kafka transaction, predict what <code>read_committed<\/code> and <code>read_uncommitted<\/code> readers see and why the last stable offset holds them back, and say what fencing stops and where exactly-once ends.","quiz":[{"q":"From lesson 5: the ledger's producer has idempotence on (the default) but no transactions. Instance 1 writes entries for pay-0 to pay-3 and crashes before committing offsets; instance 2 writes them again. Why does the broker accept the second copies?","options":["Idempotence only dedupes within one batch","The broker only checks sequence numbers for <code>acks=1<\/code>","Instance 2 is a new producer session with a new producer id, so its records are new records","The broker does reject them; the duplicates come from the consumer"],"answer":2,"why":"The idempotent producer drops a retry from the same producer id and sequence number. A restarted instance gets a new producer id, and its sends are not retries. A transactional id is what links instances across restarts: the new instance's <code>initTransactions<\/code> aborts the old one's open transaction instead of letting it stand.","from":"kafka-05"},{"q":"A partition's log end is 151. A transaction that started at offset 100 is still open, and offsets 101 to 150 hold non-transactional records. What does a <code>read_committed<\/code> consumer get, and what is its end offset?","options":["Offsets 101 to 150, end offset 151","Everything below 100, end offset 100: it waits for the transaction even for the plain records","Everything except offset 100, end offset 151","Nothing until the transaction commits"],"answer":1,"why":"The last stable offset is the first offset of the oldest open transaction, 100. A <code>read_committed<\/code> reader never reads at or past it, because records are returned in offset order. <code>endOffsets<\/code> returns the LSO for such a reader. The plain records become visible once the transaction ends.","from":null},{"q":"A transformer catches a <code>KafkaException<\/code> during a batch, calls <code>abortTransaction()<\/code>, and goes straight back to <code>poll<\/code>. What happens to that batch?","options":["It is processed again in the next transaction","The broker replays it after the abort","Its entries are deleted from the output topic","It is skipped: the consumer's position is already past it, and only a restart would read it again from the committed offset"],"answer":3,"why":"<code>poll<\/code> moved the position when it returned the batch (lesson 6). The abort hides the entries from <code>read_committed<\/code> readers and leaves the committed offset where it was, but the running consumer keeps reading from its position. Seek every partition back to the batch's first offset after an abort.","from":null},{"q":"Instance A pauses for 40 seconds, the group moves on, and instance B starts with the same <code>transactional.id<\/code>. A wakes and calls <code>commitTransaction()<\/code>. What stops A's entries from becoming visible?","options":["B's <code>initTransactions()<\/code> bumped the epoch; the broker refuses A's older epoch, so A's transaction can't commit","Nothing: A's commit succeeds and readers see duplicates","A's session timeout deletes its records","The consumer group rejects A's records"],"answer":0,"why":"Fencing: each <code>initTransactions<\/code> gets a higher epoch for the id, and the coordinator and partition leaders refuse the older one. In Kafka 4.4 A's send and commit fail with <code>InvalidProducerEpochException<\/code> and its abort with <code>ProducerFencedException<\/code>; A must close. B's <code>initTransactions<\/code> also aborted whatever A had left open.","from":null},{"q":"Inside a transactional batch, the fee service calls the billing API for each payment, then the batch's commit times out and the service aborts and retries the batch. What happens at the billing API?","options":["Nothing: the abort rolls the calls back","The calls are made again for the retried batch, so fees are posted twice unless the API deduplicates by an idempotency key","Kafka holds the calls until the transaction commits","Kafka 4.4's two-phase commit makes the API part of the transaction"],"answer":1,"why":"A Kafka transaction covers only Kafka writes and offsets. The HTTP calls already happened and happen again on the retry. Send the payment's idempotency key so the API recognises repeats. KIP-939's two-phase commit isn't in Kafka 4.4, and it would cover a database, not an HTTP API.","from":null}],"cards":[{"front":"What does a Kafka transaction make atomic in consume-transform-produce?","back":"<p>The output records in any number of partitions plus the consumer group's offset commit (<code>sendOffsetsToTransaction<\/code>).<\/p>"},{"front":"When are a transaction's records written to the log?","back":"<p>At once, when sent. Commit or abort only adds a marker; nothing is removed.<\/p>"},{"front":"What is the last stable offset (LSO)?","back":"<p>The first offset of the oldest open transaction in a partition. <code>read_committed<\/code> readers never read at or past it.<\/p>"},{"front":"What is the default <code>isolation.level<\/code>, and what does it show?","back":"<p><code>read_uncommitted<\/code>: every record, including aborted and still-open transactions.<\/p>"},{"front":"What fences a zombie transactional producer?","back":"<p>A new <code>initTransactions()<\/code> with the same <code>transactional.id<\/code> bumps the epoch; the broker refuses the old epoch.<\/p>"},{"front":"What must the code do after <code>abortTransaction()<\/code>?","back":"<p>Seek the consumer back to the first offset of the batch in every partition, so the batch is processed again.<\/p>"},{"front":"Does a Kafka transaction cover a database write or an API call in the loop?","back":"<p>No. Only Kafka writes and offsets. Use an idempotency key for the rest; KIP-939 two-phase commit hasn't shipped.<\/p>"}],"terms":[{"term":"Consume-transform-produce","plain":"Read records, compute something, write records to another topic, and commit the input offsets."},{"term":"transactional.id","plain":"A stable name for one producer instance, used to find its transaction coordinator and to fence older instances."},{"term":"Transaction coordinator","plain":"The broker that tracks a transactional id's transactions in <code>__transaction_state<\/code> and writes the markers."},{"term":"Transaction marker","plain":"A control record (COMMIT or ABORT) written into each partition a transaction touched; it takes an offset."},{"term":"isolation.level","plain":"Consumer setting: <code>read_uncommitted<\/code> (default) returns everything; <code>read_committed<\/code> hides aborted and open transactions."},{"term":"Last stable offset (LSO)","plain":"The first offset of the oldest open transaction; <code>read_committed<\/code> readers stop there."},{"term":"Zombie","plain":"An old instance that has been replaced but keeps running, for example after a long pause."},{"term":"Fencing","plain":"Refusing writes from an older epoch of a transactional id, so a zombie can't commit."}],"remote":true},"kafka-10":{"id":"kafka-10","track":"kafka","n":10,"title":"Kafka Streams: tables, state and windows","ready":true,"minutes":40,"goal":"By the end you can explain how Kafka Streams folds a stream of payments into a table, where that table lives and how it comes back after a lost disk, count events per time window with a grace period for late records, and say what <code>exactly_once_v2<\/code> and the new streams rebalance protocol change.","quiz":[{"q":"From lesson 2: the changelog topic of the <code>balances<\/code> store is compacted, and the store has 10 accounts. A new instance restores it and reads 1,000 records. Why so many?","options":["Compaction never touches the active segment, so a young changelog still holds every update","Compaction only removes tombstones, never older values","The restore also re-reads the <code>payments<\/code> topic","RocksDB needs every version of each key to rebuild its files"],"answer":0,"why":"Compaction keeps the last value per key, but only in closed segments; the active segment is never cleaned. A changelog younger than one segment (1 GiB or 7 days by default) holds every update. The restore reads the changelog only, never the input topic; RocksDB needs just the final value per key.","from":"kafka-02"},{"q":"A fraud rule counts debits in one-minute tumbling windows with a 30-second grace. In one task, debits arrive stamped 10:00:20, 10:01:40 (another account), then 10:00:50. What happens to the last one?","options":["Counted: it arrived less than 30 seconds of wall-clock time after the first","Counted: each account has its own stream time","Dropped: stream time is 10:01:40, past the window's close at 10:01:30","Dropped: tumbling windows never accept out-of-order records"],"answer":2,"why":"Stream time is the largest timestamp seen in the task, here 10:01:40, from any key. The window [10:00, 10:01) accepted records until stream time reached 10:01:30. Wall-clock time plays no part, and out-of-order records inside the grace period are accepted.","from":null},{"q":"A topology runs <code>payments.groupBy((account, amount) -&gt; merchantOf(account)).count()<\/code>. <code>payments<\/code> is keyed by account. What does Kafka Streams do that <code>groupByKey<\/code> would not?","options":["Nothing: grouping is always local to the task","It writes every record to an internal repartition topic keyed by merchant and reads it back","It refuses to run, because the key changed","It keeps the counts in memory only"],"answer":1,"why":"A task only sees its own partition, and records of one merchant are spread over all of them. To count per merchant, Kafka Streams re-keys every record through a <code>-repartition<\/code> topic so that each merchant's records meet in one task. That's one more write and read per record; key the input by the aggregation key when you can.","from":null},{"q":"A balance app runs with the default <code>at_least_once<\/code>, commits every 30 seconds and has the record cache off. An instance dies 20 seconds after a commit, and another takes over its task. What do the restored balances show?","options":["Exactly the right balances: the changelog guarantees it","Balances that miss the last 20 seconds of payments","Balances that count the last 20 seconds of payments twice","Nothing: the task waits for the dead instance"],"answer":2,"why":"Between commits, every update already reached the changelog, so the restored store includes those 20 sec
