onds of payments. The new owner then reads the same payments again from the committed offset and adds them a second time. Nothing is missing, and the task doesn't wait for the dead instance. <code>exactly_once_v2<\/code> puts the changelog writes and the offsets in one transaction, so a crash aborts both.","from":null},{"q":"With the record cache off, four payments for two accounts go through the balance topology. How many records does the <code>balances<\/code> output topic get?","options":["2, one per account","4, one per update of the table","1, the final table","None until the next commit"],"answer":1,"why":"<code>toStream()<\/code> emits every change of the table, so each payment produces one record. The output topic is the table's history, and the latest record per key is its current state. With the cache on, updates of the same key between commits can merge, and fewer records come out.","from":null}],"cards":[{"front":"KStream or KTable: what does each record mean?","back":"<p>KStream: an event that happened. KTable: the new value for its key, replacing the old one.<\/p>"},{"front":"Where does a Kafka Streams state store live, and what backs it up?","back":"<p>On local disk (RocksDB under <code>state.dir<\/code>), one slice per task. Every write also goes to the compacted topic <code>&lt;application.id&gt;-&lt;store&gt;-changelog<\/code>.<\/p>"},{"front":"What happens when a task moves to an instance with no local store?","back":"<p>It replays the changelog partition into a new store before processing, then reads the input from the committed offset.<\/p>"},{"front":"What is stream time?","back":"<p>The largest record timestamp a task has seen so far. It never goes back, and any key can move it.<\/p>"},{"front":"When does a window stop accepting records?","back":"<p>When stream time passes the window's end plus the grace period. Later records are dropped and counted in <code>dropped-records-total<\/code>.<\/p>"},{"front":"What does <code>exactly_once_v2<\/code> put in one transaction?","back":"<p>A commit interval's output records, changelog writes and input offsets, with commits every 100 ms.<\/p>"},{"front":"What does <code>group.protocol=streams<\/code> change?","back":"<p>The broker assigns tasks (KIP-1071, production-ready since 4.2). Standbys become a group config; regex subscriptions aren't supported; switching needs a full stop.<\/p>"}],"terms":[{"term":"Kafka Streams","plain":"A Java library that runs consume-transform-produce loops with local state inside your service."},{"term":"Topology","plain":"The graph of processing steps from input topics to output topics."},{"term":"KStream / KTable","plain":"A stream of events, and a table of the latest value per key built from a stream."},{"term":"State store","plain":"A local key-value store (RocksDB by default) that holds a table or window for one task."},{"term":"Changelog topic","plain":"A compacted topic that receives every write to a state store, so the store can be rebuilt."},{"term":"Task","plain":"The unit of work in Kafka Streams: one input partition plus its slices of the stores."},{"term":"Stream time","plain":"The largest record timestamp a task has seen; it decides when windows close."},{"term":"Grace period","plain":"How long after a window's end it still accepts late records, measured in stream time."}],"remote":true},"kafka-11":{"id":"kafka-11","track":"kafka","n":11,"title":"Schemas, Connect and change data capture","ready":true,"minutes":40,"goal":"By the end you can explain why a record needs a schema id, predict which schema changes Schema Registry accepts in each compatibility mode, describe what Kafka Connect's workers, connectors, tasks and converters do, and move a database write to Kafka exactly when it commits with the transactional outbox and Debezium.","quiz":[{"q":"From lesson 9: why can't the payment service make its PostgreSQL insert and its Kafka send atomic with a Kafka transaction?","options":["A Kafka transaction covers only Kafka writes and consumer offsets; two-phase commit with a database (KIP-939) hasn't shipped","Kafka transactions only work with Kafka Streams","PostgreSQL doesn't support transactions across tables","It can, if the producer sets <code>isolation.level=read_committed<\/code>"],"answer":0,"why":"Lesson 9's boundary: the transaction coordinator only knows Kafka partitions. KIP-939 proposes taking part in an outside two-phase commit, and its APIs aren't in Kafka 4.4. <code>isolation.level<\/code> is a consumer setting about what readers see. The outbox avoids the problem by making the database the only write.","from":"kafka-09"},{"q":"A subject is in BACKWARD mode. Which change does the registry reject?","options":["Adding <code>currency<\/code> with the default \"EUR\"","Removing <code>note<\/code>, which had no default","Adding <code>merchantId<\/code> with no default","Widening <code>amount<\/code> from int to long"],"answer":2,"why":"BACKWARD checks that the new schema can read the latest version's data. Old records lack <code>merchantId<\/code>, and there's no default to fill it. A removed field is skipped by the new reader, a default fills <code>currency<\/code>, and Avro reads an int as a long.","from":null},{"q":"A team switches a subject to FORWARD. In which order should producers and consumers move to the next version?","options":["Consumers first, then producers","Producers first, then consumers","Both at once, in one deploy","It doesn't matter in FORWARD"],"answer":1,"why":"FORWARD guarantees that readers on the latest registered schema can read data written with the new one. So producers can start writing the new version while consumers still run the old one. Under BACKWARD it's the other way round, and only FULL makes the order free.","from":null},{"q":"In PostgreSQL, transaction A inserts an outbox row first, then transaction B inserts one, then B commits, then A commits. In which order does Debezium write their events?","options":["A, then B: in the order the rows were inserted","In outbox id order","In any order: CDC doesn't keep order","B, then A: in commit order"],"answer":3,"why":"Logical decoding hands over a transaction when it commits, with its changes in order, so transactions come out in commit order. That's also why a poller that reads by id can skip A: B's higher id was visible first.","from":null},{"q":"A Debezium connector writes events for 40 seconds after its last offset flush, then its worker crashes. What do consumers of <code>outbox.event.payment<\/code> see after the restart?","options":["Nothing changes: Debezium confirms each event to PostgreSQL first","Some events a second time, with the same event ids","A gap: those 40 seconds of events are lost","The same events with new ids"],"answer":1,"why":"The restarted task reads the WAL again from the last stored LSN, so the events after it are written again. The slot kept that WAL, so nothing is lost, and the ids come from the outbox rows, so they repeat. Consumers dedupe on the <code>id<\/code> header.","from":null}],"cards":[{"front":"What does a registry-aware serializer put in front of the Avro bytes?","back":"<p>5 bytes: a magic byte 0 and the 4-byte schema id from Schema Registry.<\/p>"},{"front":"Avro: the reader has a field the writer doesn't. What happens?","back":"<p>The reader's default fills it. With no default, the read fails.<\/p>"},{"front":"What does BACKWARD compatibility guarantee, and who upgrades first?","back":"<p>Readers on the new schema can read data written with the latest one. Consumers upgrade first.<\/p>"},{"front":"What is a <code>_TRANSITIVE<\/code> compatibility mode?","back":"<p>The same check against every registered version, not just the latest.<\/p>"},{"front":"Kafka Connect: connector, task, converter?","back":"<p>A connector is a configured copy job; tasks do the copying in parallel; a converter turns records into the bytes in Kafka and back.<\/p>"},{"front":"What is the transactional outbox?","back":"<p>Writing the business row and an event row in one database transaction, then publishing the event rows from the database's log.<\/p>"},{"front":"What is Debezium's offset for PostgreSQL, and its delivery guarantee?","back":"<p>The LSN, a position in the write-ahead log, stored in <code>connect-offsets<\/code>. At-least-once: dedupe on the event id.<\/p>"}],"terms":[{"term":"Schema","plain":"The written-down shape of a record: field names, types and defaults."},{"term":"Schema Registry","plain":"An HTTP service that stores schema versions per subject, gives them ids and checks new versions for compatibility."},{"term":"Subject","plain":"The name schema versions are registered under, by default <code>&lt;topic&gt;-value<\/code> or <code>&lt;topic&gt;-key<\/code>."},{"term":"Compatibility mode","plain":"The rule a subject applies to new versions: BACKWARD, FORWARD, FULL, their <code>_TRANSITIVE<\/code> forms, or NONE."},{"term":"Kafka Connect","plain":"A runtime that ships with Kafka and runs configured source and sink connectors on a cluster of workers."},{"term":"Converter","plain":"The Connect component that turns records into the bytes stored in Kafka and back."},{"term":"Change data capture (CDC)","plain":"Turning a database's log of committed changes into a stream of change events."},{"term":"Transactional outbox","plain":"An outbox table written in the same database transaction as the business data, published to Kafka by CDC."}],"remote":true},"kafka-12":{"id":"kafka-12","track":"kafka","n":12,"title":"Share groups and running Kafka in production","ready":true,"minutes":40,"goal":"By the end you can explain how a share group lets many consumers read one partition, predict what locks, acknowledgements and delivery counts do to a record, size a topic's partitions from measured rates, read consumer lag, and wrap the blocking poll loop in a Kotlin <code>Flow<\/code>.","quiz":[{"q":"From lesson 7: a consumer group has 8 members and its topic has 6 partitions. What do the two extra members do?","options":["Each takes half of a partition","Nothing: they sit idle until a member leaves or partitions are added","They read the same partitions as two other members, as backups","The broker rejects them"],"answer":1,"why":"In a consumer group a partition has exactly one owner, so members beyond the partition count get no partitions. They do take over when an owner leaves. Several members reading one partition is what a share group does.","from":"kafka-07"},{"q":"In a share group with the defaults, a consumer releases one record every time it gets it. What happens after its fifth delivery?","options":["It's redelivered forever, every 30 seconds","The partition stops until someone accepts it","The broker archives it, and with a DLQ configured in 4.4 writes it to the dead-letter topic","The consumer gets an exception and must seek past it"],"answer":2,"why":"<code>share.delivery.count.limit<\/code> is 5: the release on the fifth delivery archives the record. Other records keep flowing all along, because a share partition never blocks on one record, and nobody seeks: the broker tracks every record's state.","from":null},{"q":"A share consumer acquires two records and then stalls in a 40-second GC pause. The lock is 30 seconds. What happens?","options":["The records wait until the consumer's session times out, after 45 seconds","Another member gets them after 30 seconds with delivery count 2, and the stalled consumer's acknowledgements are refused","The group rebalances and the partition moves","Nothing until the consumer acknowledges them"],"answer":1,"why":"Each record's lock runs out on its own, after <code>share.record.lock.duration.ms<\/code>, and the record becomes available to any member. That needs no session timeout and no rebalance. The second acquisition raises the delivery count to 2, and the old holder no longer holds the lock.","from":null},{"q":"A team wants to scale the ledger consumer, which applies each account's payments in order, by moving it to a share group. What goes wrong?","options":["Nothing: share groups keep per-key order","Share groups can't read keyed records","The ledger would need more partitions","Two payments of one account can be processed at the same time by two members, in either order"],"answer":3,"why":"A share group promises each record to one member, not order. Records of one account can be on two members at once, and redeliveries come back later. Ordered work stays on a consumer group keyed by account; scale it with partitions chosen up front.","from":null},{"q":"Peak load in two years is 6,000 payments a second. One partition takes 10,000 a second from producers; one consumer instance processes 400 a second. How many partitions, at least?","options":["15","1","6","10"],"answer":0,"why":"Producers need 6,000 / 10,000, so 1 partition; consumers need 6,000 / 400 = 15, and a consumer group can't use more members than partitions. The larger number wins, so at least 15, and 16 gives a little room.","from":null}],"cards":[{"front":"Consumer group vs share group: who reads a partition?","back":"<p>Consumer group: exactly one member per partition. Share group: every member, with the broker handing out records one by one.<\/p>"},{"front":"The four states of a record in a share partition?","back":"<p>Available, acquired (locked to one consumer), acknowledged, archived.<\/p>"},{"front":"ACCEPT, RELEASE, REJECT, RENEW?","back":"<p>Done; give it back for another try; give up on it (archive); extend the lock.<\/p>"},{"front":"When is a share-group record archived without a REJECT?","back":"<p>When its delivery count reaches <code>share.delivery.count.limit<\/code> (5) and it is released again or its lock runs out.<\/p>"},{"front":"What does a share-group DLQ need in Kafka 4.4?","back":"<p><code>share.version<\/code> 2, the group config <code>errors.deadletterqueue.topic.name<\/code>, a topic named <code>dlq.*<\/code> with <code>errors.deadletterqueue.group.enable=true<\/code>.<\/p>"},{"front":"How do you read consumer lag?","back":"<p>Per partition: log end offset minus committed offset. Watch its growth and the age of the oldest record, per partition.<\/p>"},{"front":"Why does a Kotlin Flow over a consumer call <code>wakeup()<\/code> when the collector stops?","back":"<p><code>poll<\/code> blocks its thread; <code>wakeup()<\/code> is the only call another thread may make, and it ends a blocked <code>poll<\/code> at once.<\/p>"}],"terms":[{"term":"Share group","plain":"A group whose members all read every partition, with the broker handing out records one by one."},{"term":"Acquisition lock","plain":"The time-limited hold one share consumer has on a record it fetched (30 s by default)."},{"term":"Delivery count","plain":"How many times a record has been handed to a share consumer; at the limit (5) it is archived."},{"term":"Acknowledgement type","plain":"A share consumer's answer per record: ACCEPT, RELEASE, REJECT or RENEW."},{"term":"Share-partition start offset (SPSO)","plain":"The first offset a share group hasn't finished in a partition; everything before it is done."},{"term":"Consumer lag","plain":"Per partition, the log end offset minus the group's committed offset."},{"term":"Tiered storage","plain":"Keeping closed segments in object storage and only the newest on broker disks (KIP-405)."}],"remote":true},"redis-01":{"id":"redis-01","track":"redis","n":1,"title":"What Redis is and how it executes commands","ready":true,"minutes":40,"goal":"By the end you can explain how one Redis thread runs every command in turn, predict when one slow command stalls every other client, and connect to Redis from Java and Kotlin.","quiz":[{"q":"Fifty pods each call <code>INCR auths:today<\/code> 1,000 times on the same key, all at the same moment. No call times out or retries. What does the key hold at the end?","options":["Exactly 50,000","Less than 50,000, because some increments overlap","Exactly 50,000 only if <code>io-threads<\/code> is off","A different number on every run"],"answer":0,"why":"Each <code>INCR<\/code> reads, adds and writes inside one command, and the loop never runs two commands at once. I/O threads only move bytes; they never execute commands, so turning them on changes nothing here. Overlapping increments are a client-side bug (GET then SET), not something one <code>INCR<\/code> can suffer.","from":null},{"q":"Two pods debit the same balance at once with <code>String v = redis.get(\"balance:7\"); redis.set(\"balance:7\", String.valueOf(Long.parseLong(v) - 100));<\/code>. Each command is atomic. Is the debit safe?","options":["Yes, because each command is atomic","No: both pods can read the same balance before either writes, so one debit is lost","Yes, as long as both pods share one Jedis <code>RedisClient<\/code>","No, because the <code>GET<\/code> and the <code>SET<\/code> may go over two different pooled connections"],"answer":1,"why":"Atomic commands don't make a sequence of commands atomic. The loop can run the other pod's <code>GET<\/code> between your <code>GET<\/code> and your <code>SET<\/code>. Use one command that does the whole job (<code>DECRBY balance:7 100<\/code>), or a script or transaction (lesson 6). Which connection carries each command doesn't matter either: the gap is between two commands on the server, and sharing one client object or one connection doesn't close it.","from":null},{"q":"Your Redis p99 jumps from 1 ms to 900 ms for a few seconds every hour, for every key. During the spike one CPU core is at 100% and the others are idle. What do you check first?","options":["Turn on <code>io-threads 4<\/code> to use the idle cores","Raise the Jedis pool size so more requests are in flight","Look in <code>SLOWLOG GET<\/code> for one slow command that runs at that time","Switch the clients to RESP3 so replies parse faster"],"answer":2,"why":"Every key slowing down together, with one core pegged, is the signature of one long command holding the only execution thread. <code>SLOWLOG<\/code> names it. I/O threads and more connections can't help, because the bottleneck is command execution, and that stays on one thread.","from":null},{"q":"Which of these does Redis 8.10 do off the main thread with its default settings?","options":["Executing <code>GET<\/code> and <code>SET<\/code>","Running Lua scripts","Reading and parsing commands from client sockets","Freeing the memory of a big key deleted with <code>UNLINK<\/code>"],"answer":3,"why":"<code>UNLINK<\/code> hands the memory to the <code>bio_lazy_free<\/code> background thread. Commands and scripts always run on the main thread. Reading and parsing move to I/O threads only when you start the server with <code>io-threads<\/code> above 1, and the default is 1.","from":null},{"q":"A Lua script has been spinning for 6 seconds on a Redis with default settings. A client sends <code>GET payment:42<\/code>. What does that client get?","options":["A BUSY error at once, because the script is past the 5-second <code>busy-reply-threshold<\/code>","The value, as soon as the script finishes","The value at once, because reads skip the script queue","A connection reset"],"answer":0,"why":"After 5 seconds Redis starts answering other clients between script steps, but only with BUSY errors, so that someone can send <code>SCRIPT KILL<\/code> (or <code>SHUTDOWN NOSAVE<\/code> if the script has written). Before the 5-second mark the same GET would simply wait.","from":null}],"cards":[{"front":"How many threads execute commands in Redis 8?","back":"<p>One, the main thread. Background threads, a forked child and optional I/O threads do side work, never command execution.<\/p>"},{"front":"Why can fifty clients call <code>INCR<\/code> on one key without losing an update?","back":"<p>The event loop runs each command to completion before it starts the next, so no other command can run between INCR's read and its write.<\/p>"},{"front":"What does <code>io-threads 4<\/code> change?","back":"<p>Three extra threads, plus the main one, read sockets, parse commands and write replies. Commands still run one at a time on the main thread. You can set it only at start-up.<\/p>"},{"front":"What happens to other clients while a Lua script runs?","back":"<p>They wait. After <code>busy-reply-threshold<\/code> (5 s by default) they get BUSY errors until the script ends or someone runs <code>SCRIPT KILL<\/code>.<\/p>"},{"front":"How does a client switch its connection to RESP3?","back":"<p>It sends <code>HELLO 3<\/code>. Jedis 8 and Lettuce 7.9 both do this when they connect.<\/p>"},{"front":"What does Lettuce's Kotlin coroutines API need?","back":"<p><code>kotlinx-coroutines-core<\/code> and <code>kotlinx-coroutines-reactive<\/code> on the classpath, and an <code>@OptIn(ExperimentalLettuceCoroutinesApi::class)<\/code>.<\/p>"}],"terms":[{"term":"Event loop","plain":"A loop that waits for sockets with data, runs what arrived, and writes the replies. Redis's main thread is one."},{"term":"Atomic","plain":"Happens as one step. Other clients see it either not started or finished, never halfway."},{"term":"epoll","plain":"The Linux call a server uses to ask which of thousands of sockets have data, without one thread per socket."},{"term":"RESP","plain":"The Redis serialization protocol: length-prefixed strings, integers, arrays and errors. RESP3 adds maps, sets, a null and push messages."},{"term":"I/O threads","plain":"Optional threads (<code>io-threads<\/code>) that read, parse and write for the main thread. They never run commands."},{"term":"Connection pool","plain":"A set of open connections that calls borrow one at a time and give back. Jedis keeps at most 8 by default."},{"term":"Multiplexing","plain":"Many callers sharing one connection: commands go out back to back, and replies are matched to callers in order."},{"term":"Valkey","plain":"A BSD-licensed fork of Redis, run by the Linux Foundation."}],"remote":true},"redis-02":{"id":"redis-02","track":"redis","n":2,"title":"Core data types and their encodings","ready":true,"minutes":40,"goal":"By the end you can pick the right Redis type for a job in a payment service, predict when Redis switches a key from a compact encoding to a hash table or skip list, and build a leaderboard on a sorted set.","quiz":[{"q":"Each payment is a hash with 12 short fields. With Redis 8.10 defaults, how is one such key stored?","options":["As a listpack, because it is under 512 fields and every value is under 64 bytes","As a hash table, because every hash is a hash table","As 12 separate string keys","As a quicklist"],"answer":0,"why":"<code>hash-max-listpack-entries<\/code> is 512 and <code>hash-max-listpack-value<\/code> is 64 bytes, so a 12-field hash with short values stays a listpack. <code>TYPE<\/code> says <code>hash<\/code> either way; the encoding is an internal choice. Quicklist is the encoding of big lists.","from":null},{"q":"A sorted set grew to 200 BINs and was then trimmed to 50 with <code>ZREMRANGEBYRANK<\/code>. What does <code>OBJECT ENCODING<\/code> say now?","options":["<code>listpack<\/code>, because it is under 128 members again","<code>skiplist<\/code>","<code>intset<\/code>, because the BINs are numbers","It depends on the scores"],"answer":1,"why":"Conversion goes one way. Once a sorted set becomes a skip list, removing members never turns it back into a listpack. To keep a key compact, keep it under the limit from the start, as the worked example does. Intset is only for sets, never sorted sets.","from":null},{"q":"Merchants <code>m-a<\/code>, <code>m-b<\/code> and <code>m-c<\/code> all have score 10 in <code>board<\/code>. What does <code>ZRANGE board 0 -1 REV<\/code> return?","options":["<code>m-a<\/code>, <code>m-b<\/code>, <code>m-c<\/code>","The order in which they were added","<code>m-c<\/code>, <code>m-b<\/code>, <code>m-a<\/code>","A different order each time"],"answer":2,"why":"Equal scores are ordered by member, comparing bytes, so ascending is <code>m-a<\/code>, <code>m-b<\/code>, <code>m-c<\/code>. <code>REV<\/code> reverses the whole order, ties included. Insertion order is never used, and the order is deterministic.","from":null},{"q":"A nightly report runs <code>SMEMBERS fraud:flagged<\/code> on a set that has grown to 2 million members. What is the risk?","options":["None: <code>SMEMBERS<\/code> is a read, and reads never block anyone","Redis cuts the reply off at 1 million members","The set converts back to a listpack","Every other client of that Redis waits while the reply is built, for tens of milliseconds or more"],"answer":3,"why":"<code>SMEMBERS<\/code> is O(N) and runs on the one command thread, so it blocks everyone for as long as it takes. On the lab server one million members took about 54 ms. Read with <code>SSCAN<\/code> in pages instead, or split the set by day.","from":null},{"q":"From lesson 1: a thousand pods run <code>ZINCRBY merchants:approved 1 m-17<\/code> at the same moment. Why is no approval lost?","options":["Redis locks the key during each <code>ZINCRBY<\/code>","Each <code>ZINCRBY<\/code> runs to completion on the one command thread before the next command starts","Jedis queues the calls from all pods","Sorted sets update scores with atomic CPU instructions"],"answer":1,"why":"The event loop never runs two commands at once, so each <code>ZINCRBY<\/code> reads the score, adds and writes it with nobody in between. There is no lock to take. Jedis can't coordinate pods: each pod has its own client.","from":"redis-01"}],"cards":[{"front":"Which command shows how Redis stores a key internally?","back":"<p><code>OBJECT ENCODING key<\/code>. Answers include <code>listpack<\/code>, <code>intset<\/code>, <code>skiplist<\/code>, <code>hashtable<\/code>, <code>quicklist<\/code>, <code>int<\/code>, <code>embstr<\/code> and <code>raw<\/code>.<\/p>"},{"front":"When does a sorted set stop being a listpack (8.10 defaults)?","back":"<p>At its 129th member (<code>zset-max-listpack-entries 128<\/code>), or as soon as one member is longer than 64 bytes. It becomes a skiplist and never converts back.<\/p>"},{"front":"Default compact limits for hashes and for sets of integers?","back":"<p>Hashes: 512 fields with values up to 64 bytes stay a listpack. Sets of integers: up to 512 members stay an intset.<\/p>"},{"front":"How does Redis order members with equal scores?","back":"<p>By member, comparing bytes. Ascending with <code>ZRANGE<\/code>, descending with <code>ZRANGE ... REV<\/code>.<\/p>"},{"front":"What two structures hold a big sorted set?","back":"<p>A hash table from member to score (<code>ZSCORE<\/code> in O(1)) and a skip list in score order (<code>ZADD<\/code>, <code>ZRANK<\/code>, <code>ZRANGE<\/code> in O(log N)).<\/p>"},{"front":"Why <code>UNLINK<\/code> rather than <code>DEL<\/code> for a big key?","back":"<p><code>UNLINK<\/code> removes the key at once and frees the memory on a background thread. <code>DEL<\/code> frees it on the main thread, and every client waits.<\/p>"}],"terms":[{"term":"Encoding","plain":"How Redis lays a value out in memory, separate from its type. <code>OBJECT ENCODING<\/code> shows it."},{"term":"Listpack","plain":"One block of memory holding length-prefixed entries back to back. Compact, searched from the start, used for small hashes, sets, sorted sets and lists."},{"term":"Intset","plain":"A sorted array of integers, used for small sets that hold only integers."},{"term":"Skip list","plain":"A sorted linked list where some nodes have extra links that jump ahead, so search, insert and rank take O(log N)."},{"term":"Quicklist","plain":"A linked list of listpacks: the encoding Redis uses for big lists."},{"term":"Big key","plain":"A key so large that O(N) commands on it take milliseconds and stall the server."}],"remote":true},"redis-03":{"id":"redis-03","track":"redis","n":3,"title":"Bitmaps, HyperLogLog, geo and the Redis 8 built-ins","ready":true,"minutes":40,"goal":"By the end you can count active cards with bitmaps, count distinct cards in 12 KB with HyperLogLog and say how wrong it can be, find nearby terminals with a geo index, and say which Redis 8 built-ins are worth using.","quiz":[{"q":"Card ids in your system are random 64-bit numbers. Why is <code>SETBIT cards:active:day1 &lt;card id&gt; 1<\/code> a bad idea?","options":["A bitmap can't hold more than a million bits","The offset is a position: a huge id needs a huge string, and offsets stop at 2^32 - 1 anyway","<code>SETBIT<\/code> is O(N) in the number of set bits","Bitmaps are not saved to disk"],"answer":1,"why":"<code>SETBIT<\/code> grows the string to reach the offset, so the id is the size. Random 64-bit ids are mostly past the 2^32 - 1 limit, and the ones below it would still need up to 512 MB. Map each card to a dense index (0, 1, 2, ...) first. <code>SETBIT<\/code> itself is O(1), and bitmaps are strings, saved like any other key.","from":null},{"q":"A merchant's HyperLogLog for the day says 1,000,000 distinct cards. What should you expect the true count to be?","options":["Exactly 1,000,000","Anywhere from 900,000 to 1,100,000, all equally likely","Usually within about 1% of it: 0.81% is one standard error","Always below 1,000,000, because HyperLogLog only undercounts"],"answer":2,"why":"Redis's HyperLogLog has a standard error of 0.81%, so about two times in three the true count is within roughly 8,100 of the estimate, and it is rarely off by more than 2 to 3%. Errors go both ways: on the lab server 100,000 cards came out as 101,058.","from":null},{"q":"You keep one HyperLogLog per merchant per hour. How do you get distinct cards for the whole day?","options":["Add up the 24 <code>PFCOUNT<\/code> results","Take the biggest hourly count","You can't without keeping a set of card ids","<code>PFMERGE<\/code> the 24 keys into one (or <code>PFCOUNT<\/code> them together) and count that"],"answer":3,"why":"Merging keeps the maximum of each register, which is exactly the HyperLogLog of the union, so a card seen in several hours counts once. Adding the hourly counts counts that card once per hour. The biggest hour ignores every card that only paid in other hours.","from":null},{"q":"A Bloom filter of breached card fingerprints says \"no\" (<code>BF.EXISTS<\/code> returns 0) for a card. What do you know?","options":["The fingerprint was never added: the card is not on the list","The card is probably not on the list, about 99.9% sure","The card might be on the list; check the database","Nothing: a Bloom filter is approximate in both directions"],"answer":0,"why":"An added item always sets all its bits, so a 0 in any of them proves it was never added. Only \"yes\" can be wrong, at about the false positive rate you reserved. That asymmetry is the whole point: most checks end at Redis, and only the rare \"yes\" goes to the exact lookup.","from":null},{"q":"From lesson 2: why can <code>GEOSEARCH<\/code> on a geo index of 100,000 terminals answer without looking at every point?","options":["Redis keeps a separate spatial tree for each geo key","A geo key is a sorted set, so Redis reads a few score ranges through its skip list instead of every point","<code>GEOSEARCH<\/code> results are cached after the first call","Geo keys always stay listpacks, which are fast to scan"],"answer":1,"why":"Scores are geohashes, and nearby points mostly share score ranges. A sorted set past 128 members is a skip list, which finds the start of each range in O(log N) and reads M members from there. There is no separate tree, and a 100,000-member sorted set is far past the listpack limit.","from":"redis-02"}],"cards":[{"front":"How much memory does a bitmap for a million cards take, and why?","back":"<p>About 125,000 bytes: one bit per card index up to 999,999, however many bits are set.<\/p>"},{"front":"What does a HyperLogLog register store?","back":"<p>The longest run of zero bits (plus one) seen in the hashes that landed in that register. It only ever goes up.<\/p>"},{"front":"Size and error of a Redis HyperLogLog?","back":"<p>At most 12 KB (16,384 registers of 6 bits, plus a 16-byte header) and a standard error of 0.81%.<\/p>"},{"front":"What does <code>PFMERGE<\/code> compute?","back":"<p>The register-by-register maximum, which is exactly the HyperLogLog of the union of the inputs.<\/p>"},{"front":"What is a geo index underneath?","back":"<p>A sorted set. Each member's score is a 52-bit geohash of its longitude and latitude, so <code>ZREM<\/code> deletes a point.<\/p>"},{"front":"Which Bloom filter answer can you trust?","back":"<p>\"No\". If any of the item's bits is 0, it was never added. \"Yes\" is wrong at about the false positive rate you reserved.<\/p>"},{"front":"Which Redis version put JSON, Bloom, time series and the Query Engine in the core?","back":"<p>Redis 8.0. Before that they were separate modules, shipped as Redis Stack.<\/p>"}],"terms":[{"term":"Bitmap","plain":"A string treated as an array of bits, read and written with SETBIT, GETBIT, BITCOUNT and BITOP."},{"term":"Cardinality","plain":"The number of distinct elements in a collection."},{"term":"HyperLogLog","plain":"A fixed-size sketch that estimates cardinality from the longest runs of zero bits in hashed elements."},{"term":"Register","plain":"One small counter inside a HyperLogLog that keeps the highest rank (zero run plus one) it has seen. Redis has 16,384 of them, 6 bits each."},{"term":"Geohash","plain":"A number made by interleaving the bits of latitude and longitude, so nearby points get nearby numbers."},{"term":"Bloom filter","plain":"A bit array plus several hash functions that answers \"definitely not seen\" or \"probably seen\"."},{"term":"False positive","plain":"A \"yes\" that is wrong: the filter says it saw an item that was never added."}],"remote":true},"redis-04":{"id":"redis-04","track":"redis","n":4,"title":"Expiry, eviction and memory","ready":true,"minutes":40,"goal":"By the end you can say when an expired key really leaves memory, predict what a full Redis does under each eviction policy, and choose a TTL, a maxmemory and a policy for a payment service's Redis.","quiz":[{"q":"A key was set with <code>EX 60<\/code>. Thirty seconds later the service runs <code>SET payment:42:status settled<\/code> on it. What does <code>TTL payment:42:status<\/code> return now?","options":["About 30","60","-1","-2"],"answer":2,"why":"A plain <code>SET<\/code> replaces the value and removes the deadline, so the key no longer has a TTL and <code>TTL<\/code> returns -1. To keep the remaining 30 seconds, the service needed <code>SET ... KEEPTTL<\/code> (or <code>XX KEEPTTL<\/code>). -2 would mean the key doesn't exist, and 60 would need a new <code>EX 60<\/code>.","from":null},{"q":"A Redis has <code>maxmemory 1gb<\/code> and <code>maxmemory-policy volatile-lru<\/code>. It holds only rate-limit counters, none with a TTL, and memory is full. An <code>INCR<\/code> on a new counter arrives. What happens?","options":["Redis evicts the least recently used counter and runs the INCR","The INCR fails with an OOM error","Redis grows past 1 GB, because counters are small","Redis evicts a random counter, because no key has a TTL"],"answer":1,"why":"<code>volatile-*<\/code> policies only consider keys that have a TTL. With none, there is nothing they may evict, so the server behaves like <code>noeviction<\/code> and refuses the write. Redis never falls back to evicting keys without a TTL.","from":null},{"q":"Every night a report job reads every key of a 2-million-key cache once, with <code>SCAN<\/code> and <code>GET<\/code>. The cache runs <code>allkeys-lru<\/code>. What happens to the hot keys during the next morning's evictions?","options":["Nothing: LRU knows the hot keys are read thousands of times a day","The scan's reads don't update the LRU stamp, so nothing changes","Redis switches to LFU automatically while a scan runs","They become likely victims: the scan made millions of cold keys look as recent as the hot ones, or more recent"],"answer":3,"why":"LRU only knows when a key was last used, not how often. The scan stamps every key it reads, so hot keys lose their advantage, and a hot key last read before the scan finished can look older than cold keys the scan touched. <code>allkeys-lfu<\/code> resists this: one read adds at most one point to a counter that hot keys have far above.","from":null},{"q":"A Redis holding 4 GB of idempotency keys keeps <code>used_memory<\/code> just under <code>maxmemory 4gb<\/code>, but the container (limit 4.2 GB) gets killed with exit code 137 during a background save. Why?","options":["<code>maxmemory<\/code> limits what the allocator handed out; the kernel counts the process's real memory, which also includes fragmentation, buffers and the save's extra pages","<code>maxmemory<\/code> only applies to keys with a TTL","<code>noeviction<\/code> lets Redis grow past <code>maxmemory<\/code> during saves","Exit code 137 means Redis ran out of disk space"],"answer":0,"why":"Redis compares <code>maxmemory<\/code> with <code>used_memory<\/code>, the allocator's count. The kernel kills the process based on its resident memory (<code>used_memory_rss<\/code> and more), which adds fragmentation, replica and AOF buffers, and pages copied during a background save (lesson 10). Leave headroom between <code>maxmemory<\/code> and the container's limit. Exit code 137 means the process received SIGKILL, here from the out-of-memory killer.","from":null},{"q":"From lesson 1: 500,000 keys expire in the same second. Where does the work of deleting them happen, and what does a client's GET on an unrelated key see?","options":["On a background thread, so the GET is unaffected","On the main thread, in slices of at most 25 ms, so the GET can wait up to one slice","On the main thread, all at once, so the GET waits until all 500,000 are gone","In a forked child process, like a snapshot"],"answer":1,"why":"The active expiry cycle runs on the one thread that executes every command, between commands. It caps each run at 25% of the 100 ms tick, so other clients are served between the slices, but a GET that arrives during one waits for it. With the default <code>lazyfree-lazy-expire no<\/code>, the freeing happens on the main thread too.","from":"redis-01"}],"cards":[{"front":"What does a plain <code>SET<\/code> do to an existing key's TTL?","back":"<p>Removes it: the key lives forever. <code>SET ... KEEPTTL<\/code> (Redis 6.0) keeps the old deadline.<\/p>"},{"front":"What are Redis's two ways of expiring keys?","back":"<p>Lazy: every access checks the deadline and deletes an expired key. Active: a cycle checks 20 keys with a TTL at a time, 10 times a second.<\/p>"},{"front":"When does the active expiry cycle go again at once, and when does it stop?","back":"<p>It repeats while more than 10% of a batch had expired, and stops after 25 ms, a quarter of the 100 ms tick.<\/p>"},{"front":"What does a full Redis do under the default <code>noeviction<\/code>?","back":"<p>Refuses commands that add data with <code>OOM command not allowed when used memory &gt; 'maxmemory'<\/code>. Reads and deletes still work.<\/p>"},{"front":"How does Redis approximate LRU?","back":"<p>It samples <code>maxmemory-samples<\/code> keys (5) into a pool of 16 candidates and evicts the one idle longest, by a 24-bit, one-second stamp in each key.<\/p>"},{"front":"What does <code>volatile-lru<\/code> do when no key has a TTL?","back":"<p>Nothing: it behaves like <code>noeviction<\/code> and writes fail with an OOM error.<\/p>"},{"front":"LRU, LFU or LRM: which ignores reads?","back":"<p>LRM, least recently modified (Redis 8.6). It updates a key's stamp only on writes.<\/p>"}],"terms":[{"term":"TTL","plain":"Time to live: how long until a key's deadline. <code>TTL<\/code> returns -1 for no deadline and -2 for no key."},{"term":"Lazy expiry","plain":"Deleting an expired key when a command touches it, before the command runs."},{"term":"Active expiry","plain":"A cycle on the main thread that checks keys with a deadline and deletes the expired ones, 10 times a second."},{"term":"maxmemory","plain":"The memory limit Redis compares <code>used_memory<\/code> with before each write. 0, the default, means no limit."},{"term":"Eviction policy","plain":"What Redis does at <code>maxmemory<\/code>: refuse writes (<code>noeviction<\/code>) or delete keys chosen by LRU, LFU, LRM, TTL or at random."},{"term":"LRU","plain":"Least recently used: evict the key that has gone longest without a read or write."},{"term":"LFU","plain":"Least frequently used: evict the key with the lowest access counter, a logarithmic 8-bit count that decays over time."},{"term":"Eviction pool","plain":"Redis's list of the 16 best eviction candidates seen so far, kept across evictions."}],"remote":true},"redis-05":{"id":"redis-05","track":"redis","n":5,"title":"Caching patterns and stampedes","ready":true,"minutes":40,"goal":"By the end you can put a cache-aside Redis in front of a slow database, keep it from serving stale or missing data for long, and stop a hot key's expiry from turning into a hundred identical database queries.","quiz":[{"q":"Hits take 0.3 ms and misses 120 ms. A new deploy drops the hit ratio from 99% to 95%. What happens to the average read latency?","options":["It barely moves: 95% is still a good hit ratio","It roughly quadruples, from about 1.5 ms to about 6.3 ms","It rises by 4%","It doubles, from 0.3 ms to 0.6 ms"],"answer":1,"why":"Average = hit ratio × 0.3 + miss ratio × 120. At 99%: 0.297 + 1.2 ≈ 1.5 ms. At 95%: 0.285 + 6 ≈ 6.3 ms. The misses dominate the average, so a few points of hit ratio near the top change latency by a factor of four.","from":null},{"q":"A service renames a merchant. In which order should it touch Oracle and Redis?","options":["DEL the key, then commit the UPDATE","Commit the UPDATE, then SET the new row in Redis","Commit the UPDATE, then DEL the key","SET the new row in Redis, then commit the UPDATE"],"answer":2,"why":"Delete after the commit: the next reader then loads the committed row. Deleting first leaves a window where a reader reloads the old row and caches it again. Setting the new row loses races between two writers whose SETs reach Redis in the opposite order from their commits, and setting before the commit caches a row that may never be committed.","from":null},{"q":"A partner sends authorizations for the same 50 unknown merchant ids, each 100 times a second. You add negative caching with a 60-second TTL. About how many database queries a minute do these lookups cost now?","options":["About 50","About 300,000","About 5,000","0"],"answer":0,"why":"Each unknown id misses once, finds nothing, and stores the marker for 60 seconds, so each id costs about one query a minute: 50 in total, against 300,000 without the marker. It is not zero, because markers expire, and that is on purpose: a merchant created later must show up. Negative caching wouldn't help much if the ids were random and never repeated.","from":null},{"q":"Each of 20 pods uses a correct in-process single-flight in front of the database. A hot key expires and every pod gets 100 concurrent misses. How many database queries for that row?","options":["2,000","100","1","20"],"answer":3,"why":"Single-flight collapses misses inside one JVM, so each pod sends exactly one query: 20 in total instead of 2,000. To get down to one across pods, the pods must coordinate through something shared, such as <code>SET lock:&lt;key&gt; &lt;token&gt; NX PX<\/code> in Redis.","from":null},{"q":"From lesson 4: a deploy loaded 50,000 merchant profiles in one minute, all with <code>EX 3600<\/code>. An hour later, besides the database load from the misses, what extra work lands on Redis in that minute?","options":["None: expired keys are deleted by a background thread","Its active expiry cycle deletes 50,000 keys on the main thread, in slices of up to 25 ms, while clients are being served","Redis evicts 50,000 other keys to make room for the reloads","Redis blocks all clients until the 50,000 keys are gone"],"answer":1,"why":"Keys with the same deadline expire together, and the active cycle removes them on the one thread that also runs commands, taking up to 25 ms of every 100 ms until they are gone. Clients are served between those slices, so latency rises without stopping. Jitter spreads both the misses and this deletion work.","from":"redis-04"}],"cards":[{"front":"What are the three steps of cache-aside?","back":"<p>GET the key; on a miss load from the database; SET it with a TTL and return it.<\/p>"},{"front":"After a database write, what do you do to the cached copy, and when?","back":"<p>DEL it, after the commit. Updating it with SET loses races between writers; deleting before the commit lets a reader re-cache the old row.<\/p>"},{"front":"Why add jitter to TTLs?","back":"<p>Keys loaded together would expire together, and every one of them misses in the same minute. A random ±10% spreads the misses and the expiry work.<\/p>"},{"front":"What is negative caching?","back":"<p>Caching \"not found\" as a marker with a short TTL, so repeated lookups for missing ids stop at Redis.<\/p>"},{"front":"What does single-flight do?","back":"<p>Collapses concurrent loads of one key inside one JVM into one call; the other callers wait for its result.<\/p>"},{"front":"How do you stop a stampede across pods?","back":"<p>One pod wins <code>SET lock:&lt;key&gt; &lt;token&gt; NX PX &lt;ms&gt;<\/code> and loads; the others poll the cache briefly, then load themselves if it never appears.<\/p>"}],"terms":[{"term":"Cache-aside","plain":"The application reads the cache first and, on a miss, loads from the database and writes the cache itself."},{"term":"Hit ratio","plain":"The share of reads the cache answers. 99% vs 95% can mean 1.5 ms vs 6.3 ms on average."},{"term":"Invalidation","plain":"Removing a cached copy after the source changes, so the next read loads the new value."},{"term":"TTL jitter","plain":"A random spread added to each TTL so that keys written together don't expire together."},{"term":"Negative caching","plain":"Caching the fact that something doesn't exist, with a short TTL."},{"term":"Cache stampede","plain":"Many requests missing the same key at once and all loading it from the database."},{"term":"Single-flight","plain":"Letting one caller load a key while concurrent callers wait for its result."}],"remote":true},"redis-06":{"id":"redis-06","track":"redis","n":6,"title":"Atomicity: transactions, Lua and pipelining","ready":true,"minutes":40,"goal":"By the end you can say which of MULTI/EXEC, WATCH, a Lua script and a pipeline makes a sequence of Redis commands safe, which only makes it fast, and write a transfer that never loses or creates money.","quiz":[{"q":"Pod A runs <code>WATCH balance:7<\/code>, then <code>GET balance:7<\/code> (100). Before A's EXEC, another client runs <code>SET balance:7 100<\/code>, writing the same value again. A then sends <code>MULTI<\/code>, <code>SET balance:7 70<\/code>, <code>EXEC<\/code>. What does A get?","options":["<code>(nil)<\/code>: any write to a watched key aborts EXEC, even of the same value","<code>1) OK<\/code>: the value didn't change, so the watch still holds","An error: two clients can't watch the same key","<code>1) OK<\/code>, but only if both clients use the same connection pool"],"answer":0,"why":"WATCH doesn't compare values. Every write command to the key marks every connection watching it as dirty, and EXEC on a dirty connection aborts. A plain GET by another client would not have aborted it. If you want to compare values instead, Redis 8.4's <code>SET ... IFEQ<\/code> does exactly that.","from":null},{"q":"A Kafka consumer pipelines <code>DECRBY acct:a 3000<\/code> and <code>INCRBY acct:b 3000<\/code> for each transfer event. A reporting job reads both keys with <code>MGET<\/code> now and then. Can it see 3,000 cents missing from both accounts?","options":["No: commands in one pipeline run back to back","No: pipelines are wrapped in MULTI automatically","Yes: other clients' commands can run between pipelined commands","Only if the pipeline has more than 10,000 commands"],"answer":2,"why":"A pipeline only saves round trips. Redis reads pipelined commands in chunks and serves other clients between them, so an MGET can land between the DECRBY and the INCRBY. Wrap each pair in MULTI/EXEC, or use a transfer script, if readers must never see the money in flight.","from":null},{"q":"After a failover to the replica, every call of your transfer fails with <code>NOSCRIPT No matching script<\/code>. What went wrong, and what is the fix?","options":["The replica runs an older Lua version; upgrade it","EVALSHA is disabled on replicas; send the script to the old primary","The SHA1 digest changes after a failover; compute it again from the server","The script cache isn't persisted or replicated; catch NOSCRIPT, load the script again (or use EVAL) and retry, or install it as a function"],"answer":3,"why":"EVALSHA only works if this server has the script in its cache, and a restart, a failover or SCRIPT FLUSH empties it. Clients must handle NOSCRIPT by loading the script again. The digest of the same text never changes. Functions loaded with FUNCTION LOAD are saved and replicated, so they survive failovers.","from":null},{"q":"50 pods debit the same hot wallet key about 2,000 times a second with a WATCH/MULTI/EXEC retry loop, and p99 latency is climbing. What is the best change?","options":["Raise the connection pool size so more attempts run in parallel","Add a random sleep before each retry and keep WATCH","Move the read-test-write into a Lua script (or INCREX on Redis 8.8) so there is nothing to retry","Wrap each attempt in a pipeline"],"answer":2,"why":"WATCH is optimistic: on a hot key most attempts lose and each lost attempt costs several round trips, and more parallel attempts only make more of them lose. A script runs the whole decision as one command, so it never conflicts and never retries. A pipeline doesn't change the conflict, and backoff only trades retries for waiting.","from":null},{"q":"From lesson 1: a Lua transfer script is atomic. Why is a script that loops over a 2-million-member set to compute a balance a bad idea?","options":["Lua scripts can't read sets","It runs on the one thread that executes every command, so every client waits until it finishes","Redis kills any script after 5 seconds","Scripts run on a background thread and see stale data"],"answer":1,"why":"Atomic and blocking are the same fact: nothing else runs while the script runs. A loop over 2 million members takes long enough that every client, whatever key it wants, waits behind it. After 5 seconds (<code>busy-reply-threshold<\/code>) other clients start getting BUSY errors, but Redis does not kill the script; you would have to send SCRIPT KILL.","from":"redis-01"}],"cards":[{"front":"What does EXEC do when one queued command fails at run time?","back":"<p>Runs all the others and returns an error in that command's slot. Redis never rolls back.<\/p>"},{"front":"When does a whole transaction fail with EXECABORT?","back":"<p>When a command was rejected while queuing (bad syntax, wrong number of arguments). Then nothing runs.<\/p>"},{"front":"What makes a WATCHed EXEC return nil?","back":"<p>Any write to a watched key by any client after the WATCH, even writing the same value. The client should read again and retry.<\/p>"},{"front":"Why must WATCH, MULTI and EXEC use one connection?","back":"<p>WATCH state belongs to the connection. In Jedis, <code>redis.transaction(false)<\/code> pins one pooled connection; with Lettuce, use a dedicated connection.<\/p>"},{"front":"When does EVALSHA fail with NOSCRIPT, and what should the client do?","back":"<p>When the server's script cache is empty (restart, failover, SCRIPT FLUSH). Load the script again and retry.<\/p>"},{"front":"Is a pipeline atomic?","back":"<p>No. It saves round trips and syscalls; other clients' commands can run between pipelined commands.<\/p>"},{"front":"Which Redis 8 commands do single-key check-and-set in one step?","back":"<p><code>SET key new IFEQ old<\/code> (8.4) and <code>INCREX key BYINT n LBOUND/UBOUND<\/code> (8.8).<\/p>"}],"terms":[{"term":"Lost update","plain":"Two clients read the same value and both write; the second write silently replaces the first."},{"term":"MULTI/EXEC","plain":"Queue commands after MULTI, then run them all with nothing in between at EXEC. No rollback."},{"term":"WATCH","plain":"Makes the next EXEC on this connection abort if any watched key was written in the meantime."},{"term":"Optimistic locking","plain":"Read without locking, then write only if nothing changed since, and retry if it did."},{"term":"EVALSHA","plain":"Runs a cached Lua script by its SHA1 digest instead of sending the source again."},{"term":"Redis function","plain":"A Lua function installed with FUNCTION LOAD and called with FCALL; saved and replicated with the data."},{"term":"Pipelining","plain":"Sending many commands without waiting for each reply, then reading all the replies."}],"remote":true},"redis-07":{"id":"redis-07","track":"redis","n":7,"title":"Rate limiting and idempotency keys","ready":true,"minutes":40,"goal":"By the end you can build a per-card rate limit that survives a crashed pod and a minute boundary, and an idempotency-key store that turns a retried payment into a replay of the first answer.","quiz":[{"q":"A token bucket holds at most 10 tokens and gains one every 500 ms. A merchant's client was idle for 10 minutes, then sends 30 requests at once. How many get through?","options":["10","30: it earned 1,200 tokens while it was idle","2: the rate is 2 per second","None: its key expired, so Redis doesn't know the client"],"answer":0,"why":"Tokens stop piling up at the capacity, so ten quiet minutes buy at most 10. That cap is what lets a bucket allow a burst without letting a quiet client save up an unlimited one. An expired key means a new, full bucket, not an empty one.","from":null},{"q":"A client pays 12.50 euros with key k-7f3a and gets <code>approved<\/code>. Later, because of a bug, it sends a 40-euro payment with the same key. The record stores a hash of the body. What should the client get?","options":["The stored 12.50 response, because the key matches","A new 40-euro charge, because the body is different","422: the key was already used for a different request","409: the key is busy"],"answer":2,"why":"The key says \"this is the same request\", and a different body breaks that promise, so the server refuses it; the IETF draft asks for 422. Replaying the stored response is the dangerous option: the client would believe the 40 euros were approved when nothing was charged. 409 is for a key whose first request is still running.","from":null},{"q":"You drop <code>ENX<\/code> and send <code>INCREX rl:card:7 BYINT 1 UBOUND 5 EX 60<\/code> for each attempt. What changes?","options":["Nothing: EX only applies when the key is created","Every admitted attempt restarts the 60 seconds, so the window ends 60 s after the last admitted attempt instead of the first","Refused attempts restart the 60 seconds too, so a card that keeps trying is blocked forever","The key gets no TTL at all"],"answer":1,"why":"Without ENX, INCREX sets the TTL whenever it applies an increment. On the lab server a refused call (applied increment 0) left the TTL alone, so the card isn't blocked forever, but its window stretches with every admitted attempt. ENX sets the deadline once, on the attempt that opened the window.","from":null},{"q":"From lesson 6: why can't the sliding window be a MULTI/EXEC block of ZREMRANGEBYSCORE, ZCARD and ZADD?","options":["MULTI doesn't accept sorted-set commands","Queued commands only run at EXEC, so your code can't look at ZCARD's answer to decide whether to send the ZADD","EXEC rolls the ZADD back when the limit is reached","It works, but it is slower than a script"],"answer":1,"why":"Inside MULTI every command answers QUEUED, and ZCARD's real result arrives with all the others after EXEC, when the ZADD has already run. A transaction makes a batch atomic; it can't branch on a read. A script reads, decides and writes inside one command. And EXEC never rolls anything back.","from":"redis-06"},{"q":"Pod A claims k-7f3a (PENDING, 30-second TTL), charges the card, and is OOM-killed before it writes DONE. The client retries 45 seconds later. What happens, and what closes the gap?","options":["The retry gets 409 forever; lower the PENDING TTL","The retry gets the stored response, because Redis saved it with the PENDING value","The PENDING has expired, so the retry charges again; pass the same key to the payment provider, or record it in the payment's database transaction","Redis keeps the PENDING until pod A restarts and finishes the request"],"answer":2,"why":"After 30 seconds the PENDING is gone, the retry claims a fresh key and charges again. Redis can't know the charge happened; only the system that moved the money can. An idempotency key on the provider's API, or the record written in the same transaction as the payment, closes the gap. A longer PENDING TTL only delays the retry.","from":null}],"cards":[{"front":"Why is INCR followed by a separate EXPIRE unsafe for a rate limit?","back":"<p>If the client dies between them, the key has no TTL, no later request sets one, and the counter never resets. Use one Lua script, or <code>INCREX ... EX 60 ENX<\/code> on Redis 8.8.<\/p>"},{"front":"What does ENX do in INCREX?","back":"<p>Sets the TTL only if the key has none, so later increments don't push the end of the window out.<\/p>"},{"front":"What is the weakness of a fixed window?","back":"<p>Its seam: up to twice the limit can pass across a boundary, such as 5 at 0:59 and 5 at 1:00.<\/p>"},{"front":"How is a sliding-window log stored in Redis?","back":"<p>A sorted set per subject: score = time in ms, member = a unique request id. One script runs ZREMRANGEBYSCORE, ZCARD, then ZADD and PEXPIRE.<\/p>"},{"front":"What does a token bucket store per client?","back":"<p>Two numbers: tokens left and the last refill time. Refill = min(capacity, tokens + earned since then).<\/p>"},{"front":"What does <code>SET key value NX GET<\/code> return?","back":"<p>Nil if the key was free (and it now holds your value); otherwise the existing value, which it leaves unchanged. One command, Redis 7.0+.<\/p>"},{"front":"Why does a PENDING idempotency record carry a random token?","back":"<p>So that only the attempt that owns it can turn it into DONE (<code>SET ... IFEQ &lt;my pending&gt;<\/code>), and a stale attempt whose PENDING expired changes nothing.<\/p>"}],"terms":[{"term":"Fixed window","plain":"A counter per subject that starts over every N seconds. Up to twice the limit can pass across a boundary."},{"term":"Sliding window log","plain":"One timestamped entry per admitted request; the limit applies to the entries in the last N seconds."},{"term":"Token bucket","plain":"Up to C tokens, refilled at a fixed rate; each request spends one. Allows a burst of C, then the rate."},{"term":"Idempotency key","plain":"An id the client chooses and sends with every attempt of one request, so the server can recognize retries."},{"term":"Request fingerprint","plain":"A hash of the request body stored with the key, to catch a key reused for a different request."},{"term":"Owner token","plain":"A random value in the PENDING record that names the attempt allowed to finish it."},{"term":"INCREX","plain":"Redis 8.8 increment with bounds and expiry in one command. Replies with the new value and the increment it applied."}],"remote":true},"redis-08":{"id":"redis-08","track":"redis","n":8,"title":"Distributed locks, honestly","ready":true,"minutes":40,"goal":"By the end you can take and release a Redis lock that never deletes another client's, explain what a lease can't protect against, and add fencing tokens so a paused holder can't corrupt the data it guards.","quiz":[{"q":"Pod A releases its lock with <code>if (token.equals(redis.get(key))) redis.del(key);<\/code>. Why is that still unsafe?","options":["GET returns a cached copy, not the live value","DEL fails on a key that has a TTL","A pause between the GET and the DEL lets the lease expire and another pod take the lock, and the DEL then deletes that pod's lock","It is safe: the token check proves the lock is A's"],"answer":2,"why":"The check and the delete are two commands, and anything can happen between them: a GC pause, a slow network. The token check was true when it ran and false by the time DEL arrived. A Lua script or <code>DELEX key IFEQ token<\/code> does the compare and the delete inside one command, where nothing can run in between.","from":null},{"q":"From lesson 4: the lock's Redis runs <code>maxmemory-policy allkeys-lru<\/code> and fills up. The fence counter <code>fence:{settle}<\/code> hasn't been touched for a day and is evicted. What happens at the next acquire?","options":["INCR starts again from 0 and returns 1, so the store, which has seen 34, refuses every write from now on","INCR fails with an error because the key is gone","Nothing: Redis never evicts keys that have no TTL","The lock can't be acquired until someone restores the key"],"answer":0,"why":"INCR on a missing key starts from 0 (lesson 1), so the next holder gets 1. The store refuses any fence below 34, so every future batch fails: safe, but stuck until someone fixes the counter. The allkeys policies can evict any key; only the volatile policies limit themselves to keys with a TTL. A fence counter needs a Redis that never evicts it.","from":"redis-04"},{"q":"You take a Redisson lock with <code>lock.lock()<\/code> (watchdog, 30-second timeout). The holder's JVM then stops for 45 seconds in a full GC. What happens?","options":["The watchdog keeps renewing during the pause, so the lock stays safe","The watchdog's thread stops too, the lease ends after about 30 seconds, and another pod can take the lock while the holder still believes it has it","Redisson notices the pause and rolls back the holder's writes","The lock is held until the JVM exits"],"answer":1,"why":"A stop-the-world pause stops every thread in the JVM, the watchdog included. Redis expires the lease on schedule, another pod acquires, and when the pause ends the first holder carries on. The watchdog protects against slow work, not against a stopped process. That case needs a fencing check at the resource.","from":null},{"q":"Which of these needs fencing tokens or another check at the resource, not just a Redis lock?","options":["Only one pod refreshes a cached exchange-rate table each minute","Two pods shouldn't recompute the same merchant report at the same time","Only one request should load a hot merchant into the cache (stampede protection)","The payout file for a batch must be sent to the bank exactly once"],"answer":3,"why":"In the first three a rare double run wastes some work and nothing else: those locks are for efficiency, and a single Redis key with a token is enough. Sending a payout file twice pays merchants twice. That is a correctness lock, so the resource must refuse the second run: a fencing token it checks, or a unique constraint on the batch id.","from":null},{"q":"A team runs Redlock on five Redis masters to protect a ledger update and skips fencing, because \"a majority makes it safe\". What is the strongest objection?","options":["Five masters are too slow for payment traffic","A holder can still pause after acquiring and write after its lease ended, and Redlock's random value has no order, so the ledger can't tell the stale write from the current one","Redlock needs replication between the five masters, and replication is asynchronous","Redlock only works with Redis Cluster"],"answer":1,"why":"A majority protects the acquire against one server failing. It can't stop a holder that paused after it got the lock, which is the same failure a single server has. Without an ordered token the ledger has nothing to compare. Redlock deliberately uses independent masters with no replication, and works without Cluster.","from":null}],"cards":[{"front":"Why must the PX be inside the SET that takes a lock?","back":"<p>So that a crashed holder's lock expires. SETNX followed by EXPIRE can leave a lock with no TTL, held forever.<\/p>"},{"front":"Why does every acquire store a fresh random token?","back":"<p>So release and extend can check that the lock is still theirs. A pod name repeats; a UUID per acquire doesn't.<\/p>"},{"front":"What is compare-and-delete on Redis 8.4+, and before?","back":"<p><code>DELEX key IFEQ token<\/code>. Before 8.4, a Lua script: if GET equals the token then DEL, else return 0.<\/p>"},{"front":"What does Redisson's lock watchdog do, and what can't it handle?","back":"<p>It keeps extending a lock taken without a lease time (<code>lockWatchdogTimeout<\/code>, 30 s default) while the client runs. It can't help when the whole JVM pauses: it stops too.<\/p>"},{"front":"What is a fencing token?","back":"<p>A number that grows with every lock acquisition and travels with every write. The resource refuses a write whose number is lower than the highest it has accepted.<\/p>"},{"front":"Efficiency lock or correctness lock?","back":"<p>Efficiency: a double run only wastes work, so one Redis key is fine. Correctness: a double run corrupts data or moves money twice, so the resource must enforce it.<\/p>"},{"front":"Redlock in one sentence?","back":"<p>SET NX PX on 5 independent masters; the lock is held if at least 3 succeed within the TTL. Whether it is safe for correctness is disputed.<\/p>"}],"terms":[{"term":"Lease","plain":"A lock with a deadline: held until released or until the time runs out, whichever comes first."},{"term":"Lock token","plain":"A random value stored in the lock key by the holder, so only the holder can release or extend it."},{"term":"Compare-and-delete","plain":"Delete a key only if it still holds an expected value, in one command (<code>DELEX ... IFEQ<\/code> or a Lua script)."},{"term":"Lock watchdog","plain":"A background task that keeps extending a lock's lease while its holder is alive (Redisson's name for it)."},{"term":"Stop-the-world pause","plain":"A pause in which every thread of a JVM stops, for example during a full garbage collection."},{"term":"Fencing token","plain":"A number that grows with each lock holder; the protected resource refuses writes carrying a lower number."},{"term":"Redlock","plain":"A lock algorithm that takes the same lock on a majority of N independent Redis masters."}],"remote":true},"redis-09":{"id":"redis-09","track":"redis","n":9,"title":"Messaging: pub/sub and Streams","ready":true,"minutes":40,"goal":"By the end you can say when pub/sub's at-most-once delivery is good enough, and build a Streams consumer group that settles every payment at least once, even when a worker crashes halfway through a batch.","quiz":[{"q":"<code>PUBLISH payments:status \"p-990 approved\"<\/code> returns <code>(integer) 0<\/code>. What does that tell you?","options":["The message is queued until a subscriber connects","Nobody was subscribed at that moment, so the message went nowhere","The channel doesn't exist yet and has to be created first","Redis refused the message because a subscriber's output buffer is full"],"answer":1,"why":"PUBLISH returns how many subscribers received the message, and 0 means none were connected. Channels are never created or stored, and nothing is queued: the message is gone. That return value is the only feedback pub/sub gives you.","from":null},{"q":"Worker w1 reads 10 entries with <code>XREADGROUP ... &gt;<\/code>, settles and acknowledges 7, and is killed. A new w1 starts with the same consumer name and runs <code>XREADGROUP GROUP settlers w1 STREAMS payments 0<\/code>. What does it get?","options":["The 3 unacknowledged entries, and their delivery count goes up to 2","Nothing: entries delivered before a restart are lost","All 10 entries again, because w1 is a new connection","An error, because a consumer named w1 already exists"],"answer":0,"why":"The PEL belongs to the group and records the consumer by name, not by connection, so the 3 entries are still pending under w1. Reading with an ID instead of <code>&gt;<\/code> returns this consumer's pending entries and counts another delivery. The 7 acknowledged ones left the PEL for good.","from":null},{"q":"Your recovery loop runs <code>XAUTOCLAIM<\/code> with a min-idle-time of 2 seconds, but settling a payment sometimes takes 5 seconds at the issuer. What happens?","options":["Nothing: XAUTOCLAIM never takes an entry from a consumer that is still connected","XAUTOCLAIM waits until the first worker has finished","Slow entries are claimed while the first worker is still settling them, so some payments are settled twice","The slow entries are removed from the PEL"],"answer":2,"why":"Redis doesn't know whether a consumer is alive or working; it only knows how long an entry has been idle since its last delivery. After 2 seconds a slow entry looks abandoned and is handed to another worker. Set the threshold above your slowest legitimate settlement, and keep the handler idempotent for the cases it still misses.","from":null},{"q":"From lesson 7: a consumer group gives at-least-once delivery. What makes a second settlement of payment p-981 harmless?","options":["Acknowledging the entry twice","Reading with <code>NOACK<\/code> so entries are never redelivered","Trimming the stream right after each read","Settling through an idempotency key on the payment id, so the second run finds DONE and changes nothing"],"answer":3,"why":"A second delivery happens when a worker settles and dies before XACK, and Redis can't prevent it. The handler has to: claim <code>settle:p-981<\/code> with <code>SET ... NX GET<\/code> before the work and store DONE after it, as in lesson 7. NOACK swaps duplicates for losses (at-most-once), and trimming doesn't change who already has the entry.","from":"redis-07"},{"q":"<code>XPENDING payments settlers - + 10<\/code> shows one entry with a delivery count of 47. What is the most likely cause, and the fix?","options":["47 workers are in the group; reduce them","It is a poison message that fails every worker; move it to a dead-letter stream and XACK it","Redis delivered it 47 times by mistake; restart Redis","The entry is too large; raise MAXLEN"],"answer":1,"why":"Every claim adds one to the count, so 47 means it has been claimed and failed again and again. Left alone it keeps failing and keeps wasting a worker every few seconds. Past a limit, copy it to a dead-letter stream for a person, acknowledge it, and alert on it. On Redis 8.8, <code>XNACK ... FATAL<\/code> lets the failing worker mark it at once.","from":null}],"cards":[{"front":"What delivery guarantee does Redis pub/sub give?","back":"<p>At-most-once: a message reaches the subscribers connected at that moment, is never stored and never redelivered.<\/p>"},{"front":"What does a stream entry ID mean?","back":"<p><code>&lt;milliseconds&gt;-&lt;sequence&gt;<\/code>, assigned by <code>XADD *<\/code>. IDs always grow, even if the server's clock goes back.<\/p>"},{"front":"XREADGROUP with <code>&gt;<\/code> versus <code>0<\/code>?","back":"<p><code>&gt;<\/code>: entries never delivered to anyone in the group. <code>0<\/code>: this consumer's own pending entries, whose delivery count goes up.<\/p>"},{"front":"What is the PEL?","back":"<p>A consumer group's pending entries list: every delivered, unacknowledged entry with its owner, idle time and delivery count. XACK removes an entry.<\/p>"},{"front":"What does XAUTOCLAIM do?","back":"<p>Scans the PEL from a cursor and gives entries idle for at least min-idle-time to this consumer, adding one to their delivery count. Repeat until the cursor is 0-0.<\/p>"},{"front":"How do you handle a poison message?","back":"<p>Spot it by its rising delivery count; past a limit, copy it to a dead-letter stream and XACK it, in one transaction.<\/p>"},{"front":"What does <code>XADD ... IDMP &lt;producer&gt; &lt;id&gt;<\/code> do (Redis 8.6)?","back":"<p>Dedupes a producer's retries: the same producer and id within the window returns the original entry's ID instead of adding another.<\/p>"}],"terms":[{"term":"Pub/sub channel","plain":"A name that messages are published to; Redis pushes each message to the connections subscribed at that moment and keeps nothing."},{"term":"At-most-once","plain":"Each message is delivered once or not at all; losses are possible, duplicates are not."},{"term":"At-least-once","plain":"Each message is delivered until it is acknowledged; nothing is lost, and duplicates are possible."},{"term":"Stream","plain":"A Redis key holding an append-only log of entries, each with an ID and field-value pairs."},{"term":"Consumer group","plain":"A named reader of a stream that hands each new entry to one of its consumers and tracks what each has acknowledged."},{"term":"Pending entries list (PEL)","plain":"The group's record of delivered but unacknowledged entries, with owner, idle time and delivery count."},{"term":"Poison message","plain":"An entry that makes every consumer fail, so it is redelivered forever unless something moves it aside."},{"term":"Dead-letter stream","plain":"A separate stream where entries that failed too many times are copied for a person to inspect."}],"remote":true},"redis-10":{"id":"redis-10","track":"redis","n":10,"title":"Persistence and replication","ready":true,"minutes":40,"goal":"By the end you can say what each persistence setting loses when the Redis process dies and when the whole machine dies, explain how a replica catches up after a break, and choose RDB, AOF, replication and Sentinel for a payment service's Redis.","quiz":[{"q":"A Redis with the default save points and no AOF takes 50 writes a minute. The process is killed with kill -9. What is the most it can lose?","options":["Nothing: RDB is on by default","About the last second of writes","About 5 minutes of writes, around 250 payments","Up to an hour of writes"],"answer":2,"why":"At 50 writes a minute, the first rule to fire is <code>300 100<\/code>: 300 seconds have passed and at least 100 keys changed (250 have). So a snapshot happens every 5 minutes, and a crash just before the next one loses about 250 writes. The <code>3600 1<\/code> rule matters only on a quieter server, and the one-second figure belongs to the AOF with everysec on a machine crash.","from":null},{"q":"The VM running Redis loses power. Redis had <code>appendonly yes<\/code> and <code>appendfsync everysec<\/code>. What is lost?","options":["About the last second of acknowledged writes: the ones still in the kernel's page cache","Nothing: every write was in the append-only file","Everything written since the last AOF rewrite","Only writes that were never acknowledged"],"answer":0,"why":"Each write reached the kernel with <code>write()<\/code> before its reply, but the page cache lives in RAM, and a power cut empties it. Only what the background thread had fsynced survives: everything up to about a second ago. A rewrite doesn't change that, because the base and increment files together hold every fsynced write. \"Nothing lost\" is true for a process crash, not for a machine crash.","from":null},{"q":"A replica was cut off for 3 minutes. The primary writes about 2 MB of replication stream per second, and <code>repl-backlog-size<\/code> is the default. What happens when the replica reconnects?","options":["A partial resync with the last 1 MB, and the rest of the gap is skipped","A full resync: the backlog holds 1 MB of a 360 MB gap, so the primary forks and sends a whole snapshot","The replica stays disconnected until an operator runs REPLICAOF","A partial resync, because the replication ID still matches"],"answer":1,"why":"A partial resync needs both conditions: the ID must match and every missing byte must still be in the backlog. 3 minutes at 2 MB/s is about 360 MB, and the backlog keeps 1 MB, so Redis starts over with a snapshot: a fork on the primary and the whole dataset over the network. A backlog of about 400 MB would have made it partial. Redis never applies half of a gap, because the replica would silently differ from its primary.","from":null},{"q":"Your service sends <code>SET payment:42 settled<\/code> and then <code>WAIT 1 500<\/code> on the same connection. WAIT returns 0 after 500 ms. What is true?","options":["The SET was rolled back, because no replica confirmed it","The SET is queued and runs once a replica is available","The primary now refuses writes until a replica returns","The SET is applied on the primary and visible to every client; no replica has confirmed it yet"],"answer":3,"why":"WAIT only counts. The write was applied and acknowledged before WAIT ran, and nothing undoes it: in the lab the payment was still readable on the primary after WAIT returned 0. Refusing writes is a different feature, <code>min-replicas-to-write<\/code>, and it applies to later writes. Treat 0 as \"not confirmed\": alert, or WAIT again.","from":null},{"q":"A read-heavy service reads idempotency keys from a replica. One key's TTL has just passed, and the primary's DEL for it hasn't arrived yet. What does <code>GET<\/code> on the replica return?","options":["The old value, until the DEL arrives","An error, because replicas can't evaluate TTLs","nil: the replica hides keys whose deadline has passed, but leaves deleting them to the primary","nil, and the replica deletes the key and sends the DEL to the primary"],"answer":2,"why":"Lesson 4's rule: replicas never expire keys themselves, because two servers' clocks would make their datasets drift apart. They do check the deadline on reads and answer as if the key were gone. The key stays in the replica's memory until the primary's DEL arrives in the replication stream. A replica never sends writes to its primary.","from":"redis-04"}],"cards":[{"front":"What does BGSAVE do that SAVE doesn't?","back":"<p>It forks: a child writes the snapshot from a copy-on-write view of memory while the main thread keeps serving. SAVE writes it on the main thread and blocks every client.<\/p>"},{"front":"What does copy-on-write cost during a snapshot?","back":"<p>The kernel copies every page the parent changes while the child writes, 4 KB at a time (<code>rdb_last_cow_size<\/code>). A write-heavy server can need close to twice its memory.<\/p>"},{"front":"kill -9 under <code>appendfsync everysec<\/code>: how many acknowledged writes are lost?","back":"<p>None. Redis passed each one to <code>write()<\/code> before replying, and the kernel still has it. Only a machine crash loses about the last second.<\/p>"},{"front":"What is the replication backlog?","back":"<p>The newest part of the replication stream, 1 MB by default, kept by the primary so a reconnecting replica can get only the bytes it missed.<\/p>"},{"front":"When does a replica need a full resync?","back":"<p>When the primary doesn't know its replication ID, or the bytes after its offset have left the backlog.<\/p>"},{"front":"What does <code>WAIT 1 500<\/code> return, and what doesn't it do?","back":"<p>How many replicas acknowledged this connection's earlier writes, after at most 500 ms. It never undoes a write and doesn't make Redis strongly consistent.<\/p>"},{"front":"Why run three Sentinels?","back":"<p>A failover needs a majority of Sentinels. With three on three machines, the side of a split that has one Sentinel can't promote anything.<\/p>"}],"terms":[{"term":"RDB snapshot","plain":"A compact file, <code>dump.rdb<\/code>, holding the whole dataset as it was at one moment; written by a forked child."},{"term":"Copy-on-write","plain":"After fork, parent and child share memory pages; the kernel copies a page only when one of them writes to it."},{"term":"Append-only file (AOF)","plain":"A log of every write command, replayed at startup; since 7.0 a base file, increment files and a manifest."},{"term":"fsync","plain":"The system call that waits un
