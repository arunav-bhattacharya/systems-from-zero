<style>@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-400.woff2) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-400i.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:normal;font-weight:400;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-400.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-400i.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:normal;font-weight:600;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-600.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:italic;font-weight:600;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-600i.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/inter-500.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff2) format('woff2')}@font-face{font-family:'CMU Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/cmu-serif-400.woff2) format('woff2')}@font-face{font-family:'CMU Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/cmu-serif-400i.woff2) format('woff2')}</style>
<style>/* Systems from Zero: the "from zero" field-guide family look (index on the left, one reading
   column, contents on the right on wide screens). Light by default on a near-white page; a near-black
   night theme is one toggle away. Signal green is the one accent; blue marks the Try it boxes, and
   each track has its own colour for its number, rail and cards. */
:root {
  color-scheme: light;
  --ink: #fcfcfb;        /* page */
  --panel: #ffffff;      /* cards, raised surfaces */
  --well: #f5f6f8;       /* code blocks, inputs */
  --tint: #eef1f5;       /* inline code, quiet fills */
  --rule: #e2e5eb;
  --rule-2: #eceff3;
  --fg: #23262e;
  --mute: #575b66;
  --faint: #8b909b;
  --ember: #17784a;      /* the accent: signal green */
  --ember-ink: #ffffff;
  --soft: rgba(23, 120, 74, 0.08);
  --gold: #0f5132;       /* deep green for emphasis text */
  --teal: #2b5fb4;       /* Try it boxes and reveals (blue, so they stand apart from the accent) */
  /* one colour per track, in course order */
  --c1: #3a63a8; --c2: #5b6576; --c3: #9a7410; --c4: #6a44c0; --c5: #b13a2e; --c6: #0f7a6a; --c7: #cf1d6e; --c8: #2e7d4a;
  --amber: #995a05;
  --plum: #4b55b8;
  --rose: #ab3450;
  --ok: #1d7a4c;
  --bad: #b5303a;
  --mark-off: rgba(35, 38, 46, 0.16);
  /* code, in GitHub's light theme */
  --gh-fg: #1f2328; --gh-bg: #f6f8fa; --gh-file: #ffffff; --gh-border: #d1d9e0; --gh-inline: rgba(129, 139, 152, 0.12);
  --gh-kw: #cf222e; --gh-str: #0a3069; --gh-com: #59636e; --gh-const: #0550ae; --gh-ent: #6639ba; --gh-var: #953800;
  /* older names the page still uses */
  --run: var(--ember); --link: var(--ember); --hold: var(--ember); --hold-ink: var(--gold);
  --display: "Instrument Serif", "CMU Serif", Georgia, serif;
  --read: "Newsreader", "CMU Serif", Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fig: "CMU Serif", "Latin Modern Roman", Georgia, serif;
  --top: 54px;
  --side: 272px;
  --read-w: 40em;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  /* night: near-black neutral greys, the same blue accent */
  --ink: #0a0a0b; --panel: #141415; --well: #101011; --tint: #1d1d1f; --rule: #2a2a2d; --rule-2: #1f1f21;
  --fg: #ececee; --mute: #a6a6ad; --faint: #717177;
  --ember: #4fc78c; --ember-ink: #04120b; --soft: rgba(79, 199, 140, 0.12); --gold: #9be3bf;
  --teal: #7aa7ff;
  --c1: #6c98dd; --c2: #9aa4b5; --c3: #d9aa3c; --c4: #a585e8; --c5: #e06a5c; --c6: #3fc7b3; --c7: #ee5d9d; --c8: #5cb377; --amber: #f2b85b; --plum: #a7b4ff; --rose: #f2839a; --ok: #5ccf96; --bad: #f07a86;
  --mark-off: rgba(236, 236, 238, 0.16);
  --gh-fg: #f0f6fc; --gh-bg: #151b23; --gh-file: #0d1117; --gh-border: #3d444d; --gh-inline: rgba(101, 108, 118, 0.2);
  --gh-kw: #ff7b72; --gh-str: #a5d6ff; --gh-com: #9198a1; --gh-const: #79c0ff; --gh-ent: #d2a8ff; --gh-var: #ffa657;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 400 20px/1.46 var(--read); font-feature-settings: "kern", "liga"; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
::selection { background: color-mix(in srgb, var(--ember) 30%, transparent); }
a { color: var(--ember); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--ember) 45%, transparent); }
a:hover { text-decoration-color: var(--ember); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
code, pre, kbd { font-family: var(--mono); }
p code, li code, td code, dd code, h2 code, h3 code, .q code, .opt code, .why code, .goal code, .front code, .crumb code, .tag code {
  font-family: var(--mono); font-size: 0.8em; padding: 0.2em 0.4em; border-radius: 6px; background: var(--gh-inline); color: var(--gh-fg); white-space: break-spaces;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: 0; text-wrap: balance; margin: 0; line-height: 1.08; }
h1 em, h1 i, h2 em { font-style: italic; }
.label { font: 600 13px/1.35 var(--body); letter-spacing: 0; text-transform: none; color: var(--mute); }
.mute { color: var(--mute); }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- frame ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; min-width: 0; color: var(--fg); }
.brand b { font: 400 21px/1 var(--display); white-space: nowrap; }
.brand i { font-family: var(--display); color: var(--gold); }
.iconbtn { background: none; border: 1px solid transparent; border-radius: 9px; padding: 7px; cursor: pointer; color: var(--mute); display: grid; place-items: center; }
.iconbtn:hover { color: var(--fg); border-color: var(--rule); }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--body); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 12px; background: transparent; cursor: pointer; color: var(--mute); white-space: nowrap; }
.chip:hover { border-color: var(--faint); color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
.chip.quiet .dot { background: var(--mark-off); }
.hide-sm { display: inline-flex; }
.switch { position: relative; width: 40px; height: 22px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; }
.switch .tr { position: absolute; inset: 0; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); }
.switch .kn { position: absolute; top: 4px; left: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform 0.2s; }
:root[data-theme="dark"] .switch .kn { transform: translateX(18px); }

.side { position: fixed; left: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + var(--top)); width: var(--side); border-right: 1px solid var(--rule); background: var(--ink); overflow-y: auto; padding: 12px 0 40px; padding-left: max(0px, env(safe-area-inset-left, 0px)); scrollbar-width: none; transition: transform .3s ease; z-index: 40; }
.side::-webkit-scrollbar { display: none; }
.side.closed { transform: translateX(-100%); }
.main { margin-left: var(--side); transition: margin .3s ease; min-width: 0; }
.main.wide { margin-left: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 96px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .wrap { padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); } }
.scrim { display: none; }
@media (max-width: 1023px) {
  .side { top: 0; z-index: 80; width: min(88vw, 340px); padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .side:not(.closed) { box-shadow: 0 0 40px rgba(0, 0, 0, 0.25); }
  .main { margin-left: 0; }
  .scrim.on { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 70; }
}
@media (max-width: 560px) { .hide-sm { display: none; } .brand b { font-size: 19px; } }

.nav { display: grid; gap: 1px; padding: 0 8px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--fg); font: 400 15.5px/1.35 var(--read); width: 100%; }
.nav button:hover { border-left-color: var(--rule); }
.nav button.on { border-left-color: var(--ember); font-weight: 600; }
.nav .count { margin-left: auto; font: 600 12px var(--body); color: var(--faint); }
.navsec { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.navsec > .label { padding: 0 20px 8px; display: block; }
.trk { border-bottom: 1px solid var(--rule); }
.trk > button { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 8px; align-items: start; text-align: left; width: 100%; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--fg); }
.trk .tn { font: 600 12px/1.9 var(--body); font-variant-numeric: tabular-nums; color: var(--trk, var(--faint)); }
.trk .tt { font: 400 17px/1.2 var(--display); }
.trk .draft { grid-column: 2; }
.trk ul { list-style: none; margin: 0 0 8px; padding: 0 8px 0 30px; }
.trk li button { display: flex; gap: 9px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 5px 10px; cursor: pointer; font: 400 15px/1.35 var(--read); color: var(--mute); }
.trk li button:hover { color: var(--fg); border-left-color: var(--rule); }
.trk li button.on { color: var(--fg); font-weight: 600; border-left-color: var(--trk, var(--ember)); }
.trk li .cell { flex: none; transform: translateY(-1px); }
.field.filter { margin: 4px 20px 6px; width: calc(100% - 40px); font-size: 15px; }

/* progress marks: filled = done, ringed = next, faint = later */
.draft { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.cell { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--mark-off); border: 0; flex: none; }
.cell.done { background: var(--ember); }
.cell.here { background: var(--ember); box-shadow: 0 0 0 2px var(--ink), 0 0 0 3.2px var(--ember); }
.cell.lg { width: 11px; height: 11px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; background: var(--ember); color: var(--ember-ink); font: 600 15px var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--rule); font-weight: 500; }
.btn.ghost:hover { border-color: var(--mute); }
.btn.hold { background: var(--ember); color: var(--ember-ink); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: 17px/1.5 var(--read); resize: vertical; }
.field:focus { outline: none; border-color: var(--mute); }
select.field { width: auto; font: 14px var(--body); height: 34px; padding: 0 10px; border-radius: 9px; }
.linkish { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 22px; }
.hair { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* ---------- prose ---------- */
.prose { max-width: var(--read-w); }
.prose > * { margin: 0 0 0.9em; }
.prose > *:last-child { margin-bottom: 0; }
.prose ul { list-style: disc outside; padding-left: 1.5em; }
.prose ol { list-style: decimal outside; padding-left: 1.5em; }
.prose li { margin: 0.35em 0; padding-left: 0.2em; }
.prose ul li::marker { content: "\2022  "; color: var(--ember); font-size: 1.15em; }
.prose ol li::marker { font-family: var(--read); font-weight: 600; color: var(--ember); font-variant-numeric: lining-nums; }
.prose strong { font-weight: 600; color: var(--fg); }
.prose h3, .prose h4 { font: 600 20px/1.3 var(--read); margin-top: 1.3em; }
.tablewrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.tablewrap table { border-collapse: collapse; width: 100%; font: 15px/1.45 var(--body); }
.tablewrap th, .tablewrap td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tablewrap th { font-weight: 600; font-size: 13px; color: var(--mute); background: var(--well); }
.tablewrap tr:last-child td { border-bottom: 0; }

/* ---------- code: GitHub's look (markdown blocks on a grey panel, files with a header bar) ---------- */
pre.code, .codebox pre { margin: 0; background: var(--gh-bg); color: var(--gh-fg); border: 0; border-radius: 6px; padding: 16px; overflow-x: auto; font: 400 14px/1.5 var(--mono); tab-size: 4; max-width: 100%; }
.prose pre.code { margin: 0 0 1em; }
.codebox { border: 1px solid var(--gh-border); border-radius: 6px; overflow: hidden; background: var(--gh-file); min-width: 0; }
.codebox .bar { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--gh-border); font: 600 13px var(--body); color: var(--gh-fg); background: var(--gh-bg); }
.codebox .bar .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13px var(--mono); }
.codebox .bar .label { font-size: 12px; font-weight: 500; color: var(--gh-com); }
.codebox pre { background: var(--gh-file); border-radius: 0; }
.codebox .run { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-top: 1px solid var(--gh-border); font: 13px/1.4 var(--mono); color: var(--gh-com); background: var(--gh-bg); }
.codebox .run code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--gh-fg); }
.copy { font: 500 12px var(--body); background: var(--gh-file); border: 1px solid var(--gh-border); border-radius: 6px; padding: 3px 10px; cursor: pointer; color: var(--gh-fg); }
.copy:hover { background: var(--gh-bg); }
code, pre, kbd, .codebox, .sim ol { font-variant-ligatures: none; }
/* Pygments token classes mapped to GitHub's syntax roles */
.k, .kd, .kn, .kr, .kp, .kt, .ow { color: var(--gh-kw); }
.kc, .m, .mi, .mf, .mh, .il, .mb, .mo, .nb, .bp, .no { color: var(--gh-const); }
.s, .s1, .s2, .sb, .sc, .se, .sa, .sh, .sx, .si, .sd, .dl, .sr { color: var(--gh-str); }
.c, .c1, .cm, .cs, .ch, .cp, .cpf { color: var(--gh-com); }
.nf, .fm, .nc, .ne { color: var(--gh-ent); }
.nd, .nl { color: var(--gh-var); }
.n, .nn, .na, .nv, .o, .p, .w { color: inherit; }
.gp { color: var(--gh-com); user-select: none; }
.err { color: inherit; background: none; }

/* Java/Kotlin pairs: html[data-code] is java, kotlin or both */
.pair { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); min-width: 0; margin: 0 0 1em; max-width: 100%; }
.pair:last-child { margin-bottom: 0; }
.pi { display: grid; gap: 4px; min-width: 0; }
.pi .lg { font: 600 12.5px var(--body); color: var(--mute); }
.pi[data-lang="java"] .lg { color: var(--ember); }
.pi[data-lang="kotlin"] .lg { color: var(--plum); }
.pi pre.code { margin: 0; }
.pairbar { display: inline-flex; justify-self: start; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.pairbar button { border: 0; background: none; padding: 3px 11px; border-radius: 999px; cursor: pointer; font: 500 12.5px var(--body); color: var(--mute); }
.pairbar button:hover { color: var(--fg); }
:root[data-code="java"] .pairbar [data-lang="java"], :root[data-code="kotlin"] .pairbar [data-lang="kotlin"], :root[data-code="both"] .pairbar [data-lang="both"], :root:not([data-code]) .pairbar [data-lang="both"] { background: var(--ember); color: var(--ember-ink); }
:root[data-code="java"] .pair > .pi[data-lang="kotlin"], :root[data-code="kotlin"] .pair > .pi[data-lang="java"] { display: none; }
.cmp { container-type: inline-size; display: grid; gap: 12px; }
@container (min-width: 900px) {
  :root[data-code="both"] .pair.cols2, :root:not([data-code]) .pair.cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pair.cols2 > .pairbar { grid-column: 1 / -1; }
}

/* ---------- home ---------- */
.hero { display: grid; gap: 22px; margin-bottom: 44px; }
.hero h1 { font-size: clamp(46px, 7vw, 68px); line-height: 1.02; }
.hero h1 i { color: var(--gold); }
.hero p { font-size: 20.5px; color: var(--mute); max-width: 42em; margin: 0; }
.plate-wrap { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 18px 0; overflow-x: auto; }
.plate-svg { display: block; width: 100%; max-width: 860px; height: auto; }
.plate-svg .wk { font: 12px var(--mono); fill: var(--faint); }
.plate-svg circle { cursor: pointer; }
.plate-legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 14px var(--body); color: var(--mute); align-items: center; }
.plate-legend span { display: inline-flex; gap: 8px; align-items: center; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
.pulse { animation: pulse 1.8s ease-in-out infinite; }

.today { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-bottom: 52px; }
@media (min-width: 900px) { .today { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, .9fr); } }
.step { display: grid; gap: 10px; align-content: start; }
.step .n { font: 600 13px var(--body); color: var(--mute); display: flex; gap: 8px; align-items: center; }
.step h3 { font-size: 30px; }
.step.now { border-color: color-mix(in srgb, var(--ember) 45%, var(--rule)); box-shadow: 0 0 0 3px var(--soft); }
.stat { font: 400 44px/1 var(--display); }
.stat small { font: 600 13px var(--body); color: var(--faint); margin-left: 8px; }

.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 16px; flex-wrap: wrap; }
.sechead h2 { font-size: 36px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-bottom: 52px; }
.tcard { text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start; color: var(--fg); transition: border-color .15s; font: inherit; box-shadow: inset 0 3px 0 var(--trk, var(--ember)); }
.tcard > .label:first-child, .trk-l { color: var(--trk, var(--mute)); }
.crumb > button { color: var(--trk, inherit); }
.tcard:hover { border-color: var(--mute); }
.tcard h3 { font-size: 26px; }
.tcard p { margin: 0; font-size: 17px; color: var(--mute); line-height: 1.45; }
.tcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 13px var(--body); color: var(--faint); }
.how { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.how div { border-top: 1px solid var(--rule); padding-top: 12px; }
.how b { display: block; font: 400 24px/1.2 var(--display); margin-bottom: 4px; }
.how span { color: var(--mute); font-size: 17.5px; }

/* ---------- lesson ---------- */
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; }
@media (min-width: 1280px) { .lgrid { grid-template-columns: minmax(0, 1fr) 232px; } }
.lgrid > article { min-width: 0; max-width: 900px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top) + 26px); align-self: start; display: none; max-height: calc(100vh - 120px); overflow-y: auto; font-family: var(--body); }
@media (min-width: 1280px) { .toc { display: block; } }
.toc ul { list-style: none; margin: 10px 0 0; padding: 0; border-left: 1px solid var(--rule); }
.toc li button { display: flex; gap: 8px; background: none; border: 0; text-align: left; cursor: pointer; padding: 6px 0 6px 14px; margin-left: -1px; border-left: 2px solid transparent; font: 14px/1.35 var(--body); color: var(--mute); width: 100%; }
.toc li button:hover { color: var(--fg); }
.toc li.on button { color: var(--fg); border-left-color: var(--ember); }
.toc li button .label { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.toc li.on button .label { color: var(--ember); }
.lhead { display: grid; gap: 14px; margin-bottom: 30px; max-width: 900px; }
.crumb { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.crumb > .label:first-child { font: 600 13px var(--body); padding: 4px 11px; border-radius: 999px; background: var(--soft); color: var(--ember) !important; }
.crumb button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--mute); font: italic 17px var(--read); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.crumb button:hover { color: var(--fg); }
.crumb .label { font: italic 400 17px var(--read); color: var(--mute); }
.lhead h1 { font-size: clamp(40px, 5vw, 58px); line-height: 1.02; max-width: 20ch; }
.goal { font-size: 20.5px; line-height: 1.5; color: var(--mute); margin: 0; max-width: 42em; }
.donebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.done-pill { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font: 600 14px var(--body); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.lsec { padding-top: 0; margin-top: 76px; scroll-margin-top: calc(var(--top) + 16px); display: grid; gap: 18px; }
.lsec:first-of-type { margin-top: 46px; }
.shead { display: flex; gap: 14px; align-items: center; }
.shead .sn { font: 400 23px var(--display); color: var(--ember); width: 42px; height: 42px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; flex: none; font-variant-numeric: lining-nums; }
.shead h2 { font-size: 34px; line-height: 1.1; }
.block { margin-top: 84px; scroll-margin-top: calc(var(--top) + 16px); display: grid; gap: 16px; }
.block > h2 { font-size: 36px; }
.block > .label { margin-bottom: -8px; }

.call { border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; max-width: none; }
.call > .label { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font: 600 17px var(--read); }
.call .prose { font-size: 18.5px; max-width: none; }
.call.analogy { background: color-mix(in srgb, var(--teal) 7%, transparent); border-color: color-mix(in srgb, var(--teal) 26%, transparent); }
.call.analogy > .label { color: var(--teal); }
.call.world { background: color-mix(in srgb, var(--amber) 7%, transparent); border-color: color-mix(in srgb, var(--amber) 26%, transparent); }
.call.world > .label { color: var(--amber); }
.call.mistake { background: color-mix(in srgb, var(--rose) 6%, transparent); border-color: color-mix(in srgb, var(--rose) 26%, transparent); }
.call.mistake > .label { color: var(--rose); }

.tryit { border-radius: 14px; padding: 14px 18px; display: grid; gap: 10px; background: color-mix(in srgb, var(--teal) 6%, transparent); border: 1px solid color-mix(in srgb, var(--teal) 28%, transparent); }
.tryit .th { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font: 600 17px var(--read); }
.tryit .th > .label { color: var(--teal); font: 600 17px var(--read); }
.tryit .th b { font: 600 17px var(--read); color: var(--fg); }
.tryit .mins { margin-left: auto; font: italic 15px var(--read); color: var(--faint); }
.tryit ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 18px; line-height: 1.42; }
.tryit ol li::marker { color: var(--teal); font-weight: 600; }
.tryit > .label { font-weight: 400; color: var(--faint); }
.expect { border-top: 1px dashed color-mix(in srgb, var(--teal) 35%, transparent); padding-top: 8px; }
.expect .prose { font-size: 17px; }
details.reveal > summary { cursor: pointer; font: 600 15.5px var(--read); color: var(--teal); list-style: none; }
details.reveal > summary::-webkit-details-marker { display: none; }
details.reveal > summary::before { content: "+ "; }
details.reveal[open] > summary::before { content: "\2212  "; }

/* figures sit on a black stage with the Manim palette, in both themes */
figure.fig { margin: 0; display: grid; gap: 0; }
.fig .svg { overflow-x: auto; border: 1px solid #1d2026; border-radius: 14px; padding: 18px; background: #000; }
.fig svg { display: block; width: 100%; min-width: 480px; max-width: 700px; height: auto; margin: 0 auto; font-family: var(--fig); }
.fig figcaption { font: italic 16px/1.45 var(--read); color: var(--mute); margin-top: 10px; }
.fig figcaption b { font-style: normal; font-weight: 600; color: var(--fg); margin-right: 6px; }
svg .box { fill: transparent; stroke: #ffffff; stroke-opacity: 0.85; stroke-width: 1.6; }
svg .box-a { fill: rgba(88, 196, 221, 0.14); stroke: #58c4dd; stroke-width: 1.8; }
svg .box-b { fill: rgba(247, 217, 111, 0.13); stroke: #f7d96f; stroke-width: 1.8; }
svg .box-ok { fill: rgba(131, 193, 103, 0.14); stroke: #83c167; stroke-width: 1.8; }
svg .box-bad { fill: rgba(252, 98, 85, 0.14); stroke: #fc6255; stroke-width: 1.8; }
svg .box-dim { fill: rgba(252, 98, 85, 0.06); stroke: #fc6255; stroke-width: 1.2; stroke-dasharray: 5 5; }
.fig svg text { fill: #ffffff; font-family: var(--fig); font-size: 14px; }
.fig svg .t { fill: #ffffff; }
.fig svg .t-s { font-size: 12.5px; }
.fig svg .t-m { fill: #b8b8b8; font-style: italic; }
.fig svg .t-a { fill: #58c4dd; }
.fig svg .t-b { fill: #f7d96f; }
.fig svg .t-ok { fill: #83c167; }
.fig svg .t-bad { fill: #fc6255; }
.fig svg .t-code { font-family: var(--mono); font-size: 13.5px; }
.fig svg .t-s.t-code { font-size: 12px; }
svg .ln, svg .ln-d, svg .ln-a, svg .ln-bad { fill: none; stroke: #ffffff; stroke-opacity: 0.8; stroke-width: 1.6; stroke-linecap: round; }
svg .ln-d { stroke: #888888; stroke-opacity: 1; stroke-width: 1.4; stroke-dasharray: 5 5; }
svg .ln-a { stroke: #58c4dd; stroke-opacity: 1; }
svg .ln-bad { stroke: #fc6255; stroke-opacity: 1; }
svg .arrowhead { fill: #ffffff; fill-opacity: 0.85; }

/* interleaving simulator */
.sim { border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--panel); }
.sim .simh { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.sim .simh b { font: 400 24px/1.2 var(--display); }
.sim .state { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 18px; border-bottom: 1px solid var(--rule); font: 15px var(--mono); background: var(--well); }
.sim .state span b { color: var(--ember); font-weight: 400; }
.sim .threads { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.sim .th { padding: 12px 14px; border-right: 1px solid var(--rule); display: grid; gap: 8px; align-content: start; min-width: 0; }
.sim .th:last-child { border-right: 0; }
.sim .th .tname { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 15px var(--body); }
.sim ol { list-style: none; margin: 0; padding: 0; font: 14px/1.5 var(--mono); }
.sim ol li { padding: 3px 8px; border-radius: 6px; color: var(--faint); white-space: pre-wrap; overflow-wrap: anywhere; }
.sim ol li.ran { color: var(--mute); }
.sim ol li.next { background: var(--soft); color: var(--fg); box-shadow: inset 2px 0 0 var(--ember); }
.sim .regs { font: 13px var(--mono); color: var(--mute); min-height: 1.4em; }
.sim .msg { padding: 12px 18px; border-top: 1px solid var(--rule); font-size: 17px; min-height: 48px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.sim .msg.win { background: color-mix(in srgb, var(--amber) 9%, transparent); }
.sim .msg.dead { background: color-mix(in srgb, var(--rose) 9%, transparent); }
.sim .log { padding: 0 18px 12px; font: 12.5px/1.6 var(--mono); color: var(--faint); }
.sim .label { color: var(--faint); }

/* worked example */
.worked { list-style: none; margin: 0; padding: 0; display: grid; }
.worked li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.worked .wn { display: flex; flex-direction: column; align-items: center; }
.worked .wn span { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--ember); color: var(--ember); display: grid; place-items: center; font: 500 13px var(--body); }
.worked .wn i { flex: 1; width: 1px; background: var(--rule); margin: 4px 0; }
.worked .wb { padding-bottom: 22px; display: grid; gap: 10px; min-width: 0; }

/* lab */
.lab { border: 1px solid var(--rule); border-top: 2px solid var(--ember); border-radius: 16px; padding: 20px 22px; display: grid; gap: 14px; background: var(--panel); }
.lab h3 { font-size: 30px; }
.lab .files { display: grid; gap: 4px; font: 13.5px/1.5 var(--mono); color: var(--mute); }
.lab .files span { overflow-wrap: anywhere; }
.lab ol { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.lab ol li::marker { color: var(--ember); font-weight: 600; }
.hint { border-left: 2px solid var(--amber); padding: 2px 0 2px 12px; font-size: 18px; }
.hint .label { color: var(--amber); margin-right: 8px; }

/* quiz */
.quiz { display: grid; gap: 18px; }
.qcard { border: 1px solid var(--rule); border-radius: 16px; padding: 18px 20px; display: grid; gap: 12px; background: var(--panel); }
.qcard .qn { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qcard .q { font-size: 19px; font-weight: 600; }
.qcard .q pre { font-weight: 400; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: baseline; text-align: left; border: 1px solid var(--rule); background: transparent; border-radius: 10px; padding: 11px 12px; cursor: pointer; font: 17.5px/1.45 var(--read); color: var(--fg); }
.opt:hover:not([disabled]) { border-color: var(--mute); }
.opt[disabled] { cursor: default; }
.opt .key { font: 500 13px var(--mono); color: var(--mute); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.opt.right .key { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.opt.wrong .key { color: var(--bad); }
.why { font-size: 17px; color: var(--mute); border-top: 1px dashed var(--rule); padding-top: 10px; }
.why b { color: var(--fg); }
.tag { font: 600 12px var(--body); border-radius: 999px; padding: 3px 10px; color: var(--mute); background: var(--tint); border: 0; }
.tag.from { background: var(--soft); color: var(--ember); }
.score { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; border: 1px solid var(--rule); border-radius: 16px; padding: 16px 20px; background: var(--panel); }
.score b { font: 400 32px var(--display); }

.recap { border: 1px solid var(--rule); border-radius: 16px; padding: 18px 22px; background: var(--panel); }
.recap ul { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
.terms { display: grid; gap: 0 32px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin: 0; }
.terms div { border-top: 1px solid var(--rule); padding: 10px 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 2px 0 0; color: var(--mute); font-size: 17px; line-height: 1.45; }
.cards-preview { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.cards-preview div { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; font-size: 16px; line-height: 1.4; color: var(--mute); background: var(--panel); }
.refs { display: grid; gap: 6px; font: 16px/1.45 var(--body); border-top: 1px dashed var(--rule); padding-top: 10px; }
.refs a { color: var(--fg); text-decoration-color: var(--rule); overflow-wrap: anywhere; }
.refs a:hover { text-decoration-color: var(--ember); }
.refs .kind { font: 600 11.5px var(--body); padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--ember); margin-right: 8px; text-transform: capitalize; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--rule); padding-top: 22px; margin-top: 64px; }
.pager button { background: none; border: 0; cursor: pointer; text-align: left; padding: 0; display: grid; gap: 4px; color: var(--fg); }
.pager button.nx { text-align: right; justify-items: end; }
.pager b { font: 400 23px/1.2 var(--display); }
.pending { max-width: 60ch; }

/* ---------- review ---------- */
.rv { max-width: 760px; display: grid; gap: 18px; }
.rv h1 { font-size: 50px; }
.flash { border: 1px solid var(--rule); border-radius: 16px; background: var(--panel); padding: 26px 26px 22px; display: grid; gap: 16px; min-height: 260px; align-content: start; }
.flash .front { font: 400 29px/1.25 var(--display); }
.flash .front code { font-size: .7em; }
.flash .back { border-top: 1px dashed var(--rule); padding-top: 16px; font-size: 19px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grades button { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; font: 600 15px var(--body); color: var(--fg); }
.grades button small { font: 500 12px var(--body); color: var(--faint); }
.grades button:hover { border-color: var(--mute); }
.grades .g1 { border-color: color-mix(in srgb, var(--bad) 50%, var(--rule)); }
.grades .g3 { border-color: color-mix(in srgb, var(--ember) 60%, var(--rule)); }
.meter { height: 6px; background: var(--tint); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ember); }

/* ---------- plan ---------- */
.weeks { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.wk { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; }
.wk.cur { border-color: color-mix(in srgb, var(--ember) 45%, var(--rule)); background: var(--soft); }
.wk .label { width: 62px; flex: none; }
.wkcells { display: flex; gap: 7px; align-items: center; }
.wkcells .cell { cursor: pointer; padding: 0; }
.wkcells .cell:hover { outline: 2px solid var(--rule); outline-offset: 2px; }
.plan-list { display: grid; }
.plan-list .pr { display: grid; grid-template-columns: 96px 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule); font-size: 17px; }
.plan-list .pr .d { font: 500 13px var(--body); color: var(--faint); }
.plan-list .pr button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--fg); font: inherit; }
.plan-list .pr button .label { font-weight: 400; }
.plan-list .ptrack { padding: 22px 4px 6px; font: 400 24px var(--display); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 14px; }

/* ---------- focus timer ---------- */
.timer { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 55; width: min(320px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); font-family: var(--body); }
.timer .tt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.timer .big { font: 400 36px/1 var(--display); font-variant-numeric: tabular-nums; }
.phases { display: grid; gap: 3px; }
.phases div { display: grid; gap: 4px; }
.phases i { height: 6px; border-radius: 99px; background: var(--tint); overflow: hidden; display: block; }
.phases i b { display: block; height: 100%; background: var(--faint); }
.phases div.cur i b { background: var(--ember); }
.phases span { font: 600 11.5px var(--body); color: var(--faint); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--panel); color: var(--fg); border: 1px solid var(--rule); padding: 10px 16px; border-radius: 12px; font: 15px var(--body); z-index: 90; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12); max-width: calc(100vw - 32px); }
.empty { border: 1px dashed var(--rule); border-radius: 16px; padding: 24px; color: var(--mute); }
.sheet { margin-bottom: 48px; }
.sheet h2 { font-size: 34px; margin-bottom: 12px; }

/* grids that hold code never grow past their column */
.lsec, .block, .tryit, .lab, .quiz, .qcard, .rv, .flash, .step, .lhead, .cmp, .call, .tcard, .score > div { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tryit .label, .crumb .label { overflow-wrap: anywhere; }

/* ---------- side by side (any two samples) ---------- */
.duo { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@container (min-width: 760px) { .duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.duo-i { display: grid; gap: 6px; align-content: start; min-width: 0; }
.duo-i .lg { font: 600 12.5px var(--body); color: var(--mute); }
.duo-i:first-child .lg { color: var(--ember); }
.duo-i:last-child .lg { color: var(--plum); }

/* ---------- lab: what it needs ---------- */
.needs { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.needs .label { margin-right: 2px; }

/* ---------- stepper: one frame of a mechanism at a time ---------- */
.stepper { border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--panel); margin: 6px 0 4px; outline: none; }
.stepper .simh { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.stepper .simh b { font: 400 24px/1.2 var(--display); }
.stepper .stepintro { margin: 0; padding: 10px 18px 0; font-size: 16px; }
.stepper .stepsvg { overflow-x: auto; margin: 12px 14px 0; border: 1px solid #1d2026; border-radius: 12px; padding: 16px; background: #000; }
.stepper .stepsvg svg { display: block; width: 100%; min-width: 480px; max-width: 700px; height: auto; margin: 0 auto; font-family: var(--fig); }
.stepper .stepsvg svg text { fill: #ffffff; font-family: var(--fig); font-size: 14px; }
.stepper .stepsvg svg .t-s { font-size: 12.5px; }
.stepper .stepsvg svg .t-m { fill: #b8b8b8; font-style: italic; }
.stepper .stepsvg svg .t-a { fill: #58c4dd; }
.stepper .stepsvg svg .t-b { fill: #f7d96f; }
.stepper .stepsvg svg .t-ok { fill: #83c167; }
.stepper .stepsvg svg .t-bad { fill: #fc6255; }
.stepper .stepsvg svg .t-code { font-family: var(--mono); font-size: 13.5px; }
.stepper .stepsay { padding: 12px 18px 4px; display: grid; gap: 4px; min-height: 92px; }
.stepper .stepsay .prose { font-size: 17.5px; }
.stepper .stepsay .prose p { margin: 0 0 .5em; }
.stepper .stepnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px 14px; }
.stepper .dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.stepper .dots button { width: 10px; height: 10px; border-radius: 99px; border: 0; padding: 0; cursor: pointer; background: var(--mark-off); }
.stepper .dots button.seen { background: color-mix(in srgb, var(--ember) 45%, transparent); }
.stepper .dots button.on { background: var(--ember); transform: scale(1.25); }

/* ---------- narrated animations ---------- */
.vid { margin: 4px 0 22px; display: grid; gap: 8px; }

<script type="application/json" id="course">{"title":"Systems from Zero","tagline":"Networks, operating systems, SQL and NoSQL databases, database internals, Kafka, Redis and big data, from first principles to labs on your laptop, one focused session a day.","repo":"https://github.com/arunav-bhattacharya/systems-from-zero","tracks":[{"id":"net","lab":"net","title":"Computer networking","short":"Packets, addresses, routing, UDP and TCP, DNS, TLS and HTTP/3, seen with real tools on your laptop.","lessons":["net-01","net-02","net-03","net-04","net-05","net-06","net-07","net-08","net-09","net-10","net-11","net-12"],"intro":"<p>By the end of this track you can follow one HTTPS call from your Kotlin service to a card issuer through every layer it crosses: the DNS lookup and its caches, the ARP request on your own link, the routers and NATs on the way, the TCP handshake and its states, the windows that decide how fast bytes move, the TLS handshake and its certificate checks, the HTTP version on top, and the load balancers, pools and timeouts that production adds. When a call fails, you'll know which layer to look at first and which command shows it: refused or timed out, CLOSE-WAIT or TIME-WAIT, a missing intermediate or an idle connection a balancer forgot.<\/p>\n<p>You need to read Kotlin or Java, and Docker on your laptop. You don't need any networking background: every lesson starts from a concrete problem and builds the mechanism up from there, with real packets captured on the lab network.<\/p>\n<p>Each lesson has Try its that run in the lab box (<code>docker compose -f env/labbox.yml run --rm box<\/code>, a Linux shell with tcpdump, tshark, ss, dig, curl, openssl and JDK 25) or on the small lab network in <code>env/net.yml<\/code> (client, peer, router, server, a second site behind a 1,400-byte tunnel, and a dual-stack IPv6 link). The labs are Kotlin with JUnit, in <code>labs/net<\/code>, one package per lesson (<code>sfz.net.l01<\/code> to <code>sfz.net.l12<\/code>). They need no Docker: they parse frames captured on the lab network and model state machines and caches with a fake clock, so they run in seconds. Run <code>./gradlew :net:test --tests 'sfz.net.lNN.*'<\/code> from <code>labs/<\/code> until it passes; <code>./gradlew :net:solutionTest<\/code> runs the same tests against the reference answers.<\/p>","cheatsheet":"<h2>The four layers and their addresses<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Unit<\/th>\n<th>Address<\/th>\n<th>Header<\/th>\n<th>Lessons<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Link (Ethernet)<\/td>\n<td>frame<\/td>\n<td>MAC, 48 bits, one link only<\/td>\n<td>14 bytes<\/td>\n<td>1, 2<\/td>\n<\/tr>\n<tr>\n<td>Internet (IP)<\/td>\n<td>packet<\/td>\n<td>IPv4 32 bits, IPv6 128 bits, end to end<\/td>\n<td>20 bytes (IPv4), 40 (IPv6)<\/td>\n<td>3, 4, 5<\/td>\n<\/tr>\n<tr>\n<td>Transport (UDP, TCP, QUIC)<\/td>\n<td>datagram, segment<\/td>\n<td>port, 16 bits<\/td>\n<td>UDP 8, TCP 20 to 60<\/td>\n<td>6, 7, 8, 11<\/td>\n<\/tr>\n<tr>\n<td>Application (DNS, TLS, HTTP)<\/td>\n<td>message<\/td>\n<td>a name<\/td>\n<td>varies<\/td>\n<td>9 to 12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>MAC addresses are rewritten at every router; IP addresses and ports travel end to end until a NAT rewrites them. EtherType <code>0x0800<\/code> is IPv4 (<code>0x0806<\/code> ARP, <code>0x86dd<\/code> IPv6); IP protocol 6 is TCP, 17 UDP.<\/p>\n<h2>Numbers worth remembering<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ethernet MTU, TCP MSS<\/td>\n<td>1,500 bytes; 1,460 bytes of TCP data (1,448 with timestamps)<\/td>\n<\/tr>\n<tr>\n<td>Biggest unfragmented ping<\/td>\n<td><code>ping -M do -s 1472<\/code> (1,472 + 28 bytes of headers)<\/td>\n<\/tr>\n<tr>\n<td>Private IPv4 ranges<\/td>\n<td>10/8, 172.16/12, 192.168/16; carrier-grade NAT 100.64/10<\/td>\n<\/tr>\n<tr>\n<td>Starting TTL on Linux<\/td>\n<td>64<\/td>\n<\/tr>\n<tr>\n<td>Linux ephemeral ports<\/td>\n<td>32768 to 60999: 28,232 ports<\/td>\n<\/tr>\n<tr>\n<td>TIME-WAIT<\/td>\n<td>60 s on Linux, 30 s on macOS: about 470 new connections a second to one address and port<\/td>\n<\/tr>\n<tr>\n<td>Connect to a silent address<\/td>\n<td>Linux gives up after about 136 s unless you set a connect timeout<\/td>\n<\/tr>\n<tr>\n<td>Initial congestion window<\/td>\n<td>10 segments; slow start doubles it per round trip; CUBIC cuts to 70% on loss<\/td>\n<\/tr>\n<tr>\n<td>Throughput ceiling<\/td>\n<td>window / round trip; to fill a link, bandwidth x round trip in flight<\/td>\n<\/tr>\n<tr>\n<td>Delayed ACK on Linux<\/td>\n<td>at least 40 ms: the Nagle stall<\/td>\n<\/tr>\n<tr>\n<td>JVM DNS cache<\/td>\n<td>30 s for answers, 10 s for failures, whatever the TTL<\/td>\n<\/tr>\n<tr>\n<td>Negative DNS answer cached<\/td>\n<td>min(SOA TTL, SOA minimum)<\/td>\n<\/tr>\n<tr>\n<td>New HTTPS connection<\/td>\n<td>1 round trip TCP + 1 round trip TLS 1.3 before the request leaves<\/td>\n<\/tr>\n<tr>\n<td>JDK 25 ClientHello<\/td>\n<td>1,614 bytes with the X25519MLKEM768 key share: two segments<\/td>\n<\/tr>\n<tr>\n<td>HTTP/2 frame header<\/td>\n<td>9 bytes; windows start at 65,535 bytes; frames carry at most 16,384 bytes by default<\/td>\n<\/tr>\n<tr>\n<td>Idle timeouts<\/td>\n<td>JDK HttpClient pool 30 s, JDK HttpServer 30 s, AWS ALB 60 s, AWS NLB and NAT gateway 350 s, TCP keepalive first probe 2 h<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Symptoms and what they mean<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>You see<\/th>\n<th>It means<\/th>\n<th>Lesson<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Destination Host Unreachable<\/code> from your own address<\/td>\n<td>ARP (or neighbor discovery) got no answer on your link<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td><code>* * *<\/code> in the middle of a traceroute, answers after it<\/td>\n<td>that hop doesn't answer probes; nothing about loss<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>small requests work, big transfers hang after the handshake<\/td>\n<td>path MTU black hole: ICMP Fragmentation Needed is blocked<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td><code>Connection refused<\/code> within one round trip<\/td>\n<td>RST: the host is up, nothing listens on the port<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td><code>Connect timed out<\/code><\/td>\n<td>the SYN got no answer: firewall, route or host down<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td><code>Cannot assign requested address<\/code><\/td>\n<td>ephemeral ports used up, usually by TIME-WAIT<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>CLOSE-WAIT growing on your side<\/td>\n<td>your code never calls <code>close()<\/code><\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>about 40 ms per small request<\/td>\n<td>Nagle plus delayed ACK: write once, or <code>TCP_NODELAY<\/code><\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>a new name fails for minutes after it was created<\/td>\n<td>the NXDOMAIN was cached<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>still calling the old IP after a DNS change<\/td>\n<td>caches (resolver, JVM 30 s) and pooled connections<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td><code>PKIX path building failed<\/code><\/td>\n<td>no chain to a trusted root: missing intermediate or private CA<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td><code>No subject alternative DNS name matching ...<\/code><\/td>\n<td>the certificate doesn't name the host you called<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td><code>header parser received no bytes<\/code>, <code>Connection reset<\/code><\/td>\n<td>a forgotten idle connection, or an mTLS rejection<\/td>\n<td>10, 12<\/td>\n<\/tr>\n<tr>\n<td>every HTTP/2 request slow together under loss<\/td>\n<td>TCP head-of-line blocking<\/td>\n<td>11<\/td>\n<\/tr>\n<tr>\n<td>only the first call after a quiet period fails<\/td>\n<td>pool idle timeout longer than a hop's<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Commands<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>Command<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where does a packet to X go?<\/td>\n<td><code>ip route get 10.10.2.20<\/code><\/td>\n<\/tr>\n<tr>\n<td>Who is on my link?<\/td>\n<td><code>ip neigh<\/code> (IPv4 and IPv6)<\/td>\n<\/tr>\n<tr>\n<td>Which sockets, in which state?<\/td>\n<td><code>ss -tan<\/code>, <code>ss -tin<\/code> (cwnd, rtt), <code>ss -tanp state time-wait<\/code><\/td>\n<\/tr>\n<tr>\n<td>What is on the wire?<\/td>\n<td><code>tcpdump -i eth0 -nn -S 'tcp port 9000'<\/code>; <code>-XX<\/code> for the bytes<\/td>\n<\/tr>\n<tr>\n<td>What does a frame mean?<\/td>\n<td><code>tshark -r f.pcap -V<\/code>, <code>-d tcp.port==8080,http2<\/code> for cleartext HTTP/2<\/td>\n<\/tr>\n<tr>\n<td>Which path?<\/td>\n<td><code>traceroute -n host<\/code>, <code>ping -M do -s 1472 host<\/code><\/td>\n<\/tr>\n<tr>\n<td>Who answers for a name?<\/td>\n<td><code>dig +trace name<\/code>, <code>dig +norecurse @server name<\/code><\/td>\n<\/tr>\n<tr>\n<td>Where does the time go?<\/td>\n<td><code>curl -w '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer}\\n'<\/code><\/td>\n<\/tr>\n<tr>\n<td>What certificate does a server send?<\/td>\n<td><code>openssl s_client -connect host:443 -servername host -showcerts<\/code><\/td>\n<\/tr>\n<tr>\n<td>What is inside my TLS?<\/td>\n<td><code>SSLKEYLOGFILE=keys.log curl ...<\/code>, then <code>tshark -o tls.keylog_file:keys.log<\/code><\/td>\n<\/tr>\n<tr>\n<td>Simulate a bad network<\/td>\n<td><code>tc qdisc add dev eth0 root netem delay 50ms loss 1%<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Pairs people mix up<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<th>The difference<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MAC address<\/td>\n<td>IP address<\/td>\n<td>MAC: the next box on this link, rewritten at each router. IP: the final destination, end to end.<\/td>\n<\/tr>\n<tr>\n<td>Switch<\/td>\n<td>Router<\/td>\n<td>A switch forwards frames inside one link by MAC and learns ports. A router forwards packets between networks by longest prefix match and lowers the TTL.<\/td>\n<\/tr>\n<tr>\n<td>UDP<\/td>\n<td>TCP<\/td>\n<td>UDP: one datagram, no handshake, no resend, message boundaries kept. TCP: a byte stream, handshake, ordering, resends, flow and congestion control.<\/td>\n<\/tr>\n<tr>\n<td>Refused<\/td>\n<td>Timed out<\/td>\n<td>Refused: an RST, the host is there. Timed out: silence, something drops packets.<\/td>\n<\/tr>\n<tr>\n<td>TIME-WAIT<\/td>\n<td>CLOSE-WAIT<\/td>\n<td>TIME-WAIT: the side that closed first, normal, 60 s. CLOSE-WAIT: the peer closed and your program hasn't: a leak.<\/td>\n<\/tr>\n<tr>\n<td>Flow control<\/td>\n<td>Congestion control<\/td>\n<td>Flow: the receiver's free buffer (rwnd). Congestion: the sender's guess at what the network takes (cwnd). Send min of both.<\/td>\n<\/tr>\n<tr>\n<td>HTTP/2 blocking<\/td>\n<td>HTTP/3 blocking<\/td>\n<td>HTTP/2: one lost TCP segment stalls every stream. HTTP/3: QUIC stalls only the streams in the lost packet.<\/td>\n<\/tr>\n<tr>\n<td>L4 balancer<\/td>\n<td>L7 balancer<\/td>\n<td>L4: per connection, bytes unread. L7: ends TLS, reads and routes each request, adds X-Forwarded-For.<\/td>\n<\/tr>\n<tr>\n<td>HTTP keep-alive<\/td>\n<td>TCP keepalive<\/td>\n<td>HTTP: reuse a connection for more requests. TCP: empty probes on an idle connection (<code>SO_KEEPALIVE<\/code>).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>JVM settings that matter<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>What it controls<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>socket.connect(address, ms)<\/code>, <code>HttpClient.Builder.connectTimeout<\/code><\/td>\n<td>how long to wait for the SYN-ACK<\/td>\n<\/tr>\n<tr>\n<td><code>socket.soTimeout<\/code><\/td>\n<td>how long each read may wait<\/td>\n<\/tr>\n<tr>\n<td><code>HttpRequest.Builder.timeout<\/code><\/td>\n<td>until the response headers arrive<\/td>\n<\/tr>\n<tr>\n<td><code>sendAsync(...).orTimeout(...)<\/code><\/td>\n<td>the whole call, body included<\/td>\n<\/tr>\n<tr>\n<td><code>socket.tcpNoDelay = true<\/code><\/td>\n<td>turns off Nagle's algorithm<\/td>\n<\/tr>\n<tr>\n<td><code>networkaddress.cache.ttl<\/code> (security property)<\/td>\n<td>the JVM's DNS cache, 30 s by default<\/td>\n<\/tr>\n<tr>\n<td><code>-Djava.net.preferIPv6Addresses=true<\/code><\/td>\n<td>the JVM tries IPv6 first; it never races the two<\/td>\n<\/tr>\n<tr>\n<td><code>-Djdk.httpclient.keepalive.timeout=N<\/code><\/td>\n<td>how long the HttpClient pool keeps idle connections (30 s)<\/td>\n<\/tr>\n<tr>\n<td><code>HttpClient.Version.HTTP_3<\/code><\/td>\n<td>HTTP/3, from JDK 26 only<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","recap":["A request crosses four layers, each with its own address: a name (DNS), a port (TCP or UDP), an IP address (end to end) and a MAC address (the next box only). Each layer wraps the one above in a header, and the receiver unwraps them in reverse.","On one link, ARP (IPv4) or neighbor discovery (IPv6) turns an IP address into a MAC, and switches learn where each MAC lives. Between links, routers forward each packet alone by longest prefix match, lower the TTL, and report problems with ICMP, which traceroute and path MTU discovery depend on.","Private IPv4 addresses reach the internet through NAT, which keeps one table entry per connection and forgets idle ones. IPv6 gives every host global addresses of its own and replaces ARP and broadcast with multicast neighbor discovery.","UDP delivers datagrams or loses them silently. TCP builds a reliable byte stream with a handshake, sequence numbers, ACKs, retransmission and per-direction closing; TIME-WAIT belongs to the side that closed first, CLOSE-WAIT to code that never closed.","TCP's throughput is at most a window per round trip. The receive window protects the receiver, the congestion window protects the network, and small writes can stall 40 ms between Nagle and delayed ACKs.","DNS walks root, TLD and authoritative servers, and every answer is a copy with a TTL. Nothing is pushed: resolvers, the JVM (30 s) and connection pools each hold their copies by their own rules.","TLS 1.3 agrees on keys in one round trip, encrypts everything after the ServerHello, and authenticates the server with a certificate chain the client checks: signatures, CA flags, dates and the name. The SNI stays visible; mTLS makes the client prove itself too.","HTTP/1.1 carries one exchange per connection at a time; HTTP/2 interleaves streams on one TCP connection but suffers TCP's head-of-line blocking; HTTP/3 puts streams into QUIC over UDP so a loss stalls only its own stream.","In production, a request crosses proxies that open their own connections and pools that forget idle connections by their own clocks. Give every wait its own timeout, retry only what's safe with backoff and jitter, and keep each client's idle timeout below the next hop's."],"quiz":[{"q":"A packet goes from your laptop through three routers to a server, with no NAT on the way. Which addresses in the packet are rewritten at every hop?","options":["The source and destination MAC addresses; the IP addresses stay the same","The destination IP address, so the next router can find it","Nothing: all addresses travel end to end","The source port, so replies come back through the same router"],"answer":0,"why":"A MAC address only means something on one link, so every router writes a new Ethernet header with its own MAC as the source and the next hop's as the destination. The IP addresses name the endpoints and travel unchanged; only a NAT rewrites them (and the ports).","from":null},{"q":"Two hosts are on different subnets, joined through a switch and a router. Which statement is right?","options":["The switch reads the destination IP address and picks the router","The router learns MAC addresses per port and floods unknown ones","The switch forwards frames by MAC address inside one link; the router forwards packets between subnets by the longest matching route and lowers the TTL","Both read the IP header; the router is just faster"],"answer":2,"why":"A switch never reads IP: it learns which MAC lives on which port and forwards (or floods) frames within one link. Getting to another subnet takes a router, which looks up the destination IP in its routing table, picks the most specific match and decrements the TTL. The second option describes a switch.","from":null},{"q":"A service sends a DNS query over UDP, and the datagram is lost. Who notices and sends it again?","options":["The kernel's UDP code, after the retransmission timeout","The router that dropped it, with an ICMP message","Nobody: the lookup fails at once","The resolver code in the application, after its own timeout, because UDP never resends"],"answer":3,"why":"UDP adds ports and a checksum to IP and nothing else: no ACKs, no timers, no resends. DNS clients build their own reliability, waiting a few seconds and asking again (glibc waits 5 s). TCP would resend from the kernel; a router that drops a packet for congestion sends nothing back.","from":null},{"q":"A connect to a partner's API fails after about 136 seconds with a connect timeout, and the application set no connect timeout. What happened?","options":["The partner's service is down but its host is up","The partner refused the connection","The SYNs got no answer at all: a firewall or a route dropped them, or the host is gone, and Linux gave up after its retries","The TLS handshake took too long"],"answer":2,"why":"With nothing listening, the host would answer the SYN with an RST at once: connection refused, within a round trip. 136 seconds is Linux resending the SYN with growing gaps and finally giving up, which happens only when nothing comes back. TLS starts after the connect, so it can't make the connect time out.","from":null},{"q":"<code>ss -tan<\/code> on a payment service shows 3,000 sockets to a fraud API, all in CLOSE-WAIT, and the number grows every hour. What is wrong?","options":["The fraud API's connections are in their normal 60-second wait after closing","The fraud API closed those connections and the service's code never closed its end","The service is opening too many new connections","FIN packets are being lost on the network"],"answer":1,"why":"CLOSE-WAIT means the peer sent its FIN and the kernel acknowledged it, and now waits for the local program to call <code>close()<\/code>. A growing count is a leak, often a response body nobody read to the end. The first option describes TIME-WAIT, which belongs to the side that closed first and goes away by itself after 60 seconds on Linux.","from":null},{"q":"A Kafka consumer pauses for 10 seconds while the broker keeps sending a large fetch response. What stops the broker from sending more than the consumer can hold?","options":["The congestion window, which shrinks when the consumer pauses","The broker notices the pause through TCP keepalive","Nothing: the extra data is dropped and resent later","The consumer's receive window, which falls to zero as its socket buffer fills"],"answer":3,"why":"Flow control protects the receiver: every ACK carries the free space in its receive buffer, and when the paused consumer stops reading, that window reaches zero and the broker's kernel stops sending. Congestion control protects the network and reacts to loss, not to a slow reader. Keepalive only probes idle connections.","from":null},{"q":"A partner moves its API to a new IP address. DNS answers with the new address everywhere, yet your service keeps sending requests to the old one for an hour. What is the most likely reason?","options":["DNS changes take 24 to 48 hours to propagate","The JVM caches DNS answers forever by default","Pooled connections opened before the change still point at the old address, and DNS is only consulted when a connection opens","The partner's TLS certificate still names the old address"],"answer":2,"why":"Every cache honours some expiry: resolvers the TTL, the JVM 30 seconds by default. A connection pool doesn't look at DNS again until it opens a new connection, so long-lived pooled connections keep going to the old address until the pool replaces them. A maximum connection lifetime bounds that. Certificates name hosts, not addresses.","from":null},{"q":"Your service calls <code>https://api.issuer.example/authorize<\/code> over TLS 1.3. What can a router on the path read?","options":["The addresses, the name api.issuer.example from the ClientHello's SNI, and the size and timing of each record","The full URL, because the path travels in the ClientHello","Nothing at all","The request headers but not the body"],"answer":0,"why":"The ClientHello is sent in the clear and names the server, so that the server can pick a certificate; the IP addresses and record sizes are visible too. Everything after the ServerHello, including the path, headers and body, is encrypted. Encrypted Client Hello can hide the name where both sides support it.","from":null},{"q":"A mobile app sends six API requests at once over a lossy cellular link, and one packet is lost. How do HTTP/2 and HTTP/3 differ?","options":["No difference: both run over TCP","HTTP/2 resends only the lost frame; HTTP/3 resends the whole connection's data","Over HTTP/2 every request whose bytes come after the hole waits for TCP's retransmission; over HTTP/3 only the stream that lost data waits","HTTP/3 never loses packets, because QUIC uses UDP"],"answer":2,"why":"HTTP/2 multiplexes streams over one TCP byte stream, and TCP delivers nothing past a hole, so a single loss stalls the streams behind it. QUIC orders bytes per stream, so the other streams keep flowing. UDP loses packets like anything else; QUIC recovers them itself.","from":null},{"q":"Every morning the first authorization after the overnight quiet fails with <code>Connection reset<\/code>, and the issuer's backends never saw it. The client's pool keeps idle connections 10 minutes; the network load balancer in front of the issuer forgets idle ones after 350 seconds. What is the fix?","options":["Turn on retries for every request, POST included","Raise the client's connect timeout","Set the pool's idle timeout below the balancer's 350 seconds (and retry once on a fresh connection only for idempotent requests)","Switch the issuer calls to UDP"],"answer":2,"why":"The balancer forgot the connection and answered the morning's request with a reset, before any backend saw it. If the pool drops idle connections first, the request simply opens a new connection. Blind retries of POST risk double charges, and the connect timeout isn't involved: the connection was already open.","from":null}]},{"id":"os","lab":"os","title":"Operating systems","short":"System calls, processes and threads, scheduling, virtual memory, the page cache, I/O models and containers, traced on a real Linux box.","lessons":["os-01","os-02","os-03","os-04","os-05","os-06","os-07","os-08","os-09","os-10","os-11","os-12"],"intro":"<p>By the end of this track you can follow a JVM service from its first system call to its container's limits: read a <code>strace<\/code> and a thread dump against what the kernel shows in <code>/proc<\/code>, tell a JVM <code>OutOfMemoryError<\/code> from a kernel OOM kill and a <code>SIGTERM<\/code> from a <code>SIGKILL<\/code>, explain why a pod with a CPU limit stalls and why its RSS doesn't fall, write a file so that a power cut can't corrupt it, say what epoll and virtual threads do with 2,000 idle connections, and build a container by hand from namespaces and a cgroup.<\/p>\n<p>You need to be able to program, and to run Docker on your laptop. Nothing about kernels is assumed. Lesson 1 sets up the picture the whole track uses, programs in user mode asking the kernel for everything through system calls, and each later lesson opens one box of that kernel: processes, threads, the scheduler, locks, virtual memory, malloc, the page cache, file systems, I/O and containers. The kernel facts are Linux 6.12 (the lab box's kernel, with EEVDF and cgroup v2), and the JVM facts are JDK 25.<\/p>\n<p>Every Try-it runs in the lab box, an Ubuntu 24.04 container with JDK 25, <code>strace<\/code>, <code>gcc<\/code> and friends: <code>docker compose -f env/labbox.yml run --rm box<\/code> from the <code>labs<\/code> folder, or <code>box-priv<\/code> for the steps that need privileges (<code>unshare<\/code>, mounts, io_uring). Short C programs live in <code>labs/os/c/lNN/<\/code> and compile to <code>/tmp<\/code> inside the box; Java demos live in <code>labs/os/src/demo<\/code>. The labs are Kotlin models of each mechanism, in packages <code>sfz.os.l01<\/code> to <code>sfz.os.l12<\/code>, with tests that need no Docker; many check your model against real output captured in the lab box. Run <code>./gradlew :os:test --tests 'sfz.os.lNN.*'<\/code> from <code>labs/<\/code> until it passes; <code>./gradlew :os:solutionTest<\/code> runs the same tests against the reference answers.<\/p>","cheatsheet":"<h2>The picture<\/h2>\n<p>Programs run in <strong>user mode<\/strong> and can't touch hardware. The <strong>kernel<\/strong> runs in kernel mode and does everything on their behalf, asked through <strong>system calls<\/strong> (a trap: about 150 ns in the lab box). A container is ordinary processes on that one kernel, with namespaces, a cgroup, capabilities, seccomp and an overlay root around them.<\/p>\n<h2>Where to look<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>question<\/th>\n<th>look at<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>what is it asking the kernel for?<\/td>\n<td><code>strace -f -c -p &lt;pid&gt;<\/code> (always <code>-f<\/code> for a JVM)<\/td>\n<\/tr>\n<tr>\n<td>what is a process doing right now?<\/td>\n<td><code>/proc/&lt;pid&gt;/status<\/code> (<code>State<\/code>, <code>Threads<\/code>, <code>VmRSS<\/code>, <code>NSpid<\/code>), <code>ps -L -o tid,stat,wchan:20,comm<\/code><\/td>\n<\/tr>\n<tr>\n<td>which Java thread is that TID?<\/td>\n<td><code>jstack &lt;pid&gt;<\/code>: <code>nid=<\/code> is the TID in decimal since JDK 18<\/td>\n<\/tr>\n<tr>\n<td>how much memory, really?<\/td>\n<td>RSS (<code>VmRSS<\/code>, <code>smaps_rollup<\/code>), PSS for shared pages, <code>jcmd &lt;pid&gt; VM.native_memory summary<\/code><\/td>\n<\/tr>\n<tr>\n<td>what limits this container?<\/td>\n<td><code>/sys/fs/cgroup/<\/code>: <code>memory.max<\/code>, <code>cpu.max<\/code>, <code>pids.max<\/code><\/td>\n<\/tr>\n<tr>\n<td>did it hit them?<\/td>\n<td><code>memory.events<\/code> (<code>oom_kill<\/code>), <code>cpu.stat<\/code> (<code>nr_throttled<\/code>), <code>pids.events<\/code> (<code>max<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>is it waiting for a resource?<\/td>\n<td><code>cpu.pressure<\/code>, <code>memory.pressure<\/code> (PSI) in the cgroup; <code>/proc/pressure/*<\/code> is the whole machine<\/td>\n<\/tr>\n<tr>\n<td>which files are open or deleted?<\/td>\n<td><code>ls -l /proc/&lt;pid&gt;/fd<\/code>, <code>lsof +L1<\/code>, <code>grep 'open files' /proc/&lt;pid&gt;/limits<\/code><\/td>\n<\/tr>\n<tr>\n<td>what did the JVM detect?<\/td>\n<td><code>java -XshowSettings:system -version<\/code>, <code>-Xlog:os+container=debug<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Processes, signals and threads (lessons 1 to 3)<\/h2>\n<ul>\n<li><code>fork<\/code> copies the process (copy-on-write), <code>execve<\/code> replaces the program and keeps PID and open fds, <code>wait<\/code> collects the exit status. A dead child is a <strong>zombie<\/strong> until reaped; an <strong>orphan<\/strong> is adopted by PID 1.<\/li>\n<li>Exit status of a killed process: 128 + signal. <strong>137<\/strong> = <code>SIGKILL<\/code> (OOM killer or grace period over), <strong>143<\/strong> = <code>SIGTERM<\/code> handled. <code>SIGKILL<\/code> and <code>SIGSTOP<\/code> can't be caught; the JVM runs shutdown hooks on <code>SIGTERM<\/code>, <code>SIGINT<\/code>, <code>SIGHUP<\/code>.<\/li>\n<li>In a container, make the JVM PID 1 with the exec-form <code>ENTRYPOINT<\/code>, and add <code>--init<\/code> (tini) if it starts child processes.<\/li>\n<li>A thread is a task that shares memory, files and signal handlers (<code>clone<\/code> flags). Platform thread = one OS thread, about 2 MB stack reserved on arm64 Linux (1 MB on x86-64).<\/li>\n<li>Every thread counts against <code>pids.max<\/code>: past it, <code>clone<\/code> fails with <code>EAGAIN<\/code> and the JVM says <code>OutOfMemoryError: unable to create native thread<\/code>.<\/li>\n<li>Virtual threads mount on carriers (one per CPU) and unmount when they block; since JDK 24 <code>synchronized<\/code> doesn't pin, class initializers and native frames still do.<\/li>\n<li>The vDSO answers clock reads in user space (about 17 ns); <code>strace<\/code> never sees them. Docker's seccomp filter refuses about 44 calls, <code>clone3<\/code> with <code>ENOSYS<\/code>.<\/li>\n<\/ul>\n<h2>CPU and locks (lessons 4 and 5)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><code>nice<\/code><\/th>\n<th><code>cpu.max<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>what it is<\/td>\n<td>a weight: nice 0 = 1024, nice 10 = 110<\/td>\n<td>a budget: quota per period, <code>50000 100000<\/code> = 50 ms per 100 ms<\/td>\n<\/tr>\n<tr>\n<td>when it matters<\/td>\n<td>only when tasks compete for a CPU<\/td>\n<td>always, even on an idle node<\/td>\n<\/tr>\n<tr>\n<td>failure mode<\/td>\n<td>a share you didn't expect<\/td>\n<td>throttling: all threads stop until the next period<\/td>\n<\/tr>\n<tr>\n<td>evidence<\/td>\n<td><code>ps -o ni,pcpu<\/code>, <code>/proc/&lt;pid&gt;/schedstat<\/code><\/td>\n<td><code>cpu.stat<\/code>: <code>nr_throttled<\/code> / <code>nr_periods<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>EEVDF (complete in Linux 6.12) runs the eligible task (owed CPU) with the earliest virtual deadline; default slice 3 ms on 8 or more CPUs.<\/li>\n<li>The JVM's <code>availableProcessors()<\/code> = quota / period, rounded up; it sizes GC, JIT, <code>ForkJoinPool<\/code> and carriers.<\/li>\n<li>A <strong>futex<\/strong> lock costs one compare-and-swap when nobody else wants it; the kernel is entered only to sleep (<code>FUTEX_WAIT<\/code>) or wake (<code>FUTEX_WAKE<\/code>).<\/li>\n<li>Deadlock needs mutual exclusion, hold and wait, no preemption and circular wait. Fix by breaking one: lock ordering first, <code>tryLock<\/code> with random back-off second. <code>jstack<\/code> prints \"Found one Java-level deadlock\"; the kernel only sees threads asleep in <code>futex_wait_queue<\/code>.<\/li>\n<\/ul>\n<h2>Memory (lessons 6 to 8)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>number<\/th>\n<th>means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>VSZ<\/td>\n<td>every reserved address; <code>-Xmx4g<\/code> reserves 4 GB at start<\/td>\n<\/tr>\n<tr>\n<td>RSS<\/td>\n<td>pages in RAM now; what a memory limit counts (with page cache)<\/td>\n<\/tr>\n<tr>\n<td>PSS<\/td>\n<td>RSS with shared pages split among sharers; sums correctly<\/td>\n<\/tr>\n<tr>\n<td><code>Committed_AS<\/code><\/td>\n<td>memory promised to all processes; can exceed RAM (overcommit)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Pages are 4 KB (16 KB on Apple Silicon); a four-level page table maps them; the TLB caches translations, and 2 MB huge pages multiply its reach by 512.<\/li>\n<li><strong>Minor fault<\/strong>: first touch or a page already in RAM, about a microsecond. <strong>Major fault<\/strong>: waits for the disk (an uncached file page or swap). <code>-XX:+AlwaysPreTouch<\/code> takes the heap's faults at start-up.<\/li>\n<li><code>fork<\/code> copies page tables, not pages; the first write to a page copies it. <code>MAP_SHARED<\/code> writes reach the file; <code>MAP_PRIVATE<\/code> writes go to private copies.<\/li>\n<li><code>OutOfMemoryError: Java heap space<\/code> is the JVM's <code>-Xmx<\/code>: an exception, heap dump possible. Exit 137 with <code>oom_kill<\/code> in <code>memory.events<\/code> is the kernel's <code>memory.max<\/code>: <code>SIGKILL<\/code>, nothing runs. The OOM killer picks the biggest process (plus <code>oom_score_adj<\/code>), not the one that asked last.<\/li>\n<li><code>malloc<\/code> uses <code>brk<\/code> for small blocks and <code>mmap<\/code> from 128 KB; freed memory goes back to malloc, not the kernel, so RSS stays at its peak. glibc keeps up to 8 arenas per CPU; <code>MALLOC_ARENA_MAX=2<\/code> trades lock waits for less RSS. NMT shows HotSpot's own memory, not native libraries.<\/li>\n<\/ul>\n<h2>Files (lessons 9 and 10)<\/h2>\n<ul>\n<li>Every read and write goes through the <strong>page cache<\/strong>. <code>available<\/code>, not <code>free<\/code>, is what programs can still get; clean cache is dropped on demand, and in a cgroup it's charged as <code>file<\/code> next to <code>anon<\/code>.<\/li>\n<li><code>write()<\/code> returns once the bytes are in RAM (dirty). Writeback comes about 30 s later. A process crash, <code>kill -9<\/code> included, loses nothing; a power cut loses dirty pages. <code>fsync<\/code> (<code>force(true)<\/code>) or <code>fdatasync<\/code> (<code>force(false)<\/code>) waits for the device: 2 to 9 ms here, so batch with group commit.<\/li>\n<li>Replace a file safely: write a temp file in the same directory, <code>fsync<\/code> it, <code>rename<\/code> it over the target, <code>fsync<\/code> the directory.<\/li>\n<li>A file is an <strong>inode<\/strong> (size, owner, link count, blocks; no name). A directory maps names to inode numbers. Hard link = another name for the inode; symlink = an inode holding a path.<\/li>\n<li>Three tables: fd table (per process) → open file description (offset, flags; one per <code>open()<\/code>, shared by <code>fork<\/code> and <code>dup2<\/code>) → inode. <code>O_APPEND<\/code> moves the offset to the end before every write.<\/li>\n<li><code>rm<\/code> of an open file frees nothing until the last close: <code>df<\/code> counts it, <code>du<\/code> doesn't. Find it with <code>lsof +L1<\/code>, free it with <code>: &gt; /proc/&lt;pid&gt;/fd/&lt;n&gt;<\/code>.<\/li>\n<li><code>EMFILE<\/code> = this process hit <code>RLIMIT_NOFILE<\/code> (the JVM raises its soft limit to the hard one); <code>ENFILE<\/code> = the machine hit <code>fs.file-max<\/code>. Sockets are descriptors too.<\/li>\n<li>ext4's journal (<code>data=ordered<\/code>, commit every 5 s) keeps metadata consistent through a crash. It doesn't make un-fsynced data durable.<\/li>\n<\/ul>\n<h2>I/O (lesson 11)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>model<\/th>\n<th>call<\/th>\n<th>wakes you when<\/th>\n<th>cost per wait<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>blocking<\/td>\n<td><code>read()<\/code><\/td>\n<td>data arrived<\/td>\n<td>one thread per connection<\/td>\n<\/tr>\n<tr>\n<td>non-blocking<\/td>\n<td><code>read()<\/code> → <code>EAGAIN<\/code><\/td>\n<td>never: you ask again<\/td>\n<td>a spinning CPU<\/td>\n<\/tr>\n<tr>\n<td>readiness<\/td>\n<td><code>epoll_wait<\/code> (<code>epoll_pwait<\/code> on arm64)<\/td>\n<td>some registered sockets are readable<\/td>\n<td>the ready sockets only<\/td>\n<\/tr>\n<tr>\n<td>completion<\/td>\n<td><code>io_uring_enter<\/code><\/td>\n<td>the I/O you submitted is done<\/td>\n<td>many operations per call, files too<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><code>select<\/code>/<code>poll<\/code> check every descriptor per call (<code>select<\/code> stops at 1,024). Level-triggered reports a socket while readable; edge-triggered once per arrival, so drain to <code>EAGAIN<\/code>.<\/li>\n<li>Java's <code>Selector<\/code> is epoll on Linux, kqueue on macOS. Virtual threads use it underneath: failed <code>read<\/code>, <code>epoll_ctl<\/code>, park, the <code>MasterPoller<\/code> thread in <code>epoll_wait<\/code>.<\/li>\n<li>io_uring is blocked by Docker's default seccomp (Docker 25+), disabled on Google's production servers, and switchable with <code>kernel.io_uring_disabled<\/code>.<\/li>\n<\/ul>\n<h2>Containers (lesson 12)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>namespace<\/th>\n<th>cgroup<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>decides<\/td>\n<td>what a process can see<\/td>\n<td>how much it can use<\/td>\n<\/tr>\n<tr>\n<td>kinds<\/td>\n<td>pid, mnt, net, uts, ipc, user, cgroup, time<\/td>\n<td>pids, memory, cpu (and io, cpuset)<\/td>\n<\/tr>\n<tr>\n<td>made with<\/td>\n<td><code>unshare<\/code>, <code>clone(CLONE_NEW*)<\/code><\/td>\n<td><code>mkdir /sys/fs/cgroup/&lt;name&gt;<\/code>, write <code>cgroup.procs<\/code><\/td>\n<\/tr>\n<tr>\n<td>when exceeded<\/td>\n<td>nothing to exceed<\/td>\n<td><code>fork<\/code> gets <code>EAGAIN<\/code>, the OOM killer runs, threads are throttled<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Root in a default Docker container is user 0 to the kernel, with 14 capabilities and a seccomp filter; <code>--privileged<\/code> gives all capabilities and no filter.<\/li>\n<li>The root file system is an overlay: read-only image layers plus a per-container upper layer; the first write copies a file up. <code>docker diff<\/code> lists the upper layer.<\/li>\n<li>JDK 25 in a container: heap = 25% of <code>memory.max<\/code>, CPUs = quota / period rounded up, G1 only with at least 2 CPUs and 1,792 MB (else Serial). JDK-8346874: older JDK builds on kernel 6.12 missed the container and sized the heap from the host.<\/li>\n<li>USE method: for each resource, check utilization, saturation and errors. In a container: <code>cpu.stat<\/code>, <code>cpu.pressure<\/code>, <code>memory.current<\/code>, <code>memory.pressure<\/code>, <code>memory.events<\/code>, <code>pids.events<\/code>.<\/li>\n<\/ul>","recap":["Programs run in user mode and ask the kernel for everything through system calls. <code>strace -f<\/code> shows them; the vDSO and uncontended futexes stay in user space and never show up.","A process is created by <code>fork<\/code>, changed by <code>execve<\/code> and collect
