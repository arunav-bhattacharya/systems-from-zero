,"minutes":40,"goal":"By the end you can trace how a process is created, replaced, ended and reaped, explain zombies and orphans, and tell from an exit code like 137 what happened to your JVM.","quiz":[{"q":"A pod's last state is <code>Terminated, exit code 137<\/code>, and the application log stops mid-line with no shutdown messages. What is the most likely story?","options":["The JVM threw an <code>OutOfMemoryError<\/code> and exited","Something sent <code>SIGKILL<\/code>: the grace period ran out, or the kernel's OOM killer ended the process","The app called <code>System.exit(137)<\/code> from a shutdown hook","The JVM got <code>SIGTERM<\/code> and ran its hooks"],"answer":1,"why":"137 is 128 + 9, death by <code>SIGKILL<\/code>, which skips shutdown hooks, hence no shutdown lines. A <code>SIGTERM<\/code> path would log the hooks and end with 143. An uncaught <code>OutOfMemoryError<\/code> ends the JVM with status 1, not 137.","from":null},{"q":"<code>ps<\/code> in a container shows 300 lines like <code>[curl] &lt;defunct&gt;<\/code> with PPID 1, and PID 1 is <code>java -jar app.jar<\/code>. What fixes it?","options":["<code>kill -9<\/code> each defunct PID","Restart the zombies with <code>kill -CONT<\/code>","Run the container with <code>--init<\/code> (or tini) so a real init reaps orphans","Give the container more memory"],"answer":2,"why":"Those are orphans that died under a PID 1 that never calls <code>wait<\/code> for processes it didn't start. They're already dead, so <code>kill<\/code> of any kind does nothing. A tiny init as PID 1 reaps them as they die. Memory has nothing to do with it: each zombie holds a PID, not memory.","from":null},{"q":"A shell runs <code>java -jar ledger.jar &gt; ledger.log<\/code>. Which process opens <code>ledger.log<\/code>, and when?","options":["The JVM, when <code>System.out<\/code> is first used","The kernel, during <code>execve<\/code>","The shell, before <code>fork<\/code>, passing the file name to java","The shell's child, after <code>fork<\/code> and before <code>execve<\/code>, pointing fd 1 at it"],"answer":3,"why":"Redirection happens in the gap between <code>fork<\/code> and <code>exec<\/code>. The child still runs the shell's code, opens the file and <code>dup2<\/code>s it onto fd 1, then <code>exec<\/code>s java. The JVM writes to fd 1 and never learns a file is behind it.","from":null},{"q":"A Kotlin service has a shutdown hook that commits Kafka offsets. Which way of stopping it skips the hook?","options":["<code>kill &lt;pid&gt;<\/code>","Ctrl-C in the terminal it runs in","<code>kill -9 &lt;pid&gt;<\/code>","<code>docker stop<\/code> on a container whose PID 1 is the JVM, when the JVM exits within 10 seconds"],"answer":2,"why":"<code>kill -9<\/code> sends <code>SIGKILL<\/code>, which no process can catch, so the JVM never runs its hooks. Plain <code>kill<\/code> sends <code>SIGTERM<\/code> and Ctrl-C sends <code>SIGINT<\/code>, and the JVM handles both by running hooks. <code>docker stop<\/code> sends <code>SIGTERM<\/code> first, and a JVM that is PID 1 has a handler for it.","from":null},{"q":"From the last lesson's tool: strace on a shell shows <code>clone(child_stack=NULL, flags=CLONE_CHILD_CLEARTID|CLONE_CHILD_SETTID|SIGCHLD, ...) = 45<\/code>. What did the shell just do?","options":["Called <code>fork<\/code>: there is no <code>CLONE_THREAD<\/code>, so 45 is a new process","Started a thread, because <code>clone<\/code> always starts threads","Ran <code>execve<\/code> in process 45","Sent <code>SIGCHLD<\/code> to process 45"],"answer":0,"why":"<code>clone<\/code> makes both threads and processes, depending on its flags. With <code>CLONE_THREAD<\/code> (and <code>CLONE_VM<\/code>) the new task joins the caller's process as a thread. Here neither flag is set and <code>SIGCHLD<\/code> is the signal to send the parent when the child dies, so this is glibc's <code>fork()<\/code>. 45 is the child's PID.","from":"os-01"}],"cards":[{"front":"What do <code>fork<\/code>, <code>execve<\/code> and <code>wait<\/code> each do?","back":"<p><code>fork<\/code> copies the calling process. <code>execve<\/code> replaces the program in a process but keeps its PID and open files. <code>wait<\/code> sleeps until a child ends and collects its status.<\/p>"},{"front":"Why are fork and exec two separate calls?","back":"<p>The child runs the parent's code between them, so a shell can set up redirection, pipes or limits before the new program starts.<\/p>"},{"front":"What is a zombie process?","back":"<p>A process that has exited but whose parent hasn't called <code>wait<\/code>. Only its PID and exit status remain. <code>ps<\/code> shows <code>Z<\/code> and <code>&lt;defunct&gt;<\/code>.<\/p>"},{"front":"How do you get rid of a zombie?","back":"<p>Make its parent call <code>wait<\/code>, or end the parent so PID 1 adopts and reaps it. <code>kill<\/code> does nothing: it's already dead.<\/p>"},{"front":"What happens to an orphan?","back":"<p>The kernel makes PID 1 (or a subreaper) its parent. PID 1 must reap it when it exits.<\/p>"},{"front":"What do exit statuses 137 and 143 mean?","back":"<p>128 + 9 (<code>SIGKILL<\/code>) and 128 + 15 (<code>SIGTERM<\/code>).<\/p>"},{"front":"Which signals can't be caught, blocked or ignored?","back":"<p><code>SIGKILL<\/code> (9) and <code>SIGSTOP<\/code> (19).<\/p>"}],"terms":[{"term":"Process","plain":"A running program plus the kernel's record of it: PID, parent, state, memory, open files and signal settings."},{"term":"PID / PPID","plain":"The process's ID and its parent's ID. Every process except PID 1 has a parent."},{"term":"fork","plain":"The call that creates a new process as a copy of the caller. On arm64 glibc implements it with <code>clone<\/code>."},{"term":"execve","plain":"The call that replaces the program running in a process. The PID and open files stay."},{"term":"Zombie","plain":"A process that has exited but not been waited for. Only its PID and exit status are left."},{"term":"Orphan","plain":"A live process whose parent has died. The kernel gives it PID 1 (or a subreaper) as its new parent."},{"term":"Signal","plain":"A small numbered message the kernel delivers to a process, such as <code>SIGTERM<\/code> (15) or <code>SIGKILL<\/code> (9)."},{"term":"Shutdown hook","plain":"A Java thread the JVM runs when it exits normally or gets <code>SIGTERM<\/code>, <code>SIGINT<\/code> or <code>SIGHUP<\/code>. It never runs on <code>SIGKILL<\/code>."}],"remote":true},"os-03":{"id":"os-03","track":"os","n":3,"title":"Threads, and how the JVM maps them to the OS","ready":true,"minutes":40,"goal":"By the end you can find any JVM thread from the kernel's side and back, explain why platform threads hit container limits, and say what virtual threads change and what they don't.","quiz":[{"q":"A Quarkus service in a pod with <code>pids.max<\/code> set to 512 starts a platform thread per request. During a spike it logs <code>OutOfMemoryError: unable to create native thread<\/code> while the heap is 30% used. What happened?","options":["The heap filled up with <code>Thread<\/code> objects","The pod reached its pids limit, because every platform thread is a task the kernel counts","The JVM ran out of metaspace","The node ran out of CPU"],"answer":1,"why":"<code>clone<\/code> failed with <code>EAGAIN<\/code> because the cgroup's task count hit <code>pids.max<\/code>, and the JVM reports that as <code>OutOfMemoryError<\/code>. The heap had room. <code>pids.events<\/code> would show the <code>max<\/code> counter going up.","from":null},{"q":"<code>top -H<\/code> shows TID 3071 at 100% CPU in a service on JDK 21. What do you search for in the <code>jstack<\/code> output?","options":["<code>nid=0xbff<\/code>","<code>#3071<\/code>","<code>nid=3071<\/code>","<code>tid=3071<\/code>"],"answer":2,"why":"Since JDK 18 <code>nid<\/code> is printed in decimal, so it matches <code>top<\/code> as is. <code>nid=0xbff<\/code> is the JDK 17 form. <code>#<\/code> is the Java thread ID, and <code>tid=<\/code> is the address of the JVM's internal thread object.","from":null},{"q":"A virtual thread calls JDBC <code>executeQuery<\/code>, which blocks reading the database socket. What happens to its carrier on JDK 25?","options":["The virtual thread unmounts, and the carrier runs other virtual threads while the query waits","The carrier blocks until the query returns","The JVM creates a new OS thread for the query","The query fails because virtual threads can't do blocking I/O"],"answer":0,"why":"Blocking on a socket is the case virtual threads were built for: the JDK saves the thread's frames on the heap and frees the carrier. It would stay on the carrier only if pinned, for example inside a class initializer. Since JDK 24 a <code>synchronized<\/code> block in the driver no longer pins.","from":null},{"q":"Which of these still pins a virtual thread to its carrier on JDK 25?","options":["Blocking on a socket read inside a <code>synchronized<\/code> block","Waiting in <code>ReentrantLock.lock()<\/code>","<code>Thread.sleep(100)<\/code>","Blocking inside a class's <code>static {}<\/code> initializer"],"answer":3,"why":"JEP 491 (JDK 24) stopped <code>synchronized<\/code> from pinning, and <code>ReentrantLock<\/code> and <code>sleep<\/code> never pinned. Class initialization still does: a virtual thread that blocks in a <code>static {}<\/code> block keeps its carrier until the initializer finishes.","from":null},{"q":"From the last lesson: a JVM with 35 threads runs <code>ProcessBuilder(\"pdftotext\", \"invoice.pdf\").start()<\/code>. How many threads does the new child process have when <code>pdftotext<\/code> starts running?","options":["35, because creating a process copies every thread","One. A new process starts with a single thread, and <code>execve<\/code> gives it <code>pdftotext<\/code>'s program","35 threads, all paused","None until <code>pdftotext<\/code> creates one"],"answer":1,"why":"<code>fork<\/code> copies only the thread that called it, and the JDK's <code>posix_spawn<\/code> route makes a single-threaded child as well. Then <code>execve<\/code> replaces the program, so <code>pdftotext<\/code> starts with exactly one thread, its main thread, and makes more only if it wants them.","from":"os-02"}],"cards":[{"front":"On Linux, what separates a thread from a process?","back":"<p>Both are tasks made by <code>clone<\/code>. A thread shares memory, files and signal handlers with its group (<code>CLONE_VM<\/code>, <code>CLONE_FILES<\/code>, <code>CLONE_SIGHAND<\/code>, <code>CLONE_THREAD<\/code>). A process gets copies.<\/p>"},{"front":"Where do you list the threads of process 812?","back":"<p><code>/proc/812/task/<\/code>, one directory per TID, or <code>ps -L -p 812<\/code>.<\/p>"},{"front":"In <code>\"fraud-scorer\" #27 [145] ... tid=0x0000ffffa014db90 nid=145<\/code>, which number is the OS thread ID?","back":"<p>145, shown as <code>[145]<\/code> and <code>nid=145<\/code>. <code>#27<\/code> is the Java thread ID and <code>tid=<\/code> is an address inside the JVM.<\/p>"},{"front":"How does jstack print <code>nid<\/code> on JDK 17 compared with JDK 21?","back":"<p>JDK 17 prints hex (<code>nid=0x91<\/code>). JDK 18 and later print decimal (<code>nid=145<\/code>), which matches <code>top -H<\/code> and <code>ps -L<\/code>.<\/p>"},{"front":"Why can a JVM fail with \"unable to create native thread\" while its heap is mostly empty?","back":"<p>Each platform thread is a kernel task. The cgroup's <code>pids.max<\/code> (or <code>ulimit -u<\/code>) counts them, and <code>clone<\/code> fails with <code>EAGAIN<\/code>.<\/p>"},{"front":"What do mount and unmount mean for a virtual thread?","back":"<p>Mount: run on a carrier platform thread. Unmount: when it blocks, its frames are saved on the heap and the carrier runs another virtual thread.<\/p>"},{"front":"What still pins a virtual thread in JDK 25?","back":"<p>Blocking in a class initializer, waiting for another thread's class initialization, and blocking in native code that called back into Java. <code>synchronized<\/code> stopped pinning in JDK 24.<\/p>"}],"terms":[{"term":"Task","plain":"The thing the Linux kernel schedules. Every thread is a task with its own TID."},{"term":"Thread group (TGID)","plain":"The tasks that share one address space, which you know as a process. Its ID is the first task's TID, the PID."},{"term":"Platform thread","plain":"A Java thread backed one-to-one by an OS thread for its whole life."},{"term":"Virtual thread","plain":"A Java thread that is a heap object and runs by mounting on a carrier. JDK 21 and later."},{"term":"Carrier thread","plain":"A platform thread in the JDK's <code>ForkJoinPool<\/code> that runs virtual threads, one at a time."},{"term":"Pinning","plain":"A virtual thread that blocks but can't unmount, so it keeps its carrier busy."},{"term":"nid","plain":"The native (OS) thread ID in a thread dump. Decimal since JDK 18, hex before."},{"term":"pids controller","plain":"The cgroup v2 limit on the number of tasks, threads included, in a group (<code>pids.max<\/code>)."}],"remote":true},"os-04":{"id":"os-04","track":"os","n":4,"title":"CPU scheduling: EEVDF, nice and CPU quotas","ready":true,"minutes":40,"goal":"By the end you can predict how Linux splits a CPU between tasks with different nice values, explain how EEVDF picks the next task, and recognise CPU quota throttling in a JVM from cpu.max, cpu.stat and the stalls it causes.","quiz":[{"q":"Two CPU-bound threads share one CPU, at nice 0 and nice 5. About how do they split it?","options":["About 50% each: both are runnable all the time","About 75% and 25%","About 60% and 40%: five levels at 10% each","100% and 0%: the nice 0 thread always goes first"],"answer":1,"why":"Nice 0 is weight 1024 and nice 5 is 335, so the split is 1024 / 1359, about 75%, against 25%. The lab box measured 7.53 s and 2.47 s. The 10% rule is relative and compounds (each level is a factor of about 1.25), so it doesn't add up to 50 points of difference.","from":null},{"q":"A pod's <code>cpu.max<\/code> is <code>100000 100000<\/code> and it runs 8 busy threads on a 16-CPU node. What does each 100 ms period look like?","options":["All 8 threads run for about 12.5 ms, then none runs until the period ends","The 8 threads take turns on one CPU in 3 ms slices","The kernel moves all 8 threads onto one CPU","Only one thread runs; the other seven never start"],"answer":0,"why":"A quota is CPU time, not a CPU. Eight threads on eight CPUs spend 100 ms of CPU time in 12.5 ms of wall time, then the group is throttled for the rest of the period. Taking turns on one CPU is what <code>--cpuset-cpus<\/code> with one CPU would do: no throttling, just sharing.","from":null},{"q":"On Linux 6.12, a task asks for a 1 ms slice with <code>sched_setattr()<\/code> while its neighbours keep the 3 ms default. All are nice 0 and CPU-bound. What changes for it?","options":["It gets three times as much CPU","It gets a third as much CPU","It runs sooner and more often, in shorter turns, with the same share","Nothing: the slice is set once for the whole system"],"answer":2,"why":"A shorter slice gives an earlier virtual deadline, so EEVDF picks the task sooner, but the task's virtual runtime still grows at the same rate per ms of CPU, so its share stays a third. In the lab's simulator its longest wait drops from 6 ms to 3 ms.","from":null},{"q":"<code>cpu.stat<\/code> in a service's container shows <code>nr_periods<\/code> up by 1,000 and <code>nr_throttled<\/code> up by 950 over the last two minutes. The CPU usage graph shows the pod at its limit. What does it mean?","options":["The node has run out of CPU","There were 950 context switches","The garbage collector paused 950 times","The pod ran out of budget in 95% of its periods, so its threads stalled at the end of nearly every period"],"answer":3,"why":"<code>nr_throttled<\/code> counts periods in which the cgroup used up its quota and was stopped. The node may be mostly idle; throttling is about this group's budget. The fix is fewer threads burning CPU at once, or a bigger limit.","from":null},{"q":"From the last lesson: a JVM on JDK 25 runs in a container started with <code>--cpus=0.5<\/code> on a 12-CPU host. How many carrier threads does the virtual-thread scheduler use by default?","options":["12, one per CPU on the host","1, because the JVM reports one available processor","None: with half a CPU, virtual threads run on the main thread","256, the scheduler's maximum pool size"],"answer":1,"why":"The carrier pool's parallelism defaults to the number of available processors, and under a 50 ms per 100 ms quota the JVM rounds 0.5 up and reports 1 (the demo printed <code>availableProcessors() = 1<\/code>). 256 is the most platform threads the scheduler may grow to when it adds carriers to make up for pinned ones, not its default size.","from":"os-03"}],"cards":[{"front":"How does Linux split one CPU between a nice 0 and a nice 10 task?","back":"<p>By weight: 1024 against 110, so about 90.3% and 9.7%. The nice 10 task is never starved.<\/p>"},{"front":"What is a task's virtual runtime?","back":"<p>Its real CPU time × 1024 / its weight. Heavy (low nice) tasks' clocks run slowly, so they stay behind and get picked more.<\/p>"},{"front":"In EEVDF, when is a task eligible?","back":"<p>When its virtual runtime is at or behind V, the weighted average of all runnable tasks' virtual runtimes (lag zero or more). Only eligible tasks may run.<\/p>"},{"front":"Among eligible tasks, which one does EEVDF run?","back":"<p>The one with the earliest virtual deadline: its virtual runtime plus its slice × 1024 / weight. Shorter slices mean earlier deadlines.<\/p>"},{"front":"What does <code>cpu.max<\/code> contain under <code>docker run --cpus=0.5<\/code>?","back":"<p><code>50000 100000<\/code>: a quota of 50 ms of CPU time per 100 ms period, for the whole group.<\/p>"},{"front":"Where do you see CPU throttling, and what does it look like to the app?","back":"<p><code>cpu.stat<\/code>: <code>nr_throttled<\/code> against <code>nr_periods<\/code> (and <code>throttled_usec<\/code>). The app sees stalls of up to a whole period while it is runnable.<\/p>"},{"front":"What three numbers are in <code>/proc/&lt;pid&gt;/schedstat<\/code>?","back":"<p>Nanoseconds on a CPU, nanoseconds waiting in a run queue, and the number of turns (timeslices) it got.<\/p>"}],"terms":[{"term":"Scheduler","plain":"The part of the kernel that picks which runnable task runs on each CPU, and for how long."},{"term":"Run queue","plain":"The per-CPU set of tasks that are ready to run and waiting for that CPU."},{"term":"Context switch","plain":"Saving one task's registers and loading another's, so a different task runs on the CPU."},{"term":"Time slice","plain":"How long a task runs once picked before the scheduler decides again; 3 ms by default on 8 or more CPUs."},{"term":"Nice and weight","plain":"Nice (-20 to 19) is how you mark a task as less important; the kernel maps it to a weight (nice 0 = 1024) and shares CPU by weight."},{"term":"Virtual runtime","plain":"Real CPU time scaled by 1024 / weight. The fair schedulers favour the task with the least."},{"term":"Lag and eligibility","plain":"Lag is how far a task is behind its fair share. A task with lag zero or more is eligible to run in EEVDF."},{"term":"CPU quota and throttling","plain":"A cgroup budget of CPU time per period (<code>cpu.max<\/code>). When it runs out, every thread in the group waits for the next period."}],"remote":true},"os-05":{"id":"os-05","track":"os","n":5,"title":"Locks at the OS level: futexes and deadlock","ready":true,"minutes":40,"goal":"By the end you can explain how a futex keeps uncontended locks out of the kernel, read futex activity and lock waits from strace, ps and jstack, and fix a deadlock by naming the condition your fix breaks.","quiz":[{"q":"Which of these makes a <code>futex<\/code> system call with a glibc mutex?","options":["Locking a mutex nobody holds","Unlocking a mutex nobody is waiting for","A thread finding the mutex held and going to sleep","Every thousandth lock, to keep the kernel's records in sync"],"answer":2,"why":"Taking a free mutex is a compare-and-swap, and unlocking one with the word at 1 is an atomic swap: no kernel. Only a thread that must wait calls <code>FUTEX_WAIT<\/code>, and the unlocker then calls <code>FUTEX_WAKE<\/code> because the word says 2. The kernel keeps no records for a futex nobody waits on.","from":null},{"q":"A C program whose eight threads do nothing but take and release one shared pthread mutex shows 9,000 <code>futex<\/code> calls with 3,500 errors under <code>strace -f -c -e trace=futex<\/code>. What are the errors?","options":["<code>FUTEX_WAIT<\/code> calls that found the word already changed and returned <code>EAGAIN<\/code> instead of sleeping","The kernel running out of memory for wait queues","Deadlocks the kernel detected and broke","Threads interrupted by <code>SIGKILL<\/code>"],"answer":0,"why":"<code>FUTEX_WAIT<\/code> sleeps only if the word still holds the value the caller expected; if the lock was released in between, it fails at once with <code>EAGAIN<\/code> and the thread retries. Those are harmless races under contention. The kernel never detects user-space deadlocks: it doesn't know what a futex word means.","from":null},{"q":"A service hangs at 0% CPU, two worker threads sleep in <code>futex_wait_queue<\/code>, and <code>jstack<\/code> prints \"Found one Java-level deadlock\" between <code>transfer<\/code> calls. Which change makes this deadlock impossible for any pair of accounts?","options":["Use <code>new ReentrantLock(true)<\/code> so the lock is fair","Add <code>Thread.sleep(10)<\/code> between taking the two locks","Give the worker pool more threads","Always lock the account with the smaller id first"],"answer":3,"why":"A global order removes circular wait: two transfers between the same accounts ask for the locks in the same order, so one waits before it holds anything. Fairness only changes who gets a free lock next; it does nothing for a lock that's never released. A sleep makes the deadlock more likely, as the demo's 50 ms pause shows.","from":null},{"q":"You change the second <code>lock()<\/code> to <code>tryLock(10, MILLISECONDS)<\/code>; on failure the thread releases the first lock and immediately tries again. Which condition did you break, and what can still go wrong?","options":["Circular wait; nothing else can go wrong","No preemption; both threads can retry in lockstep forever, a livelock, so add a random back-off","Mutual exclusion; the balances can now be corrupted","Hold and wait; the transfers now run one at a time"],"answer":1,"why":"Releasing what you hold when you can't get the next lock is self-preemption, which removes the no-preemption condition. With identical timing both threads keep grabbing their first lock and failing on the second. OSTEP's cure for that livelock is a random delay before retrying, as the demo's <code>trylock<\/code> mode does.","from":null},{"q":"From the last lesson: two threads use a spinlock (a loop on compare-and-swap), pinned to the same CPU on the lab box. The holder is switched out inside its critical section. About how long does the waiter burn CPU before the holder can run again?","options":["No time: a spinning thread gives up the CPU at once","About 100 ms: one cgroup period","About one time slice, around 3 ms on a machine with 8 or more CPUs","About 1 ms: one timer tick"],"answer":2,"why":"A spinner never blocks, so the scheduler lets it use its whole slice, and EEVDF's default slice is 3 ms with 8 or more CPUs. Only then can the holder run and release the lock. That wasted slice is why user-space locks sleep through the kernel instead of spinning for long.","from":"os-04"}],"cards":[{"front":"What does compare-and-swap do?","back":"<p>In one indivisible step: if the word holds the expected value, write the new value and report success; otherwise change nothing and report failure.<\/p>"},{"front":"What is a futex?","back":"<p>A 32-bit word in user memory used as a lock, plus a kernel wait queue per address. The kernel is called only to sleep or wake threads.<\/p>"},{"front":"What does <code>FUTEX_WAIT(addr, val)<\/code> do if <code>*addr != val<\/code>?","back":"<p>Fails at once with <code>EAGAIN<\/code> instead of sleeping. The check and the sleep are atomic, which prevents lost wake-ups.<\/p>"},{"front":"What do 0, 1 and 2 mean in glibc's mutex word?","back":"<p>0 free, 1 locked, 2 locked with (possibly) waiting threads. Releasing the lock calls <code>FUTEX_WAKE<\/code> only when it swaps out a 2.<\/p>"},{"front":"The four conditions for deadlock?","back":"<p>Mutual exclusion, hold and wait, no preemption, circular wait. All four must hold.<\/p>"},{"front":"Which condition does lock ordering break?","back":"<p>Circular wait. With one global order, no cycle of waiting threads can form.<\/p>"},{"front":"How does a Java deadlock look from the kernel's side?","back":"<p>Threads asleep (<code>S<\/code>) at 0% CPU with <code>WCHAN<\/code> <code>futex_wait_queue<\/code>. Only <code>jstack<\/code> shows the cycle.<\/p>"}],"terms":[{"term":"Critical section","plain":"The code between taking a lock and releasing it, which only one thread may run at a time."},{"term":"Compare-and-swap (CAS)","plain":"An atomic instruction that writes a new value only if the word still holds the expected one, and reports whether it did."},{"term":"Spinlock","plain":"A lock whose waiters loop on CAS instead of sleeping. Good for nanosecond critical sections, wasteful when the holder isn't running."},{"term":"Futex","plain":"Fast user-space mutex: a lock word in your memory, with the <code>futex()<\/code> system call used only to sleep and wake."},{"term":"Contention","plain":"Threads trying to take a lock that another thread holds. It is what sends a futex lock into the kernel."},{"term":"Deadlock","plain":"A set of threads each waiting for a lock another one in the set holds, so none can ever continue."},{"term":"Wait-for graph","plain":"Arrows from each waiting thread to the thread holding what it waits for. A cycle in it is a deadlock."},{"term":"Livelock","plain":"Threads that keep retrying and failing in step: busy, but making no progress."}],"remote":true},"os-06":{"id":"os-06","track":"os","n":6,"title":"Virtual memory: page tables, the TLB and page faults","ready":true,"minutes":40,"goal":"By the end you can translate a virtual address through a four-level page table by hand, explain what the TLB caches and when it runs out, and read page faults, VSZ and RSS to tell reserved memory from memory a process really uses.","quiz":[{"q":"From lesson 3: a JVM starts 500 platform threads, each with a 2 MB stack reserved. VSZ grows by about 1 GB, but RSS by only a few tens of MB. Why?","options":["The kernel compresses the stacks of idle threads","The JVM shares one stack among threads that are waiting","Each stack is a reserved region, and only the pages a thread has actually touched have frames in RAM","<code>ps<\/code> counts stacks in VSZ by mistake"],"answer":2,"why":"A thread stack is a region like the 1 GB <code>mmap<\/code> in this lesson: its pages fault in on first touch. A thread that only goes a few calls deep touches a few pages at the top of its 2 MB, so RSS counts only those. The rest stays reserved address space, which VSZ counts.","from":"os-03"},{"q":"A fraud service probes a 64 MB in-memory table at random, once per request. The CPU's TLB holds 2,048 translations. With 4 KB pages, about what share of probes miss the TLB?","options":["Most of them: 64 MB is 16,384 pages, eight times what the TLB holds","Almost none: 2,048 entries is plenty for one table","About half","None after the first pass, because the TLB keeps every page it has seen"],"answer":0,"why":"The TLB can hold 2,048 of the table's 16,384 pages, so a random probe finds its page there about one time in eight. With 2 MB pages the table is 32 pages, and nearly every probe hits. The TLB evicts as it goes, like any cache; it can't keep everything it has seen.","from":null},{"q":"<code>/usr/bin/time -v<\/code> reports 300,000 minor page faults and 0 major ones for a nightly settlement job. What does that tell you?","options":["The job was swapping heavily","The job touched about 1.2 GB of new memory with 4 KB pages, and nothing had to come from disk","The job crashed 300,000 times and was restarted","The job's data was read from files 300,000 times"],"answer":1,"why":"Minor faults are first touches the kernel served from RAM, typically by mapping zeroed pages. 300,000 × 4 KB is about 1.2 GB. Swapping and reading uncached files would show as major faults, and there were none.","from":null},{"q":"A service runs with <code>-Xms4g -Xmx4g<\/code> in a container with a 3 GB memory limit, without <code>AlwaysPreTouch<\/code>. What happens?","options":["The JVM refuses to start because -Xms exceeds the limit","Nothing ever goes wrong: the heap is virtual, so the limit doesn't apply","The container is OOM-killed at start-up while the heap is reserved","It starts and runs, and is OOM-killed later, once the heap pages it has touched plus everything else pass 3 GB"],"answer":3,"why":"Reserving the 4 GB heap only creates a region; the memory limit counts pages in RAM. As the heap fills, its pages fault in and the container's charge grows until it hits 3 GB and the kernel kills the process, possibly hours into traffic. With <code>AlwaysPreTouch<\/code> the same JVM would be killed at start-up instead.","from":null},{"q":"Touching 1 GB of 4 KB pages in the lab box made the process's page tables grow by about 2 MB. Where does 2 MB come from?","options":["Every 4 KB page needs its own 4 KB table","The TLB is saved to RAM as the process runs","262,144 pages × 8 bytes per entry: 512 level-3 tables of 4 KB each","The kernel keeps a flat array covering the whole 1 GB region"],"answer":2,"why":"Each last-level table holds 512 entries of 8 bytes and maps 2 MB, so 1 GB needs 512 of them, plus a couple of tables above. A table per page would cost 1 GB, and a flat array over the whole 48-bit address space would cost 512 GB.","from":null}],"cards":[{"front":"Page size in the lab box, and on an Apple Silicon Mac?","back":"<p>4 KB (4096) in the lab box's arm64 Linux, 16 KB (16384) on macOS. Ask with <code>getconf PAGESIZE<\/code>.<\/p>"},{"front":"How does a 48-bit address split with 4 KB pages and four levels?","back":"<p>Four 9-bit table indices (bits 47-39, 38-30, 29-21, 20-12) and a 12-bit offset (bits 11-0).<\/p>"},{"front":"Why is the page table a tree instead of an array?","back":"<p>An array for 2^36 pages at 8 bytes each would be 512 GB per process. A tree only has tables under addresses that are mapped.<\/p>"},{"front":"What is the TLB's reach?","back":"<p>Entries × page size: the memory it can translate without a walk. 2,000 entries cover 8 MB with 4 KB pages, 4 GB with 2 MB pages.<\/p>"},{"front":"Minor fault or major fault?","back":"<p>Minor: the kernel resolves it from RAM (a zeroed page, a cached file page). Major: it must read from disk first (an uncached file page, swap).<\/p>"},{"front":"VSZ vs RSS?","back":"<p>VSZ: total size of all reserved regions. RSS: pages actually in RAM. Memory limits and the OOM killer care about RSS.<\/p>"},{"front":"What does <code>-XX:+AlwaysPreTouch<\/code> do?","back":"<p>Touches every heap page at start-up, so the page faults (and the full RSS) happen before the first request instead of during traffic.<\/p>"}],"terms":[{"term":"Virtual address","plain":"An address as a program sees it, private to its process; the hardware translates it to a physical one."},{"term":"Page and frame","plain":"A fixed-size piece of virtual memory (4 KB in the lab box) and the same-size piece of physical RAM it maps to."},{"term":"Page table","plain":"The per-process tree of tables that maps virtual pages to frames. The hardware walks it; the kernel fills it."},{"term":"TLB","plain":"Translation lookaside buffer: the CPU's small cache of recent page-to-frame translations."},{"term":"Page fault","plain":"The exception the CPU raises when a translation is missing or not allowed, which hands control to the kernel."},{"term":"Demand paging","plain":"Giving a page RAM only when it is first touched, not when it is reserved."},{"term":"RSS and VSZ","plain":"Resident set size (pages of the process in RAM) and virtual size (all its reserved address space)."},{"term":"Huge page","plain":"A 2 MB page mapped by one higher-level entry, so one TLB entry covers 512 times as much memory."}],"remote":true},"os-07":{"id":"os-07","track":"os","n":7,"title":"Copy-on-write, mmap and the OOM killer","ready":true,"minutes":40,"goal":"By the end you can explain why fork of a 512 MB process copies almost nothing, tell anonymous from file-backed and shared from private mappings, read Committed_AS against CommitLimit, and tell a JVM OutOfMemoryError from a kernel OOM kill.","quiz":[{"q":"Lesson 2's <code>tinysh<\/code> runs a command with <code>fork<\/code> and then <code>exec<\/code>. With copy-on-write, roughly what does that <code>fork<\/code> cost when the parent is a JVM with 2 GB of touched memory in 4 KB pages?","options":["A 2 GB copy, which <code>exec<\/code> then throws away","A copy of the page table, a few MB, and no data pages unless one side writes before <code>exec<\/code>","Nothing at all: the child shares the parent's page table until <code>exec<\/code>","A copy of the stack only, because <code>exec<\/code> needs nothing else"],"answer":1,"why":"The child needs its own page table with read-only entries for all of the parent's pages: about 2 MB of tables per GB (lesson 6), so about 4 MB here. Data pages are copied only on a write, and <code>exec<\/code> drops the child's whole address space before it writes much. Sharing the parent's page table is what <code>vfork<\/code>-style calls do; plain <code>fork<\/code> can't, because the child may write.","from":"os-02"},{"q":"A parent and three forked workers each show RSS 900 MB in <code>ps<\/code>. <code>smaps_rollup<\/code> gives each one <code>Pss<\/code> 300 MB. About how much RAM do the four use together?","options":["3.6 GB: four times 900 MB","900 MB: they are all the same memory","About 1.2 GB: the sum of their PSS values","300 MB: the shared part only counts once"],"answer":2,"why":"PSS charges each shared page to its sharers in equal parts, so summing PSS over all processes gives the frames really in use: 4 × 300 MB = 1.2 GB (for example 800 MB shared by all four plus 100 MB private each). Summing RSS counts every shared page four times, which is how dashboards end up showing more memory than the machine has.","from":null},{"q":"A rates service maps a 1 GB reference-data file with <code>MapMode.PRIVATE<\/code> and patches a few entries in memory for a test run. What happens to the file on disk?","options":["Writeback copies the patched pages to the file within about 30 seconds","Nothing: each patched page became a private anonymous copy, and the file never changes","The changes reach the file when the buffer is garbage-collected","The JVM throws <code>ReadOnlyBufferException<\/code> on the first patch"],"answer":1,"why":"A private mapping is copy-on-write against the file. The first write to a page faults, and the kernel gives the process its own anonymous copy of that page; other processes and the file keep seeing the original. Only <code>READ_WRITE<\/code> (a shared mapping) writes into the page cache, from where writeback reaches the disk.","from":null},{"q":"A Docker container with <code>--memory 2g<\/code> runs a JVM with <code>-Xmx1800m<\/code>. It runs for hours, then disappears with exit code 137. The log ends mid-request with no exception. What happened?","options":["An <code>OutOfMemoryError<\/code> was thrown, but the log line was lost in the crash","A long GC pause made Docker's health check send <code>SIGTERM<\/code>","The JVM ran out of heap and called <code>System.exit(137)<\/code>","The heap's touched pages plus the JVM's non-heap memory crossed 2 GB, and the kernel's OOM killer sent <code>SIGKILL<\/code>"],"answer":3,"why":"137 means <code>SIGKILL<\/code>, and the kernel's memory controller kills at <code>memory.max<\/code> without the JVM getting a say. The heap grew toward 1.8 GB as it was touched, and metaspace, thread stacks and native memory came on top. An <code>OutOfMemoryError<\/code> would have exited with 1 and printed a stack trace; <code>SIGTERM<\/code> would give 143.","from":null},{"q":"In one container's cgroup, a JVM with 1.2 GB of RSS and a 50 MB shell script share a 1.5 GB limit. The script's next command allocates 300 MB and the group hits its limit. Both have <code>oom_score_adj<\/code> 0. Who gets killed?","options":["The JVM: it has by far the highest badness score","The script: it made the request that failed","Neither: the script's allocation returns <code>ENOMEM<\/code>","Both, because they share a cgroup"],"answer":0,"why":"The OOM killer scores candidates by memory held (RSS plus swap plus page tables) plus <code>oom_score_adj<\/code>, not by who asked last. The JVM's 1.2 GB beats the script's 350 MB. The failing request is a page fault, not a call that can return <code>ENOMEM<\/code>. Killing the whole group needs <code>memory.oom.group<\/code> set to 1, and Docker leaves it at 0.","from":null}],"cards":[{"front":"What does <code>fork<\/code> copy on Linux?","back":"<p>The page table (with every entry marked read-only) and the task's kernel records. Data pages are shared and copied one at a time on the first write: copy-on-write.<\/p>"},{"front":"RSS or PSS: which one can you add up across processes?","back":"<p>PSS. It splits each shared page among the processes that map it. RSS counts a shared page in full in each one.<\/p>"},{"front":"<code>MAP_SHARED<\/code> vs <code>MAP_PRIVATE<\/code> for a file?","back":"<p>Shared: writes go into the page cache and reach the file. Private: the first write to a page copies it; the file never changes.<\/p>"},{"front":"Which pages can the kernel simply drop when memory is short?","back":"<p>Clean file-backed pages, because it can read them again from the file. Anonymous pages need swap; dirty file pages must be written back first.<\/p>"},{"front":"What do <code>vm.overcommit_memory<\/code> 0, 1 and 2 mean?","back":"<p>0: heuristic, refuse obvious overcommits (default). 1: always say yes. 2: never let <code>Committed_AS<\/code> exceed <code>CommitLimit<\/code>.<\/p>"},{"front":"How does the OOM killer choose its victim?","back":"<p>Highest badness: RSS + swap + page tables, plus <code>oom_score_adj<\/code> thousandths of the allowed memory. -1000 is never chosen.<\/p>"},{"front":"<code>OutOfMemoryError<\/code> or exit code 137?","back":"<p>OOME: the Java heap hit <code>-Xmx<\/code>, an exception the JVM throws. 137: <code>SIGKILL<\/code>, usually the kernel's OOM killer at <code>memory.max<\/code>; nothing in the JVM runs.<\/p>"}],"terms":[{"term":"Copy-on-write","plain":"Sharing a page read-only between processes and copying it only when one of them first writes to it."},{"term":"PSS","plain":"Proportional set size: a process's resident pages, with each shared page divided by the number of processes that map it."},{"term":"Anonymous memory","plain":"Memory that belongs to no file and starts as zeros: heap, stacks, the Java heap."},{"term":"File-backed mapping","plain":"A region whose pages come from a file through the page cache, set up by <code>mmap<\/code> of a file."},{"term":"Overcommit","plain":"Promising processes more memory than RAM and swap hold, because most promises are never fully used."},{"term":"OOM killer","plain":"The kernel code that, when no memory can be reclaimed, picks a process by its memory use and kills it with SIGKILL."},{"term":"oom_score_adj","plain":"A per-process value from -1000 to 1000 added to its OOM badness score; -1000 means never kill it."},{"term":"memory.max","plain":"A cgroup's hard memory limit. Crossing it makes the kernel reclaim and then OOM-kill inside the group."}],"remote":true},"os-08":{"id":"os-08","track":"os","n":8,"title":"Memory allocation: malloc, arenas and why RSS grows","ready":true,"minutes":40,"goal":"By the end you can explain how malloc carves the memory it gets with brk and mmap, why freed memory usually stays in RSS, what glibc's arenas trade, and how to account for a JVM's RSS with NMT.","quiz":[{"q":"From lesson 6: right after <code>/tmp/frag 32<\/code> calls <code>malloc_trim(0)<\/code>, its heap still spans 192 MB of addresses but RSS is 33 MB. What happened to the other pages?","options":["They were written to swap","The kernel took back their frames; the addresses are still mapped, and touching one again takes a minor fault and gets a zeroed page","They were compacted: malloc moved the live blocks together","They still hold their data, but <code>ps<\/code> stops counting pages that are free in malloc"],"answer":1,"why":"<code>madvise(MADV_DONTNEED)<\/code> drops the page-table entries and frees the frames, but leaves the region in place. The next access is a first touch again: a minor fault that maps a zeroed frame. Nothing went to disk, and C's malloc can't move live blocks, because the program holds raw pointers to them.","from":"os-06"},{"q":"A service mallocs a 64 KB buffer for each request and frees it when the request ends. After a busy hour its RSS stays 300 MB higher than at start-up, then stays flat for days under steady load. Most likely?","options":["A memory leak in the request path","The kernel forgot to reclaim the pages","Freed chunks sitting in malloc's free lists and arenas at the busy hour's peak, reused by later requests","The 64 KB buffers are mmapped and never unmapped"],"answer":2,"why":"64 KB is under the 128 KB mmap threshold, so the buffers come from heaps that keep their freed chunks. RSS rises to the peak and stays there, and later requests reuse the chunks, so it doesn't grow further. A leak would keep growing under steady load. An mmapped block would go back to the kernel on <code>free<\/code>.","from":null},{"q":"A JVM with 300 platform threads runs on a 4-CPU VM. Its threads use a JNI compression library now and then. How many glibc arenas can that library's <code>malloc<\/code> calls end up spread over, with default settings?","options":["1: the JVM has a single native heap","4: one per CPU","300: one per thread","Up to 32: 8 per CPU on 64-bit, after which threads share"],"answer":3,"why":"glibc creates a new arena for a thread's first <code>malloc<\/code> until it reaches 8 × CPUs on 64-bit Linux, then assigns existing ones. In a container with only a CPU quota, glibc still counts the host's CPUs, so the limit can be much higher. <code>MALLOC_ARENA_MAX<\/code> sets it explicitly.","from":null},{"q":"NMT's committed total for a JVM stays at 600 MB for a day, while RSS climbs from 700 MB to 1.4 GB. Where should you look first?","options":["At memory outside HotSpot: native libraries' <code>malloc<\/code> and what the allocator keeps after <code>free<\/code>, for example with <code>pmap -x<\/code> and <code>MALLOC_ARENA_MAX<\/code>","At the Java heap: take a heap dump","At metaspace: classes are leaking","Nowhere: NMT is the true number and RSS is overcounting"],"answer":0,"why":"NMT tracks only HotSpot's own allocations, heap and metaspace included, and those are flat. The growth is in memory NMT can't see: JNI and JDK native libraries such as zlib, and freed chunks held by glibc. RSS is what the kernel and the container limit count, so it's the number that gets the pod killed.","from":null},{"q":"A C service allocates a 2 MB buffer per batch and frees it after. Strace shows <code>mmap<\/code> and <code>munmap<\/code> on the first batch, but from the second batch on, no system calls at all. Why?","options":["The kernel caches the last unmapped region","Freeing the 2 MB mmapped block raised glibc's mmap threshold above 2 MB, so later buffers come from the heap and are reused there","strace stops tracing after the first call of each type","glibc maps 2 MB with huge pages, which strace can't see"],"answer":1,"why":"glibc's dynamic threshold: freeing an mmapped block bigger than the threshold (and at most 32 MB) raises the threshold to that block's size. The next 2 MB request is under it, grows the heap once with <code>brk<\/code>, and after that each free and malloc reuses the same chunk without calling the kernel.","from":null}],"cards":[{"front":"What does <code>brk<\/code> do?","back":"<p>Moves the program break, the end of the process's heap region. glibc's main arena grows and shrinks the heap with it.<\/p>"},{"front":"When does glibc use <code>mmap<\/code> for a single <code>malloc<\/code>?","back":"<p>When the chunk is at least the mmap threshold (128 KB at start, raised dynamically up to 32 MB) and doesn't fit in the free lists or the top chunk.<\/p>"},{"front":"Why can RSS stay high after <code>free<\/code>?","back":"<p>Freed chunks stay on malloc's free lists, and the brk heap shrinks only from the top. Only whole free pages at the top, or with <code>malloc_trim<\/code>, go back to the kernel.<\/p>"},{"front":"What does <code>malloc_trim(0)<\/code> do?","back":"<p>Gives back every whole page inside free chunks (with <code>madvise<\/code>) and trims the top of the heap. Addresses stay; RAM goes.<\/p>"},{"front":"What is a glibc arena, and the default limit?","back":"<p>A separate heap with its own lock and free lists, given to threads to cut contention. Default limit: 8 × CPUs on 64-bit; set with <code>MALLOC_ARENA_MAX<\/code>.<\/p>"},{"front":"What does NMT not see?","back":"<p>Memory allocated by native code outside HotSpot (JDK libraries like zlib, JNI libraries) and memory glibc keeps after <code>free<\/code>.<\/p>"}],"terms":[{"term":"Program break","plain":"The end of a process's heap region; the <code>brk<\/code> system call moves it up or down."},{"term":"Chunk","plain":"A block handed out by malloc plus its hidden size header; the unit malloc splits, frees and merges."},{"term":"Top chunk","plain":"The free space at the end of a heap, up to the break, that malloc carves from when its free lists have nothing that fits."},{"term":"Fragmentation","plain":"Free memory split into pieces: too small for a request, or sharing pages with live blocks so the kernel can't take them back."},{"term":"Arena","plain":"One of glibc's separate heaps, each with its own lock, so threads don't all wait on one."},{"term":"mmap threshold","plain":"The size from which glibc gives a request its own mapping instead of carving it from a heap."},{"term":"NMT","plain":"Native Memory Tracking: HotSpot's accounting of its own native memory, by category, read with jcmd."}],"remote":true},"os-09":{"id":"os-09","track":"os","n":9,"title":"The page cache, writeback and fsync","ready":true,"minutes":40,"goal":"By the end you can say where a read and a write go in the kernel, why a successful write() isn't a durable one, what fsync costs and how group commit pays it once for many records, and how to replace a file so that a crash leaves either the old version or the new one.","quiz":[{"q":"From lesson 7: a service maps a file with <code>MapMode.READ_WRITE<\/code>, puts a record into the mapping, and the machine loses power a second later. Is the record in the file after the reboot?","options":["Yes: a shared mapping writes straight to the disk","Probably not: the store went into a page-cache page, which is dirty until writeback or <code>MappedByteBuffer.force()<\/code>","Yes, because mapped files are never cached","No, never: a shared mapping's writes are discarded when the process ends"],"answer":1,"why":"A shared file mapping points the process's page table at the page-cache frame, so a store dirties that frame exactly as <code>write()<\/code> would. Writeback or an explicit <code>force()<\/code> (<code>msync<\/code>) puts it on disk. If only the process ended, the dirty page would still be written back; a power cut loses it.","from":"os-07"},{"q":"A JVM is killed with <code>kill -9<\/code> a moment after <code>write()<\/code> returned for a record. The machine stays up. Is the record in the file?","options":["No: it was never forced","Only if the JVM's shutdown hook ran","Yes: the dirty page belongs to the kernel, which writes it back as usual","Only if the file was opened with <code>O_SYNC<\/code>"],"answer":2,"why":"After <code>write()<\/code> returns, the bytes are in the kernel's page cache, not in the process. Killing the process doesn't touch the cache, and writeback still happens. <code>fsync<\/code> protects against losing the machine; a dead process loses only what it hadn't yet passed to <code>write()<\/code>, such as a <code>BufferedOutputStream<\/code>'s buffer.","from":null},{"q":"A pod's memory usage is 3.5 GB of its 4 GB limit. <code>memory.stat<\/code> shows <code>anon<\/code> 900 MB and <code>file<\/code> 2.5 GB, mostly clean. Is the pod about to be OOM-killed?","options":["Yes: it's at 88% of its limit","Not from this: clean file pages are reclaimed when the pod needs memory, before the OOM killer runs","Yes, unless the page cache is dropped by hand","No: page cache isn't charged to the pod at all"],"answer":1,"why":"In cgroup v2 the page cache is charged to the group, so it counts in usage, but clean pages can be dropped at any time and read again from the file. The kernel reclaims them before it gives up and kills. The number to watch is <code>anon<\/code> (plus dirty pages, which must be written first), here 900 MB.","from":null},{"q":"A ledger writer forces every record on one thread, and each force takes 3 ms. About how many records a second can it write, and what's the cheapest change that keeps every record durable before its answer?","options":["About 330 a second; force once per batch of the records that arrived during the previous force (group commit)","About 330,000 a second; nothing needs to change","About 330 a second; switch from <code>force(true)<\/code> to <code>close()<\/code>","About 3,000 a second; use <code>force(false)<\/code> and skip the batching"],"answer":0,"why":"1,000 ms / 3 ms is about 333 forces a second, so one record per force caps throughput there. Group commit forces once for everything that arrived meanwhile and answers all those callers after it, so throughput grows with the batch while each record is still durable before its answer. <code>close()<\/code> forces nothing, and <code>fdatasync<\/code> saves a little metadata work but still waits for the device.","from":null},{"q":"A config writer does temp file, <code>fsync<\/code>, <code>rename<\/code>, and skips the <code>fsync<\/code> of the directory. What can a crash right after it returns leave?","options":["A half-written config file under the real name","An empty file under the real name","Two files with the real name","The old config, intact, as if the update never happened"],"answer":3,"why":"The new file's data is on disk before the rename, so the real name can only point at the complete old file or the complete new one. Without the directory <code>fsync<\/code> the rename may not be on disk yet, so a crash can roll back to the old file. Nothing is corrupted, but an update the caller was told about is lost.","from":null}],"cards":[{"front":"What is a dirty page?","back":"<p>A page-cache page that's newer than the copy on disk, because a write or a shared mapping changed it and writeback hasn't run yet.<\/p>"},{"front":"When does Linux write dirty pages back?","back":"<p>When they're older than <code>dirty_expire_centisecs<\/code> (30 s) at a flusher wake-up, when dirty data passes <code>dirty_background_ratio<\/code>, on <code>fsync<\/code>/<code>sync<\/code>, and from throttled writers past <code>dirty_ratio<\/code>.<\/p>"},{"front":"<code>force(true)<\/code> or <code>force(false)<\/code> in Java?","back":"<p><code>force(true)<\/code> is <code>fsync<\/code>: content and metadata. <code>force(false)<\/code> is <code>fdatasync<\/code> on Linux: content plus only the metadata needed to read it back.<\/p>"},{"front":"Does <code>kill -9<\/code> lose data that <code>write()<\/code> already accepted?","back":"<p>No. The page cache belongs to the kernel and is written back as usual. A power cut or kernel crash loses it.<\/p>"},{"front":"The four steps of a crash-safe file replace?","back":"<p>Write a temp file in the same directory, <code>fsync<\/code> it, <code>rename<\/code> it over the target, <code>fsync<\/code> the directory.<\/p>"},{"front":"Why <code>fsync<\/code> the directory after <code>rename<\/code>?","back":"<p>The rename changes the directory, and fsyncing the file doesn't make the directory entry durable. Without it a crash can bring back the old file.<\/p>"},{"front":"What is group commit?","back":"<p>Forcing once for all records that arrived during the previous force, then answering all their callers: one device round trip shared by many.<\/p>"}],"terms":[{"term":"Page cache","plain":"The kernel's in-RAM copy of file pages, shared by every process; reads and writes go through it."},{"term":"Dirty page","plain":"A cached page that has changed since it was last written to disk."},{"term":"Writeback","plain":"The kernel writing dirty pages to disk in the background, by age or by volume."},{"term":"fsync","plain":"The system call that writes one file's dirty data and metadata and waits until the device has stored it."},{"term":"fdatasync","plain":"Like fsync, but skips metadata that isn't needed to read the data back, such as timestamps."},{"term":"Atomic rename","plain":"rename() swapping a name to a new file in one step, so no reader sees it missing or half-changed."},{"term":"Group commit","plain":"Sharing one fsync among many records and answering all their callers after it."}],"remote":true},"os-10":{"id":"os-10","track":"os","n":10,"title":"File systems: inodes, links and file descriptors","ready":true,"minutes":40,"goal":"By the end you can tell a file's name from its inode and its file descriptor, predict what two processes writing one log file will do, find and recover a deleted file a process still holds open, and fix \"Too many open files\".","quiz":[{"q":"From lesson 2: a shell runs <code>(date; hostname) &gt; out.txt<\/code>. Why does <code>out.txt<\/code> end up with both lines instead of <code>hostname<\/code> writing over <code>date<\/code>?","options":["The shell opens <code>out.txt<\/code> with <code>O_APPEND<\/code>","Both programs inherit fd 1 pointing at the one open file description the shell made, so they share its offset","The kernel always writes at the end of a file that two processes have open","The shell collects both outputs and writes them once at the end"],"answer":1,"why":"The shell opens the file once, and each child gets fd 1 through <code>fork<\/code>, pointing at the same description, so the second program starts where the first stopped. <code>&gt;<\/code> opens with <code>O_TRUNC<\/code>, not <code>O_APPEND<\/code> (that's <code>&gt;&gt;<\/code>). The kernel doesn't append on its own: two separate <code>open()<\/code> calls would overwrite each other, as <code>share.c<\/code> showed. And the shell doesn't buffer its children's output.","from":"os-02"},{"q":"A node's <code>/var<\/code> is 98% full. <code>du -sh /var<\/code> adds up to 30 GB of a 100 GB volume. What's the most likely explanation, and the first command to run?","options":["The file system is corrupted; run <code>fsck<\/code>","The journal has grown to 70 GB; resize it","Deleted files are still held open by running processes; run <code>lsof +L1<\/code>","<code>du<\/code> doesn't count files larger than 4 GB; use <code>ls -l<\/code> instead"],"answer":2,"why":"<code>df<\/code> counts allocated blocks and <code>du<\/code> counts what names reach. A large gap means blocks with no names, which is almost always files deleted while a process holds them open. <code>lsof +L1<\/code> lists them, and truncating through <code>/proc/&lt;pid&gt;/fd/&lt;n&gt;<\/code> frees the space. The journal has a fixed size (4 MB in the Try-it's image, a few hundred MB at most on large disks), and <code>du<\/code> counts big files fine.","from":null},{"q":"<code>/data<\/code> holds <code>rates.csv<\/code>, plus a hard link <code>rates-backup.csv<\/code> and a symlink <code>rates-latest.csv -&gt; rates.csv<\/code>, all in the same directory. A job runs <code>mv rates.csv archive/<\/code>. Which names still open the data?","options":["<code>archive/rates.csv<\/code> and <code>rates-backup.csv<\/code>; the symlink now dangles","All three: links follow the file wherever it moves","Only <code>archive/rates.csv<\/code>","<code>archive/rates.csv<\/code> and <code>rates-latest.csv<\/code>; the hard link broke"],"answer":0,"why":"<code>mv<\/code> within one file system is a rename: it moves a directory entry, and the inode doesn't change. The hard link holds the inode number, so it still works. The symlink holds the path <code>rates.csv<\/code>, which no longer exists in <code>/data<\/code>, so it dangles. Nothing follows a moved file except names that hold its inode number.","from":null},{"q":"Ops set <code>ulimit -S -n 1024<\/code> for a service user, but a JVM under that user still fails with \"Too many open files\" only after about a million descriptors. Why?","options":["The kernel ignores soft limits","HotSpot raises its soft <code>RLIMIT_NOFILE<\/code> to the hard limit at start-up, so only the hard limit applies","Each Java stream uses 1,000 kernel descriptors","Sockets don't count against <code>RLIMIT_NOFILE<\/code>"],"answer":1,"why":"The soft limit is what the kernel enforces, but any process may raise it up to the hard limit, and the JVM does exactly that (<code>MaxFDLimit<\/code>, on by default; <code>strace<\/code> shows the <code>prlimit64<\/code> call). The leak then runs until the hard limit, or the machine's <code>fs.file-max<\/code>. Sockets are descriptors and count like files.","from":null},{"q":"From lesson 9: ext4 in <code>data=ordered<\/code> mode loses power 2 s after a service appended records with <code>write()<\/code> and no <code>fsync<\/code>. After the reboot the mount takes a second, with no <code>fsck<\/code>. What can you expect?","options":["The file is exactly as the last <code>write()<\/code> left it: the journal made it durable","The file system may need a full <code>fsck<\/code> before it's usable","The file system is consistent, but the file may be missing the last records or be shorter","The file is lost entirely, because the journal discards open files"],"answer":2,"why":"The journal replays committed metadata transactions, so the structure is consistent and no <code>fsck<\/code> is needed. It journals metadata only, and ext4 commits every 5 s at most, while dirty data waits up to 30 s for writeback. Records that only reached the page cache are gone, and the size may roll back to the last committed transaction. Durability of data still needs <code>fsync<\/code>.","from":"os-09"}],"cards":[{"front":"What does an inode hold, and what doesn't it hold?","back":"<p>Type, size, owner, permissions, timestamps, link count and where the data blocks are. Not its name: names live in directories.<\/p>"},{"front":"Hard link or symlink: which survives renaming the original name?","back":"<p>The hard link: it holds the inode number. A symlink holds a path, which dangles once that name is gone.<\/p>"},{"front":"When does the kernel free a deleted file's blocks?","back":"<p>When its link count is 0 and no open file description points at it, so after the last process closes it.<\/p>"},{"front":"What's in an open file description?","back":"<p>The file offset and the open flags (such as <code>O_APPEND<\/code>), plus a pointer to the inode. One per <code>open()<\/code>; shared by <code>fork<\/code> and <code>dup2<\/code>.<\/p>"},{"front":"Why does <code>O_APPEND<\/code> stop two writers from overwriting each other?","back":"<p>The kernel sets the offset to the end of the file before each write, in the same step as the write.<\/p>"},{"front":"<code>df<\/code> says 80 GB used, <code>du<\/code> says 30 GB. Where's the rest?","back":"<p>Usually in deleted files that processes still hold open. <code>lsof +L1<\/code> finds them.<\/p>"},{"front":"What's the difference between EMFILE and ENFILE?","back":"<p><code>EMFILE<\/code>: this process hit its <code>RLIMIT_NOFILE<\/code>. <code>ENFILE<\/code>: the whole machine hit <code>fs.file-max<\/code>.<\/p>"}],"terms":[{"term":"Inode","plain":"The record of one file: type, size, owner, permissions, times, link count and the blocks holding its data. It has a number, not a name."},{"term":"Directory entry","plain":"One name in a directory, paired with an inode number."},{"term":"Hard link","plain":"A second directory entry for the same inode. The inode's link count counts them."},{"term":"Symbolic link","plain":"A small inode whose content is a path, looked up again each time the link is opened."},{"term":"File descriptor","plain":"A small number in a process's fd table that points at an open file description."},{"term":"Open file description","plain":"What one open() call creates: the offset, the flags and a pointer to the inode. fork and dup2 share it."},{"term":"RLIMIT_NOFILE","plain":"The per-process limit on open descriptors, with a soft value the kernel enforces and a hard ceiling."},{"term":"Journal","plain":"A log area where a file system writes a change and a commit record before applying it, so a crash leaves the old state or the new one."}],"remote":true},"os-11":{"id":"os-11","track":"os","n":11,"title":"I/O models: blocking, epoll and io_uring","ready":true,"minutes":40,"goal":"By the end you can explain what a blocking read costs, how one thread waits on thousands of sockets with epoll, what level- and edge-triggered mean for your loop, what Java NIO and virtual threads do underneath, and why io_uring works differently and is often switched off.","quiz":[{"q":"From lesson 3: a JDK 25 service on 8 CPUs runs 5,000 requests at once on virtual threads, each blocked reading the card issuer's HTTP response. About how many OS threads serve those reads, and what are they doing?","options":["5,000, each asleep in <code>read()<\/code>","About 8 carriers that are mostly idle, plus a poller thread asleep in <code>epoll_wait<\/code>; the 5,000 virtual threads are parked on the heap","One, spinning on non-blocking reads","About 8 carriers, each blocked in <code>read()<\/code> on one connection at a time"],"answer":1,"why":"A virtual thread's blocking read is a non-blocking read underneath. When it returns <code>EAGAIN<\/code>, the JDK registers the socket with epoll and parks the virtual thread, which frees its carrier. One poller thread waits in <code>epoll_wait<\/code> for all the sockets and unparks a virtual thread when its socket is ready. Carriers never block in <code>read()<\/code> on a socket, which is the point.","from":"os-03"},{"q":"A hand-written edge-triggered epoll loop reads 4 KB from each socket it gets an event for. A client sends a 10 KB request and waits for the answer. What happens?","options":["The loop gets three events and reads all 10 KB","The kernel splits the request into 4 KB packets, one event each","The loop reads 4 KB, and the other 6 KB wait in the receive queue with no further event; the client hangs","<code>epoll_wait<\/code> returns an error because the buffer was too small"],"answer":2,"why":"Edge-triggered epoll reports a socket once per arrival of new data, and the 10 KB may arrive together. After one 4 KB read, nothing new arrives, because the client is waiting, so there is no next event. Edge-triggered code must read until <code>EAGAIN<\/code>. Level-triggered epoll would report the socket again, which is why it's the forgiving default.","from":null},{"q":"A gateway holds 10,000 connections; in a typical millisecond 5 have data. Which statement about the cost of one wake-up is right?","options":["<code>poll<\/code> and <code>epoll_wait<\/code> both check all 10,000 sockets","<code>poll<\/code> checks all 10,000 descriptors it was passed; <code>epoll_wait<\/code> returns the 5 on its ready list","<code>select<\/code> is fastest, because its bitmap is compact","<code>epoll_wait<\/code> checks all 10,000, but in the kernel, so it's free"],"answer":1,"why":"<code>poll<\/code> and <code>select<\/code> take the whole set on every call and the kernel checks each descriptor, so the cost follows the number of connections. epoll registers sockets once and the kernel adds a socket to the ready list when data arrives, so <code>epoll_wait<\/code> only looks at what's ready. <code>select<\/code> also can't handle descriptor numbers above 1,023.","from":null},{"q":"A service using Netty's io_uring transport starts fine on a developer's Linux laptop, but in a Docker container it fails at start-up with \"Operation not permitted\". What's the most likely cause?","options":["The container's kernel is too old for io_uring","Docker's default seccomp profile blocks <code>io_uring_setup<\/code>, so it fails with <code>EPERM<\/code>","io_uring needs more memory than the container's limit","Netty can't use io_uring inside a JVM"],"answer":1,"why":"Containers share the host's kernel, and the lab box's <code>io_uring_disabled<\/code> is 0, so the kernel allows it. Docker 25 and later block the three io_uring system calls in the default seccomp filter, and the call fails with <code>EPERM<\/code>. Fall back to the epoll transport, or run with a seccomp profile that allows io_uring if you accept the risk.","from":null},{"q":"A batch job reads thousands of large files from a network disk. A teammate wants to put the files in an epoll set so one thread can read them all without blocking. Why won't that work?","options":["epoll only works for TCP sockets, not Unix sockets","epoll has a limit of 1,024 descriptors","Regular files are always \"ready\": <code>epoll_ctl<\/code> refuses them with <code>EPERM<\/code>, and a read of an uncached page still blocks for the disk","Files must be opened with <code>O_APPEND<\/code> to be watched"],"answer":2,"why":"epoll answers \"can I read without waiting?\", and for a regular file the kernel has no such notion: the read waits for the disk inside the kernel. The 1,024 limit belongs to <code>select<\/code>. Waiting on many file reads at once needs several threads or a completion API such as io_uring.","from":null}],"cards":[{"front":"What does <code>read()<\/code> on an empty non-blocking socket return?","back":"<p>-1 with <code>errno<\/code> <code>EAGAIN<\/code> (\"try again\"), at once, instead of sleeping.<\/p>"},{"front":"What does epoll keep that <code>poll<\/code> doesn't?","back":"<p>An interest list registered once with <code>epoll_ctl<\/code>, and a ready list the kernel fills as data arrives. <code>epoll_wait<\/code> returns only ready sockets.<\/p>"},{"front":"Level-triggered or edge-triggered: which one strands data if you read only part of it?","back":"<p>Edge-triggered: it reports a socket once per arrival. Read until <code>EAGAIN<\/code> on every event.<\/p>"},{"front":"Which system calls is Java's <code>Selector<\/code> made of on Linux?","back":"<p><code>epoll_create1<\/code> (open), <code>epoll_ctl<\/code> (register), <code>epoll_pwait<\/code> on arm64 (select). On macOS it uses kqueue.<\/p>"},{"front":"What happens when a virtual thread's socket read finds no data?","back":"<p>The JDK registers the socket with epoll, parks the virtual thread, and the poller thread unparks it when the socket is ready; then the read is retried.<\/p>"},{"front":"Readiness model vs completion model?","back":"<p>Readiness (epoll): the kernel says when you can do the I/O without blocking. Completion (io_uring): you submit the I/O and the kernel says when it's done.<\/p>"},{"front":"Three ways io_uring gets switched off","back":"<p>Docker's default seccomp profile (since Docker 25), Google's production and ChromeOS kernels, and <code>kernel.io_uring_disabled<\/code> = 1 or 2.<\/p>"}],"terms":[{"term":"Receive queue","plain":"The kernel's buffer of bytes that arrived on a socket and haven't been read yet."},{"term":"Blocking read","plain":"A read that puts the thread to sleep until data is in the receive queue."},{"term":"O_NONBLOCK / EAGAIN","plain":"A socket flag that makes reads return at once; EAGAIN is the error meaning \"nothing yet, try again\"."},{"term":"epoll","plain":"Linux's API for waiting on many descriptors: register them once, then sleep until some are ready and get only those."},{"term":"Level-triggered","plain":"epoll reports a descriptor for as long as it stays ready."},{"term":"Edge-triggered","plain":"epoll reports a descriptor once each time it becomes ready, so the program must drain it."},{"term":"Event loop","plain":"One thread that waits for ready descriptors, handles each, and waits again; the core of NIO, Netty and Vert.x."},{"term":"io_uring","plain":"A Linux API with shared submission and completion rings, where the kernel performs the I/O and reports when it's done."}],"remote":true},"os-12":{"id":"os-12","track":"os","n":12,"title":"Containers are processes: namespaces and cgroups","ready":true,"minutes":40,"goal":"By the end you can show that a container is an ordinary process on a shared kernel, build one by hand from namespaces, a cgroup and an overlay root, predict what happens when it hits pids.max or memory.max, and read the cgroup files the JVM reads to size itself.","quiz":[{"q":"From lesson 7: two containers run on one node. Container A, limited to 512 MB, leaks memory until it hits its limit; container B has no limit and holds 3 GB. Which process does the kernel kill?","options":["B's biggest process, because it uses the most memory on the node","The biggest process in A's cgroup, because A's <code>memory.max<\/code> was hit and the OOM killer runs inside that group","Nothing: the kernel just refuses A's next <code>malloc<\/code>","Whichever process allocated last, in either container"],"answer":1,"why":"Hitting <code>memory.max<\/code> starts reclaim and then the OOM killer for that cgroup only, choosing the biggest process inside it, and <code>memory.events<\/code> in A counts <code>oom_kill<\/code>. B is outside the group and never a candidate. <code>malloc<\/code> doesn't fail on Linux here, because the memory was promised long before; the failure happens at the page fault, as lesson 7 showed.","from":"os-07"},{"q":"A container is started with its own PID namespace but no <code>--pids-limit<\/code>. Someone runs a fork bomb in it. What stops the fork bomb?","options":["The PID namespace: it only has room for 32,768 PIDs","Nothing in the container: only a <code>pids.max<\/code> above it, or the host's own task limits, can stop it","The container's PID 1 reaps the children as they appear","seccomp blocks <code>fork<\/code> after the first thousand calls"],"answer":1,"why":"A namespace renumbers processes; it doesn't count them against anything. Every child is still a task in the one kernel, so the bomb fills the host's task table until it hits <code>pids.max<\/code> of some cgroup above it or the kernel's global limits, and then every container suffers. That's what <code>--pids-limit<\/code> (and Kubernetes' pod PID limit) is for.","from":null},{"q":"A pod runs JDK 25 with <code>limits.memory: 2Gi<\/code> and <code>limits.cpu: 500m<\/code>, and no JVM flags. What does the JVM choose?","options":["A 512 MB heap, 1 CPU, Serial GC","A 1 GB heap, 1 CPU, G1","A 512 MB heap, the node's CPU count, G1","A 2 GB heap, 1 CPU, G1"],"answer":0,"why":"<code>memory.max<\/code> is 2 GB and the default <code>MaxRAMPercentage<\/code> is 25%, so 512 MB. <code>cpu.max<\/code> is <code>50000 100000<\/code>, which the JVM rounds up to 1 CPU. With fewer than 2 CPUs the machine isn't server-class, so the default collector is Serial, whatever the memory. Using all 2 GB as heap would get the pod OOM-killed, since metaspace, thread stacks and native memory come on top.","from":null},{"q":"Why does Docker's default profile block system calls like <code>mount<\/code>, <code>unshare<\/code> and the io_uring calls, even though the container's processes run as root?","options":["Because root inside a container is a different, unprivileged user on the host","Because the calls would only affect the container itself","Because every container shares the host's kernel: without a user namespace, container root is user 0 to that kernel, and a bug in any reachable call is a bug for the whole host","Because those calls are too slow for containers"],"answer":2,"why":"Docker doesn't use user namespaces by default; the Try-it showed the same user namespace inside and out. So the only things between a container's root and the kernel are its capability set and the seccomp filter. Removing whole system calls shrinks the kernel code a container can reach, which matters because that code is shared by everything on the machine.","from":null},{"q":"A container edits <code>/etc/app.conf<\/code>, which came from its image. The container is removed and a new one starts from the same image. What does the new container find in <code>/etc/app.conf<\/code>?","options":["The edited version: the edit was written into the image","The original version: the edit went to a copy in the old container's upper layer, which was deleted with it","Nothing: the file was moved to the old container's layer","The edited version, if the old container stopped cleanly"],"answer":1,"why":"Image layers are read-only. The first write copied the file up into the container's own upper directory and changed the copy there; <code>docker diff<\/code> would have shown <code>C /etc/app.conf<\/code>. <code>docker rm<\/code> deletes the upper directory, and the image underneath never changed. Data that must outlive a container goes on a volume.","from":null}],"cards":[{"front":"Namespace or cgroup: which one limits how much memory a container uses?","back":"<p>The cgroup (<code>memory.max<\/code>). A namespace only changes what a process can see.<\/p>"},{"front":"What does <code>NSpid: 40037 1<\/code> in <code>/proc/40037/status<\/code> mean?","back":"<p>The process is PID 40037 in the host's PID namespace and PID 1 in its own, nested one.<\/p>"},{"front":"What happens when a <code>fork<\/code> would pass <code>pids.max<\/code>?","back":"<p>It fails with <code>EAGAIN<\/code>, and <code>pids.events<\/code> counts <code>max<\/code>. Threads count too.<\/p>"},{"front":"What does <code>--privileged<\/code> change?","back":"<p>It gives the container every capability (<code>CapEff<\/code> 000001ffffffffff) and switches its seccomp filter off.<\/p>"},{"front":"What happens on the first write to a file from an image layer?","back":"<p>overlayfs copies the whole file up into the container's upper directory, then changes the copy.<\/p>"},{"front":"How does the JVM turn <code>cpu.max = 150000 100000<\/code> into a CPU count?","back":"<p>Quota / period = 1.5, rounded up to 2, capped by the cpuset's CPUs.<\/p>"},{"front":"What do <code>some<\/code> and <code>full<\/code> mean in a PSI <code>*.pressure<\/code> file?","back":"<p>The share of time at least one task (<code>some<\/code>) or all tasks (<code>full<\/code>) in the group waited for that resource.<\/p>"}],"terms":[{"term":"Container","plain":"One or more ordinary processes on the shared kernel, given their own namespaces, a cgroup, limited privileges and an overlay root."},{"term":"Namespace","plain":"A separate copy of one kernel table, such as PIDs, mounts, network or hostname, that a group of processes sees instead of the global one."},{"term":"cgroup","plain":"A directory under /sys/fs/cgroup holding processes that the kernel counts and limits together."},{"term":"Controller","plain":"The part of cgroups that manages one resource, such as pids, memory or cpu, through its files."},{"term":"Capability","plain":"One slice of root's power, such as CAP_CHOWN or CAP_SYS_TIME, that the kernel checks instead of user 0."},{"term":"Overlay filesystem","plain":"A mount that stacks read-only lower layers under a writable upper one, copying a file up on its first write."},{"term":"PSI","plain":"Pressure stall information: how much of the time tasks waited for CPU, memory or I/O, per cgroup and for the machine."},{"term":"USE method","plain":"Checking every resource for utilization, saturation and errors."}],"remote":true},"sql-01":{"id":"sql-01","track":"sql","n":1,"title":"The relational model, keys and NULL","ready":true,"minutes":40,"goal":"By the end you can name the candidate keys of a table, predict what NULL does to a comparison, a WHERE clause and a count, and write a one-table query whose time range, order and row limit are exactly right.","quiz":[{"q":"A new nullable column <code>refunds.note_code<\/code> holds a code for 36 of 40 refunds; 4 have none yet. 10 refunds have <code>note_code = 'FR'<\/code>. How many rows does <code>SELECT * FROM refunds WHERE note_code &lt;&gt; 'FR'<\/code> return?","options":["26","30","36","40"],"answer":0,"why":"30 refunds are not 'FR', but 4 of those 30 have NULL, and <code>NULL &lt;&gt; 'FR'<\/code> is unknown, so WHERE drops them. 26 remain. 30 is the answer the English question wants, and you get it with <code>note_code IS DISTINCT FROM 'FR'<\/code>.","from":null},{"q":"In the current data, no merchant has two payments with the same <code>created_at<\/code>. What does that tell you about the pair <code>(merchant_id, created_at)<\/code>?","options":["It is a candidate key, so it could be the primary key","It is a foreign key to merchants","Only that it is unique today; it becomes a rule only if you add a UNIQUE constraint","It is a superkey but not a candidate key"],"answer":2,"why":"A key is a promise about every row the table may ever hold. Current data can show that a set of columns is not unique, but it cannot show that it always will be. Until a UNIQUE constraint enforces it, the next import can break it.","from":null},{"q":"Why does <code>SELECT amount_minor / 100 AS amount FROM payments ORDER BY amount<\/code> work, while the same query with <code>WHERE amount &gt; 5<\/code> fails?","options":["WHERE is evaluated before the select list, and ORDER BY after it","WHERE cannot compare numeric expressions","Aliases work only in ORDER BY because of a PostgreSQL limitation that Oracle does not have","<code>amount<\/code> is a reserved word inside WHERE"],"answer":0,"why":"The logical order is FROM, WHERE, GROUP BY, HAVING, select list, DISTINCT, ORDER BY, LIMIT. When WHERE runs, the alias has not been computed yet. Oracle has the same rule for the same reason.","from":null},{"q":"A test runs <code>SELECT payment_id FROM payments WHERE card_id = 8 LIMIT 1<\/code> and expects 6, the card's oldest payment. It has passed 200 times. What is true?","options":["It will keep passing, because PostgreSQL returns rows in insertion order","It can start failing after an update to one of those rows, because without ORDER BY the order is whatever is fastest","LIMIT 1 always returns the row with the lowest primary key","It fails only on PostgreSQL 18, which changed the scan order"],"answer":1,"why":"Without ORDER BY, rows come back in whatever order the plan produces. An UPDATE writes a new row version elsewhere in the table, and an index scan would change the order again. Write <code>ORDER BY created_at, payment_id<\/code>.","from":null},{"q":"Table <code>t<\/code> has three rows with <code>score<\/code> 10, 20 and NULL. What does <code>SELECT count(*), count(score), avg(score) FROM t<\/code> return?","options":["3, 3, 10","3, 2, 15","2, 2, 15","3, 2, 10"],"answer":1,"why":"<code>count(*)<\/code> counts all three rows. <code>count(score)<\/code> and <code>avg(score)<\/code> skip the NULL, so the average is (10 + 20) / 2 = 15. \"3, 2, 10\" is what you would get if NULL counted as zero, which it does not.","from":null}],"cards":[{"front":"W
