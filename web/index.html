JVM: JDBC, pools, batching and migrations","ready":true,"minutes":40,"goal":"By the end you can say what a JDBC connection and a round trip cost, size and configure a HikariCP pool and find a leak, keep user input out of SQL with prepared statements, turn a loop of inserts into a batch and an N+1 loop into one query (and prove it by counting round trips), and change a schema safely with Flyway migrations.","quiz":[{"q":"A payments API runs 12 pods, each with a Hikari pool of 50, against one 8-core PostgreSQL server whose data fits in memory. Under load the database shows hundreds of active connections and every query is slow. What do you change first?","options":["Raise max_connections and give each pod 100 connections","Shrink the pools so all pods together hold a few dozen connections, near (8 × 2) + 0, and let requests wait in the pools","Set connectionTimeout to 0 so no request ever waits for a connection","Open a new connection per request so the pool can't run dry"],"answer":1,"why":"The server can run about 8 queries at once. Six hundred connections that all want a core make every query wait for CPU, caches and locks, so each one is slower and total throughput falls. A small total, with requests queued in the pools, keeps the server busy without thrashing; that is the HikariCP wiki's point. More connections make it worse, and a new connection per request adds the login cost to every request.","from":null},{"q":"An endpoint lets the caller choose the sort column: <code>\"SELECT ... FROM payments ORDER BY $sort\"<\/code>. How do you make it safe?","options":["Bind it: <code>ORDER BY ?<\/code> with <code>ps.setString(1, sort)<\/code>","Escape single quotes in <code>sort<\/code> before pasting it","Map the request value to one of a fixed set of column names in code, and reject anything else","Run the query on a read-only connection"],"answer":2,"why":"A placeholder carries a value, not an identifier: <code>ORDER BY ?<\/code> sorts by a constant string, the same for every row, so nothing is sorted. Escaping quotes does not help, because an identifier needs no quotes to inject (<code>created_at; DROP TABLE ...<\/code>). A read-only connection limits damage but still lets a caller read what it should not. Choose identifiers from a fixed list.","from":null},{"q":"The importer now uses <code>addBatch<\/code> and <code>executeBatch<\/code> for 10,000 rows, and its time dropped a lot. Yet <code>pg_stat_statements<\/code> still shows <code>calls = 10000<\/code> for its INSERT. Why?","options":["The batch is not working: autocommit sends each row on its own","A batch saves round trips, not statements: pgJDBC still sends one INSERT per row. <code>reWriteBatchedInserts=true<\/code> turns them into a few multi-row INSERTs","pg_stat_statements counts rows, not statements","PostgreSQL splits every batch back into single rows"],"answer":1,"why":"pgJDBC writes the queued INSERTs back to back and reads the answers only when its buffer fills, so 10,000 statements cost a handful of round trips, which is where the time went. The server still executes each one. With the rewrite flag the driver builds INSERTs with many VALUES rows, and calls drops to a few dozen. pg_stat_statements reports both calls and rows, separately.","from":null},{"q":"Lesson 9 built LATERAL joins. The dashboard loads merchants, then runs one query per merchant for its latest succeeded payment: N+1. Which single query keeps every merchant, including those with no payment?","options":["<code>FROM merchants m CROSS JOIN LATERAL (SELECT ... LIMIT 1) p<\/code>","<code>FROM merchants m JOIN payments p ON p.merchant_id = m.merchant_id ORDER BY p.created_at DESC LIMIT 1<\/code>","<code>FROM merchants m LEFT JOIN LATERAL (SELECT ... WHERE merchant_id = m.merchant_id ORDER BY created_at DESC, payment_id DESC LIMIT 1) p ON true<\/code>","<code>FROM merchants m LEFT JOIN payments p USING (merchant_id) GROUP BY m.merchant_id<\/code>"],"answer":2,"why":"LEFT JOIN LATERAL ... ON true runs the subquery once per merchant inside the server and keeps merchants whose subquery returned nothing, with NULLs. CROSS JOIN LATERAL drops them, the LIMIT 1 outside the join returns one row for the whole query, and GROUP BY alone cannot return the other columns of the latest payment.","from":"sql-09"},{"q":"A teammate fixes a typo in a comment inside <code>V7__refund_index.sql<\/code>, which production applied last month, and deploys. The service runs Flyway's <code>migrate()<\/code> at start-up. What happens?","options":["Nothing: comments do not change the schema","Flyway runs V7 again, and fails because the index exists","Flyway reports a checksum mismatch for version 7 and stops, so the service does not start","Flyway applies the new comment as version 8"],"answer":2,"why":"Flyway stores each applied script's checksum and validates before migrating. The edited file's checksum differs, so migrate fails with <code>Migration checksum mismatch for migration version 7<\/code>. It never reruns an applied version and never invents a new one. Revert the edit; if the change was deliberate, a new V8 is the way to ship it.","from":null}],"cards":[{"front":"What does <code>close()<\/code> do on a connection borrowed from a pool?","back":"<p>Gives it back to the pool, still open and logged in. The socket and the server process stay.<\/p>"},{"front":"What is HikariCP's connectionTimeout?","back":"<p>How long <code>getConnection()<\/code> waits for a free connection before throwing SQLTransientConnectionException. Default 30 seconds.<\/p>"},{"front":"The HikariCP wiki's starting point for pool size?","back":"<p>connections = (cores × 2) + effective spindles, for the database server as a whole. About 9 for 4 cores and cached data.<\/p>"},{"front":"Why can't a value bound to a PreparedStatement become SQL?","back":"<p>The driver sends the SQL text (Parse) and the values (Bind) in separate protocol messages; the server has parsed the SQL before it sees any value.<\/p>"},{"front":"addBatch alone vs reWriteBatchedInserts: what does each cut?","back":"<p>addBatch cuts round trips (2,000 rows: 9). The rewrite also cuts statements, into multi-row INSERTs (2,000 rows: 6).<\/p>"},{"front":"When does pgJDBC fetch a result in slices instead of all at once?","back":"<p>Autocommit off, a fetch size above 0, a forward-only result set, one statement. Then it uses a server cursor.<\/p>"},{"front":"Why must you never edit an applied Flyway migration?","back":"<p>Flyway stored its checksum; the next migrate fails validation with a checksum mismatch. Fix forward with a new version.<\/p>"}],"terms":[{"term":"Round trip","plain":"One send-and-wait between the driver and the server: the driver writes a request, then blocks until the answer arrives."},{"term":"Connection pool","plain":"A set of open, logged-in connections that the application borrows and returns, instead of opening one per request."},{"term":"Connection leak","plain":"A borrowed connection that is never returned; enough of them empty the pool."},{"term":"Prepared statement","plain":"SQL with placeholders whose values travel separately from the text, so they are never parsed as SQL."},{"term":"SQL injection","plain":"Input pasted into SQL text that the server parses as SQL, changing what the statement does."},{"term":"Batch","plain":"Many executions of one statement queued in the driver and sent together, in a few round trips."},{"term":"N+1 queries","plain":"One query for a list, then one more query for each row of it, usually from lazy loading."},{"term":"Migration","plain":"A numbered script that changes the schema, applied once per database and recorded in a history table."}],"remote":true},"dbi-01":{"id":"dbi-01","track":"dbi","n":1,"title":"Bytes, pages and durability: a log-structured store","ready":true,"minutes":40,"goal":"By the end you can say when a write is really on disk, build a Bitcask-style store that appends every change to one file and indexes it in RAM, and recover that store after a crash tears its last record.","quiz":[{"q":"To save latency, an authorization service appends each request to a log with <code>write<\/code>, replies OK at once, and a background thread calls <code>force<\/code> every 100 ms. What happens if the machine loses power?","options":["Nothing is lost, because the background thread forces the file soon after","Up to about 100 ms of authorizations that were already confirmed to clients can disappear","Only the request being written at that moment can be lost","The log becomes unreadable, so every authorization is lost"],"answer":1,"why":"Every record written since the last force may still be only in the page cache, and the service already said OK for all of them. The third option describes the safe design, where the reply waits for the force. The log is not unreadable: recovery keeps everything up to the torn tail.","from":null},{"q":"You plan a Bitcask-style store for 200 million idempotency keys of about 40 bytes each, with values of 300 bytes. What runs out first?","options":["Disk space, because the values are large","RAM, because the keydir holds every key and its position in memory","CPU, because every get computes a CRC","File handles, because each key needs its own file"],"answer":1,"why":"200 million keys at 40 bytes is 8 GB before any map overhead, and the keydir must hold all of them in RAM. The values, 60 GB, sit on disk, which is cheap. Reads don't need to verify the CRC on every get, and Bitcask uses a few large files, not one per key.","from":null},{"q":"On restart, the scan finds that the last record in the file has the right sizes but a CRC that does not match. What should recovery do?","options":["Keep the record, since the sizes prove it was completely written","Repair the bytes using the CRC, then apply the record","Skip that record and keep scanning for more records after it","Stop there and truncate the file at the start of that record"],"answer":3,"why":"A CRC mismatch means the bytes are not what was written, so the record cannot be trusted, and its put never returned, so dropping it loses nothing that was promised. A CRC detects damage but cannot repair it. Skipping ahead is a trap: the sizes of a damaged record can't be trusted to say where the next record starts.","from":null},{"q":"One <code>force<\/code> takes 4 ms on your drive, and one thread writes the log. Roughly how many durable commits per second can it do with a force per commit, and with one force per batch of 20 commits?","options":["About 250, and about 5,000","About 250 in both cases, because the drive is the limit","About 4,000, and about 80,000","About 5,000 in both cases, because appends are sequential"],"answer":0,"why":"1 second / 4 ms = 250 forces a second. If each force covers 20 commits, the same 250 forces make 5,000 commits durable. The drive limits forces, not commits, which is why group commit works. Each commit in a batch waits a little longer, up to one batch window.","from":null},{"q":"A product manager wants \"all captures for card 4242 between 09:00 and 10:00\" from the Bitcask store, where keys look like <code>card:4242:2026-11-07T09:15:03<\/code>. What does the store have to do?","options":["One positional read, because the keydir knows where every key is","Scan every key in the keydir, because a hash table keeps no order","Read only the newest part of the file, because the log is in time order","Use the hint file, which stores keys in sorted order"],"answer":1,"why":"A hash table answers \"where is exactly this key\" and nothing else, so a range means checking every key. The log is in write order, but writes for one card are mixed with every other card's, and old values may be dead. Hint files list keys and positions, not sorted ranges. Ordered indexes (B+trees, LSM trees) come later in this track for this reason.","from":null}],"cards":[{"front":"When <code>FileChannel.write<\/code> returns, where are your bytes?","back":"<p>In the kernel's page cache, in RAM. They reach the drive later, unless you call <code>force<\/code>.<\/p>"},{"front":"What does <code>FileChannel.force(false)<\/code> call on Linux, and on macOS?","back":"<p><code>fdatasync<\/code> on Linux. On macOS the JDK calls <code>fcntl(F_FULLFSYNC)<\/code>, which also flushes the drive's own write cache.<\/p>"},{"front":"What is Bitcask's keydir?","back":"<p>An in-memory hash table from each live key to the position and size of its newest value in the data file. A get is one lookup plus one positional read.<\/p>"},{"front":"What is a torn tail, and how does recovery spot it?","back":"<p>A last record that was only partly written when the system crashed. Recovery spots it because too few bytes are left, the sizes don't fit the file, or the CRC doesn't match.<\/p>"},{"front":"What goes wrong if recovery does not truncate the torn tail?","back":"<p>The next append lands after the garbage. The next restart stops at the garbage and drops every record written since.<\/p>"},{"front":"What is group commit?","back":"<p>Making many writes durable with one force. Each force covers every byte written before it, so commits that arrive together share the cost of one fsync.<\/p>"},{"front":"What does a merge (compaction) trade?","back":"<p>It saves space by rewriting only live records into a new file, and pays for it in write amplification: the same values get written to disk again.<\/p>"}],"terms":[{"term":"Page cache","plain":"The kernel's in-memory copy of file data. Writes land here first."},{"term":"fsync / force","plain":"The call that waits until the drive reports your written data is stored."},{"term":"Append-only log","plain":"A file that is only ever written at the end. Old records are never changed."},{"term":"Keydir","plain":"Bitcask's in-memory hash table from key to the position of its newest value."},{"term":"Tombstone","plain":"A record that marks a key as deleted, because an append-only file cannot erase."},{"term":"Torn write","plain":"A write cut short by a crash, leaving part of a record on disk."},{"term":"CRC-32C","plain":"A 32-bit checksum stored with each record so a reader can tell whether the bytes are intact."},{"term":"Write amplification","plain":"How many bytes reach the disk for each byte the application wrote, counting rewrites by merges."}],"remote":true},"dbi-02":{"id":"dbi-02","track":"dbi","n":2,"title":"Pages, tuples and heap files","ready":true,"minutes":40,"goal":"By the end you can read a PostgreSQL heap page with pageinspect, explain how a slotted page keeps variable-length rows behind slot ids that never change, and build one that inserts, deletes and compacts.","quiz":[{"q":"Every row in a table is 120 bytes including its 24-byte header. About how many rows fit on one 8 KB PostgreSQL heap page?","options":["68","65","85","64"],"answer":1,"why":"The page has a 24-byte header, and each row needs its 120 bytes plus a 4-byte line pointer: (8192 - 24) / 124 = 65.9, so 65. 68 forgets the line pointers (8168 / 120). 85 counts only the 96 bytes of column data and forgets that every row carries its own header.","from":null},{"q":"An index entry points at (page 12, slot 7). VACUUM then compacts page 12 and the row in slot 7 moves 300 bytes. What happens on the next index lookup?","options":["The lookup fails until the index is rebuilt","VACUUM rewrote the index entry to the row's new byte offset","The lookup reads slot 7, which now holds the row's new offset, and finds the row","The row was moved to a new page, so the lookup follows a forwarding pointer"],"answer":2,"why":"Indexes never store byte offsets, only (page, slot). Compaction moves the bytes and updates the slot's offset, so the same index entry keeps working without touching the index at all. That indirection is the reason slotted pages exist.","from":null},{"q":"Your lab page has 36 bytes of contiguous free space and 300 bytes in holes left by deleted records. What should <code>insert<\/code> do with a 250-byte record?","options":["Return null, because only 36 bytes are free","Put the record into the biggest hole","Reuse the slot of one of the deleted records","Compact the page first, then insert into the single 336-byte gap"],"answer":3,"why":"The record needs 254 bytes (250 plus a 4-byte slot). After compaction the free gap is 36 + 300 = 336 bytes, so it fits. Splitting a record across holes isn't possible, and reusing a dead slot id would let an old index entry find the wrong record.","from":null},{"q":"You store a 50 KB card-network response as <code>text<\/code> in an authorizations table, and it compresses poorly. What does the row on the heap page hold for that column?","options":["An 18-byte pointer to chunks of about 2,000 bytes in the table's TOAST table","The full 50 KB, spread across seven consecutive heap pages","Nothing: PostgreSQL rejects rows larger than one page","The first 2 KB of the text, with the rest in the WAL"],"answer":0,"why":"A row must fit in one page, so PostgreSQL compresses wide values and, if the row is still over about 2 KB, moves them out of line into the TOAST table and leaves an 18-byte pointer. Heap rows never span pages, and the WAL is a log of changes, not storage for column values.","from":null},{"q":"From lesson 1: a transaction inserts a row, PostgreSQL appends the change to the WAL, and COMMIT returns. The 8 KB heap page with the new row is still only in memory when the server crashes. Is the row there after restart?","options":["No, because the heap page was never written","Yes, because recovery replays the WAL and redoes the insert on the page","Only if a checkpoint had finished after the commit","Only if the table has a primary key"],"answer":1,"why":"COMMIT returns only after the WAL up to the commit record is flushed. On restart, recovery replays WAL records from the last checkpoint and re-applies the insert to the page. That is why the database doesn't need to write data pages at commit time.","from":"dbi-01"}],"cards":[{"front":"What is a ctid in PostgreSQL?","back":"<p>A row's physical address: (page number, line pointer number). Indexes store it.<\/p>"},{"front":"What do <code>pd_lower<\/code> and <code>pd_upper<\/code> mark on a page?","back":"<p><code>pd_lower<\/code> is the end of the line pointer array; <code>pd_upper<\/code> is the start of the row data. The free space is between them.<\/p>"},{"front":"Why can compaction move rows without breaking indexes?","back":"<p>Indexes point at (page, slot). Compaction moves the bytes and updates the slot's offset, so the slot number stays the same.<\/p>"},{"front":"What does a PostgreSQL DELETE do to the row on the page?","back":"<p>Nothing physical. It sets the row's <code>t_xmax<\/code> to the deleting transaction. VACUUM reclaims the space later.<\/p>"},{"front":"How big is a PostgreSQL heap tuple header, and what does a line pointer cost?","back":"<p>23 bytes, padded to 24 when there are no nulls. Each row also needs a 4-byte line pointer.<\/p>"},{"front":"When does TOAST kick in, and what is left in the row?","back":"<p>When a row is wider than about 2 KB. Big values are compressed and, if still too big, moved to the TOAST table in about 2,000-byte chunks; the row keeps an 18-byte pointer.<\/p>"}],"terms":[{"term":"Page","plain":"The fixed-size block (8 KB in PostgreSQL) a database reads, writes and caches as one unit."},{"term":"Heap file","plain":"A table file whose rows sit wherever there is room, in no order."},{"term":"Slotted page","plain":"A page layout with an array of slots at the front pointing to variable-length rows packed at the back."},{"term":"Line pointer","plain":"PostgreSQL's 4-byte slot: the row's offset, length and state."},{"term":"ctid","plain":"A PostgreSQL row's physical address, (page, line pointer number)."},{"term":"Free space map","plain":"A small side file that records roughly how much room each page has, so inserts can find one quickly."},{"term":"TOAST","plain":"PostgreSQL's way of storing big column values compressed or out of line in a separate table."}],"remote":true},"dbi-03":{"id":"dbi-03","track":"dbi","n":3,"title":"The buffer pool","ready":true,"minutes":40,"goal":"By the end you can explain how a buffer pool caches pages with pins, dirty flags and a clock sweep, read PostgreSQL's buffer cache with pg_buffercache and EXPLAIN, and build a pool that never evicts a page in use.","quiz":[{"q":"A pool has three frames holding page 7 (usage 3, unpinned), page 8 (usage 0, pinned) and page 9 (usage 1, unpinned), in that order, and the hand points at page 7's frame. <code>fetch(20)<\/code> misses. Which page is evicted?","options":["Page 7, because the hand starts there","Page 8, because its usage count is already 0","Page 9, on the hand's second pass","None: the pool throws because one frame is pinned"],"answer":2,"why":"Pass 1: page 7 goes 3 to 2, page 8 is skipped because it is pinned, page 9 goes 1 to 0. Pass 2: page 7 goes 2 to 1, page 8 is skipped again, page 9 is unpinned at 0, so it is the victim. Page 8's count of 0 doesn't matter while it is pinned, and the pool only gives up when every frame it passes is pinned.","from":null},{"q":"A handler fetches a page, and on a validation error it returns early without calling <code>unpin<\/code>. It works in every test. What happens in production?","options":["Nothing: the pool evicts the page anyway when it needs the frame","Each error leaves one more frame pinned, until a miss finds no unpinned frame and fails","The page is marked dirty and written to disk on every sweep","The usage count overflows and the page is evicted first"],"answer":1,"why":"A pinned frame is never a victim, so every leaked pin removes a frame from the pool for good. Under a steady trickle of errors the pool shrinks until a miss can't get a frame: <code>NoFreeFrameException<\/code> in the lab, <code>no unpinned buffers available<\/code> in PostgreSQL. It is the connection-leak pattern, and tests with few errors never reach the limit.","from":null},{"q":"The first run of a query shows <code>Buffers: shared read=1280<\/code>, the second <code>shared hit=1280<\/code>. A colleague concludes the first run went to the SSD 1,280 times. What is the most accurate reply?","options":["Correct: a read in EXPLAIN always means a device read","Wrong: <code>read<\/code> means the pages came from the WAL","Wrong: <code>read<\/code> counts pages PostgreSQL read twice","Not necessarily: <code>read<\/code> means a miss in shared_buffers, and the OS page cache may have served the page without touching the SSD"],"answer":3,"why":"PostgreSQL reads through the kernel. A <code>shared read<\/code> is a system call that copies the page into shared_buffers, and the kernel may already hold it in its page cache. The I/O timings tell you: 1,280 reads in 0.15 ms cannot have come from an SSD.","from":null},{"q":"shared_buffers is 16 GB. A nightly job runs <code>SELECT sum(amount_cents) FROM settlements<\/code> with a sequential scan over a 300 GB table. What happens to the hot pages of the payments table?","options":["Almost all stay cached: the scan reuses a small ring of buffers","All of them are evicted, because the scan reads 300 GB through a 16 GB cache","Half of them are evicted, because the scan may use half of shared_buffers","The scan bypasses shared_buffers and reads straight from the OS page cache"],"answer":0,"why":"The table is bigger than a quarter of shared_buffers, so the sequential scan gets a ring buffer and keeps recycling the same few hundred pages. It still goes through shared_buffers, just a tiny part of it. Without the ring, the second option is what LRU-style eviction would do.","from":null},{"q":"From lesson 2: VACUUM wants to compact a heap page while another backend has the page pinned and is reading a row from it. Why must VACUUM wait until it holds the only pin?","options":["Because compaction renumbers the slots, so the reader would find the wrong row id","Because compaction moves row bytes inside the page, and the reader may hold a pointer straight into the old position","Because the reader's pin marks the page dirty","It doesn't need to wait: compaction only changes the free space map"],"answer":1,"why":"Compaction keeps every slot number but moves row bytes and updates their offsets. A backend that pinned the page may be holding a pointer to a row's bytes in shared memory, which would suddenly point at another row or at free space. So PostgreSQL requires a cleanup lock: an exclusive lock while being the only pinner. The slot numbers never change, which is why the first option is wrong.","from":"dbi-02"}],"cards":[{"front":"What two structures make up a buffer pool?","back":"<p>A fixed array of page-sized frames in memory, and a page table that maps page id to frame.<\/p>"},{"front":"What does a pin count protect against?","back":"<p>Eviction while in use: a frame with pin count &gt; 0 is never chosen as a victim, because callers are reading or writing its memory.<\/p>"},{"front":"What must happen before a dirty victim's frame is reused?","back":"<p>Its page is written back to disk, exactly once. A clean victim is just dropped.<\/p>"},{"front":"PostgreSQL clock sweep: what does the hand do at each buffer?","back":"<p>Skip it if pinned. If unpinned with usage count &gt; 0, decrement and move on. If unpinned with usage 0, evict it.<\/p>"},{"front":"What is PostgreSQL's maximum buffer usage count, and why cap it?","back":"<p>5 (BM_MAX_USAGE_COUNT). The cap lets a once-hot page leave after a few sweeps instead of millions.<\/p>"},{"front":"When does a PostgreSQL sequential scan use a ring buffer?","back":"<p>When the table is bigger than a quarter of shared_buffers. The scan recycles a small ring instead of flooding the cache.<\/p>"},{"front":"Why can a page be cached twice in PostgreSQL?","back":"<p>PostgreSQL reads files through the kernel, so a page sits in the OS page cache and in shared_buffers. That's why the docs suggest about 25% of RAM for shared_buffers.<\/p>"}],"terms":[{"term":"Buffer pool","plain":"The database's own cache of disk pages in memory (shared_buffers in PostgreSQL)."},{"term":"Frame","plain":"One page-sized slot in the buffer pool."},{"term":"Page table","plain":"The hash map from page id to the frame that holds that page."},{"term":"Pin","plain":"A count of current users of a frame. A pinned frame cannot be evicted."},{"term":"Dirty page","plain":"A page changed in memory that must be written to disk before its frame is reused."},{"term":"Clock sweep","plain":"PostgreSQL's CLOCK eviction: a hand moves round the buffers, lowering usage counts until it finds an unpinned buffer at 0."},{"term":"Sequential flooding","plain":"A big scan pushing every useful page out of a cache by reading many pages once."},{"term":"Ring buffer","plain":"A small private set of buffers a big scan, VACUUM or bulk write reuses, so it can't flood the pool."}],"remote":true},"dbi-04":{"id":"dbi-04","track":"dbi","n":4,"title":"B+trees","ready":true,"minutes":40,"goal":"By the end you can explain why a database index is a short, wide tree of pages, trace an insert that splits a leaf and grows a new root, read PostgreSQL's B-tree pages with pageinspect, and build an order-4 B+tree with range scans.","quiz":[{"q":"A B+tree has about 400 children per internal node and 400 keys per leaf. Roughly how many levels does it need for 64 million keys?","options":["3","4","26","8"],"answer":0,"why":"400 x 400 x 400 = 64 million: the root covers 400 internal nodes, each of which covers 400 leaves of 400 keys. 26 is log2 of 64 million, the height of a binary tree. Height grows with the logarithm to base 400, which is why real indexes stay at 3 or 4 levels.","from":null},{"q":"In an order-4 B+tree (at most 3 keys per node), you insert 25 into the full leaf <code>10 20 30<\/code>. The leaf splits into <code>10 20<\/code> and <code>25 30<\/code>. What happens to 25?","options":["It moves up to the parent and is removed from the leaf","Nothing goes up; the parent finds the new leaf through the leaf chain","It is copied up as the separator and stays as the first key of the right leaf","20 is copied up, because it is the last key of the left leaf"],"answer":2,"why":"A leaf split copies the new leaf's first key into the parent and keeps it in the leaf, because the leaves must hold every key and its value. Moving the key up and out is what an internal split does with its middle key. The leaf chain is for range scans; searches only go down, so the parent needs the separator.","from":null},{"q":"A settlement report runs <code>WHERE merchant_id = 42 AND created_at &gt;= '2026-11-01'<\/code>. Which index lets PostgreSQL read one contiguous run of leaf entries?","options":["<code>(created_at, merchant_id)<\/code>","<code>(merchant_id, created_at)<\/code>","Either: both columns are in the index","Neither: a B-tree can't use two conditions at once"],"answer":1,"why":"With <code>merchant_id<\/code> first, all of merchant 42's entries are together and sorted by time, so the scan starts at the first one on or after the date and stops at the next merchant. With <code>created_at<\/code> first, merchant 42's entries are scattered among every other merchant's since that date, and the scan reads and discards them. Equality columns first, range column last.","from":null},{"q":"Two tables get 200,000 inserts each: one keyed by <code>uuidv7()<\/code>, the other by <code>gen_random_uuid()<\/code>. The random one's index has about a third more leaf pages. Why?","options":["Random UUIDs are longer than time-ordered ones","Random keys split pages in the middle and leave them about two-thirds full, while ascending keys split the rightmost leaf, which PostgreSQL leaves 90% full","PostgreSQL compresses time-ordered UUIDs","The random index has more levels, and each level adds pages"],"answer":1,"why":"Both UUID types are 16 bytes. The difference is where inserts land: random keys hit pages all over the index, and each split leaves two half-full pages that refill unevenly, so leaves average about 66%. Time-ordered keys always go to the rightmost leaf, and PostgreSQL's rightmost split keeps the left page at the 90% fillfactor. Both indexes have the same number of levels.","from":null},{"q":"From lesson 3: a primary key lookup reads the root, an internal page, a leaf and a heap page. On a busy server with a big table, which of these is most likely to need a read from disk?","options":["The root, because it is the first page read","All four equally, because the clock sweep treats every page the same","The leaf and the heap page","None: index pages are never evicted"],"answer":2,"why":"Every lookup pins the root and one of a few internal pages, so their usage counts stay at or near 5 and the clock sweep keeps passing them by. There are thousands of leaves and heap pages, and each one is touched rarely, so those are the pages that drop to usage 0 and get evicted. Index pages have no special protection; they stay because they are used.","from":"dbi-03"}],"cards":[{"front":"In this lesson's definition, what does a B+tree of order 4 allow per node?","back":"<p>At most 4 children, so at most 3 keys. Books define order in different ways, so check which one a text uses.<\/p>"},{"front":"Leaf split vs internal split: what happens to the separator?","back":"<p>A leaf split copies the new leaf's first key up and keeps it in the leaf. An internal split pushes its middle key up and removes it from both halves.<\/p>"},{"front":"Why is every leaf of a B+tree at the same depth?","back":"<p>The tree only grows when the root splits and a new root is added above it. It grows at the top, never at the bottom.<\/p>"},{"front":"Why do databases use B+trees rather than the original B-tree?","back":"<p>Internal nodes hold only keys and pointers, so fanout is higher and the tree is shorter, and linked leaves make range scans a walk along the bottom level.<\/p>"},{"front":"How many <code>int<\/code> index entries fit in a PostgreSQL B-tree page, and how full are leaves after CREATE INDEX?","back":"<p>407 entries of 20 bytes. Leaves are filled to the default fillfactor of 90%, about 367 entries.<\/p>"},{"front":"What does a PostgreSQL B-tree high key do?","back":"<p>It is the first item on every page except the rightmost on its level: an upper bound for the page's keys. With the right-link it lets a search that hits a just-split page move right (Lehman and Yao).<\/p>"},{"front":"What does PostgreSQL 18's B-tree skip scan do?","back":"<p>For a condition on a later column of a multicolumn index, it descends once per distinct value of the leading column. It pays off only when that column has few distinct values.<\/p>"}],"terms":[{"term":"B+tree","plain":"A balanced tree of pages whose internal nodes hold only separator keys and whose linked leaves hold every key and value."},{"term":"Fanout","plain":"How many children an internal node has. Hundreds per 8 KB page in a real index."},{"term":"Separator key","plain":"A key in an internal node that says which child covers which range of keys."},{"term":"Page split","plain":"Moving half of a full node's keys to a new sibling and adding a separator for it to the parent."},{"term":"High key","plain":"In PostgreSQL, the first item of a B-tree page: the upper bound of the keys that page may hold."},{"term":"Fillfactor","plain":"How full PostgreSQL packs B-tree leaves when it builds an index or splits the rightmost leaf. 90% by default."},{"term":"Clustered index","plain":"An index whose leaves hold the table's rows themselves, as InnoDB's primary key does."},{"term":"Skip scan","plain":"Using a multicolumn index without a condition on its first column, by searching once per distinct value of that column."}],"remote":true},"dbi-05":{"id":"dbi-05","track":"dbi","n":5,"title":"LSM trees, SSTables and Bloom filters","ready":true,"minutes":40,"goal":"By the end you can explain why an LSM tree turns random writes into sequential ones, trace a write, a flush, a read and a compaction through a memtable, SSTables and Bloom filters, size a Bloom filter, and build a small LSM store.","quiz":[{"q":"A store has four SSTables. You delete <code>card:7<\/code>; its tombstone is in the newest SSTable, and the oldest SSTable still holds <code>card:7 = ACTIVE<\/code>. A compaction merges only the two newest SSTables. May it drop the tombstone?","options":["Yes: the tombstone has done its job once it is merged","No: the oldest SSTable still holds card:7, and without the tombstone reads would find ACTIVE again","Yes, but only if the memtable is empty","No: tombstones are never removed from an LSM tree"],"answer":1,"why":"A tombstone hides older versions of its key. Reads stop at the first table that knows the key, so if the merged file had no entry for card:7, the read would fall through to the oldest file and return ACTIVE: a deleted card comes back. Tombstones are removed once a compaction includes every older file that could hold the key, which is why the last option is wrong.","from":null},{"q":"An SSTable's Bloom filter, sized at 10 bits per key, says \"maybe\" for <code>auth:9001<\/code>. What do you know?","options":["auth:9001 is in the file","auth:9001 is not in the file","auth:9001 is probably in the file; about 1 in 100 keys that are absent also get \"maybe\", so read the block to be sure","The filter is full and must be rebuilt"],"answer":2,"why":"A Bloom filter's \"no\" is certain and its \"maybe\" is not: all of the key's bits are 1, but other keys may have set them. At 10 bits per key and 7 hashes, about 0.8% of absent keys get a false \"maybe\". The read goes on to the index and one block, which settles it.","from":null},{"q":"On an LSM store with 6 SSTables, you run a range query: every authorization for card 4242 between 09:00 and 10:00 (keys <code>card:4242:&lt;time&gt;<\/code>). How do the Bloom filters help?","options":["They don't: a whole-key filter only answers \"is this exact key here?\", so the scan opens every file whose key range overlaps","They skip every file that doesn't contain card 4242","They return the keys in the range directly, without reading the files","They halve the number of files, like a binary search"],"answer":0,"why":"A Bloom filter is built from hashes of whole keys, and hashes destroy order, so it can't say whether any key between two bounds is present. The scan merges every SSTable whose key range overlaps. Prefix filters (RocksDB has them) can help when every query fixes the same key prefix, but a plain whole-key filter can't.","from":null},{"q":"A fraud-scoring service writes 50,000 events a second with random keys and reads back fewer than 100 a second, by exact key. Which compaction style fits, and why?","options":["Leveled: it gives the fewest files per read, which matters most here","Size-tiered (or RocksDB's universal compaction): it rewrites each byte fewer times, and reads are rare enough to pay for checking more files","None: an LSM tree can't handle that write rate","Leveled, because size-tiered can't use Bloom filters"],"answer":1,"why":"The workload is almost all writes, so write amplification is the cost to cut. Size-tiered merges files of similar size and rewrites each byte far fewer times than leveled, which RocksDB says often exceeds 10x. The price is more files per read and more space, and with rare point reads the Bloom filters absorb most of that. Both styles use Bloom filters.","from":null},{"q":"From lesson 4: in the first Try it, 10,000 time-ordered inserts dirtied about 100 pages, and 10,000 random-UUID inserts dirtied about 4,300. Why the difference?","options":["Random UUIDs are bigger, so each needs its own page","Ordered keys all go to the rightmost leaf, which fills and splits in turn, while random keys land on leaves all over the index","PostgreSQL compresses ordered keys","The random table had more rows to start with"],"answer":1,"why":"A B+tree insert goes to the leaf where its key belongs. Ascending keys always belong at the right end, so a few pages take all 10,000 inserts. Random keys belong anywhere, so nearly every insert touches a different one of the index's thousands of leaves. Both UUID kinds are 16 bytes and both tables started with a million rows.","from":"dbi-04"}],"cards":[{"front":"What is a memtable, and when is it flushed?","back":"<p>A sorted map in RAM that takes every write. When it reaches a size limit (64 MB by default in RocksDB) it is written out in key order as a new SSTable.<\/p>"},{"front":"What makes an SSTable lookup cost one read?","back":"<p>The sparse index (first key of each block) and the Bloom filter are in memory, so the lookup reads exactly one block, or nothing if the filter says no.<\/p>"},{"front":"In what order does an LSM read check its data, and when does it stop?","back":"<p>Memtable, then SSTables from newest to oldest. It stops at the first one that knows the key; a tombstone means \"not found\".<\/p>"},{"front":"Bloom filter: which answer is always right?","back":"<p>\"No\". A 0 bit proves the key was never added. \"Maybe\" can be a false positive.<\/p>"},{"front":"How many bits per key for a 1% Bloom filter, and how many hashes?","back":"<p>About 10 bits per key (RocksDB: 9.9) and k = 0.69 x 10, about 7 hashes.<\/p>"},{"front":"When may compaction drop a tombstone?","back":"<p>Only when no older file left could still hold the key. Cassandra also waits gc_grace_seconds (10 days by default).<\/p>"},{"front":"Leveled vs size-tiered compaction in one line each.","back":"<p>Leveled: at most one file per level per read, write amplification often above 10. Size-tiered: fewer rewrites, more files to read, more temporary space.<\/p>"}],"terms":[{"term":"LSM tree","plain":"A store that buffers writes in a sorted memtable, writes them out as immutable sorted files, and merges those files in the background."},{"term":"Memtable","plain":"The sorted, in-memory map that takes every write until it is flushed."},{"term":"SSTable","plain":"Sorted string table: an immutable file of records in key order, with an index and a Bloom filter."},{"term":"Sparse index","plain":"An index with one entry per block (its first key and offset) rather than one per key."},{"term":"Bloom filter","plain":"A bit array plus k hash functions that answers \"definitely not present\" or \"maybe present\" for a key."},{"term":"False positive","plain":"A \"maybe\" from a Bloom filter for a key that was never added. It costs one wasted read."},{"term":"Compaction","plain":"Merging SSTables into new ones, keeping the newest version of each key and dropping what it can."},{"term":"Read amplification","plain":"How many disk reads one lookup needs. In an LSM tree it grows with the number of files to check."}],"remote":true},"dbi-06":{"id":"dbi-06","track":"dbi","n":6,"title":"Write-ahead logging and crash recovery","ready":true,"minutes":40,"goal":"By the end you can explain why a database logs every change before it changes a page, state the commit rule and the WAL rule, trace crash recovery from a checkpoint using page LSNs, and build a small store that survives a crash at any point.","quiz":[{"q":"A service runs with <code>synchronous_commit = off<\/code>, and the server loses power. What can happen to transactions whose COMMIT had already returned?","options":["Nothing: COMMIT returned, so they are durable","The last few hundred milliseconds of them can be lost entirely, but none can be left half applied","Some of them can be half applied, so the database needs a manual check","All transactions since the last checkpoint are lost"],"answer":1,"why":"With synchronous_commit off, COMMIT returns before the log is flushed, and the WAL writer flushes within three times wal_writer_delay (600 ms by default). Those commits can vanish. The WAL rule still holds, so no page with their changes reached the disk ahead of their records, and nothing is half applied. Transactions flushed before the crash are recovered whether or not a checkpoint ran.","from":null},{"q":"A buggy storage engine writes a dirty page to the data file without first flushing the log up to that page's LSN. The page holds the debit half of a committed-in-memory transfer whose COMMIT record was still in the log buffer. The power fails. What does recovery find?","options":["The debit on disk and no record of the transfer in the log, so it can neither redo the credit nor undo the debit","Nothing wrong: recovery redoes the credit from the log","Nothing wrong: the checksum makes recovery discard the page","The transfer, complete, because pages are written in order"],"answer":0,"why":"That is exactly what the WAL rule prevents. The log records describing the transfer were never made durable, so recovery has nothing to redo the credit from and nothing that says the debit should be removed. The page checksum is valid, since the page was written completely. The money is out of balance after a clean-looking recovery.","from":null},{"q":"During recovery, a COMMIT record ends at LSN 0/4F00. The page it changed has page LSN 0/5000 on disk. What does redo do with that change?","options":["Apply it, because committed changes are always redone","Stop recovery, because the page is newer than the log","Skip it: the page was written after a later change, so it already contains this one","Apply it and set the page LSN back to 0/4F00"],"answer":2,"why":"A page LSN of 0/5000 means the page on disk already includes every change up to that point in the log, including this one. Applying an older change again could overwrite a newer value. Skipping is what makes redo idempotent. A page ahead of a record is normal; a page ahead of the end of the durable log would break the WAL rule.","from":null},{"q":"Someone sets <code>full_page_writes = off<\/code> on a PostgreSQL server on ext4 to cut WAL volume. The power fails while an 8 KB page is being written. What is the risk?","options":["None: the WAL has every change, so redo rebuilds the page","The page can be torn, half old and half new, and redo's small records can't repair it; data checksums can only report it","Only the last transaction is lost, as with synchronous_commit = off","The server refuses to start until full_page_writes is turned back on"],"answer":1,"why":"Redo records describe small changes and assume the page they apply to is intact. A full-page image after each checkpoint gives recovery a whole copy to restore first. Without it, a torn page stays torn. Checksums (on by default for new clusters since PostgreSQL 18) detect the damage, they don't repair it. The docs allow turning it off only on file systems that prevent partial writes, such as ZFS.","from":null},{"q":"From lesson 5: your LSM store acknowledges a put once it is in the memtable. What must it add so that an acknowledged put survives a crash, and when can that part of the log be deleted?","options":["Nothing: SSTables are durable","Flush the memtable after every put","Append each put to a write-ahead log and force it before acknowledging (batching puts with group commit); delete that log once the memtable has been flushed to an SSTable","Keep a Bloom filter of acknowledged keys"],"answer":2,"why":"The memtable is in RAM, so a crash loses it, as the lab test showed. Logging each put first and forcing the log makes it durable; on restart, replaying the log rebuilds the memtable. Once that memtable is written out as a forced SSTable, its log is no longer needed. Flushing the memtable on every put would make tiny SSTables and lose the point of an LSM tree.","from":"dbi-05"}],"cards":[{"front":"What does PostgreSQL write to disk at COMMIT?","back":"<p>The WAL up to and including the commit record, forced with fsync. The changed data pages stay dirty in shared_buffers.<\/p>"},{"front":"State the WAL rule.","back":"<p>Before a dirty page is written to the data file, the log must be durable at least up to that page's LSN.<\/p>"},{"front":"What is a page LSN, and what is it for?","back":"<p>The LSN just past the last log record that changed the page, stored in the page header. Redo applies a record only if the page's LSN is older, which makes redo idempotent.<\/p>"},{"front":"What does a checkpoint do, and where does recovery start?","back":"<p>It writes all dirty pages, fsyncs them and logs a checkpoint record with a redo point. Recovery starts at the redo point of the latest checkpoint, found through global/pg_control.<\/p>"},{"front":"What is a full-page image, and when is one logged?","back":"<p>A copy of a whole page in the WAL, logged with the first change to that page after each checkpoint, so recovery can restore a torn page.<\/p>"},{"front":"What can <code>synchronous_commit = off<\/code> lose?","back":"<p>The last transactions whose COMMIT returned before the WAL writer flushed, up to about 600 ms by default. Never half a transaction.<\/p>"},{"front":"How does PostgreSQL handle a transaction that never committed, after a crash?","back":"<p>Redo replays its changes too, then it counts as aborted because it has no commit record, and MVCC hides its row versions. There is no undo pass.<\/p>"}],"terms":[{"term":"Write-ahead log (WAL)","plain":"An append-only log of changes that is made durable before the changed pages are written."},{"term":"LSN","plain":"Log sequence number: a byte position in the WAL, written in PostgreSQL as two hex numbers like 0/2F12D5D8."},{"term":"Page LSN","plain":"The LSN just past the last log record that changed a page, stored in the page header."},{"term":"Checkpoint","plain":"Writing all dirty pages and logging a redo point, so recovery can start there."},{"term":"Redo","plain":"Replaying log records onto pages after a crash, skipping changes a page already has."},{"term":"Torn page","plain":"A page that is partly old and partly new on disk because a crash interrupted its write."},{"term":"Full-page image","plain":"A whole page copied into the WAL on its first change after a checkpoint."},{"term":"Steal / no-force","plain":"Dirty pages may reach disk before commit (steal), and commit doesn't write pages (no-force)."}],"remote":true},"dbi-07":{"id":"dbi-07","track":"dbi","n":7,"title":"MVCC: versions, snapshots and VACUUM","ready":true,"minutes":40,"goal":"By the end you can explain how PostgreSQL keeps several versions of one row, decide which version a snapshot sees from <code>xmin<\/code>, <code>xmax<\/code> and the snapshot's running list, say why a second writer waits or fails, and build a multi-version store whose VACUUM a long-running reader holds back.","quiz":[{"q":"A snapshot is <code>900:905:902<\/code>. Wallet 9 has version A (<code>xmin 880, xmax 902<\/code>) and version B (<code>xmin 902, xmax 0<\/code>). Transaction 902 has since committed. Which version does this snapshot read?","options":["A: 902 is on the snapshot's running list, so its delete and its insert both stay invisible","B: the commit log now says 902 committed","Neither: A is deleted and B is too new","Both, until VACUUM removes A"],"answer":0,"why":"The snapshot recorded 902 as running, and that is final for this snapshot: 902's changes stay invisible whatever the commit log says later. So A's deletion doesn't count and B's creation doesn't either. B is the tempting answer, and it is what a READ COMMITTED statement that starts after the commit would read, with a new snapshot.","from":null},{"q":"A Quarkus endpoint updates a merchant row, then calls a card issuer that hangs for 40 minutes before timing out, all in one transaction. Autovacuum visits the busy <code>authorizations<\/code> table in the same database, which the stuck transaction never touched. What happens?","options":["Autovacuum cleans <code>authorizations<\/code> as usual, since the stuck transaction never read it","Autovacuum waits for a lock the stuck transaction holds on <code>authorizations<\/code>","Autovacuum aborts the stuck transaction to free the horizon","The stuck transaction's id holds the horizon back, so versions of <code>authorizations<\/code> that died after it started can't be removed for 40 minutes"],"answer":3,"why":"The horizon is one number for the database: the oldest running transaction or snapshot. A transaction that has written something keeps its id running until it ends, so every version deleted after it started is kept, in every table. The first option is the natural guess, and it is wrong because VACUUM never checks which tables a transaction touched. Autovacuum doesn't abort anyone; <code>idle_in_transaction_session_timeout<\/code> can end such a session.","from":null},{"q":"From lesson 6: after a crash, PostgreSQL's redo replays a transaction that never committed, so its new row version is physically on the page. Why does no query ever see that version, with no undo pass?","options":["Recovery deletes it as its last step","Its page LSN is older than the checkpoint","Its <code>xmin<\/code> has no commit in the commit log, so the transaction counts as aborted, and the version fails the visibility rule for every snapshot","Redo writes it with <code>t_xmax<\/code> already set"],"answer":2,"why":"Visibility depends on the commit log, not on whether bytes are on the page. A transaction with no commit record is aborted, every version it created is invisible, and VACUUM removes them later. That is why PostgreSQL's recovery is redo-only, while ARIES-style engines like InnoDB need an undo pass. Lesson 6's Try it found such a version in slot 130 and <code>pg_xact_status<\/code> said aborted.","from":"dbi-06"},{"q":"You update all 10,000 rows of a table twice with autovacuum off, end every transaction, then run a plain <code>VACUUM<\/code>. What happens to the table file?","options":["It shrinks back to its size before the updates","It keeps its size: the dead versions' space becomes free for new versions inside the file","It is rewritten into a new file under an exclusive lock","It grows, because VACUUM copies the live rows to new pages"],"answer":1,"why":"Plain VACUUM marks the dead versions' space free and records it in the free space map; it only gives back empty pages at the very end of the file. The Try it showed 163 pages before and after, with 108 pages empty. Rewriting into a new file under an ACCESS EXCLUSIVE lock is VACUUM FULL.","from":null},{"q":"Two REPEATABLE READ transactions both read <code>card-1 = 7,500<\/code> and <code>card-2 = 7,500<\/code>, check that the sum stays at least 0 after a 10,000 withdrawal, and then A withdraws from card 1 and B from card 2. Both commit and the sum is -5,000. Why didn't first-updater-wins stop it?","options":["It did: B fails when it commits","REPEATABLE READ takes a new snapshot for each statement","The two cards were on different pages","They wrote different rows, so neither found the other's id in a <code>t_xmax<\/code>: there was no write-write conflict to catch"],"answer":3,"why":"First-updater-wins only compares writers of the same version. Here each transaction read both rows but wrote only one, and each decision rested on a row the other changed. This is write skew, and snapshot isolation allows it; the lab's write-skew test passes for the same reason. PostgreSQL's SERIALIZABLE level, in lesson 8, detects the pattern and aborts one of them.","from":null}],"cards":[{"front":"What do <code>t_xmin<\/code> and <code>t_xmax<\/code> in a tuple header hold?","back":"<p>The id of the transaction that created this version, and the id of the one that deleted or replaced it (0 if none has).<\/p>"},{"front":"What does an UPDATE do to the heap in PostgreSQL?","back":"<p>It sets <code>t_xmax<\/code> on the old version, writes a whole new version with its own id as <code>t_xmin<\/code>, and points the old version's <code>t_ctid<\/code> at the new one.<\/p>"},{"front":"Read the snapshot <code>859:861:859<\/code>.","back":"<p>Ids below 859 had finished; ids from 861 up don't count; 859 was still running. A transaction's changes are visible if it committed, is below 861 and is not 859.<\/p>"},{"front":"State the visibility rule.","back":"<p>A version is visible if the snapshot sees its <code>xmin<\/code> (your own id, or committed, below <code>xmax<\/code> and not running) and its <code>xmax<\/code> is 0 or not seen.<\/p>"},{"front":"READ COMMITTED vs REPEATABLE READ, in snapshot terms?","back":"<p>READ COMMITTED takes a new snapshot for every statement. REPEATABLE READ takes one at the first statement and keeps it to the end.<\/p>"},{"front":"What can hold back VACUUM in a whole database?","back":"<p>Anything that keeps the horizon old: a long or idle transaction that has written, a REPEATABLE READ transaction left open, a replica with <code>hot_standby_feedback<\/code> on.<\/p>"},{"front":"Why does PostgreSQL freeze old tuples?","back":"<p>Ids are 32-bit and compared in a circle, so after about 2 billion transactions an old <code>xmin<\/code> would look like the future. A frozen tuple is visible to everyone and its <code>xmin<\/code> is never checked again.<\/p>"}],"terms":[{"term":"MVCC","plain":"Multi-version concurrency control: keep old versions of rows so readers see a consistent state without blocking writers."},{"term":"Transaction id (xid)","plain":"A 32-bit counter value PostgreSQL gives a transaction when it first writes; stamped into the versions it creates and deletes."},{"term":"Snapshot","plain":"Which transactions a reader counts as finished: an <code>xmin<\/code>, an <code>xmax<\/code> and the list of ids that were running in between."},{"term":"Visibility rule","plain":"A version is visible if its creator is seen by the snapshot and its deleter is not."},{"term":"Commit log (pg_xact)","plain":"Two bits per transaction id saying in progress, committed or aborted. COMMIT and ROLLBACK only change these bits."},{"term":"Horizon","plain":"The oldest snapshot <code>xmin<\/code> or running id in the database. VACUUM may remove a version only if its deleter committed below it."},{"term":"HOT update","plain":"Heap-only tuple: an update that changes no indexed column and fits on the same page, so no index entry is written."},{"term":"Freezing","plain":"Marking an old version as visible to every snapshot, so its transaction id can be reused after wraparound."}],"remote":true},"dbi-08":{"id":"dbi-08","track":"dbi","n":8,"title":"Concurrency control: locks, deadlocks and SSI","ready":true,"minutes":40,"goal":"By the end you can explain why writers lock rows until commit, read <code>pg_locks<\/code> to see who waits for whom, find a deadlock as a cycle in a waits-for graph, say how SERIALIZABLE catches write skew without blocking readers, and build a lock manager that detects deadlocks.","quiz":[{"q":"T1 holds a shared lock on row acct-9. T2 is waiting for an exclusive lock on it. T3 now asks for a shared lock on acct-9. What does a fair lock manager like the lab's do with T3?","options":["Grant it at once, since S is compatible with T1's S","Make it wait behind T2, so that T2 isn't starved by a stream of readers","Abort T2 to let T3 in","Grant it and move T2 to the back of the queue"],"answer":1,"why":"Granting T3 would be compatible with the current holder, but then T4, T5 and every later reader could also jump ahead, and T2 might wait forever. So a request waits whenever anyone is waiting ahead of it. This is the same rule that makes a plain SELECT wait behind a queued ALTER TABLE in PostgreSQL.","from":null},{"q":"A transaction releases its lock on account 1 right after debiting it, then locks account 2 to credit it, and finally fails and rolls back. Meanwhile another transaction updated account 1 and committed. What went wrong?","options":["Nothing: the rollback restores account 1 and keeps the other change","A deadlock, which the database resolves","The other transaction built on a debit that was rolled back; locks must be held until commit (strict two-phase locking)","A write-skew anomaly, which only SERIALIZABLE catches"],"answer":2,"why":"Releasing a lock early lets other transactions see and build on a change that may still be undone. Rolling back the debit would then also erase or contradict the committed change. Strict 2PL avoids this by releasing everything only at COMMIT or ROLLBACK. Nothing here waits in a cycle, so it isn't a deadlock.","from":null},{"q":"The waits-for graph has edges T1 -&gt; T2, T2 -&gt; T3, T3 -&gt; T1 and T4 -&gt; T1. Which transactions does the lab's detector abort?","options":["T4, the youngest overall","All four","None: the detector only handles cycles of two","T3, the youngest on the cycle; T4 just waits for T1"],"answer":3,"why":"Only T1, T2 and T3 form a cycle; T4 waits on it but isn't part of it, so aborting T4 would break nothing. Aborting T3 releases its locks and removes its waiting request, so T2 can proceed, then T1, then T4. Picking the highest id overall is the tempting mistake, and one of the lab's tests catches it.","from":null},{"q":"Under PostgreSQL's SERIALIZABLE, a report runs <code>SELECT sum(amount_cents) FROM settlements<\/code> for 20 seconds while 1,000 inserts into <code>settlements<\/code> commit. What happens to the inserts during those 20 seconds?","options":["They run without waiting; SIREAD locks never block, though the report or a writer may later fail with 40001 if a dangerous pattern appears","They wait until the report commits, because the report's read locks block writers","They fail at once with 40001","They run, and the report sees each one as it commits"],"answer":0,"why":"SSI's SIREAD locks only record what was read; the docs say they never block and can't cause a deadlock. The writers proceed, and the check for read-write dependencies decides at write or commit time whether someone must be aborted. Waiting for readers is what strict 2PL would do. The report never sees the inserts: it reads from its snapshot.","from":null},{"q":"From lesson 7: two transactions under REPEATABLE READ update the same row. The first commits. What happens to the second, and what does lesson 8's lock manager add to that picture?","options":["Both commit; the second overwrites the first","The second waits for the first (on its transaction id) and then fails with 40001; the waiting is the lock manager's queue, the failure is the snapshot rule","The second fails at once with a deadlock error","The second waits, then applies its change on top of the first"],"answer":1,"why":"The first writer's id in <code>t_xmax<\/code> is the row lock, so the second writer waits for that transaction to end. Once it commits, a REPEATABLE READ transaction can't update a version it can't see, so it gets <code>could not serialize access due to concurrent update<\/code>. Applying on top of the new version is what READ COMMITTED does, which is the tempting answer.","from":"dbi-07"}],"cards":[{"front":"Which lock modes are compatible: S with S, S with X, X with X?","back":"<p>Only S with S. An exclusive lock is compatible with nothing.<\/p>"},{"front":"Where does PostgreSQL keep a row lock, and what does a waiter wait on?","back":"<p>In the row's <code>t_xmax<\/code>, as the locker's transaction id. The waiter waits for a ShareLock on that transaction id, which it gets when the transaction ends.<\/p>"},{"front":"What is strict two-phase locking?","back":"<p>Take locks as you go and release all of them only at COMMIT or ROLLBACK, so nobody builds on a change that might be rolled back.<\/p>"},{"front":"Why can a plain SELECT wait behind an ALTER TABLE?","back":"<p>The ALTER waits for ACCESS EXCLUSIVE, and the lock queue is fair: a later request waits behind anyone queued ahead with a conflicting mode.<\/p>"},{"front":"What is a deadlock, and how does PostgreSQL find one?","back":"<p>A cycle in the waits-for graph. A backend that has waited <code>deadlock_timeout<\/code> (1 s) searches the graph and, on a cycle, usually aborts its own transaction with SQLSTATE 40P01.<\/p>"},{"front":"What is a pivot in SSI?","back":"<p>A transaction with a read-write dependency coming in and another going out. Every serialization anomaly contains one, so PostgreSQL aborts when it sees one (SQLSTATE 40001).<\/p>"},{"front":"Do SIREAD locks block anyone?","back":"<p>No. They only record what a SERIALIZABLE transaction read, so writes to that data can be turned into read-write dependencies.<\/p>"}],"terms":[{"term":"Shared / exclusive lock","plain":"S lets other S holders in; X lets nobody else in. Reads that need stability take S, writes take X."},{"term":"Lock manager","plain":"The component that records, per locked object, who holds it in which mode and who waits in line."},{"term":"Two-phase locking (2PL)","plain":"Never take a lock after releasing one. The strict form releases everything at commit or rollback."},{"term":"Deadlock","plain":"Transactions waiting for each other in a cycle, so none can ever proceed."},{"term":"Waits-for graph","plain":"A graph with an edge from each waiting transaction to each transaction it waits for; a cycle is a deadlock."},{"term":"SIREAD lock","plain":"A non-blocking note that a SERIALIZABLE transaction read a row, page or table."},{"term":"Read-write dependency","plain":"T1 read a version that a concurrent T2 then replaced, so T1 must come before T2 in any equivalent serial order."},{"term":"Serializable snapshot isolation (SSI)","plain":"Snapshot isolation plus tracking of read-write dependencies, aborting a transaction when a dangerous pattern appears."}],"remote":true},"dbi-09":{"id":"dbi-09","track":"dbi","n":9,"title":"Query execution: iterators, joins and vectors","ready":true,"minutes":40,"goal":"By the end you can explain how a plan runs as a tree of iterators that pull one row at a time, predict the work a nested loop, hash and merge join do and find it in EXPLAIN ANALYZE, say what vectorized execution saves, and build a small Volcano executor with a vectorized filter.","quiz":[{"q":"EXPLAIN ANALYZE shows <code>Index Scan using merchants_pkey on merchants m (actual rows=1.00 loops=250)<\/code> under a Nested Loop. How many merchant rows did this node return in total?","options":["1","250","1,000","It can't be known from this line"],"answer":1,"why":"For a node that runs several times, EXPLAIN shows rows as an average per loop. The inner index scan ran 250 times, once per outer row, and returned 1 row each time on average: 250 rows in total. Reading <code>rows=1.00<\/code> as the total is the classic misreading, and it hides that the node ran 250 times.","from":null},{"q":"Join 2 million authorizations with 50 card networks on <code>network_id<\/code>. Neither table has an index on the join columns, and nothing is sorted. Which join does the least work?","options":["Nested loop with the networks outside: 50 scans of 2 million rows","Nested loop with the authorizations outside: 2 million scans of 50 rows","Hash join building a table of the 50 networks and probing it once per authorization","Merge join after sorting both tables"],"answer":2,"why":"The hash join reads each table once: 50 rows to build a tiny table, then 2 million probes, about 2 million units of work. Either nested loop examines 100 million pairs. A merge join would first sort 2 million rows, which costs more than hashing them, since nothing arrives sorted.","from":null},{"q":"<code>SELECT * FROM payments ORDER BY created_at LIMIT 10<\/code> runs on 10 million rows with no index on <code>created_at<\/code>. How many rows does the plan read before the first row comes out?","options":["10, because LIMIT stops the scan","About 100, because the sort works in chunks","It depends on how many rows fit in work_mem","All 10 million, because the last row read might be the first in order"],"answer":3,"why":"A sort is a pipeline breaker: it can't return its first row until it has seen every input row. PostgreSQL makes this one cheap in memory, with a top-N heapsort that keeps only the best 10 rows, but it still reads all 10 million. An index on <code>created_at<\/code> would deliver rows already in order, and then LIMIT could stop the scan after 10.","from":null},{"q":"From lesson 4: an index nested loop join looks up the merchants of 10,000 payments in a B+tree of height 3 on <code>merchants.id<\/code>. Roughly how many index page accesses does that take, and why is it cheaper than it sounds?","options":["About 30,000, three per lookup from root to leaf, but the root and the upper level stay in the buffer pool, so most are memory hits","10,000, one per lookup","3, because the tree is read once and reused","About 10 million, because each lookup scans the leaf level"],"answer":0,"why":"Each lookup descends from the root through one inner level to a leaf: three page accesses. The root and the inner pages are touched by every lookup, so they stay hot in the buffer pool from lesson 3, and only leaf pages may need a disk read. Scanning the leaf level is what a B+tree lets you avoid.","from":"dbi-04"},{"q":"On one CPU core, why does a vectorized filter over 10 million amounts run several times faster than a Volcano filter over the same data?","options":["It reads less data from disk","It pays the call overhead once per batch and spends its time in a tight loop over an array that the CPU can pipeline and the compiler can vectorize","It uses an index to skip rows","It runs the batches on several threads"],"answer":1,"why":"Both read the same values, on one thread, with no index. The Volcano filter makes calls and walks an expression for every row; the vectorized one makes one call per 1,024 rows and runs a loop with no calls inside, which modern CPUs and JIT compilers execute very efficiently. The demo measured 13.9 ns per row against 1.9.","from":null}],"cards":[{"front":"What are the three methods of an operator in the iterator (Volcano) model?","back":"<p><code>open()<\/code> to prepare, <code>next()<\/code> to return one row or null at the end, <code>close()<\/code> to clean up. Parents call <code>next()<\/code> on their children.<\/p>"},{"front":"What is a pipeline breaker?","back":"<p>An operator that must read all its input before returning its first row, such as a sort or the build side of a hash join.<\/p>"},{"front":"How much work does a nested loop join do?","back":"<p>Outer rows x inner rows comparisons. With an index on the inner key: one index lookup per outer row instead.<\/p>"},{"front":"What are the two phases of a hash join?","back":"<p>Build: read the smaller input into a hash table on the join key. Probe: read the other input once and look up each row's key.<\/p>"},{"front":"What does <code>Batches: 4<\/code> on a Hash node mean?","back":"<p>The build side didn't fit in <code>work_mem<\/code> x <code>hash_mem_multiplier<\/code>, so both inputs were split into 4 batches written to temp files and joined one pair at a time.<\/p>"},{"front":"How do you read <code>rows=1.00 loops=250<\/code> in EXPLAIN ANALYZE?","back":"<p>The node ran 250 times and returned 1 row per run on average: 250 rows in total. Multiply rows by loops.<\/p>"},{"front":"What is vectorized execution?","back":"<p>Operators pass batches of values (DuckDB: 2,048) stored by column, and process each batch in a tight loop, paying per-call overhead once per batch.<\/p>"}],"terms":[{"term":"Plan","plain":"The tree of operators the planner builds for a query; EXPLAIN prints it, root at the top."},{"term":"Iterator (Volcano) model","plain":"Every operator has open, next and close, and pulls one row at a time from its children."},{"term":"Pipeline breaker","plain":"An operator that consumes all its input before producing output, such as a sort or a hash build."},{"term":"Nested loop join","plain":"For each outer row, scan the inner input and return the matching pairs."},{"term":"Index nested loop join","plain":"A nested loop whose inner side is an index lookup on the join key, one per outer row."},{"term":"Hash join","plain":"Build a hash table from one input, then probe it with each row of the other. Equality joins only."},{"term":"Merge join","plain":"Walk two inputs sorted on the join key side by side, as when merging sorted lists."},{"term":"Vectorized execution","plain":"Operators pass batches of about a thousand values by column instead of one row per call."}],"remote":true},"dbi-10":{"id":"dbi-10","track":"dbi","n":10,"title":"Query optimization and cardinality estimates","ready":true,"minutes":40,"goal":"By the end you can explain how a planner prices plans with a cost model, compute a row estimate from <code>pg_stats<\/code> the way PostgreSQL does, show how correlated columns break the independence assumption and fix it with <code>CREATE STATISTICS<\/code>, and build an estimator and a join orderer that uses dynamic programming.","quiz":[{"q":"<code>pg_stats<\/code> for <code>payments.currency<\/code> (1,000,000 rows): <code>n_distinct<\/code> 6, MCVs {EUR, GBP} with frequencies {0.6, 0.25}. How many rows does PostgreSQL estimate for <code>currency = 'SEK'<\/code>?","options":["0, because SEK is not in the MCV list","166,667, one sixth of the rows","37,500","150,000, everything the MCVs don't cover"],"answer":2,"why":"A value outside the MCV list gets an even share of the rows the MCVs don't cover: (1 - 0.85) / (6 - 2) = 0.0375, so 37,500 rows. One sixth ignores that EUR and GBP take 85% of the rows. 150,000 would give all of the rest to SEK, though four currencies share it. A missing value isn't assumed absent, because the statistics come from a sample.","from":null},{"q":"Card payments are filtered with <code>country = 'NL' AND currency = 'EUR'<\/code>. Each condition keeps 30% of the rows, and every NL payment is in EUR. EXPLAIN estimates 9% and the query really returns 30%. What fixes the estimate?","options":["Raise <code>default_statistics_target<\/code> to 1000 and ANALYZE","Create an index on (country, currency)","<code>CREATE STATISTICS ... (dependencies) ON country, currency<\/code> and ANALYZE","Run VACUUM FULL so the statistics are exact"],"answer":2,"why":"The 9% is 0.3 x 0.3: the planner assumes the columns are independent. Only statistics about the pair can tell it that country decides currency. A bigger statistics target only makes each column's own statistics more detailed. A multicolumn index helps find the rows, but PostgreSQL doesn't take cross-column statistics from it. VACUUM FULL rewrites the table and changes no estimate.","from":null},{"q":"Why can dynamic programming keep only the single cheapest plan for each set of tables?","options":["Because PostgreSQL has too little memory for more than one plan per set","Because the cost of a plan for a bigger set is its two parts' costs plus a term that doesn't depend on how the parts were built, so a cheaper part always makes a cheaper whole","Because the cheapest plan for a set is always a left-deep plan","Because the estimates are exact for small sets"],"answer":1,"why":"In the lab's model, cost(S) = cost(L) + cost(R) + rows(S), and rows(S) is the same however L and R were joined. Swapping a part for a cheaper plan of the same set can only lower the total, so the expensive alternatives can be thrown away. That holds for the estimates whether or not they are right, which is why a correct search can still pick a bad plan. Bushy plans can beat left-deep ones, and memory has nothing to do with it.","from":null},{"q":"A query that ran in 40 ms takes 9 seconds after a big data import. EXPLAIN ANALYZE shows a Nested Loop whose outer node has <code>rows=12<\/code> and <code>actual rows=118000<\/code>. What do you do first?","options":["Set <code>enable_nestloop = off<\/code> in <code>postgresql.conf<\/code>","Check when the table was last analyzed and run ANALYZE, then look at the estimate again","Add an index on the inner table's join column","Lower <code>random_page_cost<\/code> so index scans look cheaper"],"answer":1,"why":"The plan is right for 12 rows and wrong for 118,000, so the estimate is the problem. After a big import the statistics often describe the old data, and ANALYZE fixes that. If the estimate is still off, look for correlated conditions. Turning off nested loops for the whole server hurts every query that needs them, and changing cost constants or indexes leaves the bad estimate in place.","from":null},{"q":"From lesson 9: the planner expects 8 outer rows and chooses a nested loop with an index lookup on the inner table. At run time the outer side returns 80,000 rows. What does EXPLAIN ANALYZE show on the inner index scan?","options":["<code>loops=8<\/code>, because the plan was made for 8 rows","<code>loops=80000<\/code>: one index lookup per outer row, far more than a hash join's single pass over the inner table","<code>loops=1<\/code>, because PostgreSQL switches to a hash join when the outer side grows","An error, because the estimate was exceeded"],"answer":1,"why":"A nested loop runs its inner side once per outer row, however many rows that turns out to be, so the inner index scan shows <code>loops=80000<\/code>. PostgreSQL doesn't change join methods during execution; the plan made for 8 rows runs to the end. That is why underestimates are the dangerous direction.","from":"dbi-09"}],"cards":[{"front":"What does PostgreSQL's cost of 1.0 stand for?","back":"<p>One 8 KB page read in sequence (<code>seq_page_cost<\/code>). A random page is 4.0, a row 0.01, an operator call 0.0025.<\/p>"},{"front":"What is a cardinality estimate?","back":"<p>The planner's guess of how many rows a step of a plan will produce, made before the query runs.<\/p>"},{"front":"What does an equi-depth histogram guarantee?","back":"<p>Every bucket holds about the same number of rows, so buckets are narrow where values are dense and wide where they are sparse.<\/p>"},{"front":"How does PostgreSQL combine <code>a = 1 AND b = 2<\/code> by default?","back":"<p>It multiplies the two selectivities, assuming the columns are independent. Correlated columns make that an underestimate.<\/p>"},{"front":"What does <code>CREATE STATISTICS ... (dependencies)<\/code> give the planner?","back":"<p>For each pair of columns, the fraction of rows where one decides the other, used as <code>P(a) x (d + (1 - d) x P(b))<\/code> for equality conditions.<\/p>"},{"front":"How is <code>R JOIN S ON R.x = S.y<\/code> estimated?","back":"<p><code>rows(R) x rows(S) / max(distinct x, distinct y)<\/code>.<\/p>"},{"front":"What does dynamic programming over join orders compute?","back":"<p>The cheapest plan for every set of tables, from smaller sets up: 2^n sets instead of n! orders. PostgreSQL uses it below 12 FROM items.<\/p>"}],"terms":[{"term":"Cost model","plain":"Formulas that turn pages read and rows handled into one number per plan, so plans can be compared without running them."},{"term":"Cardinality","plain":"The number of rows a table, filter or join produces. The planner has to estimate it."},{"term":"Selectivity","plain":"The fraction of rows a condition keeps: 0.1 means 10%."},{"term":"Most common values (MCV)","plain":"The values ANALYZE found clearly more often than the rest, stored with their frequencies."},{"term":"Equi-depth histogram","plain":"Bucket bounds chosen so every bucket holds the same number of rows."},{"term":"Independence assumption","plain":"Treating conditions on different columns as unrelated, so their selectivities multiply."},{"term":"Extended statistics","plain":"Statistics about several columns together, made with <code>CREATE STATISTICS<\/code>: dependencies, MCV combinations, distinct counts."},{"term":"Join ordering","plain":"Choosing which tables to join first; the planner does it by dynamic programming over sets of tables."}],"remote":true},"dbi-11":{"id":"dbi-11","track":"dbi","n":11,"title":"Column stores and compression","ready":true,"minutes":40,"goal":"By the end you can explain why a column store reads a fraction of the bytes a row store reads for an analytics query, encode a column chunk with dictionary, run-length and bit-packing, use min/max zone maps to skip chunks, see all of it in DuckDB and in PostgreSQL's BRIN indexes, and build a compressed column chunk with zone maps.","quiz":[{"q":"A table of 10 million payments is sorted by <code>status<\/code>, which has three values. Which encoding stores the <code>status<\/code> column chunk by chunk in the fewest bytes?","options":["Dictionary with bit-packed codes: 2 bits per row","Run-length encoding of the dictionary codes: one run per status per chunk","Plain strings, compressed with gzip","Bit-packing the strings' bytes"],"answer":1,"why":"Sorted by status, almost every chunk holds one status, so it is a single run: a value and a count, whatever the chunk length. Bit-packed codes still cost 2 bits per row, 2.5 MB for 10 million rows. Gzip would compress well too, but every scan would pay to decompress, which is why column stores prefer lightweight encodings.","from":null},{"q":"A chunk holds 2,048 amounts between 1,000 and 66,535 cents. With frame of reference and bit-packing, how many bits does each value take?","options":["17, because the largest value is above 65,535","16, because 66,535 - 1,000 = 65,535 fits in 16 bits","64, as a long","8, because most payments are small"],"answer":1,"why":"Frame of reference subtracts the chunk's minimum first, so the values to store run from 0 to 65,535, which is exactly 16 bits. Without the subtraction, 66,535 needs 17 bits. Bit-packing uses one width for the whole chunk, chosen by its largest value, so many small payments don't lower it.","from":null},{"q":"Payments are loaded in time order into a column store with zone maps. Which query can skip most chunks?","options":["<code>WHERE amount_cents &gt; 99000<\/code>","<code>WHERE merchant_id = 42<\/code>","<code>WHERE created_at &gt;= '2026-10-15' AND created_at &lt; '2026-10-16'<\/code>","<code>WHERE currency = 'SEK'<\/code>"],"answer":2,"why":"Only <code>created_at<\/code> follows the load order, so each chunk covers a narrow time slice and most zone maps rule out a one-day range. Amounts, merchants and currencies are mixed in every chunk, so every chunk's min and max cover the value asked for and nothing is skipped. Sorting the data b
