y merchant would make the merchant query skip instead.","from":null},{"q":"Which workload belongs in a row store rather than a column store?","options":["Summing amounts by currency over 50 million payments","Fetching one payment with all its columns by id, 5,000 times a second","Counting payments per day for a year","Scanning a month of settlements to reconcile them against a bank file"],"answer":1,"why":"A primary-key lookup of a whole row reads one heap page in a row store and one chunk per column, often compressed, in a column store. The other three read a few columns of many rows, which is exactly what a column store is built for.","from":null},{"q":"From lesson 2: a heap row has a 24-byte header and a 4-byte line pointer. In the first Try it each <code>payments<\/code> row takes 64 bytes and 119 rows fit in an 8 KB page. About what share of the bytes a <code>sum(amount_cents)<\/code> scan reads are amounts?","options":["About 12%","About 50%","About 100%","About 25%"],"answer":0,"why":"119 rows x 8 bytes = 952 bytes of amounts in an 8,192-byte page, about 12%. The rest is headers, line pointers and the other five columns, all read because a heap page stores whole rows. A column store reads the 8-byte amounts and, bit-packed, less than that.","from":"dbi-02"}],"cards":[{"front":"What is the difference between the row layout (NSM) and the column layout (DSM)?","back":"<p>NSM stores whole rows together; DSM stores each column's values together, rows rebuilt by position.<\/p>"},{"front":"What does dictionary encoding store?","back":"<p>Each distinct value once, in a sorted list, and per row a small integer code: its position in the list.<\/p>"},{"front":"What is frame of reference?","back":"<p>Subtracting the chunk's smallest value from every value before bit-packing, so the numbers need fewer bits.<\/p>"},{"front":"When does run-length encoding win?","back":"<p>When equal values sit in long runs: sorted or slowly changing columns. On data without runs it makes the chunk bigger.<\/p>"},{"front":"What is a zone map?","back":"<p>The min and max of a chunk, stored outside it, so a scan can skip the chunk (or count it whole) without decoding it.<\/p>"},{"front":"When do zone maps skip nothing?","back":"<p>When the column's values don't follow the row order on disk: every chunk's [min, max] then covers almost the whole range.<\/p>"},{"front":"What is a BRIN index in PostgreSQL?","back":"<p>A zone map per block range (128 pages by default): kilobytes in size, useful for columns that follow the table's physical order.<\/p>"}],"terms":[{"term":"Row layout (NSM)","plain":"Storing whole rows one after another, as PostgreSQL's heap does."},{"term":"Column layout (DSM)","plain":"Storing each column's values together, in row order."},{"term":"Row group","plain":"A horizontal slice of a table, such as 122,880 rows in DuckDB, whose columns are stored as separate chunks."},{"term":"Dictionary encoding","plain":"Replacing values by small codes that point into a list of the distinct values."},{"term":"Bit-packing","plain":"Storing each number in the fewest bits that hold the largest one in its chunk."},{"term":"Run-length encoding","plain":"Storing a run of equal values once, with its length."},{"term":"Zone map","plain":"A chunk's min and max, kept so a scan can skip chunks that can't match."},{"term":"BRIN index","plain":"PostgreSQL's block range index: a min and max per group of pages."}],"remote":true},"dbi-12":{"id":"dbi-12","track":"dbi","n":12,"title":"Replication and consensus with Raft","ready":true,"minutes":40,"goal":"By the end you can explain why a database copies its log to a majority of servers, trace a Raft election, the replication and commit of a log entry and a leader crash using terms, votes, AppendEntries and the commit rule, and build the core of Raft in a deterministic simulator.","quiz":[{"q":"A team runs four Raft servers instead of three \"for extra safety\". How many server failures can the four-server cluster survive and still commit writes?","options":["Two: half of the servers","One, the same as three servers","Three: one server can still lead","None: Raft needs every server"],"answer":1,"why":"A majority of four is three, so the cluster commits while three servers are up: it survives one failure, like a three-server cluster, and every write waits for one more copy. Two failures leave two servers, which is half, not a majority, and two halves could otherwise elect two leaders. Five servers are the next step up: they survive two.","from":null},{"q":"A candidate's log ends with index 8, term 2. A voter's log ends with index 5, term 3. Neither has voted in the current term. Does the voter grant its vote?","options":["Yes: the candidate's log is longer","Yes: the voter hasn't voted in this term","No: the voter's last entry has a higher term, so its log is more up to date","Only if the candidate's term is higher than 3"],"answer":2,"why":"Raft compares the terms of the last entries first, and only on a tie compares lengths. The voter's term-3 entry may be committed; a leader whose log ends in term 2 doesn't have it and could overwrite it. A long log of old-term entries is worth less than one entry from a newer term.","from":null},{"q":"The leader of term 4 finds an entry from term 2 at index 6 of its log. Three of five servers store it. May the leader mark index 6 committed now?","options":["Yes: it is on a majority","No: it must first get an entry from term 4 onto a majority; index 6 is committed along with it","No: entries from old terms are always deleted by a new leader","Only if all five servers store it"],"answer":1,"why":"This is Figure 8 of the Raft paper: an old-term entry on a majority can still be overwritten, because a server with a newer last term could win an election. So a leader commits only current-term entries by counting copies; once one is on a majority, everything before it is committed too. New leaders keep old entries, they don't delete them.","from":null},{"q":"A network partition cuts the leader off from the other four servers. For ten seconds a client keeps sending it payments, and the leader appends each one to its log. What happens to those payments?","options":["They are committed when the partition heals, because the leader logged them first","They are never committed: the leader can't reach a majority, its clients get no confirmation, and the new leader's log replaces them","They are committed at once, because a leader commits its own entries","Raft rejects them, because a partitioned leader knows it has lost its majority"],"answer":1,"why":"Without a majority of copies nothing commits, so the clients never get an OK and time out. Meanwhile the other four elect a leader in a higher term. When the partition heals, the old leader sees the higher term, becomes a follower, and its uncommitted entries conflict with the new leader's log and are dropped. It doesn't know it is cut off; it only sees no replies, which is why the client must retry with an idempotency key.","from":null},{"q":"From lesson 6: a follower replies success to AppendEntries before forcing the new entries to disk, then loses power. Why does that break Raft?","options":["It doesn't: the leader still has the entry","The leader counted that follower toward the majority, so a committed entry may now be on fewer than a majority, and a leader elected without it could overwrite it","The follower will vote twice in the same term","AppendEntries will fail forever on that follower"],"answer":1,"why":"Commit means \"on a majority of disks\". If one of the three copies vanishes in the power loss, only two servers hold the entry; a new leader can win with votes from servers that lack it and replace it, and a client was already told it is saved. That is lesson 6's commit rule again: say it is stored only after the log is forced. Its vote (<code>votedFor<\/code>) must be on disk for the same reason.","from":"dbi-06"}],"cards":[{"front":"How many failures does a Raft cluster of 2f + 1 servers survive?","back":"<p>f. Five servers survive two, three survive one, and four still survive only one.<\/p>"},{"front":"What is a term in Raft?","back":"<p>A numbered period with at most one leader, starting with an election. A higher term in any message makes a server a follower.<\/p>"},{"front":"Why are election timeouts random?","back":"<p>So one follower usually times out first and wins before others start, instead of votes splitting again and again.<\/p>"},{"front":"What does a follower check before accepting AppendEntries?","back":"<p>That its log holds an entry at <code>prevLogIndex<\/code> with term <code>prevLogTerm<\/code>. Otherwise it refuses and the leader steps <code>nextIndex<\/code> back.<\/p>"},{"front":"When does a Raft leader commit an entry?","back":"<p>When a majority stores it and it is from the leader's current term. Earlier entries commit along with it.<\/p>"},{"front":"Which candidates does a server refuse to vote for?","back":"<p>Those whose log is less up to date: an older last term, or the same last term and a shorter log. And any second candidate in a term it already voted in.<\/p>"},{"front":"What happens to an entry the old leader never got onto a majority?","back":"<p>It was never committed and may be replaced by the new leader's log; the client got no OK and must retry, ideally with an idempotency key.<\/p>"}],"terms":[{"term":"Replication","plain":"Keeping copies of the same data on several servers, usually by copying a log."},{"term":"Consensus","plain":"Servers that can crash and lose messages agreeing on one value or one order of log entries."},{"term":"Majority (quorum)","plain":"More than half of the servers: 3 of 5. Any two majorities share a server."},{"term":"Term","plain":"Raft's numbered leadership period; at most one leader per term."},{"term":"Election timeout","plain":"How long a follower waits without hearing a leader before it starts an election; random, about 150 to 300 ms."},{"term":"AppendEntries","plain":"The leader's message that copies log entries to a follower, or is an empty heartbeat."},{"term":"Log Matching Property","plain":"If two logs have an entry with the same index and term, they are identical up to that entry."},{"term":"Committed entry","plain":"An entry stored on a majority; it will never be lost and every server applies it in order."}],"remote":true},"nosql-01":{"id":"nosql-01","track":"nosql","n":1,"title":"Why NoSQL exists: Bigtable, Dynamo and the families","ready":true,"minutes":40,"goal":"By the end you can say which problem Bigtable and Dynamo each solved, read a sorted row key and a hash-ring preference list, and place any NoSQL store by its data model and its lineage.","quiz":[{"q":"A Bigtable-style table uses the row key <code>paymentId#merchantId<\/code>. Support asks for merchant M-0042's payments from today. What does the store have to do?","options":["Look the merchant up in the secondary index Bigtable keeps for every part of the key","Read every row, because the merchant isn't a prefix of the row key","Read one tablet, because all of a merchant's rows live on the same tablet","Filter by the column family on the server without reading any rows"],"answer":1,"why":"Rows are sorted by the whole row key as a string, so only a prefix of the key gives a contiguous range. With the payment id first, M-0042's rows are scattered across every tablet. Bigtable keeps no secondary indexes, and column families group columns, not rows.","from":null},{"q":"Dynamo with N = 3. Walking clockwise from a key's hash you meet nodes D, E, F, G. D is down when a write for the key arrives. Where does the write go?","options":["Nowhere: the write is rejected until D comes back","To E and F only, with W lowered to 2 for this write","To C, the node just before the key on the ring","To E, F and G, and G keeps a hint that the data belongs to D"],"answer":3,"why":"Dynamo writes to the first N healthy nodes on the ring. G isn't a home replica for this key, so it stores the write with a hint and hands it to D when D recovers. Rejecting the write would break \"always writeable\", and the ring is only ever walked clockwise.","from":null},{"q":"Which statement about Amazon DynamoDB is true?","options":["It's the 2007 Dynamo paper's system offered as a managed service","It returns conflicting versions to your code, tagged with vector clocks","Each partition's replicas elect a leader, and the leader takes the writes","It doesn't use a partition key; any node can store any item"],"answer":2,"why":"The 2022 DynamoDB paper describes a Multi-Paxos replication group per partition, where only the leader serves writes and strongly consistent reads. DynamoDB kept Dynamo's name and hash partitioning but not its leaderless design or vector clocks.","from":null},{"q":"In a Bigtable-style store, a transfer moves 50.00 from row <code>ACCT#A-1001<\/code> to row <code>ACCT#A-2002<\/code> with two writes. What does the store guarantee by itself?","options":["Each row's write is atomic on its own, and nothing ties the two together","Both writes commit or neither does","Both rows are locked until the second write finishes","Neither write is atomic, not even within its own row"],"answer":0,"why":"The Bigtable paper makes every read or write under a single row key atomic, and offers no transactions across rows. A crash between the two writes leaves the money debited and not credited, unless your code handles it.","from":null},{"q":"A fraud team wants accounts that share a device or a phone with a flagged account, up to three hops away, in under 100 ms. Which family fits first?","options":["Key-value, keyed by account id","Wide-column, partitioned by device id","Graph, starting at the flagged account and walking shared identifiers","Document, with each account's devices embedded"],"answer":2,"why":"The question is a walk along relationships of unknown length, which is exactly what a graph store does from a start node. In the other families each hop is a separate lookup or an extra copy of the data, and three hops multiply them.","from":null}],"cards":[{"front":"What is Bigtable's data model, in one line?","back":"<p>A sparse, sorted map: <code>(row:string, column:string, time:int64) -&gt; string<\/code>.<\/p>"},{"front":"What is atomic in Bigtable?","back":"<p>Every read or write under a single row key, however many columns it touches. Nothing across rows.<\/p>"},{"front":"What is a tablet?","back":"<p>A contiguous range of rows: the unit Bigtable serves, splits and moves between servers. About 100 to 200 MB by default in the paper.<\/p>"},{"front":"In Dynamo, what is a key's preference list?","back":"<p>The nodes that store the key: the first node clockwise from the key's hash (the coordinator) and the next ones clockwise, N nodes in all.<\/p>"},{"front":"What does Dynamo do when a home replica is down during a write?","back":"<p>Sloppy quorum: it writes to the first N healthy nodes. The stand-in keeps a hint and hands the data back when the owner returns (hinted handoff).<\/p>"},{"front":"Is DynamoDB the system from the 2007 Dynamo paper?","back":"<p>No. It shares the name and hash partitioning, but each partition has a Multi-Paxos leader that takes writes and strongly consistent reads.<\/p>"},{"front":"Why is a merchant id first in a row key like <code>M-0042#2026-11-07T08:15#pay-81701<\/code>?","back":"<p>Rows sort by key, so all of a merchant's payments become one contiguous range, ordered by time: one cheap prefix read.<\/p>"}],"terms":[{"term":"Scale out","plain":"Spread the data over more machines instead of buying one bigger machine (scaling up)."},{"term":"Partition","plain":"One part of a split-up dataset, held by one machine or one small group of machines. Some products say shard."},{"term":"Replica","plain":"A copy of a partition's data on another machine, so the data survives and stays reachable when one machine dies."},{"term":"Row key and tablet","plain":"Bigtable sorts rows by row key and cuts the sorted rows into tablets, contiguous ranges of about 100 to 200 MB, one server each."},{"term":"Column family","plain":"A group of columns declared up front, written <code>family:qualifier<\/code>. Qualifiers can differ per row."},{"term":"Consistent hashing","plain":"Keys and nodes hashed onto one circle; a key belongs to the first node clockwise. Adding a node moves only its neighbour's keys."},{"term":"Preference list","plain":"The N nodes that store a key in Dynamo: the coordinator and the next nodes clockwise."},{"term":"Sloppy quorum and hinted handoff","plain":"When a home node is down, the write goes to the next healthy node, which keeps a hint and hands the data back later."}],"remote":true},"nosql-02":{"id":"nosql-02","track":"nosql","n":2,"title":"Model the access patterns first","ready":true,"minutes":40,"goal":"By the end you can turn a list of payment access patterns into partition and sort keys, and say for any query whether it is a key lookup, a range read or a scan in DynamoDB, Cassandra and MongoDB.","quiz":[{"q":"A table has partition key <code>accountId<\/code> and sort key <code>createdAt<\/code>. Which query is a range read?","options":["<code>accountId = A-1001 AND createdAt BETWEEN 08:00 AND 12:00<\/code>","<code>createdAt BETWEEN 08:00 AND 12:00<\/code>","<code>merchantId = M-0042<\/code>","<code>accountId = A-1001 AND amountMinor &gt; 5000<\/code>"],"answer":0,"why":"It fixes the partition key with <code>=<\/code> and asks one range on the sort key, so it's one contiguous slice of one partition. Without the account there's no partition to go to, and <code>amountMinor<\/code> is outside the key, so that last query reads the whole partition and filters.","from":null},{"q":"An index is keyed <code>(merchantId; status, createdAt)<\/code>. A query asks for <code>merchantId = M-0042 AND createdAt &gt; 09:00<\/code>, any status. What does the store do?","options":["Reads one slice of M-0042's partition, because <code>createdAt<\/code> is in the sort key","Does one key lookup per status value, automatically","Reads all of M-0042's items and filters them, because <code>status<\/code> comes first in the sort key","Rejects every query that has a range condition"],"answer":2,"why":"Items are sorted by status first, so the 09:00 items are spread across every status. The sort key can only be used left to right with no gaps. Cassandra refuses this query outright; DynamoDB and MongoDB answer it by reading more than they return.","from":null},{"q":"A Cassandra table has <code>PRIMARY KEY ((merchant_id, day), status, created_at)<\/code>. Which query runs without <code>ALLOW FILTERING<\/code> or an error?","options":["<code>WHERE merchant_id = 'M-0042' AND status = 'FAILED'<\/code>","<code>WHERE merchant_id = 'M-0042' AND day = '2026-11-07' AND status = 'FAILED'<\/code>","<code>WHERE day = '2026-11-07'<\/code>","<code>WHERE merchant_id = 'M-0042' AND day = '2026-11-07' AND created_at &gt; '2026-11-07 09:00:00+0000'<\/code>"],"answer":1,"why":"It gives both parts of the partition key and the first clustering column. The first and third miss part of the partition key, so Cassandra asks for <code>ALLOW FILTERING<\/code>. The last skips <code>status<\/code>, and Cassandra rejects it because a preceding clustering column isn't restricted.","from":null},{"q":"An account document embeds every payment the account has ever received in an array. What goes wrong first as accounts age?","options":["Reads get faster, because everything is in one document","MongoDB rejects arrays with more than 1,000 elements","Nothing: MongoDB moves large arrays to their own collection","The document grows toward the 16 MB limit, and every read of the account drags the whole history along"],"answer":3,"why":"Payments are a high-cardinality child that grows without bound, which MongoDB's own guidance says to reference rather than embed. There's no automatic move and no 1,000-element rule; the 16 MB document limit is the hard wall, and long before it the account screen pays for data it doesn't show.","from":null},{"q":"From lesson 1: in a Bigtable-style store, why does the row key <code>M-0042#2026-11-07T08:15:03#pay-81701<\/code> make \"merchant M-0042's payments today\" cheap?","options":["Bigtable builds a secondary index on each part of the key","Rows are stored sorted by row key, so the day's payments form one contiguous range","The merchant id is hashed, so every M-0042 row lands on one node","The column family groups a merchant's payments together"],"answer":1,"why":"Bigtable keeps rows in lexicographic order of row key, so the prefix <code>M-0042#2026-11-07<\/code> is one range read. Bigtable doesn't hash row keys (that's Dynamo's ring) and has no secondary indexes, and column families group columns, not rows. It's the same idea as a partition key plus a sort key.","from":"nosql-01"}],"cards":[{"front":"What must a DynamoDB or Cassandra query give for the partition key?","back":"<p>Every part of it, with <code>=<\/code>. The store hashes it to find the one partition to read.<\/p>"},{"front":"What is a range read?","back":"<p>A contiguous slice of one partition's sort order: <code>=<\/code> on a leading part of the sort key, then at most one range on the next part.<\/p>"},{"front":"Why can't index <code>(merchantId; status, createdAt)<\/code> answer \"every status since 09:00\" as one slice?","back":"<p>Items are sorted by status first, so the 09:00 items are spread over every status. You can't skip a sort key attribute.<\/p>"},{"front":"What does a DynamoDB <code>FilterExpression<\/code> cost?","back":"<p>Every item the Query or Scan reads, not just the ones it returns. The filter runs after the read.<\/p>"},{"front":"What is CQL's <code>ALLOW FILTERING<\/code> error telling you?","back":"<p>The query doesn't fit the table's key and would read and filter partitions. Usually it means a table for that query is missing.<\/p>"},{"front":"MongoDB: when do you embed, and when do you reference?","back":"<p>Embed what's read and updated together and stays bounded. Reference what grows without limit, is written separately, or stands alone.<\/p>"},{"front":"MongoDB's ESR guideline for compound indexes?","back":"<p>Equality fields first, then the sort field, then range fields.<\/p>"}],"terms":[{"term":"Access pattern","plain":"One question the application asks, written as a query with its rate, such as \"an account's payments, newest first\"."},{"term":"Partition key","plain":"The part of the key the store hashes to choose a partition. Needs <code>=<\/code> on every part."},{"term":"Sort key","plain":"The part of the key that orders items inside a partition. Cassandra calls its parts clustering columns."},{"term":"Range read","plain":"Reading one contiguous run of items in one partition, in sort order, forward or backward."},{"term":"Scan","plain":"A read the key can't narrow down: the store reads items and throws some away, up to the whole table."},{"term":"Global secondary index","plain":"In DynamoDB, a second copy of the table's items under a different key, kept up to date by DynamoDB."},{"term":"Embed vs reference","plain":"MongoDB's choice between nesting related data in one document and storing it in its own documents with an id."}],"remote":true},"nosql-03":{"id":"nosql-03","track":"nosql","n":3,"title":"Key-value stores and DynamoDB basics","ready":true,"minutes":40,"goal":"By the end you can store and read payments in DynamoDB with the Kotlin Enhanced Client, make a payment create idempotent with a conditional write, and read an account's newest payments with one Query.","quiz":[{"q":"A table has keys <code>pk<\/code> and <code>sk<\/code>. You <code>PutItem<\/code> the key (<code>ACCT#A-1001<\/code>, <code>PAY#...#pay-81723<\/code>) with <code>attribute_not_exists(pk)<\/code>. An item with the same <code>pk<\/code> but a different <code>sk<\/code> already exists. What happens?","options":["The write succeeds: the condition looks only at the item with this exact pk and sk","The write fails, because <code>pk<\/code> already exists in the partition","The write fails with a validation error, because <code>pk<\/code> always exists","The write succeeds and replaces the other item in the partition"],"answer":0,"why":"DynamoDB evaluates a condition against the single item named by the request's full primary key. No item has this pk and sk, so <code>attribute_not_exists(pk)<\/code> is true. Other items in the same partition don't matter, and a put never touches an item with a different key.","from":null},{"q":"An account has 20 payments. A Query on its partition with <code>FilterExpression amountMinor &gt; 8000<\/code> returns 4 items. What did it read?","options":["4 items, because the filter is applied inside the index","Every item in the table","All 20 of the account's items; the filter dropped 16 after reading them","Nothing until the filter matched, then 4 items"],"answer":2,"why":"A filter runs after the Query reads its slice, so you pay for all 20 items and get 4. That's why <code>ScannedCount<\/code> and <code>Count<\/code> differ. It isn't a table scan, though: the key condition still limits the read to one partition.","from":null},{"q":"A claim's <code>expiresAt<\/code> passed two hours ago. TTL is on for that attribute. What does a GetItem for the claim return now?","options":["Nothing: TTL deletes an item the moment it expires","Possibly the item: TTL deletes typically within a few days, so check <code>expiresAt<\/code> yourself","An error saying the item has expired","The item, but with every attribute except the key removed"],"answer":1,"why":"TTL deletion is a background process that typically runs within a few days of expiry. Until then the item is a normal item, which is why the lab's condition treats <code>expiresAt &lt; :now<\/code> as free and why AWS suggests filtering expired items out of reads.","from":null},{"q":"Which of these reads can be strongly consistent?","options":["A Query on a global secondary index with <code>ConsistentRead<\/code> true","A GetItem on the table with <code>ConsistentRead<\/code> true","Any read on a table in on-demand mode","A read from DynamoDB Streams"],"answer":1,"why":"Tables and local secondary indexes support strongly consistent reads. Global secondary indexes and streams are always eventually consistent, because they're updated asynchronously from the table. The capacity mode doesn't change consistency.","from":null},{"q":"From lesson 2: a payments table has partition key <code>accountId<\/code> and sort key <code>createdAt<\/code>. Support now needs merchant M-0042's FAILED payments for any time window, many times an hour. What's the right fix?","options":["Scan the table with a FilterExpression on merchantId and status","Query every account's partition and filter by merchant","Add <code>createdAt<\/code> to the partition key","Add a global secondary index keyed by merchantId, with status then createdAt in the sort key"],"answer":3,"why":"A new access pattern on a hot path needs a key that answers it. With the merchant as partition key and status before time in the sort key, <code>status = FAILED<\/code> fixes a prefix and the time window is one slice. Scans and per-account fan-out cost in proportion to the table, and changing the table's partition key breaks AP1.","from":"nosql-02"}],"cards":[{"front":"What does DynamoDB PutItem do when an item with the same key exists?","back":"<p>Replaces it, silently. Add a condition expression if you want the second write refused.<\/p>"},{"front":"What does <code>attribute_not_exists(pk)<\/code> check in a PutItem?","back":"<p>Whether the one item named by this request's full primary key exists. Not the rest of the partition.<\/p>"},{"front":"What happens when a condition expression is false?","back":"<p>Nothing is written, DynamoDB throws <code>ConditionalCheckFailedException<\/code>, and the write units are still charged.<\/p>"},{"front":"TTL: what format, and how fast?","back":"<p>A Number attribute of Unix epoch seconds. Expired items are deleted in the background, typically within a few days, at no write cost.<\/p>"},{"front":"One read unit and one write unit cover what?","back":"<p>Read: one strongly consistent read per second of up to 4 KB (or two eventually consistent). Write: one write per second of up to 1 KB.<\/p>"},{"front":"How much does one Query call return at most?","back":"<p>1 MB, measured before any filter. <code>LastEvaluatedKey<\/code> in the response means there are more pages.<\/p>"},{"front":"How do you write an Enhanced Client bean in Kotlin?","back":"<p><code>@DynamoDbBean<\/code> on a class with <code>var<\/code> properties and defaults; key annotations on the getters: <code>@get:DynamoDbPartitionKey<\/code>, <code>@get:DynamoDbSortKey<\/code>.<\/p>"}],"terms":[{"term":"Item","plain":"One record in a DynamoDB table: a set of typed attributes, at most 400 KB."},{"term":"Item collection","plain":"All items with the same partition key, stored together and sorted by sort key."},{"term":"Condition expression","plain":"A test DynamoDB checks against the target item in the same step as the write; if it's false, nothing is written."},{"term":"Idempotency key","plain":"A value the client sends with a request so that repeats of the request are recognised and do nothing new."},{"term":"TTL (time to live)","plain":"A Number attribute of epoch seconds after which DynamoDB deletes the item in the background."},{"term":"Read and write capacity units","plain":"DynamoDB's metering: a read unit covers 4 KB read strongly consistently, a write unit covers 1 KB written."},{"term":"Enhanced Client","plain":"The AWS SDK for Java 2.x layer that maps your classes to DynamoDB items and back."}],"remote":true},"nosql-04":{"id":"nosql-04","track":"nosql","n":4,"title":"DynamoDB single-table design and transactions","ready":true,"minutes":40,"goal":"By the end you can put several item types into one DynamoDB table so that one Query answers a screen, add global secondary indexes for the questions that don't know the partition key, and move money between two accounts with one TransactWriteItems that fails as a unit.","quiz":[{"q":"A-1001's item collection holds <code>LEDGER#<\/code>, <code>PAY#<\/code>, <code>PROFILE<\/code> and <code>REFUND#<\/code> items. You Query <code>pk = ACCT#A-1001<\/code>, backward, <code>Limit 21<\/code>, with no sort key condition. Which item comes back first?","options":["The PROFILE item, because the account item always comes first","The newest payment, because the read goes backward in time","The oldest ledger entry, because LEDGER# sorts first","The newest refund, because REFUND# sorts last and the read starts at the end"],"answer":3,"why":"A backward Query starts at the largest sort key in the collection. <code>R<\/code> sorts after <code>P<\/code>, so the refunds are at the end and come out first. The profile only comes first when a <code>BETWEEN \"PAY#\" AND \"PROFILE\"<\/code> condition cuts the refunds off. DynamoDB has no idea which item is \"the account\"; only sort order counts.","from":null},{"q":"A <code>TransactWriteItems<\/code> has five actions. The condition on action 0, the debit, is false. What has DynamoDB written?","options":["Actions 1 to 4, because only action 0 failed","Nothing, and the cancellation reasons say <code>ConditionalCheckFailed<\/code> at index 0 and <code>None<\/code> for the rest","Nothing yet: the SDK retries the transaction until the condition holds","Action 0 with its old value, and actions 1 to 4 as sent"],"answer":1,"why":"One false condition cancels the whole transaction: no action is applied. The exception's reasons list has one entry per action, in request order, so you can tell which one failed. The SDK doesn't retry a cancelled transaction; your code decides what to do.","from":null},{"q":"The merchant dashboard queries <code>byMerchant<\/code> a few milliseconds after a payment was written to the table, and the payment is missing. What's going on, and what helps?","options":["The GSI is updated asynchronously; the payment shows up shortly, and only a read on the table is strongly consistent","Set <code>ConsistentRead<\/code> to true on the index Query","The PutItem must have failed silently; write the payment again","byMerchant is sparse, so it never holds payments"],"answer":0,"why":"DynamoDB copies table writes into a GSI asynchronously, so an index read can briefly miss a write the table already has. <code>ConsistentRead<\/code> is the tempting fix, but DynamoDB rejects it on a GSI with \"Consistent reads are not supported on global secondary indexes\". The index is sparse only for items without <code>merchantId<\/code>; payments have it.","from":null},{"q":"A transfer is one <code>TransactWriteItems<\/code> with five items, each under 1 KB. Its debit condition fails. How many write units does it use?","options":["0, because nothing was written","5, one per item","10: two per item, prepare and commit, charged even when cancelled","10 if it commits, 5 if it's cancelled"],"answer":2,"why":"DynamoDB performs two underlying writes for every item in a transaction, one to prepare and one to commit, and the AWS docs say this capacity is used even when the transaction is cancelled. \"Nothing was written\" is about the data, not the bill.","from":null},{"q":"From lesson 2: <code>byMerchant<\/code> has partition key <code>merchantId<\/code> and sort key <code>status<\/code>, then <code>createdAt<\/code>. A Query asks <code>merchantId = M-0042 AND createdAt &gt; 09:00<\/code>, any status. What does DynamoDB do?","options":["Reads one slice of M-0042's partition, because <code>createdAt<\/code> is part of the sort key","Rejects the Query: <code>status<\/code> comes first in the sort key and has no equality condition","Runs one Query per status value and merges them","Scans the table and filters by merchant and time"],"answer":1,"why":"Sort key attributes are used left to right with no gaps, as lesson 2 showed. Items are sorted by status first, so the 09:00 items are spread across every status. With a multi-attribute GSI key, DynamoDB refuses the Query outright: \"RANGE key attributes status must have equality conditions specified in the query\". It never fans out on its own.","from":"nosql-02"}],"cards":[{"front":"Why name the account item <code>PROFILE<\/code> rather than <code>META<\/code>?","back":"<p><code>PROFILE<\/code> sorts right after every <code>PAY#<\/code> key (<code>PA<\/code> &lt; <code>PR<\/code>), so a backward Query from <code>PROFILE<\/code> returns the account first and then the newest payments, in one request.<\/p>"},{"front":"What makes an item appear in a global secondary index?","back":"<p>Having all of the index's key attributes. Items without them are left out, which makes the index sparse.<\/p>"},{"front":"Can you read a GSI with a strongly consistent read?","back":"<p>No. DynamoDB updates GSIs asynchronously and rejects <code>ConsistentRead<\/code> on them. Read the table when you must see every write.<\/p>"},{"front":"<code>TransactWriteItems<\/code> limits?","back":"<p>Up to 100 actions on up to 100 distinct items, one account and Region, at most 4 MB. No item twice in one transaction.<\/p>"},{"front":"What do a transaction's cancellation reasons tell you?","back":"<p>One entry per action, in request order: <code>None<\/code>, or a code such as <code>ConditionalCheckFailed<\/code> or <code>TransactionConflict<\/code>. With <code>ALL_OLD<\/code>, the failing item as it was.<\/p>"},{"front":"What does a transactional write cost?","back":"<p>Two underlying writes per item, prepare and commit, even when the transaction is cancelled.<\/p>"},{"front":"ClientRequestToken versus an idempotency claim item?","back":"<p>The token makes an identical repeat within 10 minutes a no-op success. The claim stops any request that uses the same key, for as long as the claim lives.<\/p>"}],"terms":[{"term":"Single-table design","plain":"Storing several item types in one DynamoDB table, with key prefixes chosen so that each question is one Query on one item collection."},{"term":"Global secondary index (GSI)","plain":"A copy of the table's items under a different partition and sort key, kept up to date by DynamoDB, asynchronously."},{"term":"Sparse index","plain":"An index that holds only the items that have its key attributes, such as payments but not ledger entries."},{"term":"Multi-attribute key","plain":"A GSI partition or sort key made of up to four attributes, used left to right. Added in November 2025."},{"term":"TransactWriteItems","plain":"A DynamoDB call that applies up to 100 Put, Update, Delete and ConditionCheck actions all or nothing."},{"term":"Cancellation reasons","plain":"The per-action list in <code>TransactionCanceledException<\/code> that says which condition failed or which item conflicted."},{"term":"Client request token","plain":"An id sent with <code>TransactWriteItems<\/code> so that DynamoDB answers an identical repeat within 10 minutes without writing again."}],"remote":true},"nosql-05":{"id":"nosql-05","track":"nosql","n":5,"title":"Partitioning: consistent hashing and hot keys","ready":true,"minutes":40,"goal":"By the end you can explain why one token per node gives uneven shares and how virtual nodes fix it, say which nodes give keys to a joining node, read Cassandra's tokens and replica placement, and find and split a hot partition key.","quiz":[{"q":"Four nodes have one token each. A fifth node joins with one token. Which nodes give it keys?","options":["All four, about a quarter of its share each","Exactly one: the node whose arc the new token lands in","None until a background rebalance job runs","Every node, because about 80% of keys move"],"answer":1,"why":"The new node takes the arc between the previous token and its own, and that arc belonged to exactly one node, the next one clockwise. Nobody else changes. The 80% figure belongs to <code>hash mod S<\/code>, and spreading the load over several donors is what virtual nodes add.","from":null},{"q":"A ten-node Cassandra cluster with 16 tokens per node loses one node for good. Where does the dead node's share of the ring go?","options":["All of it to the next node clockwise, which doubles that node's load","Nowhere: its keys are lost until it comes back","In slices to many of the other nodes, one slice per token it owned","Every key is rehashed onto the nine remaining nodes"],"answer":2,"why":"Each of its 16 arcs falls to the next token clockwise, and those tokens belong to many different nodes, so the load spreads. The first option is what happens with one token per node. Keys aren't lost while other replicas hold copies, and a ring never rehashes everything.","from":null},{"q":"Replication factor 3. Walking clockwise from a key's token you meet tokens owned by cass2, cass2, cass1, cass2, cass3. Which nodes hold the key?","options":["cass2, cass1 and cass3","cass2, cass2 and cass1","cass1, cass2 and cass3, in address order","cass2 only, because it owns the first two tokens"],"answer":0,"why":"The walk keeps the first three distinct nodes and skips tokens of nodes already chosen. Two copies on cass2 would both vanish if cass2 died, which is why Dynamo and Cassandra skip. The order is the ring's, not the addresses'.","from":null},{"q":"Every payment updates one running-total item for its merchant, <code>MERCH#M-0042 / TOTAL<\/code>. At peak that's 4,000 updates a second on that item, and DynamoDB throttles it. What fixes it?","options":["Switch the table to on-demand capacity","Wait: DynamoDB splits a busy partition by itself","Give the cluster more virtual nodes","Keep 10 total items, add to the one picked by the payment id, and sum the 10 on read"],"answer":3,"why":"One item lives in one partition, which takes at most 1,000 writes a second in any capacity mode. A split can't help one item: the 2022 DynamoDB paper says so for a single hot item. Virtual nodes are a Cassandra ring idea and balance keys, not traffic. Sharding the counter spreads the writes, and the read pays by summing ten items.","from":null},{"q":"From lesson 1: a Bigtable-style table uses the row key <code>M-0042#&lt;Long.MAX_VALUE minus millis&gt;#&lt;paymentId&gt;<\/code> so a merchant's newest payments come first. On Black Friday, why does one tablet server take all of M-0042's writes, and what's the fix?","options":["Bigtable hashes the merchant id; add more tablet servers","Every new row sorts to the start of M-0042's range, inside one tablet; prefix a bucket such as <code>M-0042#3#...<\/code> and read all buckets","Column families are stored on one server; split them into more families","The commit log is per merchant; write in batches"],"answer":1,"why":"Rows are kept in key order, so time-ordered keys put every new write at the same end of the merchant's range, which one tablet serves. A bucket number after the merchant spreads new rows over N ranges, and a read merges N range scans: the same write sharding as in DynamoDB. Bigtable doesn't hash row keys, and families group columns, not rows.","from":"nosql-01"}],"cards":[{"front":"With S nodes and one random token each, how big is the largest share on average?","back":"<p>(1 + 1/2 + ... + 1/S) / S of the ring: about 41% for six nodes, against a fair 16.7%.<\/p>"},{"front":"What does a virtual node (token) fix?","back":"<p>Uneven shares, a joining node taking everything from one neighbour, a dead node dumping everything on one, and unequal machines (give bigger ones more tokens).<\/p>"},{"front":"Where does a joining node's data come from?","back":"<p>From the owner of the slice just before each of its tokens. One token: one donor. Many tokens: small slices from several donors.<\/p>"},{"front":"Why does a replica walk skip some tokens?","back":"<p>With virtual nodes the next tokens often belong to a node already chosen, and copies on one machine die together. Dynamo skips until it has N distinct nodes.<\/p>"},{"front":"Cassandra 5.0's partitioner and token defaults?","back":"<p>Murmur3Partitioner, tokens from -2^63 to 2^63 - 1; <code>num_tokens: 16<\/code> with <code>allocate_tokens_for_local_replication_factor: 3<\/code>.<\/p>"},{"front":"Why doesn't a partition split or more vnodes fix a hot key?","back":"<p>Everything with one partition key lives in one partition. Splits and tokens balance keys; one key's traffic stays on one partition, capped at 1,000 writes and 3,000 reads a second in DynamoDB.<\/p>"},{"front":"Write sharding: what does it cost?","back":"<p>Reads: every query for the logical key becomes one query per shard plus a merge (scatter-gather). Use a calculated suffix so one item's shard can be found again.<\/p>"}],"terms":[{"term":"Token","plain":"One position on the hash ring owned by a node. The node owns the arc that ends at its token."},{"term":"Virtual node","plain":"Dynamo's name for one of the many tokens a physical node owns, so its share is many small arcs instead of one big one."},{"term":"Murmur3Partitioner","plain":"Cassandra's default: hashes the partition key with Murmur3 to a token between -2^63 and 2^63 - 1."},{"term":"Token allocator","plain":"Cassandra's algorithm (3.x and later) that picks a joining node's tokens to balance load for a replication factor, instead of at random."},{"term":"Hot key","plain":"A partition key that gets more requests than one partition can serve, however even the rest of the table is."},{"term":"Write sharding","plain":"Writing one logical key under several keys, such as <code>MERCH#M-0042#0<\/code> to <code>#9<\/code>, so its writes spread over several partitions."},{"term":"Scatter-gather","plain":"A read that asks several partitions (or shards) at once and merges their answers."}],"remote":true},"nosql-06":{"id":"nosql-06","track":"nosql","n":6,"title":"Replication and quorums: N, R and W","ready":true,"minutes":40,"goal":"By the end you can say what N, R and W mean in a leaderless store, predict from R + W &gt; N whether a read must see the latest write, and watch hinted handoff, read repair and anti-entropy bring a stale copy back on a three-node Cassandra cluster.","quiz":[{"q":"N = 3, W = 2, R = 1. Can a read miss a write that was acknowledged?","options":["No: two replicas have the write, which is a majority","No, as long as no replica is down","Yes: 2 + 1 = 3 is not more than 3, so the one replica read may be the one without the write","Yes, but only while hinted handoff is switched off"],"answer":2,"why":"The write set has two replicas and the read asks one. The third replica, which didn't take the write, is a perfectly valid read set of size one. A majority of writers isn't enough: the read set has to overlap the write set, which needs R + W &gt; N. Hints don't change the arithmetic, and the miss can happen with every replica up, when one message is slow.","from":null},{"q":"Replication factor 3, two replicas down. Which still works?","options":["Reads and writes at ONE","Reads at QUORUM, because one replica has the data","Writes at QUORUM, stored as hints","Nothing: the partition is unavailable"],"answer":0,"why":"ONE needs one live replica, and there is one. QUORUM needs 2 of 3 alive and gets 1, so Cassandra refuses both reads and writes with <code>Unavailable<\/code> before trying, as the Try-it showed. Hints don't count toward QUORUM; only <code>ANY<\/code> accepts a hint as an acknowledgement.","from":null},{"q":"A write at ALL fails with <code>WriteTimeout: received only 2 responses<\/code>. What do you know about the cluster?","options":["Nothing was written: Cassandra rolled back the two replicas","The write is probably on two replicas and later reads may return it; treat the outcome as unknown","The write is on exactly one replica, the coordinator","The write will be rejected by read repair, because it failed"],"answer":1,"why":"A timeout means the coordinator stopped waiting, not that anything was undone. The two replicas that answered stored the value, and the Try-it read it back at ONE. Read repair spreads the newest timestamp, so it would spread this value, not remove it. Make the retry idempotent.","from":null},{"q":"Replica C is stale for key A-1001 and stale for key A-2002. A read of A-1001 at QUORUM asks A and C and repairs C. What happens to C's copy of A-2002?","options":["It's repaired too: read repair fixes the whole replica","It's repaired at the next QUORUM read of any key","It's deleted, because C was found stale","Nothing: read repair fixes only the keys that were read, on the replicas that were asked"],"answer":3,"why":"Read repair works on what the read touched: one key, the replicas in the read set. A-2002 stays stale until someone reads it with R of at least 2 including C, a hint arrives, or anti-entropy repair (<code>nodetool repair<\/code>) compares Merkle trees for its range.","from":null},{"q":"From lesson 1: DynamoDB isn't Dynamo. In this lesson's terms, how does a DynamoDB partition replicate a write?","options":["Leaderless: the client picks W per request, as in Cassandra","A leader takes every write and acknowledges once a quorum of the partition's replicas has logged it; a strongly consistent read goes to the leader","Each write goes to one replica, and anti-entropy copies it to the others later","All replicas must log the write before DynamoDB acknowledges it"],"answer":1,"why":"The 2022 DynamoDB paper describes a replication group per partition with a Multi-Paxos leader. The leader acknowledges a write once a quorum of peers has persisted its log record, and only the leader serves strongly consistent reads; any replica can serve eventually consistent ones. That's the leader-based family, not Dynamo's leaderless quorums.","from":"nosql-01"}],"cards":[{"front":"What are N, R and W?","back":"<p>N: how many replicas hold a key. W: how many must acknowledge a write. R: how many a read asks.<\/p>"},{"front":"Why does R + W &gt; N guarantee a read sees the last acknowledged write?","back":"<p>A write set of W and a read set of R can't fit in N replicas without sharing one, and the shared one has the write.<\/p>"},{"front":"Cassandra QUORUM with replication factor 3?","back":"<p>2 of 3. QUORUM writes and reads overlap (2 + 2 &gt; 3) and both survive one replica down.<\/p>"},{"front":"Default consistency in cqlsh and in the Java driver 4.19?","back":"<p>cqlsh: ONE. Java driver: LOCAL_ONE. You start at R = W = 1 unless you choose otherwise.<\/p>"},{"front":"<code>Unavailable<\/code> versus <code>WriteTimeout<\/code>?","back":"<p>Unavailable: too few replicas alive, nothing attempted. WriteTimeout: attempted, too few answers in time, and the write may have landed.<\/p>"},{"front":"Hinted handoff, read repair, anti-entropy: what does each cover?","back":"<p>Hints: a replica down for a short time (up to <code>max_hint_window<\/code>, 3 h). Read repair: keys that get read. Anti-entropy (<code>nodetool repair<\/code>, Merkle trees): everything else.<\/p>"},{"front":"Why don't quorums make Cassandra a transactional database?","back":"<p>Timed-out writes aren't undone, concurrent writes lose to the later timestamp, and quorum reads aren't linearizable. Use idempotent writes and lightweight transactions.<\/p>"}],"terms":[{"term":"Leaderless replication","plain":"Any node can take a write and send it to all replicas; no single copy orders the writes."},{"term":"Coordinator","plain":"The node that received a client's request and forwards it to the replicas, then answers the client."},{"term":"Consistency level","plain":"Cassandra's per-statement choice of W or R: ONE, QUORUM, ALL, LOCAL_QUORUM, ANY and others."},{"term":"Quorum","plain":"A set of replicas big enough that any two such sets overlap; for N = 3, any 2."},{"term":"Hinted handoff","plain":"Keeping a write for a down replica and delivering it when the replica returns."},{"term":"Read repair","plain":"During a read, writing the newest version back to the replicas that answered with an older one."},{"term":"Anti-entropy repair","plain":"A background comparison of replicas, range by range, that ships only the keys that differ."},{"term":"Merkle tree","plain":"A tree of hashes: leaves hash keys, parents hash children, so equal roots mean equal data."}],"remote":true},"nosql-07":{"id":"nosql-07","track":"nosql","n":7,"title":"Wide-column stores with Cassandra","ready":true,"minutes":40,"goal":"By the end you can read a CQL primary key as a sorted partition on disk, say what an insert, an update and a delete each leave in the SSTables, spot a tombstone storm before it happens, and choose between a query table, an SAI index, ALLOW FILTERING and a lightweight transaction.","quiz":[{"q":"Table <code>payments_by_account<\/code> has <code>PRIMARY KEY ((account_id), created_at, payment_id)<\/code> with <code>created_at DESC<\/code>. Which query reads one contiguous slice of one partition?","options":["<code>WHERE account_id = 'A-1001' AND created_at &gt;= '2026-11-07' AND created_at &lt; '2026-11-08'<\/code>","<code>WHERE created_at &gt;= '2026-11-07' ALLOW FILTERING<\/code>","<code>WHERE account_id = 'A-1001' AND payment_id = 'pay-81723'<\/code>","<code>WHERE account_id = 'A-1001' ORDER BY amount_minor DESC<\/code>"],"answer":0,"why":"It gives the partition key with <code>=<\/code> and one range on the first clustering column, so the node seeks to the window and reads until it leaves it. Without the account there's no token. <code>payment_id<\/code> alone skips <code>created_at<\/code>, so it's a gap Cassandra refuses without <code>ALLOW FILTERING<\/code>. And <code>ORDER BY<\/code> works only on clustering columns, in stored or reversed order.","from":null},{"q":"Two services set the status of pay-81723 one second apart, the first to CAPTURED, the second to VOIDED, both with plain <code>UPDATE<\/code>s through the Java driver. The second service's pod clock is 3 seconds slow. What does a read return afterwards?","options":["VOIDED: Cassandra applies writes in the order they arrive","An error, because two updates touched the same cell","CAPTURED: each cell keeps the highest timestamp, and the driver stamped the second update with the slow clock","Both values, as siblings for the application to merge"],"answer":2,"why":"The Java driver 4.x stamps each statement with the client's clock by default. The VOIDED write carries a timestamp 2 seconds older than CAPTURED, so last write wins keeps CAPTURED on every replica, and the void disappears without an error. Cassandra has no siblings; that's Dynamo with vector clocks, in lesson 9.","from":null},{"q":"Why does Cassandra write a tombstone for a delete instead of removing the row from each replica?","options":["Because removing data from an SSTable would need a full rewrite of the file","So that a replica that missed the delete can't have the row copied back to the others by repair","So that the delete can be undone within <code>gc_grace_seconds<\/code>","Because tombstones make reads faster than missing rows"],"answer":1,"why":"If the replicas that saw the delete simply forgot the row, repair would find it on the replica that was down and spread it back. The tombstone is newer than the row, so it wins the merge and repair spreads the delete instead. Immutable SSTables are true too, but a delete could still be a removal in the next compaction; the distributed copies are the reason, as the Cassandra docs say. Tombstones can't be undone, and they make reads slower.","from":null},{"q":"Support wants every FAILED payment of the day, a few times an hour, and the team adds <code>CREATE INDEX ... ON payments_by_account (status) USING 'sai'<\/code>. What does a query on <code>status<\/code> alone now do?","options":["Reads one partition, because the index stores the partition of every FAILED payment in one place","Asks every node, and each node reads only its matching rows through its own index","The same full scan as <code>ALLOW FILTERING<\/code>, because SAI only works with a partition key","It's refused: an indexed column still needs <code>ALLOW FILTERING<\/code>"],"answer":1,"why":"SAI is a local index: each node indexes its own SSTables and memtables. A query without a partition key can't know which nodes hold FAILED payments, so it visits every token range (17 in the Try-it), but each node reads only matching rows instead of all of them. That's fine a few times an hour and wrong on a hot path, where a query table wins.","from":null},{"q":"From lesson 6: a node was down for 12 days, longer than <code>gc_grace_seconds<\/code>, while a payment was deleted on the other two replicas. It comes back and <code>nodetool repair<\/code> runs. What happens to the payment?","options":["It stays deleted: repair always prefers the majority","It stays deleted, because hinted handoff delivers the tombstone","Repair fails with an error until the node is rebuilt","It can come back: compaction may have purged the tombstone on the other two, so repair copies the old row back to them"],"answer":3,"why":"Repair compares Merkle trees and copies whatever is newer or missing. Once the tombstone is gone from the other replicas, the stale node's row is the only version left, so it wins. Hints don't help: the default <code>max_hint_window<\/code> is 3 hours, and repair doesn't vote by majority. That's why every node must be repaired more often than <code>gc_grace_seconds<\/code>.","from":"nosql-06"}],"cards":[{"front":"What do the partition key and the clustering columns each decide?","back":"<p>The partition key is hashed to a token: which replicas and which partition. The clustering columns decide the sorted order of rows inside the partition.<\/p>"},{"front":"What happens on a Cassandra write, in order?","back":"<p>Append to the commit log, add to the memtable, acknowledge. Later the memtable is flushed to an immutable SSTable. Nothing is read first.<\/p>"},{"front":"What's the difference between INSERT and UPDATE in Cassandra?","back":"<p>Almost none: both are upserts that write cells with a timestamp. There's no duplicate-key error and no \"row not found\".<\/p>"},{"front":"Who sets a cell's write timestamp when you use the Java driver 4.x?","back":"<p>The client: the default <code>AtomicTimestampGenerator<\/code> uses the application server's clock, unless the statement says <code>USING TIMESTAMP<\/code>.<\/p>"},{"front":"What is <code>gc_grace_seconds<\/code>, and its default?","back":"<p>How long compaction must keep a tombstone before it may drop it: 864,000 s, 10 days. Repair every node more often than that.<\/p>"},{"front":"Tombstone thresholds in 5.0.9's <code>cassandra.yaml<\/code>?","back":"<p><code>tombstone_warn_threshold: 1000<\/code> logs a warning; <code>tombstone_failure_threshold: 100000<\/code> aborts the read.<\/p>"},{"front":"When is <code>ALLOW FILTERING<\/code> acceptable?","back":"<p>When the query also gives the full partition key, so the filter runs over one small partition. Without it, every partition on every node is read.<\/p>"}],"terms":[{"term":"Partition","plain":"All rows with the same partition key, stored together and sorted by the clustering columns, on each of the key's replicas."},{"term":"Clustering columns","plain":"The primary-key columns after the partition key; they set the order of rows inside a partition."},{"term":"Memtable","plain":"A node's in-memory, sorted table of recent writes, flushed to an SSTable when full."},{"term":"Upsert","plain":"A write that inserts the row if it's absent and overwrites the named columns if it's present. Every Cassandra INSERT and UPDATE."},{"term":"Tombstone","plain":"A timestamped marker that a row or cell was deleted or has expired; kept for gc_grace_seconds so repair can spread it."},{"term":"Compaction strategy","plain":"The rule for which SSTables a node merges: size-tiered, leveled, time-window, or unified (UCS, 5.0)."},{"term":"Storage-attached index (SAI)","plain":"Cassandra 5.0's secondary index: each node indexes its own data alongside its memtables and SSTables."},{"term":"Lightweight transaction (LWT)","plain":"A conditional write (<code>IF NOT EXISTS<\/code>, <code>IF col = ?<\/code>) that runs a Paxos round among the replicas before applying."}],"remote":true},"nosql-08":{"id":"nosql-08","track":"nosql","n":8,"title":"Document stores with MongoDB","ready":true,"minutes":40,"goal":"By the end you can shape a payment as one MongoDB document and change it atomically, read what explain() says an index did, turn a SQL GROUP BY into an aggregation pipeline, and say which writes survive a primary failover under w:1 and w:\"majority\".","quiz":[{"q":"Two support agents refund the last 1,000 of a payment at the same moment, each with the guarded <code>updateOne<\/code> from this lesson. What happens?","options":["Both refunds apply, because MongoDB has no transactions here","MongoDB raises a write conflict and both fail","The second update waits for a lock, then applies, refunding 2,000","One applies; the other's filter no longer matches, so it modifies nothing"],"answer":3,"why":"MongoDB checks the filter and applies the update to one document atomically. After the first refund, <code>refundedMinor + 1000 &lt;= amountMinor<\/code> is false, so the second update matches nothing and returns <code>modifiedCount: 0<\/code>. Two separate statements, a read then a write, would race; one guarded update can't. The lab's race test fires twenty at once.","from":null},{"q":"<code>explain(\"executionStats\")<\/code> on a query that returns 5 payments shows <code>keysExamined: 4800, docsExamined: 4800<\/code>. What does that tell you?","options":["The query is fine: it used an index, so it's fast","An index was used, but it doesn't match the query: MongoDB walked 4,800 keys and loaded 4,800 documents to keep 5","The collection is fragmented and needs compacting","MongoDB counted the documents twice because of the projection"],"answer":1,"why":"Keys examined, documents examined and documents returned should be close. Here an index served part of the filter, maybe just <code>merchantId<\/code>, and everything else was checked document by document. Reorder or extend the index to equality, sort, range (lesson 2) until the numbers meet.","from":null},{"q":"<code>db.payments.createIndex({ idempotencyKey: 1 }, { unique: true })<\/code> fails with E11000 on <code>{ idempotencyKey: null }<\/code>. Only 3 payments have a key. Why?","options":["Every payment without the field is indexed as null, and a unique index allows one null","Unique indexes can't be built on a collection that already has documents","Two of the three keys are duplicates","The field name is reserved"],"answer":0,"why":"A missing field is indexed as null, so 997 payments all have the same key, null. A <code>partialFilterExpression<\/code> such as <code>{ idempotencyKey: { $type: \"string\" } }<\/code> indexes only payments that have a key, and uniqueness then applies just to them. Nothing in the error says the three real keys collide.","from":null},{"q":"A replica set's primary is cut off for 20 seconds. Before it notices, it acknowledges one <code>w: 1<\/code> insert, and one <code>w: \"majority\", wtimeout: 5000<\/code> insert fails with a write concern timeout. After it rejoins, what's left of the two?","options":["Both survive: the old primary sends them to the new primary when it rejoins","The <code>w: 1<\/code> insert survives; the failed one is gone","Neither is in the collection; both are in the old primary's rollback files","Only the failed one survives, because it asked for a majority"],"answer":2,"why":"Neither reached a second member, so neither is on the new primary, and the rejoining member rolls back everything after the last point it shares with it. The Try-it found pay-81723 and pay-81724 side by side in the rollback file. The <code>w: 1<\/code> client was told OK and the other was told \"error\"; both were wrong about what would happen.","from":null},{"q":"From lesson 6: Cassandra and a MongoDB replica set both keep three copies. What's different about how they order writes to the same payment?","options":["Nothing: both send every write to all copies and keep the highest timestamp","Both elect a leader per key with Paxos","MongoDB is leaderless; Cassandra has a primary per partition","MongoDB's primary applies writes in one order and secondaries replay its oplog; Cassandra's coordinators send writes to all replicas and the highest timestamp wins"],"answer":3,"why":"MongoDB is the leader-based family: one primary decides the order, so two concurrent updates to one document are applied one after the other. Cassandra is leaderless, as in Dynamo: any node coordinates, replicas reconcile by timestamp, and a concurrent write can silently lose. <code>w: \"majority\"<\/code> plays the role of W = 2 of 3, on top of a single order.","from":"nosql-06"}],"cards":[{"front":"What is a MongoDB write atomic over?","back":"<p>One document. A single update can check a condition in its filter and change several fields and arrays of that document with no other write in between.<\/p>"},{"front":"What does <code>constraint<\/code> (MongoDB 9.0) add over the <code>strict<\/code> validation level?","back":"<p>It scans every existing document when you switch it on, refuses if any break the rules, and then guarantees every document in the collection passes.<\/p>"},{"front":"In <code>explain()<\/code>, what do <code>IXSCAN<\/code>, <code>FETCH<\/code>, <code>COLLSCAN<\/code> and <code>SORT<\/code> mean?","back":"<p>Walk index keys; load the documents they point at; read every document; sort in memory because no index gives the order.<\/p>"},{"front":"Why must a unique index on an optional field be partial?","back":"<p>Documents without the field are indexed as null, and a unique index allows only one null.<\/p>"},{"front":"How long before a replica set elects a new primary?","back":"<p><code>electionTimeoutMillis<\/code> is 10 s by default; the docs say an election should typically finish within 12 s.<\/p>"},{"front":"<code>w: 1<\/code> vs <code>w: \"majority\"<\/code>?","back":"<p><code>w: 1<\/code>: the primary has it, and it can be rolled back if the primary fails over. <code>w: \"majority\"<\/code> (default since 5.0): a majority has it, and it survives failover.<\/p>"},{"front":"Where does a rolled-back write go?","back":"<p>To BSON files under <code>&lt;dbpath&gt;/rollback/&lt;collection uuid&gt;/removed.&lt;time&gt;.bson<\/code> on the old primary. Read them with <code>bsondump<\/code>. Clients aren't told.<\/p>"}],"terms":[{"term":"BSON","plain":"Binary JSON: MongoDB's storage and wire format, with types JSON lacks, such as 64-bit integers, dates and ObjectId."},{"term":"Embedding","plain":"Storing related data inside the parent document, such as a payment's refunds in an array, so one read and one atomic write cover both."},{"term":"Schema validation","plain":"A <code>$jsonSchema<\/code> rule on a collection that every write must pass; levels strict, moderate and, in 9.0, constraint."},{"term":"Multikey index","plain":"An index on an array field, with one entry per array element, each pointing at the document."},{"term":"Aggregation pipeline","plain":"A list of stages ($match, $group, $sort, ...) that documents flow through in order; MongoDB's GROUP BY and more."},{"term":"Oplog","plain":"The primary's ordered log of document changes (<code>local.oplog.rs<\/code>) that secondaries copy and replay."},{"term":"Write concern","plain":"How many replica set members must have a write before the client hears OK: <code>w: 1<\/code> or <code>w: \"majority\"<\/code>."},{"term":"Rollback","plain":"A rejoining former primary undoing the writes the new primary never got, saving them to files."}],"remote":true},"nosql-09":{"id":"nosql-09","track":"nosql","n":9,"title":"Consistency models, CAP, PACELC and conflicts","ready":true,"minutes":40,"goal":"By the end you can name the consistency model a store gives you and break two of them on a replica set, state CAP and PACELC correctly and place a configuration in PACELC's terms, and say how last write wins, vector clocks and CRDTs each handle two concurrent writes.","quiz":[{"q":"A Cassandra keyspace has three replicas, and two are cut off from the coordinator. A read at <code>QUORUM<\/code> fails with <code>Unavailable<\/code>; the same read at <code>ONE<\/code> returns a balance. In CAP's terms, what happened?","options":["Cassandra is AP, so the QUORUM failure is a bug","Cassandra is CP, so the ONE read must be linearizable","Each request chose: QUORUM refused rather than risk a stale answer (C), ONE answered from what it had (A)","CAP doesn't apply, because only two nodes are down"],"answer":2,"why":"CAP describes a choice made during a partition, and Cassandra lets each statement make it. QUORUM can't reach a majority, so it refuses: consistency over availability. ONE answers from one replica that may be stale: availability over consistency. Labels such as \"Cassandra is AP\" describe defaults, not every request.","from":null},{"q":"With no failures at all, a team switches from <code>w: 1<\/code> to <code>w: \"majority\"<\/code> and writes get about 4 ms slower. Which part of PACELC is that?","options":["EC: else, choosing consistency over latency","PC: choosing consistency during a partition","PA: choosing availability during a partition","None: PACELC only covers failures"],"answer":0,"why":"There's no partition, so it's the E half: with everything healthy, waiting for a second member trades latency for the guarantee that the write survives a failover. The Try-it measured about 1.6 ms against 5.3 ms between containers; across regions the gap is a round trip. CAP alone has nothing to say about this.","from":null},{"q":"A customer pays 3,000 through the primary, then the app reads the balance from a secondary that's behind and shows the old 10,000. Then a refresh hits another secondary and shows 7,000, and a third refresh hits the first one again and shows 10,000. Which guarantees were broken?","options":["Only linearizability; session guarantees hold for every MongoDB read","Read your writes (the customer's own payment was missing) and monotonic reads (the balance went from 7,000 back to 10,000)","Only eventual consistency, because the copies disagreed","None: secondaries are allowed to be behind, so nothing was promised"],"answer":1,"why":"The customer wrote, then didn't see the write: read your writes. They saw 7,000, then an older 10,000: monotonic reads. Eventual consistency still holds, since the copies converge once replication catches up. Reading from the primary, or using a causally consistent session with majority reads and writes, keeps both promises.","from":null},{"q":"Two copies of a G-Counter are <code>{eu: 5, us: 2}<\/code> and <code>{eu: 3, us: 4}<\/code>. Why does the merge take <code>{eu: 5, us: 4}<\/code> rather than adding to <code>{eu: 8, us: 6}<\/code>?","options":["Because adding would overflow the counter","Because the maximum is faster to compute","Because each slot only grows, so the bigger value already includes the smaller, and adding would count the same increments twice","Because CRDTs never store more than one value per slot"],"answer":2,"why":"eu's slot is only ever incremented by eu, so 5 is a later state of the same slot than 3, and contains those 3 increments. Taking the maximum gives the same result in any order and when repeated, which lets copies sync any number of times. Adding counts shared history twice: merge the same copy again and the total keeps climbing.","from":null},{"q":"From lesson 6: Cassandra with N = 3, every write and read at <code>QUORUM<\/code>. Is that linearizable?","options":["Yes: R + W &gt; N means every read sees every write","No: R + W &gt; N makes acknowledged writes and reads overlap, but timeouts, concurrent writes resolved by timestamp and reads during a write still break the one-copy illusion","Yes, as long as hinted handoff is on","No, because QUORUM reads only ask one replica"],"answer":1,"why":"Lesson 6 showed the overlap guarantee and its gaps: a timed-out write may still land, two concurrent writes are settled by timestamps (last write wins), and a quorum read during a write can see it while a later one doesn't, unless read repair blocks. Abadi: \"simply using a quorum protocol is not sufficient\" for linearizability. Cassandra's lightweight transactions add the missing agreement step.","from":"nosql-06"}],"cards":[{"front":"What does linearizable mean?","back":"<p>The store behaves like one copy: every read sees every write that completed before the read began, in real time.<\/p>"},{"front":"Read your writes vs monotonic reads?","back":"<p>Read your writes: after you write, your reads include it. Monotonic reads: once you've seen a value, you never see an older one.<\/p>"},{"front":"What does CAP actually say?","back":"<p>During a network partition, a replica that can't reach the others must either answer (give up linearizability) or refuse (give up availability). Nothing about normal operation.<\/p>"},{"front":"PACELC?","back":"<p>If Partition: Availability or Consistency. Else: Latency or Consistency. Abadi, 2012.<\/p>"},{"front":"How do you compare two vector clocks?","back":"<p>Entry by entry, missing = 0. All &lt;= with one smaller: ancestor. Each bigger somewhere: concurrent, keep both as siblings.<\/p>"},{"front":"Why does last write wins lose data?","back":"<p>It keeps one of two concurrent writes by timestamp and drops the other silently, and a skewed clock can make the earlier write win.<\/p>"},{"front":"What makes a CRDT merge safe?","back":"<p>It's commutative, associative and idempotent, so copies converge whatever order and however often they merge. Example: G-Counter takes the max per slot.<\/p>"}],"terms":[{"term":"Consistency model","plain":"A promise about which writes a read may or may not reflect; Jepsen: a safety property that declares what a system can do."},{"term":"Linearizability","plain":"The strongest single-object model: the store behaves like one copy, and reads see every write that finished before they started."},{"term":"Session guarantees","plain":"Promises to one client about its own history: read your writes, monotonic reads, monotonic writes, writes follow reads."},{"term":"Network partition","plain":"Machines keep running but messages between groups of them are lost."},{"term":"PACELC","plain":"Abadi's extension of CAP: in a partition, availability or consistency; else, latency or consistency."},{"term":"Last write wins (LWW)","plain":"Conflict rule that keeps the value with the highest timestamp and drops the rest."},{"term":"Vector clock","plain":"A list of (node, counter) pairs on each version; comparing two shows whether one saw the other or they're concurrent."},{"term":"CRDT","plain":"Conflict-free replicated data type: a value whose merge gives the same result in any order, so replicas converge without coordination."}],"remote":true},"nosql-10":{"id":"nosql-10","track":"nosql","n":10,"title":"Transactions in NoSQL","ready":true,"minutes":40,"goal":"By the end you can explain how a transaction that spans partitions is made atomic (prepare, a recorded decision, commit), predict what DynamoDB, MongoDB and a Cassandra lightweight transaction do when two writers collide, and choose a better data model when a transaction isn't worth its price.","quiz":[{"q":"A <code>TransactWriteItems<\/code> that debits a busy merchant's account fails with <code>TransactionCanceledException<\/code>, reason <code>TransactionConflict<\/code> on the debit. What happened inside DynamoDB?","options":["The debit's condition was false","The transaction waited for a lock on the item and timed out","Another transaction was in flight on that item, so the storage node rejected the prepare and the whole transaction was cancelled","The debit was applied but the other items were not"],"answer":2,"why":"A storage node accepts a prepare only if no other transaction is in flight on the item (and the condition and timestamp checks pass). One rejection cancels everything; nothing was written. A false condition would say <code>ConditionalCheckFailed<\/code>. DynamoDB doesn't queue transactions behind each other, which is why the right response is a retry with jittered backoff, not a longer timeout.","from":null},{"q":"A MongoDB transaction reads A-1001 (100.00), decides to debit 80.00, and its <code>updateOne<\/code> fails with <code>WriteConflict<\/code>. A teammate retries just that <code>updateOne<\/code> inside the same session. What's wrong with that?","options":["The transaction was aborted and its snapshot is stale; the read and the decision must be redone in a new transaction","Nothing: the update has a guard, so it is safe to retry","Write conflicts are permanent; the transfer must be rejected","The update must be retried outside the transaction"],"answer":0,"why":"<code>TransientTransactionError<\/code> means \"rerun the whole transaction\". Another transaction changed A-1001 after this one's snapshot, so the 100.00 it read is no longer true, and any decision based on it has to be made again on a new snapshot. Retrying outside the transaction would lose atomicity with the credit and the ledger insert.","from":null},{"q":"A Cassandra keyspace has three replicas. One is down. An <code>INSERT ... IF NOT EXISTS<\/code> arrives. What happens?","options":["It fails: Paxos needs every replica to promise","It runs as a plain insert, because Paxos is skipped while a replica is down","It waits until the third replica returns","It runs: every phase needs a majority, two of three, and two are up"],"answer":3,"why":"Each Paxos phase waits for a majority of replicas, so one of three can be down. With two down, the coordinator can't reach a majority and the LWT fails as unavailable. Cassandra never quietly downgrades an LWT to a plain write. The replica that was down catches up through repair.","from":null},{"q":"During a lightweight transaction's prepare, one replica's promise reports an accepted value from an older ballot that it never saw committed. What must the new proposer do?","options":["Ignore it: an uncommitted value doesn't count","Finish that value first (propose and commit it under its own ballot), then start its own operation again","Abort and return an error to the client","Merge its own value with the old one"],"answer":1,"why":"That value may already have been accepted by a majority, which makes it chosen, and the proposer can't tell. Paxos's rule is to finish it. Ignoring it is the tempting answer and the one that would let two different values win. The lab's test with a crashed proposer checks exactly this.","from":null},{"q":"From lesson 6: why can't QUORUM reads and QUORUM writes alone give you \"claim this idempotency key only if nobody has\"?","options":["QUORUM reads don't see QUORUM writes","QUORUM writes are rejected when the key exists","Two coordinators can both read \"absent\" before either writes; both writes succeed, and last write wins keeps one without telling the other","Idempotency keys need ALL, not QUORUM"],"answer":2,"why":"R + W &gt; N makes reads overlap acknowledged writes, but nothing orders a read and a write from two different clients. Both claims read before either wrote, so both saw no row; both writes are then acknowledged, and timestamps settle the outcome silently. A lightweight transaction adds the missing agreement on order, with Paxos.","from":"nosql-06"}],"cards":[{"front":"What are the two phases of two-phase commit?","back":"<p>Prepare: every participant checks and holds its part, and answers yes or no. Commit (or cancel): the coordinator records the decision durably, then tells everyone.<\/p>"},{"front":"When does a DynamoDB storage node reject a transaction's prepare?","back":"<p>When a condition fails, the item would break a limit, the transaction's timestamp isn't newer than the item's last write, or another transaction is in flight on the item (<code>TransactionConflict<\/code>).<\/p>"},{"front":"What does <code>TransientTransactionError<\/code> tell your MongoDB code?","back":"<p>Abort and rerun the whole transaction, reads included, on a new snapshot. A write conflict is the usual cause.<\/p>"},{"front":"MongoDB's default limit on a transaction's runtime?","back":"<p>60 seconds (<code>transactionLifetimeLimitSeconds<\/code>). A periodic cleanup aborts older ones; the commit then fails with <code>NoSuchTransaction<\/code>.<\/p>"},{"front":"The four round trips of a Cassandra LWT (Paxos v1)?","back":"<p>Prepare and promise, read (check the IF), propose and accept, commit. Each waits for a majority of replicas.<\/p>"},{"front":"Paxos's one rule for a new proposer?","back":"<p>If a promise reports an accepted value newer than the last commit, finish that value before proposing your own.<\/p>"},{"front":"What is Accord, and can you use it in production today?","back":"<p>Cassandra 6.0's multi-partition, strict serializable transactions (<code>BEGIN TRANSACTION ... COMMIT TRANSACTION<\/code>). 6.0 is alpha: not yet.<\/p>"}],"terms":[{"term":"Two-phase commit (2PC)","plain":"Making a change on several machines atomic: all participants prepare and promise, the coordinator records one decision, then all commit or cancel."},{"term":"Transaction coordinator","plain":"The process that runs a transaction across participants and decides its outcome. DynamoDB keeps a fleet of them and a ledger of their decisions."},{"term":"Snapshot isolation","plain":"Each transaction reads the data as committed when it started. Reads never block; two writers of one item conflict. Write skew is still possible."},{"term":"Write conflict","plain":"Two open transactions writing the same document. MongoDB fails the second write at once and labels the error <code>TransientTransactionError<\/code>."},{"term":"Paxos","plain":"A consensus protocol: replicas promise ballots and accept proposals so that only one value is chosen, even with crashes and races."},{"term":"Ba
