hat does <code>NULL = NULL<\/code> return in SQL?","back":"<p>NULL, meaning unknown. Use <code>IS NULL<\/code>, or <code>IS NOT DISTINCT FROM<\/code> for NULL-safe equality.<\/p>"},{"front":"Which rows does WHERE keep?","back":"<p>Only rows whose condition is true. Rows where it is false or unknown are dropped, without any error.<\/p>"},{"front":"<code>count(*)<\/code> vs <code>count(col)<\/code> vs <code>count(DISTINCT col)<\/code>?","back":"<p>Rows; rows where col is not NULL; different non-NULL values of col.<\/p>"},{"front":"What does <code>sum(x)<\/code> return over zero rows?","back":"<p>NULL, not 0. Write <code>coalesce(sum(x), 0)<\/code> when you need a number.<\/p>"},{"front":"Candidate key vs primary key?","back":"<p>A candidate key is any minimal set of columns that is unique. The primary key is the one you choose. Give the others a UNIQUE constraint.<\/p>"},{"front":"Why can't WHERE use an alias from the select list?","back":"<p>WHERE is evaluated before the select list, so the alias does not exist yet. ORDER BY runs after it and can use it.<\/p>"},{"front":"How do you select all of March 2026 from a timestamptz column?","back":"<p><code>created_at &gt;= '2026-03-01' AND created_at &lt; '2026-04-01'<\/code>. Half-open: no gap at the end, no overlap with April.<\/p>"}],"terms":[{"term":"Relation","plain":"Codd's name for a table: a set of rows that all have the same named, typed columns."},{"term":"Bag","plain":"A collection that allows duplicates. SQL tables and query results are bags unless a key or DISTINCT prevents it."},{"term":"Candidate key","plain":"A minimal set of columns whose values never repeat. A table can have several; the primary key is one of them."},{"term":"Surrogate key","plain":"A key with no business meaning that the database hands out, such as an identity column."},{"term":"Foreign key","plain":"A column whose values must exist as a key in another table. The database checks it on every write."},{"term":"Three-valued logic","plain":"Logic with true, false and unknown. Any comparison with NULL is unknown."},{"term":"Half-open range","plain":"A range that includes its start and excludes its end: &gt;= start AND &lt; end."}],"remote":true},"sql-02":{"id":"sql-02","track":"sql","n":2,"title":"Designing a schema: normalization and constraints","ready":true,"minutes":40,"goal":"By the end you can find the functional dependencies hiding in a flat table, split it so each fact is stored once, decide when a copy is worth keeping, and write a CREATE TABLE whose constraints reject bad rows, including overlapping time ranges.","quiz":[{"q":"<code>settlement_lines(batch_id, merchant_id, merchant_name, amount_minor)<\/code> has the key <code>(batch_id, merchant_id)<\/code>. <code>merchant_name<\/code> depends on <code>merchant_id<\/code> alone. Which normal form does the table break first?","options":["1NF","2NF","3NF, but not 2NF","None: every column depends on the key"],"answer":1,"why":"2NF forbids a column that depends on only part of a composite key. <code>merchant_name<\/code> depends on <code>merchant_id<\/code>, which is half the key, so every batch repeats the name. \"Every column depends on the key\" is tempting because <code>(batch_id, merchant_id)<\/code> does determine the name, but it determines it through only one of its columns.","from":null},{"q":"Which constraint stops two fee periods for the same merchant from overlapping?","options":["UNIQUE (merchant_id, valid_during)","CHECK (lower(valid_during) &lt; upper(valid_during))","PRIMARY KEY (merchant_id, valid_during WITHOUT OVERLAPS)","REFERENCES merchants"],"answer":2,"why":"UNIQUE compares ranges for equality, so <code>[Jan, Jul)<\/code> and <code>[Jun, Sep)<\/code> are different and both get in. A CHECK sees one row at a time. Only an overlap test against the stored rows, done by a temporal key or <code>EXCLUDE ... WITH &amp;&amp;<\/code>, can refuse it.","from":null},{"q":"A team adds <code>CHECK (refunded_minor &lt;= amount_minor)<\/code> to <code>payments<\/code>, where <code>refunded_minor<\/code> is a nullable column. A bug writes NULL into <code>refunded_minor<\/code>. What happens?","options":["The insert fails, because NULL is not less than or equal to the amount","The insert succeeds: the check is unknown, and only false fails a CHECK","PostgreSQL stores 0 instead","The insert fails with a NOT NULL error"],"answer":1,"why":"<code>NULL &lt;= amount_minor<\/code> is unknown, and a CHECK rejects only false. If NULL is not allowed, the column needs <code>NOT NULL<\/code> as well.","from":null},{"q":"A reconciliation query uses <code>WHERE a.balance_minor &lt;&gt; (SELECT sum(e.amount_minor) FROM ledger_entries e WHERE e.account_id = a.account_id)<\/code>. Account 112 shows a balance of 700 and has no ledger rows. Does the query report it?","options":["No: the sum of zero rows is NULL, <code>700 &lt;&gt; NULL<\/code> is unknown, and WHERE drops the row","Yes: an account with no rows sums to 0, and 700 is not 0","No: a scalar subquery that finds no rows raises an error","Yes, but only after VACUUM updates the statistics"],"answer":0,"why":"Two rules from lesson 1 combine. <code>sum<\/code> over no rows is NULL, and WHERE keeps only true rows. Wrap the sum in <code>coalesce(..., 0)<\/code> so empty accounts compare as zero.","from":"sql-01"},{"q":"<code>accounts.balance_minor<\/code> caches the sum of ledger entries. Which write path keeps it correct when the service crashes at a random moment?","options":["Insert the ledger entries and update the balance in the same transaction","Insert the ledger entries, commit, then update the balance","Update the balance first, commit, then insert the ledger entries","Add <code>CHECK (balance_minor = sum(amount_minor))<\/code> to accounts"],"answer":0,"why":"A transaction makes both writes visible together or not at all, so a crash cannot leave one without the other. Either two-commit order leaves a window where a crash splits them. A CHECK cannot read other rows or other tables, so the last option is not even valid SQL.","from":null}],"cards":[{"front":"What does the functional dependency <code>X → Y<\/code> mean?","back":"<p>Any two rows that agree on X also agree on Y. X determines Y.<\/p>"},{"front":"How do you test <code>X → Y<\/code> against data?","back":"<p><code>SELECT X FROM t GROUP BY X HAVING count(DISTINCT Y) &gt; 1<\/code>. Any row returned breaks the dependency.<\/p>"},{"front":"3NF in one sentence?","back":"<p>No non-key column depends on another non-key column (on top of 1NF and 2NF).<\/p>"},{"front":"What happens when a CHECK condition is NULL?","back":"<p>The row is accepted. A CHECK fails only on false, so pair it with NOT NULL.<\/p>"},{"front":"Does a foreign key create an index on the referencing column?","back":"<p>No, in PostgreSQL and in Oracle. Create it yourself if you delete or update referenced rows, or join on it.<\/p>"},{"front":"What does <code>PRIMARY KEY (merchant_id, valid_during WITHOUT OVERLAPS)<\/code> enforce?","back":"<p>No two rows for the same merchant_id have overlapping ranges (PostgreSQL 18). It uses a GiST index and fails with 23P01.<\/p>"},{"front":"Why do identity ids have gaps?","back":"<p>A sequence never gives a number back. A failed or rolled-back insert still uses one up.<\/p>"}],"terms":[{"term":"Functional dependency","plain":"X → Y: rows that agree on X always agree on Y. A key determines every column."},{"term":"Normalization","plain":"Splitting tables so each fact is stored once, in a table keyed by what determines it."},{"term":"Update anomaly","plain":"A fact stored on many rows, so one change must touch all of them, and a missed row makes the table contradict itself."},{"term":"Denormalization","plain":"Storing a value you could compute, such as a cached balance, to make a read fast. It needs a check."},{"term":"Constraint","plain":"A rule the database checks on every write: NOT NULL, CHECK, UNIQUE, PRIMARY KEY, FOREIGN KEY, EXCLUDE."},{"term":"Range type","plain":"A value holding a start and an end, such as tstzrange '[2026-01-01,2026-07-01)'."},{"term":"Exclusion constraint","plain":"A rule that no two rows match under given operators, such as equal merchant and overlapping ranges."}],"remote":true},"sql-03":{"id":"sql-03","track":"sql","n":3,"title":"Joins, including semi and anti joins","ready":true,"minutes":40,"goal":"By the end you can predict how many rows any join returns, keep unmatched rows with an outer join without losing them in WHERE, write semi and anti joins with EXISTS and NOT EXISTS, and read which join method PostgreSQL chose in EXPLAIN.","quiz":[{"q":"There are 37 payments and 6 refunds. Payment 5 has two refunds, four other payments have one each, and the rest have none. How many rows does <code>payments p LEFT JOIN refunds r ON r.payment_id = p.payment_id<\/code> return?","options":["37","38","43","6"],"answer":1,"why":"Each payment appears once per matching refund, or once with NULLs if it has none. Payment 5 matches twice, so it adds one extra row: 37 + 1 = 38. 43 would be 37 plus all 6 refunds, as if every refund added a row on top of its payment.","from":null},{"q":"<code>SELECT * FROM merchants WHERE merchant_id NOT IN (SELECT merchant_id FROM accounts)<\/code> returns 0 rows, although some merchants have no settlement account yet. What is the best fix?","options":["Add DISTINCT to the subquery","Swap NOT IN for != ALL","Rewrite it as <code>WHERE NOT EXISTS (SELECT 1 FROM accounts a WHERE a.merchant_id = merchants.merchant_id)<\/code>","Wrap the subquery column in coalesce(merchant_id, 0)"],"answer":2,"why":"<code>accounts.merchant_id<\/code> is NULL for customer accounts, and one NULL makes every NOT IN test unknown. NOT EXISTS ignores NULL rows because they never make the condition true. <code>!= ALL<\/code> is the same operator as NOT IN, and DISTINCT keeps the NULL. coalesce works only as long as nobody ever has id 0, which is a guess, not a rule.","from":null},{"q":"A query has <code>FROM merchants m LEFT JOIN payments p ON p.merchant_id = m.merchant_id WHERE p.status = 'failed'<\/code>. What does it return?","options":["Every merchant, with NULLs where there are no failed payments","Every merchant once, whether or not it has payments","An error: a LEFT JOIN cannot have a WHERE on the right table","Only merchants that have failed payments, one row per failed payment"],"answer":3,"why":"WHERE runs after the join. Merchants without a failed payment get rows with <code>p.status<\/code> NULL or another status, and those rows fail the test, so the LEFT JOIN behaves like an inner join. Put <code>AND p.status = 'failed'<\/code> in ON to keep every merchant.","from":null},{"q":"Both <code>customers<\/code> and <code>accounts<\/code> are large. What join node do you expect in the plan for <code>... WHERE NOT EXISTS (SELECT 1 FROM accounts a WHERE a.customer_id = c.customer_id)<\/code>?","options":["Hash Anti Join (or Merge Anti Join)","Seq Scan with a Filter on a hashed SubPlan","Hash Join followed by a Unique node","Nested Loop with the subquery rerun from scratch for every customer, always"],"answer":0,"why":"PostgreSQL turns NOT EXISTS into an anti join, so it can use the hash or merge machinery and read each table once. The filter on a hashed SubPlan is what NOT IN produces; it is not a join, and it gets slow when the subquery result outgrows work_mem.","from":null},{"q":"Lesson 2 split the export into payments, merchants and mcc_codes, each keyed by what determines it. Joining <code>payments<\/code> to <code>merchants<\/code> to <code>mcc_codes<\/code> on those keys returns how many rows per payment?","options":["One per payment of the same merchant","Exactly one, because each step follows a foreign key to a primary key","Zero or one, depending on the payment's status","One per row of mcc_codes"],"answer":1,"why":"Each step goes from a NOT NULL foreign key to a primary key, so each payment finds exactly one merchant and that merchant exactly one category. Joins only multiply rows when you go from a parent to its children.","from":"sql-02"}],"cards":[{"front":"How many rows does an inner join return?","back":"<p>For each left row, the number of right rows that match it, added up. A cross join is left rows times right rows.<\/p>"},{"front":"Where does a condition on the right table of a LEFT JOIN go?","back":"<p>In ON. In WHERE it runs after the join, drops the NULL-padded rows and turns the LEFT JOIN into an inner join.<\/p>"},{"front":"What is a semi join, and how do you write it?","back":"<p>Keep each left row once if at least one match exists. <code>WHERE EXISTS (SELECT 1 FROM ... WHERE &lt;match&gt;)<\/code>.<\/p>"},{"front":"Why does <code>x NOT IN (SELECT y ...)<\/code> return nothing when y has a NULL?","back":"<p>It means x &lt;&gt; every y, and x &lt;&gt; NULL is unknown, so the whole test is never true.<\/p>"},{"front":"Two safe ways to write an anti join?","back":"<p><code>WHERE NOT EXISTS (...)<\/code>, or <code>LEFT JOIN ... WHERE right_pk IS NULL<\/code>.<\/p>"},{"front":"How does a hash join work?","back":"<p>Build an in-memory hash table from the smaller input, then read the larger input once and probe one bucket per row. Equality joins only.<\/p>"}],"terms":[{"term":"Inner join","plain":"All pairs of rows from two tables for which the ON condition is true."},{"term":"Cross join","plain":"Every row paired with every row: left rows times right rows."},{"term":"Left outer join","plain":"An inner join plus every unmatched left row once, with NULL in the right table's columns."},{"term":"Semi join","plain":"Keeps each left row once if at least one matching right row exists. Written with EXISTS."},{"term":"Anti join","plain":"Keeps the left rows that have no matching right row. Written with NOT EXISTS."},{"term":"Correlated subquery","plain":"A subquery that refers to a column of the outer query, so it is evaluated per outer row."},{"term":"Hash join","plain":"A join method: build a hash table from one input, then probe it once for each row of the other."}],"remote":true},"sql-04":{"id":"sql-04","track":"sql","n":4,"title":"Aggregation: GROUP BY, FILTER, ROLLUP and GROUPING SETS","ready":true,"minutes":40,"goal":"By the end you can fold rows into one row per group, choose between WHERE, HAVING and FILTER for a condition, add subtotal rows with ROLLUP and label them with GROUPING(), and spot the join that makes a sum count rows twice.","quiz":[{"q":"<code>SELECT country_code, count(*) FROM merchants WHERE count(*) &gt; 1 GROUP BY country_code<\/code> fails. What is the fix?","options":["Move the condition to <code>HAVING count(*) &gt; 1<\/code>","Add <code>count(*)<\/code> to the GROUP BY","Write <code>WHERE count &gt; 1<\/code> using the column name","Add DISTINCT to the SELECT"],"answer":0,"why":"WHERE runs on single rows before any group exists, so it cannot use an aggregate. HAVING runs on the folded rows. Adding an aggregate to GROUP BY is not allowed either, and <code>count<\/code> in WHERE is not a column at all.","from":null},{"q":"Merchants 2, 4 and 7 have failed payments; 6 merchants have payments in all. How many rows does <code>SELECT merchant_id, count(*) FROM payments WHERE status = 'failed' GROUP BY merchant_id<\/code> return?","options":["6, with 0 for merchants without failures","8","3","5, one per failed payment"],"answer":2,"why":"WHERE removes the other rows before grouping, so only merchants 2, 4 and 7 have rows to start a group. To keep all six with a 0, put the condition on the aggregate: <code>count(*) FILTER (WHERE status = 'failed')<\/code>.","from":null},{"q":"An order has 3 lines and 2 shipments. A report runs <code>orders o JOIN order_lines l ON ... JOIN shipments s ON ...<\/code> and then <code>sum(l.quantity)<\/code> per order. How many times is each line's quantity added?","options":["Once","Twice, once per shipment","Three times, once per line","It depends on the join method PostgreSQL picks"],"answer":1,"why":"The join pairs every line with every shipment of the same order: 3 x 2 = 6 rows, so each line appears twice. The join method never changes the result. Fold lines and shipments to one row per order each, then join.","from":null},{"q":"A report groups by <code>ROLLUP (region)<\/code> and labels the total row with <code>coalesce(region, 'Total')<\/code>. Some customers have a NULL region. What does the output show?","options":["Two rows labelled Total, one of them only the customers with no region","One Total row; ROLLUP merges the NULL group into it","An error: ROLLUP does not allow NULL keys","The NULL group is dropped"],"answer":0,"why":"The NULL-region customers form an ordinary group whose key is NULL, and the grand total row also has NULL there. coalesce cannot tell them apart. <code>CASE WHEN GROUPING(region) = 1 THEN 'Total' ELSE region END<\/code> can: GROUPING is 1 only on the rolled-up row.","from":null},{"q":"<code>merchants m LEFT JOIN payments p ON p.merchant_id = m.merchant_id ... GROUP BY m.merchant_id<\/code>. Paper Lantern Books has no payments. What do <code>count(*)<\/code> and <code>count(p.payment_id)<\/code> return for it?","options":["0 and 0","NULL and 0","1 and 0","1 and 1"],"answer":2,"why":"Lesson 3's LEFT JOIN emits one row for an unmatched merchant, with NULL in every payments column. <code>count(*)<\/code> counts rows, so it says 1. <code>count(p.payment_id)<\/code> counts non-NULL values, so it says 0, which is the answer you want.","from":"sql-03"}],"cards":[{"front":"What may appear in the SELECT list of a grouped query?","back":"<p>Grouping keys, aggregates, and columns of a table whose primary key is grouped (they depend on it).<\/p>"},{"front":"WHERE or HAVING: which runs first, and on what?","back":"<p>WHERE, on single rows before grouping. HAVING runs after folding, on one row per group.<\/p>"},{"front":"What does <code>count(*) FILTER (WHERE status = 'failed')<\/code> count?","back":"<p>Only the rows of the group that pass the condition. Other aggregates in the same query still see every row.<\/p>"},{"front":"<code>ROLLUP (a, b)<\/code> is shorthand for which grouping sets?","back":"<p><code>GROUPING SETS ((a, b), (a), ())<\/code>. <code>CUBE (a, b)<\/code> adds <code>(b)<\/code> as well.<\/p>"},{"front":"How do you tell a subtotal row from a group whose key is NULL?","back":"<p><code>GROUPING(col)<\/code> is 1 when col was rolled up in that row and 0 for a real value, NULL included.<\/p>"},{"front":"Why does <code>sum(p.amount)<\/code> inflate after joining payments to refunds?","back":"<p>The join repeats a payment once per refund, and GROUP BY folds every repeat. Fold refunds per payment first.<\/p>"},{"front":"What does <code>sum(x)<\/code> return over zero rows?","back":"<p>NULL, not 0. Wrap it in <code>coalesce(sum(x), 0)<\/code> when 0 is the right answer.<\/p>"}],"terms":[{"term":"Aggregate function","plain":"A function that folds many values into one: count, sum, avg, min, max."},{"term":"Group","plain":"All input rows that share the same values of the GROUP BY keys. Each group becomes one output row."},{"term":"HAVING","plain":"A filter on the folded groups, applied after GROUP BY and before the select list."},{"term":"FILTER clause","plain":"<code>agg(...) FILTER (WHERE cond)<\/code>: the aggregate reads only the rows of its group that pass cond."},{"term":"Pivoting","plain":"Turning values that sit in rows (one row per status) into columns (one column per status)."},{"term":"Grouping set","plain":"One list of grouping keys. GROUPING SETS runs several of them over the same rows in one query."},{"term":"ROLLUP and CUBE","plain":"Shorthands for grouping sets: ROLLUP drops keys from the right for subtotals; CUBE uses every combination."},{"term":"GROUPING()","plain":"Returns 1 for a column that was rolled up in this row, 0 where it holds a real value."}],"remote":true},"sql-05":{"id":"sql-05","track":"sql","n":5,"title":"Subqueries and common table expressions","ready":true,"minutes":40,"goal":"By the end you can put a subquery where a value, a list or a table goes, tell a correlated subquery from an uncorrelated one in SQL and in EXPLAIN, rewrite a per-row subquery as a join, and predict whether PostgreSQL inlines or materializes a CTE.","quiz":[{"q":"A report shows each customer with <code>(SELECT c.pan_last4 FROM cards c JOIN accounts a ON a.account_id = c.account_id WHERE a.customer_id = cu.customer_id)<\/code>. It passed every test and fails in production with \"more than one row returned by a subquery used as an expression\". Why?","options":["Some customer has two cards, and a scalar subquery may return at most one row","PostgreSQL forbids scalar subqueries in the SELECT list","The subquery needs DISTINCT","Production has customers with no card, and an empty subquery is an error"],"answer":0,"why":"The one-row limit is checked when the query runs, against the data that exists. The test data had one card per customer. An empty scalar subquery is not an error: it is NULL. DISTINCT would not help, because two cards have different last4 digits. Decide which card you want (the primary one, the newest) and say so in the WHERE.","from":null},{"q":"<code>SELECT p.payment_id FROM payments p WHERE p.amount_minor &gt; (SELECT avg(amount_minor) FROM payments WHERE merchant_id = merchant_id)<\/code>. What is each payment compared with?","options":["Its own merchant's average","The average over all payments","Nothing: the subquery returns NULL","An error is raised: ambiguous column"],"answer":1,"why":"Both <code>merchant_id<\/code> names resolve to the inner <code>payments<\/code>, the nearest table that has the column, so the condition is true for every non-NULL row and the subquery is not correlated at all. PostgreSQL raises no error. Write <code>payments p2 ... WHERE p2.merchant_id = p.merchant_id<\/code>.","from":null},{"q":"EXPLAIN ANALYZE shows <code>SubPlan 1<\/code> under a filter, with <code>loops=930826<\/code> on its Seq Scan. What is the best next step?","options":["Add MATERIALIZED to a CTE","Rewrite the subquery as a join to pre-aggregated rows, or give it an index to use","Increase work_mem","Nothing: SubPlans are cached between rows"],"answer":1,"why":"Each loop is one run of the subquery for one outer row, here a full table scan each time. Computing the aggregate once per key and joining turns 930,826 scans into two passes. PostgreSQL does not cache a SubPlan's result between rows, and work_mem does not change the number of runs.","from":null},{"q":"A CTE <code>recent<\/code> is referenced twice in the main query and has no MATERIALIZED keyword. What does PostgreSQL 18 do?","options":["Inlines it twice","Raises an error","Computes it once, stores it, and reads the stored rows twice","Computes it once per row of the main query"],"answer":2,"why":"A side-effect-free CTE is inlined only when it is referenced once. With two references it is materialized by default. Write <code>AS NOT MATERIALIZED<\/code> if you want each reference inlined, for example so that a filter can use an index.","from":null},{"q":"Lesson 3 wrote an anti join as <code>WHERE NOT EXISTS (SELECT 1 FROM accounts a WHERE a.customer_id = cu.customer_id)<\/code>. That subquery is correlated. How does PostgreSQL run it?","options":["As a Hash Anti Join, reading each table once","As a SubPlan, once per customer","As an InitPlan, once","It materializes accounts as a CTE"],"answer":0,"why":"PostgreSQL rewrites EXISTS, NOT EXISTS and IN subqueries into semi and anti joins, so lesson 3's plan showed a Hash Anti Join. Correlated does not always mean per-row. The per-row SubPlan is what you get for a correlated subquery that computes a value, such as an average.","from":"sql-03"}],"cards":[{"front":"What does a scalar subquery return when it finds no row? Two rows?","back":"<p>No row: NULL. Two rows: the statement fails with \"more than one row returned by a subquery used as an expression\".<\/p>"},{"front":"What makes a subquery correlated?","back":"<p>It refers to a column of the outer query, so its value depends on the outer row.<\/p>"},{"front":"InitPlan or SubPlan: which runs once?","back":"<p>InitPlan: an uncorrelated subquery, run once. A SubPlan is run for each outer row that needs it.<\/p>"},{"front":"In a subquery, which table does an unqualified column name bind to?","back":"<p>The nearest one: the subquery's own FROM first, then the outer query. No error either way.<\/p>"},{"front":"When does PostgreSQL 12 and later inline a CTE by default?","back":"<p>When it is not recursive, has no side effects, and is referenced once.<\/p>"},{"front":"What do MATERIALIZED and NOT MATERIALIZED do?","back":"<p>Force the CTE to be computed once and stored, or force it to be pasted into the main query.<\/p>"},{"front":"How do you check that a rewritten query returns the same rows?","back":"<p><code>(old EXCEPT ALL new) UNION ALL (new EXCEPT ALL old)<\/code> must return zero rows.<\/p>"}],"terms":[{"term":"Subquery","plain":"A SELECT in parentheses inside another statement, used as a value, a list or a table."},{"term":"Scalar subquery","plain":"A subquery that returns one column and at most one row, used where a single value goes."},{"term":"Derived table","plain":"A subquery in FROM. It acts like a table for the rest of the query."},{"term":"Correlated subquery","plain":"A subquery that refers to the outer query's row, so it is evaluated per outer row."},{"term":"InitPlan and SubPlan","plain":"EXPLAIN's names for a subquery run once (InitPlan) and one run per outer row (SubPlan)."},{"term":"Common table expression (CTE)","plain":"A named subquery declared with WITH before the main query, visible only in that statement."},{"term":"Inlining","plain":"Pasting a CTE's query into the main query so the planner optimizes them together."},{"term":"Materialization","plain":"Computing a CTE once and storing its rows for the main query to read."}],"remote":true},"sql-06":{"id":"sql-06","track":"sql","n":6,"title":"Recursive CTEs: trees and graphs in SQL","ready":true,"minutes":40,"goal":"By the end you can walk a tree of any depth down or up with WITH RECURSIVE, carry depth and path down the walk, follow a graph with cycles without looping forever, and generate rows such as a calendar from nothing.","quiz":[{"q":"Mateo (13) refers a new customer, Nia (14). Which part of the recursive downline query for Ben (2) must change to include her?","options":["Nothing: one more round finds her","The anchor, to start from 13","A fourth self join in the recursive term","The depth limit in the query"],"answer":0,"why":"The recursive term finds the children of whatever the last round found, so the round that starts from {13} now finds Nia, and the round after that is empty. That is the point of the loop: the query does not encode the depth. A fixed chain of self joins would need a fourth join.","from":null},{"q":"A recursive CTE has columns (account_id, hops) and uses UNION instead of UNION ALL. The account graph has a cycle. What happens?","options":["It stops: UNION removes repeated accounts","It raises a cycle error","It runs until a timeout: hops differs on every visit, so no row is a duplicate","It returns only the first round"],"answer":2,"why":"UNION drops a new row only when the whole row equals an earlier one. Each lap around the cycle adds 1 to hops, so the rows are never equal and every round has new rows. UNION works as a visited set only when the row is just the node id. Use CYCLE or a path check, then min(hops) after the loop.","from":null},{"q":"You walk up from a customer to the root of their referral tree. Which join belongs in the recursive term <code>FROM customers c JOIN up u ON ...<\/code>?","options":["<code>c.referred_by = u.customer_id<\/code>","<code>c.customer_id = u.referred_by<\/code>","<code>c.referred_by = u.referred_by<\/code>","<code>c.customer_id = u.customer_id<\/code>"],"answer":1,"why":"Going up, the next row is the current row's referrer: the customer whose id equals the current row's referred_by. <code>c.referred_by = u.customer_id<\/code> walks down instead, to the children. The walk stops at the root, whose referred_by is NULL and matches nothing.","from":null},{"q":"You want each root's total downline size. Where does <code>count(*)<\/code> go?","options":["In the recursive term, to count each round","In the anchor","In the main query after the CTE, grouped by a root id carried down the walk","Nowhere: recursive CTEs cannot be counted"],"answer":2,"why":"The recursive term sees only one round, and PostgreSQL rejects aggregates there. Carry the root id down unchanged, then <code>GROUP BY root_id<\/code> in the main query, where all the rows exist.","from":null},{"q":"Lesson 5 said PostgreSQL inlines a CTE that is referenced once and has no side effects. Is a recursive CTE referenced once inlined too?","options":["Yes, like any CTE referenced once","Only if it uses UNION ALL","Only with NOT MATERIALIZED","No: a recursive CTE is always computed on its own, round by round"],"answer":3,"why":"Inlining applies only to non-recursive CTEs. A recursive CTE has to run its loop to produce rows, so the plan shows a <code>CTE<\/code> node with a Recursive Union and a WorkTable Scan, and the main query reads its result through a CTE Scan. A filter in the main query therefore does not cut the walk short; put it in the anchor or the recursive term.","from":"sql-05"}],"cards":[{"front":"What are the two parts of a recursive CTE?","back":"<p>The anchor (runs once, starting rows) and the recursive term (refers to the CTE's own name), joined by UNION or UNION ALL.<\/p>"},{"front":"What does the recursive term read when it mentions the CTE's name?","back":"<p>Only the working table: the rows produced by the previous round, not the whole result.<\/p>"},{"front":"When does a recursive CTE stop in PostgreSQL?","back":"<p>When a round produces no rows. There is no depth limit.<\/p>"},{"front":"How do you get depth-first order from a recursive CTE?","back":"<p>Carry a path array (<code>path || id<\/code>) and ORDER BY path, or add <code>SEARCH DEPTH FIRST BY id SET ord<\/code> and ORDER BY ord.<\/p>"},{"front":"What does <code>CYCLE id SET is_cycle USING path<\/code> do?","back":"<p>Tracks the ids on each path, marks a row that revisits one with is_cycle = true, and does not follow it further.<\/p>"},{"front":"When does UNION (not ALL) stop a cycle?","back":"<p>Only when the rows contain just the node id, so a revisit is an exact duplicate. A depth or path column defeats it.<\/p>"},{"front":"Can the recursive term use count(*)?","back":"<p>No. Aggregate in the main query after the loop.<\/p>"}],"terms":[{"term":"Tree and root","plain":"Rows linked by a parent pointer, each with at most one parent. A root has no parent."},{"term":"Graph and cycle","plain":"Nodes joined by edges in any pattern. A cycle is a path of edges that returns to its start."},{"term":"Anchor","plain":"The non-recursive first part of a recursive CTE. It runs once and produces the starting rows."},{"term":"Recursive term","plain":"The part after UNION ALL that refers to the CTE itself and produces the next round of rows."},{"term":"Working table","plain":"The rows produced by the latest round, which the next round of the recursive term reads."},{"term":"Depth-first and breadth-first","plain":"Depth-first lists each node right after its parent; breadth-first lists all of one level before the next."},{"term":"CYCLE clause","plain":"PostgreSQL 14+ syntax that tracks each path and stops following a row that revisits a node."},{"term":"Path","plain":"The list of node ids from the start of the walk to the current row, carried down as an array."}],"remote":true},"sql-07":{"id":"sql-07","track":"sql","n":7,"title":"Window functions: ranking, LAG and running totals","ready":true,"minutes":40,"goal":"By the end you can compute a value for each row from a set of related rows without losing any rows, rank with ROW_NUMBER, RANK and DENSE_RANK and say what each does with ties, compare a row with the one before it using LAG, build a running total, and filter on a window's result one query level up.","quiz":[{"q":"On the seed, what does <code>SELECT payment_id, count(*) OVER () AS n FROM payments WHERE status = 'failed'<\/code> return?","options":["5 rows, each with n = 5","1 row with n = 5","5 rows with n = 1, 2, 3, 4 and 5","An error: count(*) needs a GROUP BY"],"answer":0,"why":"<code>OVER ()<\/code> puts all five failed payments in one window with no order, so every row counts all five, and no row is folded away. Numbers 1 to 5 need an ORDER BY inside OVER (a running count) or row_number. One row is what the plain aggregate without OVER would return.","from":null},{"q":"Two merchants tie for the highest monthly volume. Which function, filtered with <code>= 2<\/code>, returns the merchant whose volume is the second-highest distinct value?","options":["rank()","dense_rank()","row_number()","ntile(2)"],"answer":1,"why":"dense_rank gives the tied pair 1 and the next volume 2. rank gives the pair 1 and skips to 3, so no row has rank 2. row_number gives one of the tied merchants number 2, in no fixed order, which is the wrong merchant.","from":null},{"q":"A Kafka consumer writes every card authorization to <code>auths(card_id, merchant_id, amount_minor, created_at)<\/code>. A retry is the same card authorizing the same amount at the same merchant within 30 seconds of the previous one. Which window does the LAG need?","options":["PARTITION BY card_id ORDER BY created_at","PARTITION BY merchant_id, amount_minor ORDER BY created_at","ORDER BY created_at, with no partition","PARTITION BY card_id, merchant_id, amount_minor ORDER BY created_at"],"answer":3,"why":"The partition must hold exactly the rows that count as \"the same\": one card, one merchant, one amount. With card_id alone, a coffee followed by a train ticket looks like a retry. Without card_id, two customers buying the same ticket a few seconds apart look like one customer retrying. With no partition, lag compares unrelated authorizations.","from":null},{"q":"You want only the ledger entries after which the running balance is negative. Which query works in PostgreSQL 18?","options":["<code>... WHERE sum(amount_minor) OVER (ORDER BY created_at, entry_id) &lt; 0<\/code>","<code>... HAVING sum(amount_minor) OVER (ORDER BY created_at, entry_id) &lt; 0<\/code>","A subquery computes the running balance as a column, and the outer query filters on that column","<code>... GROUP BY entry_id HAVING sum(amount_minor) &lt; 0<\/code>"],"answer":2,"why":"Window functions are computed after WHERE, GROUP BY and HAVING, so PostgreSQL rejects them in WHERE and in HAVING. Computing the window in a subquery and filtering outside is the way. GROUP BY entry_id makes each entry its own group, so the sum is just the entry's own amount, not a running balance.","from":null},{"q":"Lesson 4 said a grouped query may select only grouping columns and aggregates. Why may <code>SELECT payment_id, sum(amount_minor) OVER (PARTITION BY merchant_id) FROM payments<\/code> select payment_id without grouping by it?","options":["OVER switches the rule off for the whole query","Nothing is folded: each output row is still one payment row, so payment_id has one value per row","PostgreSQL picks any payment_id from the partition","PARTITION BY adds payment_id to the grouping keys"],"answer":1,"why":"The GROUP BY rule exists because a folded row stands for many input rows, and a column that differs between them has no single value. A window function folds nothing; it adds a column to each row. If the same query also had a GROUP BY, the rule would apply again: windows run after grouping and can only use grouped values.","from":"sql-04"}],"cards":[{"front":"What does a window function return for each row?","back":"<p>A value computed over that row's window, a set of related rows. Every input row stays in the result.<\/p>"},{"front":"What does <code>OVER ()<\/code> mean?","back":"<p>One window that holds every row of the result, so every row sees the same set.<\/p>"},{"front":"rank, dense_rank and row_number on amounts 50, 40, 40, 30?","back":"<p>rank 1, 2, 2, 4. dense_rank 1, 2, 2, 3. row_number 1, 2, 3, 4, with the two 40s in no fixed order.<\/p>"},{"front":"What does <code>lag(x)<\/code> return on the first row of a partition?","back":"<p>NULL, or the default given as its third argument: <code>lag(x, 1, 0)<\/code>.<\/p>"},{"front":"What turns <code>sum(x) OVER (PARTITION BY a)<\/code> into a running total?","back":"<p>ORDER BY inside OVER: each row's window then ends at the current row. End that ORDER BY with a unique column.<\/p>"},{"front":"Why can't a window function go in WHERE?","back":"<p>Windows are computed in the select-list step, after WHERE, GROUP BY and HAVING. Filter on them in an outer query.<\/p>"},{"front":"What is <code>sum(sum(x)) OVER (ORDER BY m)<\/code> in a GROUP BY query?","back":"<p>A window over the grouped rows: the inner sum is the group's aggregate, the outer sum a running total of those values.<\/p>"}],"terms":[{"term":"Window function","plain":"A function computed for each row over a set of related rows, written with OVER. No rows are folded."},{"term":"Window","plain":"The set of rows a window function reads for the current row."},{"term":"Partition","plain":"The rows that share the PARTITION BY values. A row's window never reaches outside its partition."},{"term":"Peers","plain":"Rows that sort as equal on the window's ORDER BY, such as three payments of 18999."},{"term":"ROW_NUMBER, RANK, DENSE_RANK","plain":"Positions in window order: a plain count, a shared place that skips after ties, a shared place that does not skip."},{"term":"LAG and LEAD","plain":"Read a value from the row before or after the current row in the same partition."},{"term":"Running total","plain":"A sum over the rows from the start of the partition up to the current row."},{"term":"WINDOW clause","plain":"Names a window definition once so several functions can share it with OVER name."}],"remote":true},"sql-08":{"id":"sql-08","track":"sql","n":8,"title":"Window frames and gaps-and-islands","ready":true,"minutes":40,"goal":"By the end you can say which rows a window function reads for each row (its frame), choose ROWS, RANGE or GROUPS on purpose, avoid the default frame's trap with tied rows and the LAST_VALUE surprise, and find runs of consecutive rows such as streaks of failed logins.","quiz":[{"q":"<code>count(*) OVER (ORDER BY day)<\/code> over payments shows 3, 3, 3 on the three payments of one day. Which change makes it count 1, 2, 3 within that day, in the same order every time?","options":["Add <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW<\/code>","Add <code>payment_id<\/code> to the window's ORDER BY","Add <code>PARTITION BY day<\/code>","Write <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW<\/code> explicitly"],"answer":1,"why":"With a unique ORDER BY no row has a peer, so the default frame ends exactly at the current row, and the order of the three payments is fixed by their ids. ROWS alone also counts 1, 2, 3, but which payment gets which number is up to PostgreSQL. PARTITION BY day restarts the count each day but keeps the tie inside it. Writing the default frame explicitly changes nothing.","from":null},{"q":"Daily volumes exist for 1, 2, 3, 7 and 8 June. On which days do <code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW<\/code> and <code>RANGE BETWEEN interval '2 days' PRECEDING AND CURRENT ROW<\/code> give different sums?","options":["Only on 3 June","Only on 1 June","On none of them","On 7 and 8 June"],"answer":3,"why":"Up to 3 June the rows are consecutive days, so two rows back is two days back. On 7 June, ROWS takes the 2nd, 3rd and 7th, while RANGE takes 5 to 7 June, which holds only the 7th. On 8 June, ROWS takes the 3rd, 7th and 8th, and RANGE only the 7th and 8th. ROWS counts rows whatever days they are.","from":null},{"q":"<code>last_value(created_at) OVER (PARTITION BY card_id ORDER BY created_at)<\/code> is meant to show each card's latest payment time on every row. What does it show?","options":["Each row's own created_at, or its last tied peer's","The card's latest payment time, on every row","NULL except on the card's last row","The card's first payment time"],"answer":0,"why":"The default frame ends at the current row's last peer, so the last row of the frame is the current row (or a row tied with it). Add <code>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING<\/code>, or use <code>max(created_at) OVER (PARTITION BY card_id)<\/code>.","from":null},{"q":"You compute the island id as <code>row_number() OVER (PARTITION BY customer_id ORDER BY occurred_at) - row_number() OVER (PARTITION BY customer_id, success ORDER BY occurred_at)<\/code> but add <code>WHERE NOT success<\/code> to that same query. What happens to Jonas, who failed twice, succeeded, and failed twice again?","options":["Each failure becomes its own island","PostgreSQL rejects a WHERE next to window functions","His four failures become one island, because the success between them was removed before the numbering","It still finds his two islands of two"],"answer":2,"why":"WHERE runs before window functions. With the success gone, both counters count the same four rows, the difference is 0 on all of them, and the runs merge. Number every login first, then keep the failures one level up.","from":null},{"q":"Lesson 6 generated a calendar with one row per day. How does it help a 7-day sum written as <code>ROWS BETWEEN 6 PRECEDING AND CURRENT ROW<\/code>?","options":["It switches the frame to RANGE mode","Every day becomes a row, with 0 when nothing happened, so 6 rows back is exactly 6 days back","It removes ties from the window's ORDER BY","It makes the window skip days with no payments"],"answer":1,"why":"ROWS counts rows, so it measures days correctly only when there is exactly one row per day. A calendar LEFT JOINed to the daily volumes (with coalesce to 0) provides that. RANGE with an interval offset gets the same sums without the calendar, but the calendar also gives the zero days you need for an average per calendar day.","from":"sql-06"}],"cards":[{"front":"What is a window frame?","back":"<p>The rows of the current row's partition that a window function actually reads. The ORDER BY and the frame clause decide it.<\/p>"},{"front":"What is the default frame when OVER has an ORDER BY?","back":"<p>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW: from the partition's start through the current row's last peer.<\/p>"},{"front":"Why does a running sum repeat a value on tied rows?","back":"<p>In RANGE mode CURRENT ROW includes all peers, so tied rows share one frame. Add a unique tiebreaker, and ROWS.<\/p>"},{"front":"ROWS, RANGE or GROUPS: which one measures values?","back":"<p>RANGE. ROWS counts rows, GROUPS counts peer groups, RANGE takes rows whose ORDER BY value is within an offset such as <code>interval '6 days'<\/code>.<\/p>"},{"front":"How do you make last_value return the partition's last value?","back":"<p>Give it the whole partition: <code>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING<\/code>. Or use first_value with the opposite order.<\/p>"},{"front":"What is the two-counter trick for islands?","back":"<p>row_number over all rows minus row_number within each value. It stays constant inside a run, so it names the island.<\/p>"},{"front":"How do you split islands by a time gap?","back":"<p>Flag a row when lag shows a gap over the limit (or no previous row), then a running sum of the flags numbers the islands.<\/p>"}],"terms":[{"term":"Frame","plain":"The subset of the partition that a window function reads for the current row."},{"term":"ROWS mode","plain":"A frame measured in physical rows: <code>6 PRECEDING<\/code> means six rows back."},{"term":"RANGE mode","plain":"A frame measured in the ORDER BY value: <code>interval '6 days' PRECEDING<\/code> means six days back. CURRENT ROW includes all peers."},{"term":"GROUPS mode","plain":"A frame measured in peer groups: <code>1 PRECEDING<\/code> means the previous set of tied rows."},{"term":"Peer group","plain":"All rows that tie on the window's ORDER BY."},{"term":"Island and gap","plain":"An island is a run of consecutive rows with the same value; a gap is where the value changes or time jumps."},{"term":"EXCLUDE","plain":"A frame option that leaves out the current row, its peers, or the other ties."}],"remote":true},"sql-09":{"id":"sql-09","track":"sql","n":9,"title":"LATERAL joins, top-N per group and keyset pagination","ready":true,"minutes":40,"goal":"By the end you can write a subquery in FROM that runs once per row of the tables before it (LATERAL), choose between a window filter, LATERAL with LIMIT and DISTINCT ON for the top N rows per group, and page through a large table with a keyset cursor that stays fast on page 5,001.","quiz":[{"q":"The dashboard must list every merchant with its single largest payment, including merchants with no payments. Which FROM clause does that?","options":["<code>merchants m CROSS JOIN LATERAL (... WHERE p.merchant_id = m.merchant_id ORDER BY amount_minor DESC LIMIT 1) t<\/code>","<code>merchants m LEFT JOIN LATERAL (... WHERE p.merchant_id = m.merchant_id ORDER BY amount_minor DESC LIMIT 1) t ON true<\/code>","<code>(SELECT DISTINCT ON (merchant_id) ... FROM payments ORDER BY merchant_id, amount_minor DESC) t<\/code>","<code>merchants m JOIN (SELECT ... FROM payments ORDER BY amount_minor DESC LIMIT 1) t ON t.merchant_id = m.merchant_id<\/code>"],"answer":1,"why":"LEFT JOIN LATERAL runs the subquery per merchant and keeps a merchant whose run returned nothing. CROSS JOIN LATERAL drops it. DISTINCT ON starts from payments, so merchants without payments never appear. The last one takes the single largest payment overall and joins one merchant to it.","from":null},{"q":"Which payment per card does <code>SELECT DISTINCT ON (card_id) card_id, payment_id FROM payments ORDER BY card_id, created_at<\/code> return?","options":["The card's latest payment","An arbitrary payment, because DISTINCT ON ignores ORDER BY","The card's earliest payment","None: it fails without DESC"],"answer":2,"why":"DISTINCT ON keeps the first row of each card in the ORDER BY, and <code>created_at<\/code> ascending puts the earliest first. For the latest, write <code>ORDER BY card_id, created_at DESC, payment_id DESC<\/code>; the payment_id makes the winner fixed when two payments share a time.","from":null},{"q":"A page ended with the payment (created_at 10:00:00, id 500). The next page uses <code>WHERE created_at &lt; '10:00:00' ORDER BY created_at DESC, payment_id DESC LIMIT 20<\/code>. Payments 498 and 499 were also created at 10:00:00. What happens to them?","options":["They appear first on the next page","They appear on the next page in random order","The query fails because created_at is not unique","They are never shown: the condition excludes every row at 10:00:00"],"answer":3,"why":"Comparing created_at alone treats the whole timestamp as seen, so rows that tie with the cursor but sort after it are skipped for good. <code>(created_at, payment_id) &lt; ('10:00:00', 500)<\/code> includes them, because for equal times it compares the ids.","from":null},{"q":"With an index on (created_at, payment_id), why does <code>ORDER BY created_at DESC, payment_id DESC LIMIT 20 OFFSET 100000<\/code> still read 100,020 index entries?","options":["The index keeps entries sorted but stores no positions, so PostgreSQL must count its way to entry 100,001","OFFSET disables the use of indexes","PostgreSQL locks the skipped rows first","The planner cannot read an index backward"],"answer":0,"why":"An index can find a key quickly; it cannot find a position. OFFSET is a position, so the scan starts at the newest entry and counts. The plan in the Try it used the index, backward, and still read 100,020 rows. A keyset condition gives the scan a key to seek to instead.","from":null},{"q":"Lesson 5 showed a correlated subquery as a SubPlan that runs once per outer row. How does a LATERAL subquery relate to it?","options":["It is uncorrelated and runs once, like an InitPlan","It is a correlated subquery placed in FROM: it runs per row of the items to its left and may return many rows and columns","PostgreSQL always turns it into a hash join","It can return only one row, like a scalar subquery"],"answer":1,"why":"Both are correlated: they read values from an outer row. A scalar subquery must return one value; a LATERAL subquery returns a table, joined to the row it was run for. Like the SubPlan in lesson 5, it is cheap when each run uses an index and expensive when each run scans a big table.","from":"sql-05"}],"cards":[{"front":"What does LATERAL allow?","back":"<p>A subquery in FROM may use columns of the FROM items to its left. PostgreSQL runs it once per such row.<\/p>"},{"front":"CROSS JOIN LATERAL or LEFT JOIN LATERAL ... ON true?","back":"<p>CROSS drops outer rows whose run returned nothing. LEFT keeps them with NULLs; ON true is required syntax.<\/p>"},{"front":"What must the ORDER BY of a DISTINCT ON query start with?","back":"<p>The DISTINCT ON expressions. The columns after them decide which row of each group is kept.<\/p>"},{"front":"Three ways to get the top N rows per group?","back":"<p>row_number() in a subquery with <code>WHERE place &lt;= N<\/code>; LATERAL with ORDER BY and LIMIT N; DISTINCT ON for N = 1.<\/p>"},{"front":"Why is OFFSET slow on deep pages?","back":"<p>Skipped rows are still produced and thrown away: page 5,001 of 20 reads 100,020 rows. An index stores keys, not positions.<\/p>"},{"front":"What is the keyset condition for the next page, newest first?","back":"<p><code>WHERE (created_at, id) &lt; (:last_created_at, :last_id) ORDER BY created_at DESC, id DESC LIMIT n<\/code>, with an index on (created_at, id).<\/p>"},{"front":"Why must a keyset cursor include a unique column?","back":"<p>Without it, rows that tie with the cursor's value are skipped or repeated. The unique column makes every position exact.<\/p>"}],"terms":[{"term":"LATERAL","plain":"A keyword that lets a subquery in FROM refer to earlier FROM items; it runs once per row of them."},{"term":"Top N per group","plain":"The first N rows of each group in some order, such as each merchant's three largest payments."},{"term":"DISTINCT ON","plain":"PostgreSQL syntax that keeps the first row, by ORDER BY, of each set of rows with equal values."},{"term":"OFFSET","plain":"Skips the first n rows of a result. The skipped rows are still produced."},{"term":"Keyset pagination","plain":"Paging by remembering the sort key of the last row sent and asking for rows after it. Also called the seek method."},{"term":"Cursor (in an API)","plain":"The last row's sort key, handed to the client as a token for the next page."},{"term":"Row comparison","plain":"<code>(a, b) &lt; (x, y)<\/code>: compares pairs left to right and stops at the first pair that differs."},{"term":"Index","plain":"A separate structure that keeps chosen columns sorted with a pointer to each row. Lesson 11 builds it up."}],"remote":true},"sql-10":{"id":"sql-10","track":"sql","n":10,"title":"JSONB, upserts and MERGE","ready":true,"minutes":40,"goal":"By the end you can store and query a JSON document in a jsonb column without the text-comparison trap, index it for containment with GIN, ingest a message that may arrive twice at the same moment with INSERT ... ON CONFLICT, and bring a summary table in line with its source in one MERGE.","quiz":[{"q":"Which scores does <code>WHERE metadata -&gt; 'risk' -&gt;&gt; 'score' &gt;= '70'<\/code> let through?","options":["Only scores of 70 and above","70 to 99, and also 8 and 9, but not 100","Every score, because text sorts after numbers","None: comparing text with a number raises an error"],"answer":1,"why":"-&gt;&gt; returns text, and '70' is a text literal, so PostgreSQL compares strings character by character: '8' and '9' sort after '7', and '100' sorts before it because '1' &lt; '7'. Cast first, <code>(metadata -&gt; 'risk' -&gt;&gt; 'score')::int &gt;= 70<\/code>, or compare jsonb with jsonb, <code>metadata -&gt; 'risk' -&gt; 'score' &gt;= '70'<\/code>, which compares numbers.","from":null},{"q":"payments has <code>CREATE INDEX ... USING gin (metadata)<\/code>. Which condition can the index serve?","options":["<code>metadata -&gt;&gt; 'channel' = 'pos'<\/code>","<code>(metadata -&gt; 'risk' -&gt;&gt; 'score')::int &gt; 90<\/code>","<code>metadata::text LIKE '%pos%'<\/code>","<code>metadata @&gt; '{\"channel\": \"pos\"}'<\/code>"],"answer":3,"why":"A GIN index on a jsonb column serves the jsonb operators such as @&gt;, ? and @?. The other three apply a function or a cast to the column first, so they produce values the index does not contain, and the plan is a sequential scan. The first one asks the same question as the containment query; only the containment form can use the index.","from":null},{"q":"Session A runs <code>INSERT ... ON CONFLICT (payment_uid) DO NOTHING RETURNING payment_id<\/code> for a new uid and has not committed. Session B runs the same statement for the same uid. What does B see?","options":["B waits; when A commits, B's statement returns no rows and no error","B returns no rows at once, because A's row is already in the index","B inserts a second row, because A has not committed","B fails with a duplicate key error when A commits"],"answer":0,"why":"B finds A's uncommitted entry in the unique index and cannot know yet whether A will commit, so it waits. When A commits, B takes the DO NOTHING branch: no rows, no error. Had A rolled back, B would have inserted. The duplicate key error is what a plain INSERT, without ON CONFLICT, gets in the same situation.","from":null},{"q":"A nightly MERGE syncs March's totals with <code>WHEN NOT MATCHED BY SOURCE THEN DELETE<\/code> and no further condition. The target holds rows for January, February and March. What does it delete?","options":["Only March rows whose merchant had no March payments","Nothing, because NOT MATCHED BY SOURCE needs a condition to run","Every January and February row, plus the March rows with no March payments","Only rows of merchants with no payments at all"],"answer":2,"why":"The source holds only March, so every January and February row has no source match and falls in NOT MATCHED BY SOURCE. Without a condition such as <code>AND t.month = date '2026-03-01'<\/code>, the DELETE applies to all of them. The clause runs without a condition; that is exactly the danger.","from":null},{"q":"A Kafka batch carries some payment_uids more than once, because the producer retried, and the upsert fails with \"cannot affect row a second time\". Which source query keeps one row per uid, the most recently received?","options":["<code>SELECT DISTINCT payment_uid, status, received_at FROM batch<\/code>","<code>SELECT DISTINCT ON (payment_uid) * FROM batch ORDER BY payment_uid, received_at DESC<\/code>","<code>SELECT payment_uid, max(status), max(received_at) FROM batch GROUP BY payment_uid<\/code>","<code>SELECT * FROM batch ORDER BY received_at DESC LIMIT 1<\/code>"],"answer":1,"why":"DISTINCT ON keeps the first row of each uid in the ORDER BY, here the latest, as lesson 9 did for the latest login. DISTINCT over all columns keeps all three rows, because their statuses differ. max() of each column mixes values from different rows, the trap of lesson 9's latest_login exercise. LIMIT 1 keeps one row for the whole batch.","from":"sql-09"}],"cards":[{"front":"json or jsonb?","back":"<p>jsonb: parsed once on write, validated, stored as a tree, indexable. json keeps the exact text, including duplicate keys.<\/p>"},{"front":"What do -&gt; and -&gt;&gt; return?","back":"<p>-&gt; returns jsonb (still a document), -&gt;&gt; returns text. Cast -&gt;&gt; results before comparing numbers.<\/p>"},{"front":"What does <code>doc @&gt; '{\"risk\": {\"rules\": [\"velocity\"]}}'<\/code> ask?","back":"<p>Whether doc contains that smaller document: a risk object whose rules array includes \"velocity\".<\/p>"},{"front":"Which conditions can a GIN index on a jsonb column serve?","back":"<p>The jsonb operators: @&gt;, ?, ?|, ?&amp; and the jsonpath ones @? and @@. Not -&gt;&gt; comparisons.<\/p>"},{"front":"Why is check-then-insert unsafe, and what replaces it?","back":"<p>Two sessions can both find nothing before either inserts. INSERT ... ON CONFLICT lets the unique index decide inside the write.<\/p>"},{"front":"In ON CONFLICT DO UPDATE, what is EXCLUDED?","back":"<p>The row the INSERT proposed and could not insert, so SET status = EXCLUDED.status takes the new message's value.<\/p>"},{"front":"Why prefer ON CONFLICT over MERGE for concurrent upserts in PostgreSQL?","back":"<p>MERGE has no arbiter index: two sessions merging the same new key can both choose INSERT, and one fails with 23505.<\/p>"}],"terms":[{"term":"jsonb","plain":"PostgreSQL's binary JSON type: parsed and validated on write, stored as a tree of keys and values."},{"term":"Containment (@&gt;)","plain":"The test of whether one JSON document contains another, nesting included."},{"term":"GIN index","plain":"Generalized inverted index: for every key and value, the sorted list of rows that contain it."},{"term":"Idempotency key","plain":"A unique id that the sender attaches to a message so the receiver can tell a repeat from a new request."},{"term":"Upsert","plain":"Insert a row, or update it if a row with the same key already exists, as one atomic operation."},{"term":"EXCLUDED","plain":"In ON CONFLICT DO UPDATE, the row that was proposed for insertion."},{"term":"MERGE","plain":"A statement that joins a target to a source and inserts, updates or deletes target rows by class: matched, not matched, not matched by source."},{"term":"merge_action()","plain":"A function in MERGE ... RETURNING that says which action produced the row: INSERT, UPDATE or DELETE."}],"remote":true},"sql-11":{"id":"sql-11","track":"sql","n":11,"title":"Indexes and reading EXPLAIN","ready":true,"minutes":40,"goal":"By the end you can explain why an index turns a lookup into a few page reads, choose the column order of a multicolumn index, read EXPLAIN (ANALYZE, BUFFERS) node by node from the bottom up, spot the function, cast or low selectivity that makes PostgreSQL ignore an index, and weigh what each index costs on writes.","quiz":[{"q":"A query has <code>WHERE merchant_id = 42 AND created_at &gt;= '2026-09-01' ORDER BY created_at LIMIT 50<\/code>. Which index serves it best?","options":["(created_at, merchant_id)","(merchant_id, created_at)","Two separate indexes, one on each column","(merchant_id) INCLUDE (created_at)"],"answer":1,"why":"With merchant_id first, merchant 42's entries are contiguous and already in created_at order, so the scan seeks to 1 September and reads 50 entries with no Sort. With created_at first, the scan reads every merchant's entries from 1 September on and checks each. INCLUDE columns are not sorted, so (merchant_id) INCLUDE (created_at) still needs a Sort. Two single-column indexes can be combined with a bitmap, but the result must still be sorted.","from":null},{"q":"EXPLAIN shows <code>Index Scan using merchants_pkey on merchants m (actual rows=1.00 loops=2500)<\/code> with <code>Buffers: shared hit=7500<\/code>. What did the node do?","options":["It read 1 row in 7,500 pages","It ran 2,500 times, found one row each time and read 3 pages per run","It ran once and returned 2,500 rows","It estimated 2,500 rows and found 1"],"answer":1,"why":"rows is an average per loop, so the node produced 2,500 rows in 2,500 runs: the inner side of a nested loop. Buffers are a total over all loops, 3 pages per run, one descent of a small B-tree plus one table page. Estimates appear in the cost=... part, not in actual rows.","from":null},{"q":"The login service runs <code>WHERE lower(email) = lower(?)<\/code> and customers has a UNIQUE index on email. The plan is a Seq Scan. What is the fix?","options":["ANALYZE customers, so the planner sees the index","Rewrite it as <code>WHERE email = ?<\/code>","CREATE INDEX ON customers (lower(email))","Raise work_mem"],"answer":2,"why":"The index is sorted by email, not by lower(email), so it cannot be searched for the lowered value; fresh statistics change nothing. Rewriting to email = ? changes the meaning, since stored emails may have capital letters. An index on the expression is sorted by exactly the value the query compares.","from":null},{"q":"You add an index on payments(status). <code>SELECT sum(amount_minor) FROM payments WHERE status = 'succeeded'<\/code> still runs as a sequential scan. Why?","options":["93% of rows match, so reading the table straight through is cheaper than following 930,000 index entries","Indexes cannot be used on text columns","The planner needs a hint to use a new index","sum() always needs a sequential scan"],"answer":0,"why":"The planner compares estimated costs. Fetching nearly every row through the index means visiting nearly every page anyway, in a worse order, so the Seq Scan wins. The same index is used for status = 'pending', 1% of rows, and a partial index on the rare value is the better tool. PostgreSQL has no optimizer hints, and B-trees work on text.","from":null},{"q":"Lesson 9's keyset query <code>WHERE (created_at, payment_id) &lt; (:t, :id) ORDER BY created_at DESC, payment_id DESC LIMIT 20<\/code> read 5 buffers with an index on (created_at, payment_id). With the index on (payment_id, created_at) instead, what would you expect?","options":["The same 5 buffers: both columns are in the index","Fewer buffers, because payment_id is unique","Many more: rows in (created_at, payment_id) order are not contiguous in that index, so no single seek finds the page","An error: row comparisons need a matching index"],"answer":2,"why":"The row comparison and the ORDER BY follow created_at first, so only an index that sorts by created_at first holds the next page as one contiguous run behind the cursor. Sorted by payment_id first, the next 20 rows by time are scattered through the index, and PostgreSQL falls back to reading far more of it, or the table, and sorting. Row comparisons work without an index; they are just slow.","from":"sql-09"}],"cards":[{"front":"What is in a B-tree index entry?","back":"<p>The indexed column values (the key) and the address of the row: its page and slot in the table (ctid).<\/p>"},{"front":"In EXPLAIN ANALYZE, what is rows=1.00 loops=14?","back":"<p>One row per run, 14 runs: 14 rows in all. rows is always an average per loop.<\/p>"},{"front":"Index Cond or Filter: which one uses the index to search?","back":"<p>Index Cond. A Filter is tested row by row after the rows were read; Rows Removed by Filter counts the waste.<\/p>"},{"front":"Column order rule for a multicolumn B-tree index?","back":"<p>Equality columns first, then the one column you range over or sort by. PostgreSQL 18 skip scan relaxes it only when the leading column has few distinct values.<\/p>"},{"front":"Why does <code>WHERE created_at::date = '2026-09-01'<\/code> miss an index on created_at?","back":"<p>The index is sorted by created_at, not by the computed date. Write a half-open range on the bare column instead.<\/p>"},{"front":"What makes an Index Only Scan possible?","back":"<p>Every column the query needs is in the index (key or INCLUDE), and the visibility map marks the pages all-visible. Heap Fetches counts the exceptions.<\/p>"},{"front":"Where do you find the queries that most need an index?","back":"<p>pg_stat_statements, ordered by total_exec_time: calls, mean time and pages per normalized query.<\/p>"}],"terms":[{"term":"Index","plain":"A separate structure holding a sorted copy of some columns, each entry pointing to its row."},{"term":"B-tree","plain":"PostgreSQL's default index: sorted leaf pages with free space, and a few levels of directory pages above them, so a lookup reads one page per level."},{"term":"Sequential scan","plain":"Reading a table's pages from first to last and testing every row."},{"term":"Buffer","plain":"One 8 KB page as EXPLAIN counts it: hit if it was already in PostgreSQL's memory, read if it came from the operating system."},{"term":"Sargable","plain":"A condition the database can use to search an index: the bare column compared with values computed beforehand."},{"term":"Covering index","plain":"An index that holds every column a query needs, often through INCLUDE, so the query can run as an Index Only Scan."},{"term":"Partial index","plain":"An index over only the rows that match its WHERE clause, such as status = 'pending'."},{"term":"Skip scan","plain":"PostgreSQL 18's way to use a multicolumn index without a condition on its leading column, by searching once per leading value."}],"remote":true},"sql-12":{"id":"sql-12","track":"sql","n":12,"title":"Transactions and isolation levels","ready":true,"minutes":40,"goal":"By the end you can say what a transaction guarantees and the moment it takes effect, produce a lost update and a write skew in two psql sessions, predict what Read Committed, Repeatable Read and Serializable do about each in PostgreSQL, and write the retry loop that Serializable needs.","quiz":[{"q":"At READ COMMITTED, transaction A runs <code>SELECT count(*) FROM ledger_entries WHERE account_id = 109<\/code> twice. Between the two, B inserts a ledger entry for 109 and commits. What does A's second count return?","options":["The same as the first: a transaction sees one consistent state","One more than the first: each statement takes a new snapshot","An error, because rows changed under the transaction","The same as the first, unless A locked the rows with FOR UPDATE"],"answer":1,"why":"Read Committed takes a snapshot at the start of each statement, so the second count includes B's committed row: a phantom. The first option describes Repeatable Read, where both counts would match. Neither level raises an error for a read.","from":null},{"q":"Two Kafka consumers apply a 100 fee to account 109 at the same moment, at READ COMMITTED. Which code keeps both fees?","options":["<code>SELECT balance_minor<\/code>, then <code>UPDATE ... SET balance_minor = :computed<\/code>","The same two statements inside one BEGIN ... COMMIT","The same two statements, with an index on account_id","<code>UPDATE accounts SET balance_minor = balance_minor - 100 WHERE account_id = 109<\/code>"],"answer":3,"why":"The relative UPDATE computes from the row it holds the lock on: the second one waits, then PostgreSQL rereads the committed row and subtracts from the new value. The read-then-write versions compute from a value read before the lock, so one fee is lost, transaction or not. An index changes speed, not the interleaving.","from":null},{"q":"A REPEATABLE READ transaction fails on its third statement with SQLSTATE 40001, <code>could not serialize access due to concurrent update<\/code>. What should the application do?","options":["Roll back and run the whole transaction again from BEGIN, reads included","Run the third statement again in the same transaction","Switch that one statement to READ COMMITTED and run it again","Nothing: PostgreSQL has already retried it"],"answer":0,"why":"After an error the transaction is aborted and only ROLLBACK works. The retry has to redo the reads, because the error means they are out of date: rerunning the one statement would write a value computed from the old snapshot, which is the lost update the error just prevented.","from":null},{"q":"An Oracle service enforces a merchant's daily limit across terminals: SELECT SUM(amount) for today, then INSERT the payment if it fits, at SERIALIZABLE. Two terminals pay at the same moment. What can happen?","options":["Nothing bad: SERIALIZABLE prevents every anomaly","One INSERT always fails with ORA-08177","Both inserts commit and the limit is exceeded","The second SELECT waits until the first transaction commits"],"answer":2,"why":"Oracle's SERIALIZABLE is snapshot isolation. Both transactions read the same sum from their snapshots and insert different rows, so no row is changed by both and nothing is reported: write skew. ORA-08177 appears only when two serializable transactions change the same row. Lock a row both must touch, such as the merchant row, with SELECT ... FOR UPDATE.","from":null},{"q":"Lesson 2 noted that \"the refunds of a payment never exceed its amount\" spans rows, so no CHECK constraint can say it. Two agents refund the same payment at once, each reading the sum of refunds first, at READ COMMITTED. Which change makes the rule hold?","options":["Add a UNIQUE index on refunds (payment_id)","Lock the payment row with SELECT ... FOR UPDATE before reading the sum","Put each agent's check and insert in one transaction","Run both at REPEATABLE READ"],"answer":1,"why":"The rows that conflict are new refunds that do not exist yet, so the transactions must meet on a row that does: the payment. The second agent waits for the lock, and its next statement sees the first refund. Each agent already has one transaction, which does not stop the race. Repeatable Read lets write skew through. A unique index would allow only one refund per payment.","from":"sql-02"}],"cards":[{"front":"When do a transaction's changes become permanent and visible to others?","back":"<p>All at once, when its COMMIT record reaches the write-ahead log on disk. Before that no other session sees them, and a crash undoes them.<\/p>"},{"front":"What does a Read Committed statement read?","back":"<p>A snapshot taken when that statement starts: everything committed by then. Two SELECTs in one transaction can disagree.<\/p>"},{"front":"What happens at Repeatable Read if you update a row that another transaction changed and committed after your snapshot?","back":"<p>ERROR: could not serialize access due to concurrent update (40001). Roll back and retry the whole transaction.<\/p>"},{"front":"What is write skew?","back":"<p>Two transactions read the same rows, each writes a different row, and together they break a rule each one checked. Repeatable Read allows it; Serializable aborts one.<\/p>"},{"front":"What should code do with SQLSTATE 40001?","back":"<p>Roll back and run the whole transaction again from BEGIN, reads included, a bounded number of times. Treat 40P01 (deadlock) the same way.<\/p>"},{"front":"Is Oracle's SERIALIZABLE the same as PostgreSQL's?","back":"<p>No. Oracle's is snapshot isolation, like PostgreSQL's REPEATABLE READ: write skew gets through.<\/p>"},{"front":"Why can SERIALIZABLE abort a transaction that did not really conflict?","back":"<p>A sequential scan records a read of the whole table, so any write to it looks like a dependency. Index scans record less.<\/p>"}],"terms":[{"term":"Transaction","plain":"A group of statements whose changes become permanent together at COMMIT, or not at all."},{"term":"Commit point","plain":"The moment the COMMIT record is on disk in the write-ahead log. Before it the transaction did not happen; after it, all of it did."},{"term":"Snapshot","plain":"The set of committed transactions a statement can see: everything committed before it was taken, nothing after, nothing uncommitted."},{"term":"Isolation level","plain":"The setting that decides when a transaction's snapshot is taken and which conflicts PostgreSQL turns into errors."},{"term":"Lost update","plain":"Two transactions read the same value and both write a result computed from it; the second write erases the first."},{"term":"Write skew","plain":"Two transactions read the same rows, write different rows, and together break a rule that each checked."},{"term":"Serialization failure (40001)","plain":"PostgreSQL aborting a transaction because committing it would break its isolation level. The fix is to retry the whole transaction."},{"term":"SSI","plain":"Serializable Snapshot Isolation: snapshot reads plus tracking of read and write dependencies, aborting one transaction of a dangerous pair. PostgreSQL's SERIALIZABLE."}],"remote":true},"sql-13":{"id":"sql-13","track":"sql","n":13,"title":"Row locks, SKIP LOCKED and job queues","ready":true,"minutes":40,"goal":"By the end you can say what a row lock is and where PostgreSQL keeps it, build a job queue that many workers drain at once with FOR UPDATE SKIP LOCKED, choose between the four row lock modes (and see why a foreign-key insert takes KEY SHARE), and prevent deadlocks by locking rows in a fixed order.","quiz":[{"q":"Three workers claim with <code>... ORDER BY run_after LIMIT 1 FOR UPDATE<\/code> and keep the transaction open while each 2-second job runs. Thirty jobs are queued. About how long until all are done, and what brings it near 20 seconds?","options":["About 20 seconds already: each worker locks a different row","About 60 seconds, because the workers queue on the same first row; SKIP LOCKED in the claim brings it near 20","About 60 seconds, because PostgreSQL runs one FOR UPDATE per table at a time; a bigger connection pool fixes it","It never finishes: the three workers deadlock"],"answer":1,"why":"All three pick the same oldest row, so two wait while one works: one job every 2 seconds, 60 seconds for thirty. With SKIP LOCKED each claim skips rows other workers hold, three jobs run at once, and thirty take about 20 seconds. PostgreSQL has no per-table limit on row locks, and the waits form a line, not a cycle, so there is no deadlock.","from":null},{"q":"A fee job runs <code>SELECT * FROM merchants WHERE merchant_id = 4 FOR UPDATE<\/code>, computes for a few seconds, then updates the merchant's <code>name<\/code>. Meanwhile card payments for merchant 4 are inserted into <code>payments<\/code>. What happens to them, and what is the fix?","options":["Nothing: an INSERT into payments never waits for a lock on merchants","They fail with a foreign-key violation until the fee job commits","They wait, because the foreign-key check takes FOR SHARE, which conflicts with any lock","They wait, because the foreign-key check takes FOR KEY SHARE, which conflicts with FOR UPDATE; lock with FOR NO KEY UPDATE instead"],"answer":3,"why":"Each INSERT checks that merchant 4 exists and locks its row FOR KEY SHARE until the payment commits. KEY SHARE conflicts only with FOR UPDATE, which the fee job asked for although it never changes merchant_id or deletes the row. FOR NO KEY UPDATE, the mode an ordinary UPDATE takes, lets the payments through. FOR SHARE was the foreign-key lock before PostgreSQL 9.3.","from":null},{"q":"Two Kafka consumers apply batches of balance changes, one UPDATE per row in message order. A few times a day one batch fails with SQLSTATE 40P01. What is the best fix?","options":["Sort each batch by account_id and apply the updates in that order","Raise deadlock_timeout to 10 seconds so the transactions have time to finish","Run the batches at SERIALIZABLE","Add an index on accounts (account_id)"],"answer":0,"why":"40P01 is a deadlock: two batches that touch the same accounts in different orders each hold a row the other needs. If every batch locks in ascending id order, a second batch waits at its first shared row while holding nothing, and no cycle can form. A longer deadlock_timeout only makes the stuck pair wait longer before PostgreSQL breaks the cycle. Serializable adds serialization failures to the deadlocks, and account_id already has its primary key index.","from":null},{"q":"Lesson 11 built partial indexes. The jobs table now holds 2 million done jobs and 50 queued ones, and the claim filters on <code>status = 'queued' AND run_after &lt;= now()<\/code> ordered by run_after. Which index keeps each claim to a few pages?","options":["An index on (status), because status is in the WHERE clause","None: LIMIT 1 stops the scan after the first row","A partial index on (run_after) WHERE status = 'queued', like the seed's jobs_ready_idx","An index on (job_id), because the outer UPDATE looks rows up by job_id"],"answer":2,"why":"The partial index holds only the 50 queued rows, already in run_after order, so the claim reads its first entries and stops. Without it, LIMIT 1 stops early only once a matching row turns up, and finding one may mean reading through the done jobs first. An index on status alone still leaves the sort, and job_id already has the primary key.","from":"sql-11"},{"q":"A worker claims job 9 and holds its transaction open while it works, the claim having added 1 to <code>attempts<\/code>. Its pod is killed mid-job. What state is job 9 in a moment later?","options":["<code>running<\/code>, until a reaper notices the old locked_at","<code>queued<\/code> with the same attempts as before the claim: the rollback undid the claim and the increment, and the next worker can take it at once","Locked until deadlock_timeout expires, then queued","<code>failed<\/code>, because its transaction was aborted"],"answer":1,"why":"The connection closes, PostgreSQL rolls back the open transaction, and the lock and every change in it vanish together, including the attempts increment. That is the strength of holding the lock as a lease, and its blind spot: attempts cannot count crashes. A reaper is only needed when the claim was committed. deadlock_timeout is about deadlock checks, not crashes.","from":null}],"cards":[{"front":"Where does PostgreSQL keep a row lock?","back":"<p>In the locked row version itself (its header on the 8 KB page), not in memory. A waiter sleeps on the holder's transaction id in the lock manager.<\/p>"},{"front":"What does <code>FOR UPDATE SKIP LOCKED<\/code> do when the first candidate row is locked?","back":"<p>Skips it and tries the next row, without waiting. With LIMIT 1 it returns the first row it could lock, or none.<\/p>"},{"front":"What does <code>NOWAIT<\/code> do, and with what SQLSTATE?","back":"<p>Fails the statement at once instead of waiting for a locked row: <code>could not obtain lock on row<\/code>, 55P03.<\/p>"},{"front":"Which lock does a foreign-key check take on the parent row, and what blocks it?","back":"<p>FOR KEY SHARE. Only FOR UPDATE blocks it: a DELETE, a key change, or an explicit SELECT ... FOR UPDATE.<\/p>"},{"front":"Which row lock does a plain UPDATE that changes no key column take?","back":"<p>FOR NO KEY UPDATE, which does not conflict with foreign-key checks.<\/p>"},{"front":"How and when does PostgreSQL end a deadlock?","back":"<p>A waiter checks for a cycle after deadlock_timeout (1 s by default) and aborts one transaction with 40P01, deadlock detected.<\/p>"},{"front":"How do you make deadlocks between transfers impossible?","back":"<p>Lock the rows in one fixed order in every transaction, for example ascending account_id, before changing any of them.<\/p>"}],"terms":[{"term":"Row lock","plain":"A mark a transaction puts on a row so that other writers and lockers wait until it commits or rolls back. Plain reads ignore it."},{"term":"FOR UPDATE","plain":"The strongest row lock: taken by DELETE, by an UPDATE of a key column, and by SELECT ... FOR UPDATE. It conflicts with every other mode."},{"term":"FOR NO KEY UPDATE","plain":"The row lock of an ordinary UPDATE. It lets foreign-key checks (KEY SHARE) through."},{"term":"FOR KEY SHARE","plain":"The weakest row lock, taken on the parent row by a foreign-key check: the key must not change or vanish."},{"term":"SKIP LOCKED","plain":"A locking clause option that skips rows other transactions have locked instead of waiting for them. Made for queue tables."},{"term":"NOWAIT","plain":"A locking clause option that fails at once (55P03) instead of waiting for a locked row."},{"term":"Deadlock","plain":"A cycle of transactions, each waiting for a lock the next one holds. PostgreSQL aborts one with 40P01."},{"term":"Advisory lock","plain":"A lock on a number the application chooses, for serializing work that is not a row, such as one settlement run per merchant per day."}],"remote":true},"sql-14":{"id":"sql-14","track":"sql","n":14,"title":"SQL from the
