und trips. A better data model often removes the need.","Graph stores walk relationships from an indexed start node; search, time-series and vector stores each build one index shaped like one question. Each extra store is a copy to feed from a log and to operate."],"quiz":[{"q":"A teammate says DynamoDB will hand your code two conflicting versions of an item to merge, as the Dynamo paper describes. What actually happens in a single-Region table?","options":["DynamoDB returns siblings tagged with vector clocks","Each partition's replicas follow one leader, which orders writes, so there are no siblings to merge","The write with the newest client timestamp wins silently","DynamoDB rejects the second write with a conflict error"],"answer":1,"why":"DynamoDB shares Dynamo's name and hash partitioning, but each partition is a Multi-Paxos replication group with a leader that orders writes (lessons 1 and 6). Siblings and vector clocks belong to Dynamo and Riak; last write wins by timestamp is Cassandra's rule.","from":null},{"q":"A Cassandra table has <code>PRIMARY KEY ((account_id), created_at, payment_id)<\/code>. Which query does Cassandra refuse without <code>ALLOW FILTERING<\/code>?","options":["<code>WHERE account_id = 'A-1001' AND created_at &gt; '2026-11-01'<\/code>","<code>WHERE account_id = 'A-1001' LIMIT 20<\/code>","<code>WHERE created_at &gt; '2026-11-01'<\/code>","<code>WHERE account_id = 'A-1001' AND created_at = '2026-11-07 09:00' AND payment_id = 'pay-81723'<\/code>"],"answer":2,"why":"The partition key, <code>account_id<\/code>, picks the machine and must be given with <code>=<\/code>; without it Cassandra would have to read every partition on every node. Clustering columns only order rows inside a partition, so a range on <code>created_at<\/code> is cheap once the partition is known (lessons 2 and 7).","from":null},{"q":"A payment create must run once per idempotency key, even when two retries arrive together. In DynamoDB, what is the smallest tool that makes it safe?","options":["A <code>TransactWriteItems<\/code> with the claim and nothing else","A GetItem to check for the key, then a PutItem if it's absent","One PutItem of the claim with <code>attribute_not_exists(pk)<\/code>","A strongly consistent read before the write"],"answer":2,"why":"A condition expression makes the check and the write one atomic step on one item (lesson 3), and a second claim fails with <code>ConditionalCheckFailedException<\/code>. A read followed by a write races, whatever the read's consistency. A transaction works but costs two writes per item; you need one when the claim and the payment must be written together (lesson 4).","from":null},{"q":"A cluster grows from 4 to 5 nodes. Roughly what share of keys move with <code>hash(key) mod nodes<\/code>, and with consistent hashing and many virtual nodes?","options":["About 80% with mod; about a fifth with consistent hashing","About a fifth with both","About 80% with both","None with mod; about half with consistent hashing"],"answer":0,"why":"With mod, a key keeps its node only if <code>h mod 4 = h mod 5<\/code>, which happens for 4 of every 20 hashes, so about 80% move. On a ring the new node takes only its share of the arcs, about 1/5, from its neighbours, and virtual nodes spread that share across many nodes (lessons 1 and 5).","from":null},{"q":"Cassandra, N = 3, every read and write at <code>QUORUM<\/code>. Two requests claim the same idempotency key at the same moment with plain inserts. What does the quorum guarantee, and what does it not?","options":["It guarantees only one insert succeeds","It guarantees reads overlap acknowledged writes, but both inserts succeed and last write wins keeps one silently; agreement on one winner needs Paxos (a lightweight transaction)","It guarantees nothing, because QUORUM is eventual consistency","It guarantees both claims are kept as siblings"],"answer":1,"why":"A quorum is an overlap guarantee (lesson 6): any read of 2 sees any acknowledged write of 2. It doesn't order two writers. Consensus does: an LWT's Paxos rounds make replicas agree on one value before anyone writes (lesson 10). Siblings are Dynamo's, not Cassandra's.","from":null},{"q":"A team keeps pending payouts in a Cassandra table, inserting each payout and deleting it once paid, all in one partition per merchant. After a few weeks, reads of the next 10 payouts slow down and then fail. Why?","options":["The partition grew past 100 MB of live data","Every delete left a tombstone, kept for 10 days, and each read from the start of the partition steps over all of them","Deleted rows are rewritten on every compaction","The table needs an SAI index on the payout id"],"answer":1,"why":"Deletes don't erase in Cassandra; they write tombstones that must live <code>gc_grace_seconds<\/code> (10 days) so repair can spread them (lesson 7). A queue in one partition piles them up at the front, reads warn at 1,000 and fail at 100,000. Put queues in Kafka, or bucket by time with TTLs and read after a saved position.","from":null},{"q":"In MongoDB, should a payment's refunds be embedded in the payment, and an account's payments embedded in the account?","options":["Embed both: one document per account is fastest","Reference both: documents should stay small","Embed the refunds (read and changed with the payment, a handful at most); reference the payments (they grow without limit)","Reference the refunds; embed the payments"],"answer":2,"why":"Embed what is read and changed together and stays bounded: one guarded update can then check the refund rule atomically (lessons 2 and 8). An account's payments grow without limit and would run into the 16 MB document limit and rewrite a huge document on every payment, so they get their own collection, with at most a capped summary embedded.","from":null},{"q":"With no failures at all, switching a MongoDB write from <code>w: 1<\/code> to <code>w: \"majority\"<\/code> makes it about 4 ms slower. Which statement places that correctly?","options":["CAP: choosing consistency over availability","PACELC's else branch: with no partition, trading latency for consistency","PACELC's partition branch: choosing consistency during a partition","Neither: it's a performance bug"],"answer":1,"why":"CAP only speaks about what happens during a network partition, and there is none here. PACELC's second half covers normal days: waiting for more replicas buys a stronger guarantee (the write survives a failover) at the price of latency (lesson 9).","from":null},{"q":"During a partition, one region voids a payment while the other captures it. Which conflict rule notices that the two writes were concurrent instead of silently keeping one?","options":["Last write wins with synchronized clocks","A quorum read at <code>ALL<\/code>","Vector clocks: neither version's clock is behind the other's, so both are kept as siblings for the application","Read repair"],"answer":2,"why":"Last write wins keeps the higher timestamp and drops the other write without a trace, and with skewed clocks the earlier decision can win (lesson 9). Vector clocks compare per-node counters: when each is ahead somewhere, the writes are concurrent and both come back. For payment status, the better answer is to stop the second write before it happens, with a single leader or a transaction (lesson 10).","from":null},{"q":"The fraud team asks for accounts within three shared devices of a flagged account; support asks for disputes \"like this one\"; finance asks for merchants named like \"Nrthwind\". Which stores fit, in that order?","options":["Search, graph, vector","Graph, vector, search","Vector, search, graph","Key-value for all three, with more indexes"],"answer":1,"why":"A walk along shared identifiers is a graph question (lesson 11). Similar meaning is nearest neighbours of embeddings, a vector index (lesson 12). Typo-tolerant word matching ranked by relevance is an inverted index with fuzzy matching, a search engine (lesson 12). Each one can start inside a store you already run (pgvector, PostgreSQL full-text search) before you add a new one.","from":null}]},{"id":"kafka","lab":"kafka","title":"Kafka with Java and Kotlin","short":"The log, partitions and replicas, producers and consumers, rebalancing, retries and dead letters, transactions, Kafka Streams and share groups, in both languages.","lessons":["kafka-01","kafka-02","kafka-03","kafka-04","kafka-05","kafka-06","kafka-07","kafka-08","kafka-09","kafka-10","kafka-11","kafka-12"],"intro":"<p>By the end of this track you can explain what happens to a payment event from <code>send()<\/code> to the last consumer that reads it, and predict what each setting changes on the way. You will know a partition as an append-only log with one bookmark per reader, and build everything else on that picture: segments, retention and compaction; leaders, followers, the ISR and the high watermark; keys, batches, acks and idempotence; the poll loop, commits and rebalances; retries, dead letters and transactions; Kafka Streams tables and windows; schemas, Connect and change data capture; share groups, partition sizing and lag. Every lesson starts from a failure you could meet in a payments platform (a lost write, a double charge, a stuck partition) and ends with the setting or the pattern that prevents it.<\/p>\n<p>You need to read Java and Kotlin, have JDK 21 or newer, and have Docker for the broker-backed tests and Try-its. Every code sample comes in both languages. The track assumes Apache Kafka 4.4: KRaft only, <code>linger.ms=5<\/code>, idempotence on by default, the new consumer protocol available but not the client default, share groups production-ready. No other track is required.<\/p>\n<p>The labs live in <code>labs/kafka<\/code>, one package per lesson (<code>sfz.kafka.l01<\/code> to <code>l12<\/code>). Each lab is a small model of the mechanism (a log, an ISR, an accumulator, an assignor, a share partition) plus a client that the tests run against a real Kafka 4.4 broker started by Testcontainers, or against <code>TopologyTestDriver<\/code> and <code>MockConsumer<\/code> where no broker is needed. Run <code>./gradlew :kafka:test --tests 'sfz.kafka.l05.*'<\/code> from the <code>labs<\/code> folder. The Try-its use <code>labs/env/kafka.yml<\/code> (one broker on <code>localhost:9092<\/code>, with Schema Registry, PostgreSQL and Debezium behind profiles) and <code>labs/env/kafka-cluster.yml<\/code> (three brokers), and <code>./gradlew :kafka:demo -Pmain=...<\/code> for the demos.<\/p>","cheatsheet":"<h2>The model (lessons 1 and 2)<\/h2>\n<p>A topic is a set of partitions. A partition is an append-only log: the broker gives each record the next offset, offsets never change, and order exists only inside a partition. A reader's state is one number per partition, the offset of the next record; a group saves it in <code>__consumer_offsets<\/code> as its committed offset. Reading deletes nothing.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>On disk<\/th>\n<th>Rule<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Segment<\/td>\n<td>files named by base offset (<code>.log<\/code>, <code>.index<\/code>, <code>.timeindex<\/code>); only the active segment takes appends; rolls at <code>segment.bytes<\/code> 1 GiB or <code>segment.ms<\/code> 7 days<\/td>\n<\/tr>\n<tr>\n<td>Retention (<code>cleanup.policy=delete<\/code>)<\/td>\n<td>deletes whole closed segments once their newest record is older than <code>retention.ms<\/code> (7 days) or the partition is over <code>retention.bytes<\/code>; the earliest offset jumps a segment at a time<\/td>\n<\/tr>\n<tr>\n<td>Compaction (<code>cleanup.policy=compact<\/code>)<\/td>\n<td>keeps at least the last record per key in closed segments; offsets and order never change; a tombstone (null value) deletes a key after <code>delete.retention.ms<\/code> (1 day)<\/td>\n<\/tr>\n<tr>\n<td>Tiered storage<\/td>\n<td><code>remote.storage.enable=true<\/code>: closed segments go to object storage, <code>local.retention.ms<\/code> keeps the newest on disk; needs a plugin; no compacted topics<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>The cluster (lesson 3)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>KRaft controllers<\/td>\n<td>keep metadata in the Raft log <code>__cluster_metadata<\/code>; run 3 or 5; ZooKeeper is gone since 4.0<\/td>\n<\/tr>\n<tr>\n<td>Leader, followers<\/td>\n<td>one leader per partition takes writes; followers fetch from it<\/td>\n<\/tr>\n<tr>\n<td>ISR<\/td>\n<td>replicas that keep up; a follower drops out after <code>replica.lag.time.max.ms<\/code> (30 s) or when its broker is fenced<\/td>\n<\/tr>\n<tr>\n<td>High watermark<\/td>\n<td>the smallest log end offset in the ISR; consumers read only below it<\/td>\n<\/tr>\n<tr>\n<td><code>acks=all<\/code><\/td>\n<td>waits for the current ISR, which can be the leader alone<\/td>\n<\/tr>\n<tr>\n<td><code>min.insync.replicas<\/code><\/td>\n<td>the floor for <code>acks=all<\/code> (default 1): below it writes fail with <code>NOT_ENOUGH_REPLICAS<\/code>; use RF 3 and 2 for money<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Producing (lessons 4 and 5)<\/h2>\n<ul>\n<li>Partition of a keyed record: <code>(murmur2(key bytes) &amp; 0x7fffffff) % partitions<\/code>. Same key, same partition, same order. Key payments by account id. Adding partitions moves most keys.<\/li>\n<li>No key: sticky runs of about <code>batch.size<\/code>, steered away from slow brokers (KIP-794).<\/li>\n<li><code>send()<\/code> appends to a batch and returns a Future. A batch leaves when full (<code>batch.size<\/code> 16 KB) or old (<code>linger.ms<\/code> 5 ms since 4.0).<\/li>\n<li>Retries run on their own until <code>delivery.timeout.ms<\/code> (2 min). A <code>TimeoutException<\/code> means unknown, not unwritten.<\/li>\n<li>Idempotence (default): producer id plus sequence numbers; the leader drops duplicates of retries. It needs <code>acks=all<\/code>, retries and at most 5 in flight; <code>acks=1<\/code> turns it off silently.<\/li>\n<\/ul>\n<h2>Consuming (lessons 6 to 8)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Setting or fact<\/th>\n<th>Value and meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thread safety<\/td>\n<td>one thread per consumer; only <code>wakeup()<\/code> may be called from another<\/td>\n<\/tr>\n<tr>\n<td>Commit<\/td>\n<td>the next offset to read: last processed + 1<\/td>\n<\/tr>\n<tr>\n<td>Commit after processing<\/td>\n<td>at-least-once: duplicates after a crash, so dedupe with an idempotency key in the same database transaction<\/td>\n<\/tr>\n<tr>\n<td>Commit before processing<\/td>\n<td>at-most-once: a crash loses records<\/td>\n<\/tr>\n<tr>\n<td><code>auto.offset.reset<\/code><\/td>\n<td><code>latest<\/code> by default for a group with no committed offset<\/td>\n<\/tr>\n<tr>\n<td><code>max.poll.records<\/code> / <code>max.poll.interval.ms<\/code><\/td>\n<td>500 / 5 min: miss the interval and the member leaves the group<\/td>\n<\/tr>\n<tr>\n<td>Rebalance<\/td>\n<td>eager hands back everything; cooperative moves only what must move; KIP-848 (<code>group.protocol=consumer<\/code>, not the 4.4 client default) lets the broker assign and members reconcile alone<\/td>\n<\/tr>\n<tr>\n<td>Liveness<\/td>\n<td>session timeout 45 s for dead processes, <code>max.poll.interval.ms<\/code> for stuck loops; <code>group.instance.id<\/code> keeps partitions through a restart<\/td>\n<\/tr>\n<tr>\n<td>Poison pill<\/td>\n<td>blocks its partition: bounded retries for transient errors, a dead-letter topic with origin headers for permanent ones, park the key to keep per-account order<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Exactly-once inside Kafka (lessons 9 and 10)<\/h2>\n<p><code>transactional.id<\/code> + <code>initTransactions<\/code> (fences older epochs) + <code>beginTransaction<\/code> + sends + <code>sendOffsetsToTransaction(offsets, consumer.groupMetadata())<\/code> + <code>commitTransaction<\/code>. Records are in the log before the decision; COMMIT and ABORT markers take an offset. Readers need <code>isolation.level=read_committed<\/code> (default <code>read_uncommitted<\/code>) and stop at the last stable offset. After an abort, seek back. It covers Kafka writes and offsets only: calls and database writes still need idempotency keys (KIP-939 2PC hasn't shipped). Kafka Streams: <code>processing.guarantee=exactly_once_v2<\/code>.<\/p>\n<h2>Kafka Streams (lesson 10)<\/h2>\n<p>KStream = events; KTable = latest value per key; <code>aggregate<\/code> folds a stream into a table, <code>toStream<\/code> lists its changes. State lives in RocksDB under <code>state.dir<\/code>, one slice per task (input partition), backed by <code>&lt;application.id&gt;-&lt;store&gt;-changelog<\/code> (compacted); a new owner restores from it; <code>num.standby.replicas=1<\/code> keeps a warm copy. Windows by event time; stream time = largest timestamp seen in a task; a window closes at end + grace. <code>group.protocol=streams<\/code> (KIP-1071, 4.2): broker-side task assignment. <code>errors.dead.letter.queue.topic.name<\/code> (4.2).<\/p>\n<h2>Schemas, Connect, CDC (lesson 11)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Check<\/th>\n<th>Upgrade first<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>BACKWARD (default)<\/td>\n<td>new schema reads data of the latest<\/td>\n<td>consumers<\/td>\n<\/tr>\n<tr>\n<td>FORWARD<\/td>\n<td>latest reads data of the new schema<\/td>\n<td>producers<\/td>\n<\/tr>\n<tr>\n<td>FULL<\/td>\n<td>both<\/td>\n<td>either<\/td>\n<\/tr>\n<tr>\n<td><code>_TRANSITIVE<\/code><\/td>\n<td>against every version<\/td>\n<td>as above<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Wire format: byte 0, 4-byte schema id, Avro bytes. Avro: missing reader field takes its default, or fails. Connect: workers, connectors, tasks, converters, transforms; state in <code>connect-configs<\/code>, <code>connect-offsets<\/code>, <code>connect-status<\/code>. Outbox: business row + event row in one database transaction; Debezium reads the WAL through a replication slot, committed transactions in commit order, stores the LSN; at-least-once, dedupe on the event id.<\/p>\n<h2>Share groups and operations (lesson 12)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Consumer group<\/th>\n<th>Share group<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Who reads a partition<\/td>\n<td>one member<\/td>\n<td>every member<\/td>\n<\/tr>\n<tr>\n<td>Max useful members<\/td>\n<td>partition count<\/td>\n<td>no such cap<\/td>\n<\/tr>\n<tr>\n<td>Progress<\/td>\n<td>one committed offset per partition<\/td>\n<td>a state per record: available, acquired, acknowledged, archived<\/td>\n<\/tr>\n<tr>\n<td>Failure of one record<\/td>\n<td>blocks the partition<\/td>\n<td>RELEASE retries it, REJECT archives it; archived after 5 deliveries; DLQ to <code>dlq.*<\/code> in 4.4<\/td>\n<\/tr>\n<tr>\n<td>Order<\/td>\n<td>per partition, per key<\/td>\n<td>none<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Partitions: max(target / per-partition producer rate, target / per-consumer rate), plus growth. Lag: log end offset minus committed offset, per partition; alert on growth and on the age of the oldest record.<\/p>","recap":["A partition is an append-only log with offsets that never change, and each reader keeps one bookmark per partition; reading deletes nothing, and order exists only inside a partition.","Retention deletes whole segments by time or size; compaction keeps the latest record per key in closed segments. Neither touches the active segment.","A write is committed when the ISR has it. <code>acks=all<\/code> waits for the ISR, and <code>min.insync.replicas<\/code> sets how small the ISR may get: replication factor 3 with 2 for money.","The key picks the partition, so key payments by account and choose the partition count up front. The idempotent producer, on by default, stops retries from duplicating or reordering; it doesn't dedupe your own resends.","Commit after processing for at-least-once and make processing idempotent with an idempotency key. Rebalances move partitions and their bookmarks; commit on revoke, and prefer the new consumer protocol.","A record that always fails stops its partition: bounded retries, a dead-letter topic with origin headers, and a parked key keep the rest flowing in order.","Transactions make outputs and offsets one atomic write inside Kafka, for <code>read_committed<\/code> readers; anything outside Kafka still needs idempotency keys or an outbox.","Kafka Streams keeps tables and windows in local stores backed by compacted changelog topics; run <code>exactly_once_v2<\/code> when the state is money.","Schemas with a registry stop a producer from breaking consumers; BACKWARD means consumers upgrade first. The outbox plus Debezium turns a database commit into exactly the events it contains.","Share groups hand out records one by one with locks and delivery counts, giving queue semantics without order; size partitions from measured rates and watch lag per partition."],"quiz":[{"q":"A topic has 6 partitions. Which group can usefully run 20 members, each processing a record at a time?","options":["A consumer group: the broker splits each partition between members","A share group: every member reads every partition, and the broker hands out records one by one","Both, with <code>group.protocol=consumer<\/code>","Neither: 6 is the limit for any group"],"answer":1,"why":"A consumer group gives each partition to one member, so 14 of 20 would sit idle, whatever the protocol. A share group has no such cap, at the price of order. The new consumer protocol changes how assignments are computed, not how many owners a partition has.","from":null},{"q":"A payment consumer writes to Oracle and then commits its offset. It crashes between the two. What does the restart do, and what makes that safe?","options":["It skips the payment; nothing is needed","It processes the payment again; the idempotent producer removes the duplicate","Nothing, because Kafka transactions cover the Oracle write","It processes the payment again; an idempotency key checked in the same Oracle transaction makes the repeat harmless"],"answer":3,"why":"Committing after processing is at-least-once: the restart begins at the committed offset and repeats the payment. The idempotent producer only dedupes a producer's own retries, and a Kafka transaction covers Kafka writes and offsets, not Oracle. The consumer must recognise the repeat itself.","from":null},{"q":"Which statement about retention and compaction is true?","options":["Retention deletes single records once they expire","Compaction removes all but the last record per key in every segment, including the active one","Retention deletes whole closed segments; compaction keeps the last record per key in closed segments and never changes offsets","Compaction renumbers offsets so the log has no gaps"],"answer":2,"why":"Both work on closed segments. Retention drops whole segments whose newest record is too old, so the earliest offset jumps a segment at a time. Compaction rewrites closed segments to keep the latest record per key, leaving gaps in the offsets; the active segment is never cleaned.","from":null},{"q":"A topic has replication factor 3 and <code>min.insync.replicas=2<\/code>. Two followers fall out of the ISR. What happens to a producer with <code>acks=all<\/code>?","options":["Its writes fail with <code>NOT_ENOUGH_REPLICAS<\/code>, retried until <code>delivery.timeout.ms<\/code>, then a <code>TimeoutException<\/code>","Its writes succeed: <code>acks=all<\/code> waits for the ISR, which is now just the leader","The leader waits for the followers to come back, without a timeout","The writes succeed but consumers can't read them"],"answer":0,"why":"<code>acks=all<\/code> alone would accept the leader as the whole ISR. <code>min.insync.replicas<\/code> is the floor: with one in-sync replica and a floor of 2, the leader refuses the write. The producer retries a retriable error until its delivery timeout, then reports a <code>TimeoutException<\/code>, which means unknown, not lost.","from":null},{"q":"A group of three consumers uses the classic protocol with the default assignor list, which starts with the eager Range assignor. A fourth member joins. What do the three existing members do?","options":["Keep all their partitions; only the new member gets idle ones","Give up only the partitions that move to the new member","Give back all their partitions and wait for the new assignment","Leave the group and rejoin one at a time"],"answer":2,"why":"Eager rebalancing revokes every partition from every member before reassigning, so all processing stops for the rebalance. The cooperative assignor revokes only what moves, in two rounds, and the KIP-848 protocol lets each member give up only its own moved partitions without a group-wide stop.","from":"kafka-07"},{"q":"A producer has <code>acks=1<\/code> and doesn't set <code>enable.idempotence<\/code>. What happens to idempotence?","options":["It stays on, the default since Kafka 3.0","It's turned off silently, because idempotence needs <code>acks=all<\/code>","The producer fails to start with a <code>ConfigException<\/code>","It stays on for retries but not for reordering"],"answer":1,"why":"Idempotence is on by default only when nothing conflicts with it. <code>acks=1<\/code> conflicts, so the producer turns it off without a word. Only if you also set <code>enable.idempotence=true<\/code> explicitly does the conflict become a <code>ConfigException<\/code>.","from":null},{"q":"A consume-transform-produce service uses transactions. A downstream consumer with default settings reads its output. What does it see after a batch is aborted?","options":["Nothing from the aborted batch: aborted records are deleted","Only the ABORT marker","Nothing at all until <code>transaction.timeout.ms<\/code>","The aborted records too, because the default <code>isolation.level<\/code> is <code>read_uncommitted<\/code>"],"answer":3,"why":"Transactional records are in the log before the decision, and an abort only adds a marker. Hiding aborted records is the reader's job, and only <code>read_committed<\/code> readers do it. Exactly-once inside Kafka needs every reader of the output to opt in.","from":null},{"q":"A Kafka Streams balance app runs <code>at_least_once<\/code>. What does switching to <code>exactly_once_v2<\/code> change?","options":["The output records, changelog writes and input offsets of each commit go into one transaction, so a crash can't count a payment twice","Nothing for state: changelogs were always exact","Kafka Streams stops using changelog topics","External API calls in the topology happen once"],"answer":0,"why":"Under at-least-once, updates reach the changelog before the offsets are committed, so after a crash the restored store already contains payments that are then processed again. One transaction per commit ties them together. Calls outside Kafka are still not covered.","from":null},{"q":"A subject is in BACKWARD mode. A team removes a field that had no default and adds one with a default. Which deploy order is safe?","options":["Producers first, then consumers","Consumers first, then producers","Any order: the registry accepted it","Neither: the registry rejects both changes"],"answer":1,"why":"BACKWARD accepts a schema that can read data written with the latest version: removed fields are skipped and the new field has a default, so it's accepted. It promises nothing about old consumers reading new data, so consumers move first, then producers. Removing a field without a default would fail under FORWARD.","from":"kafka-11"},{"q":"Which of these is a job for a share group rather than a consumer group?","options":["Applying each account's payments to the ledger in order","Building a running balance per account","Sending a webhook to a merchant for each settled payment, where each call is independent and slow","Replicating a compacted account topic into a cache"],"answer":2,"why":"Share groups scale past the partition count and retry or archive each record on its own, but give up order. Independent, slow work items fit. The ledger and the balance need per-account order and state, and a compacted topic's latest-value-per-key replay needs a reader that walks each partition in order.","from":null}]},{"id":"redis","lab":"redis","title":"Redis with Java and Kotlin","short":"The single-threaded model, data types and encodings, expiry and eviction, caching, atomicity, rate limits, locks, Streams, persistence and Cluster, in both languages.","lessons":["redis-01","redis-02","redis-03","redis-04","redis-05","redis-06","redis-07","redis-08","redis-09","redis-10","redis-11"],"intro":"<p>By the end of this track you can predict what Redis does with a command before you send it: which thread runs it, how much memory the key costs, when it expires or gets evicted, whether a sequence of commands is atomic, what survives a crash, and which node of a cluster holds it. You will have built the payment-service patterns that depend on those answers, in Java and in Kotlin: a cache that survives a stampede, a WATCH-based transfer and a Lua ledger, a rate limiter, an idempotency store, a lock with fencing tokens, and a Streams worker that recovers a crashed consumer's messages.<\/p>\n<p>You need to read Java or Kotlin and to have used Redis through a client library; nothing about its internals. Lesson 1 builds the model the rest of the track uses: one thread runs every command to completion. Each later lesson adds to it, and the operating systems track's lessons on copy-on-write, malloc and the page cache come back in lessons 10 and 11, with a one-line reminder each time.<\/p>\n<p>The labs live in <code>labs/redis<\/code>, one package per lesson (<code>sfz.redis.l01<\/code> to <code>sfz.redis.l11<\/code>). Each lab is a failing test suite: run <code>./gradlew :redis:test --tests 'sfz.redis.lNN.*'<\/code> from the <code>labs<\/code> folder and make it pass; <code>src/solution<\/code> holds reference answers, which <code>./gradlew :redis:solutionTest<\/code> checks. Model labs (an event loop, sampled LRU, a HyperLogLog, a replication backlog, a cluster router) need only a JDK. The others start a pinned <code>redis:8.10.3<\/code> container through Testcontainers, so Docker must be running. Try-its use <code>env/redis.yml<\/code> (one server, plus a tiny <code>small<\/code> one for eviction), <code>env/redis-ha.yml<\/code> (a primary, a replica and three Sentinels) and <code>env/redis-cluster.yml<\/code> (three cluster nodes). Everything was tested with Redis 8.10.3, Jedis 8.0.2, Lettuce 7.9.0, Testcontainers 2.0.5 and JDK 25; lessons name the Redis version of every command newer than 7.2.<\/p>","cheatsheet":"<h3>The model<\/h3>\n<p>One thread runs every command to completion, one after another. So <strong>every single command is atomic<\/strong>, and <strong>one slow command stalls every client<\/strong>. Background threads, forked children and I/O threads (<code>io-threads<\/code>, off by default) never run commands.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Is one command atomic?<\/td>\n<td>Yes, always. A sequence of commands is not.<\/td>\n<\/tr>\n<tr>\n<td>What makes Redis slow for everyone?<\/td>\n<td>One O(N) command (<code>KEYS<\/code>, <code>HGETALL<\/code> on a big hash, <code>DEL<\/code> of a big key, a long script), a fork, a starved VM.<\/td>\n<\/tr>\n<tr>\n<td>Round trip vs command<\/td>\n<td>A <code>GET<\/code> costs about half a microsecond of server time and a few hundred microseconds of network. Batch round trips.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Types (lessons 2 and 3)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Type<\/th>\n<th>Watch out<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A value, a counter<\/td>\n<td>string: <code>SET<\/code>, <code>INCR<\/code><\/td>\n<td>a plain <code>SET<\/code> drops the TTL; use <code>KEEPTTL<\/code><\/td>\n<\/tr>\n<tr>\n<td>An object's fields<\/td>\n<td>hash: <code>HSET<\/code>, <code>HINCRBY<\/code><\/td>\n<td>listpack up to 512 fields of 64 bytes, then a hash table<\/td>\n<\/tr>\n<tr>\n<td>A ranking<\/td>\n<td>sorted set: <code>ZADD<\/code>, <code>ZRANGE ... REV<\/code><\/td>\n<td>ties sort by member; ranks start at 0; listpack up to 128<\/td>\n<\/tr>\n<tr>\n<td>Membership<\/td>\n<td>set<\/td>\n<td><code>SMEMBERS<\/code> on a big set is O(N); use <code>SSCAN<\/code><\/td>\n<\/tr>\n<tr>\n<td>Daily active cards<\/td>\n<td>bitmap: <code>SETBIT<\/code>, <code>BITCOUNT<\/code><\/td>\n<td>needs a dense integer id per card<\/td>\n<\/tr>\n<tr>\n<td>Distinct count<\/td>\n<td>HyperLogLog: <code>PFADD<\/code>, <code>PFCOUNT<\/code><\/td>\n<td>12 KB, 0.81% standard error, can't list members<\/td>\n<\/tr>\n<tr>\n<td>Nearby terminals<\/td>\n<td>geo (a sorted set)<\/td>\n<td>distances assume a sphere<\/td>\n<\/tr>\n<tr>\n<td>A work queue or event log<\/td>\n<td>stream<\/td>\n<td>trim with <code>MAXLEN ~<\/code> or <code>MINID ~<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Expiry versus eviction (lesson 4)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Expiry<\/th>\n<th>Eviction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Removes<\/td>\n<td>keys whose TTL deadline passed<\/td>\n<td>keys Redis picks when <code>used_memory<\/code> reaches <code>maxmemory<\/code><\/td>\n<\/tr>\n<tr>\n<td>When<\/td>\n<td>lazily on access, plus a sampling cycle 10 times a second<\/td>\n<td>before a write that needs room<\/td>\n<\/tr>\n<tr>\n<td>You control it with<\/td>\n<td><code>EXPIRE<\/code>, <code>SET ... EX<\/code>, <code>PERSIST<\/code><\/td>\n<td><code>maxmemory<\/code>, <code>maxmemory-policy<\/code><\/td>\n<\/tr>\n<tr>\n<td>Default<\/td>\n<td>no TTL<\/td>\n<td><code>maxmemory 0<\/code> (no limit), <code>noeviction<\/code> (writes fail when full)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Data (idempotency keys, rate limits, locks): <code>noeviction<\/code>, a TTL on every key, an alert near <code>maxmemory<\/code>. Cache: <code>allkeys-lru<\/code>. Separate instances. <code>volatile-*<\/code> policies act like <code>noeviction<\/code> when no key has a TTL.<\/p>\n<h3>Caching (lesson 5)<\/h3>\n<p>Cache-aside: <code>GET<\/code>; on a miss read the database and <code>SET ... EX<\/code>. On a write: commit, then <code>DEL<\/code> the key (never <code>SET<\/code> it). Jitter TTLs (3,600 s plus or minus 10%), cache \"not found\" briefly, and collapse a hot key's misses with single-flight in the JVM or a <code>SET NX PX<\/code> lock across pods.<\/p>\n<h3>Making a sequence safe (lessons 6 to 8)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Atomic?<\/th>\n<th>Can branch on a read?<\/th>\n<th>Saves round trips?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>MULTI<\/code> / <code>EXEC<\/code><\/td>\n<td>yes, never rolls back<\/td>\n<td>no<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>WATCH<\/code> + <code>MULTI<\/code><\/td>\n<td>yes, aborts if a watched key changed; retry<\/td>\n<td>yes, in the client<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td>Lua script / function<\/td>\n<td>yes, runs inside the event loop<\/td>\n<td>yes<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td>Pipelining<\/td>\n<td><strong>no<\/strong><\/td>\n<td>no<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>SET ... IFEQ<\/code> (8.4), <code>INCREX<\/code> (8.8)<\/td>\n<td>yes, one command<\/td>\n<td>one condition<\/td>\n<td>yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Patterns built on them:<\/p>\n<ul>\n<li>Rate limit: count and expire in one step (a script, or <code>INCREX ... EX 60 ENX<\/code> on 8.8); a sliding window is a sorted set trimmed, counted and added to by one script.<\/li>\n<li>Idempotency key: <code>SET idem:&lt;key&gt; &lt;pending&gt; NX GET PX 30000<\/code> before the work, where the pending value carries the body's hash and an owner token; after it, the stored response as DONE for 24 hours (<code>SET ... IFEQ &lt;my pending&gt;<\/code> on 8.4).<\/li>\n<li>Lock: <code>SET lock:&lt;r&gt; &lt;token&gt; NX PX &lt;ttl&gt;<\/code>; release with compare-and-delete (a script, or <code>DELEX key IFEQ token<\/code> on 8.4). A lease can expire under a paused holder, so for correctness the resource must check a <strong>fencing token<\/strong>.<\/li>\n<\/ul>\n<h3>Messaging (lesson 9)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Pub/sub<\/th>\n<th>Stream with a consumer group<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Stores messages<\/td>\n<td>no<\/td>\n<td>yes, until trimmed<\/td>\n<\/tr>\n<tr>\n<td>Delivery<\/td>\n<td>at most once, to whoever is subscribed now<\/td>\n<td>at least once: the PEL keeps each entry until <code>XACK<\/code><\/td>\n<\/tr>\n<tr>\n<td>A consumer dies<\/td>\n<td>its messages are gone<\/td>\n<td><code>XAUTOCLAIM<\/code> (or <code>XREADGROUP ... CLAIM<\/code>, 8.4) hands them to another<\/td>\n<\/tr>\n<tr>\n<td>Use for<\/td>\n<td>signals a receiver can miss: cache invalidation, live status<\/td>\n<td>work: settlements, webhooks, retries<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Durability and failover (lesson 10)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Process killed (kill -9, OOM)<\/th>\n<th>Machine dies (power, kernel panic)<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No persistence<\/td>\n<td>everything<\/td>\n<td>everything<\/td>\n<td>none<\/td>\n<\/tr>\n<tr>\n<td>RDB, default save points<\/td>\n<td>writes since the last snapshot: minutes<\/td>\n<td>the same<\/td>\n<td>a fork plus copy-on-write pages per snapshot<\/td>\n<\/tr>\n<tr>\n<td>AOF <code>everysec<\/code> (default)<\/td>\n<td>nothing<\/td>\n<td>about the last second<\/td>\n<td>one background fsync a second<\/td>\n<\/tr>\n<tr>\n<td>AOF <code>always<\/code><\/td>\n<td>nothing<\/td>\n<td>nothing<\/td>\n<td>an fsync per event-loop pass: far fewer writes a second<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Replication is asynchronous: a replica follows the stream with an offset, and after a break resyncs from the backlog (<code>repl-backlog-size<\/code>, 1 MB) or with a full snapshot. <code>WAIT n ms<\/code> counts replicas that have this connection's writes; it undoes nothing. <code>WAITAOF<\/code> (7.2) waits for fsync.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Sentinel<\/th>\n<th>Cluster<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Data<\/td>\n<td>one primary holds everything<\/td>\n<td>split over primaries by hash slot<\/td>\n<\/tr>\n<tr>\n<td>Failover<\/td>\n<td>3 or more Sentinels: a quorum agrees, a majority acts<\/td>\n<td>the other primaries vote for a replica<\/td>\n<\/tr>\n<tr>\n<td>Clients<\/td>\n<td>ask a Sentinel for the primary<\/td>\n<td>load the slot table, follow <code>MOVED<\/code> and <code>ASK<\/code><\/td>\n<\/tr>\n<tr>\n<td>Multi-key commands<\/td>\n<td>anything<\/td>\n<td>only keys in one slot: use hash tags<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Cluster (lesson 11)<\/h3>\n<p><code>slot = CRC16(key) mod 16384<\/code>; only the part inside the first <code>{...}<\/code> is hashed when there is one. <code>MOVED &lt;slot&gt; &lt;addr&gt;<\/code>: update your table. <code>ASK &lt;slot&gt; &lt;addr&gt;<\/code>: send this one command there after <code>ASKING<\/code>. <code>CROSSSLOT<\/code>: a multi-key command, transaction or script spans slots. Tag by the smallest unit that must change atomically (<code>{payment:p-981}<\/code>), never by tenant.<\/p>\n<h3>When Redis is slow (lesson 11)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>What it tells you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>SLOWLOG GET 10<\/code><\/td>\n<td>commands that ran over 10 ms on the command thread<\/td>\n<\/tr>\n<tr>\n<td><code>LATENCY LATEST<\/code>, <code>LATENCY DOCTOR<\/code><\/td>\n<td>forks, fsyncs, expiry cycles (set <code>latency-monitor-threshold<\/code> first)<\/td>\n<\/tr>\n<tr>\n<td><code>INFO commandstats<\/code><\/td>\n<td>calls and microseconds per command<\/td>\n<\/tr>\n<tr>\n<td><code>INFO persistence<\/code>, <code>INFO stats<\/code><\/td>\n<td><code>latest_fork_usec<\/code>, <code>rdb_last_cow_size<\/code>, <code>evicted_keys<\/code>, <code>expired_keys<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>INFO memory<\/code><\/td>\n<td><code>used_memory<\/code>, <code>used_memory_rss<\/code>, <code>mem_fragmentation_ratio<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>redis-cli --bigkeys<\/code>, <code>--memkeys<\/code>, <code>HOTKEYS<\/code> (8.6)<\/td>\n<td>big keys and hot keys<\/td>\n<\/tr>\n<tr>\n<td><code>redis-cli --intrinsic-latency 100<\/code><\/td>\n<td>stalls of the machine itself<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Never <code>KEYS<\/code> in production: <code>SCAN<\/code> with <code>MATCH<\/code> and <code>COUNT<\/code>. <code>UNLINK<\/code>, not <code>DEL<\/code>, for big keys.<\/p>\n<h3>Java and Kotlin<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Jedis 8<\/th>\n<th>Lettuce 7.9<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Entry point<\/td>\n<td><code>RedisClient.builder().hostAndPort(h, p).build()<\/code><\/td>\n<td><code>RedisClient.create(\"redis://h:p\")<\/code>, then <code>connect()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Connections<\/td>\n<td>a pool: one connection per call<\/td>\n<td>one multiplexed connection<\/td>\n<\/tr>\n<tr>\n<td>Style<\/td>\n<td>blocking calls<\/td>\n<td>sync, async, reactive, Kotlin coroutines (<code>coroutines()<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Pipelines and WAIT<\/td>\n<td><code>redis.pipelined()<\/code>: one connection for the batch<\/td>\n<td>every call on the shared connection<\/td>\n<\/tr>\n<tr>\n<td>Cluster<\/td>\n<td><code>RedisClusterClient<\/code><\/td>\n<td><code>io.lettuce.core.cluster.RedisClusterClient<\/code><\/td>\n<\/tr>\n<tr>\n<td>Sentinel<\/td>\n<td><code>RedisSentinelClient<\/code><\/td>\n<td><code>RedisURI.Builder.sentinel(...)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Commands by version<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Since<\/th>\n<th>Commands<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>7.0<\/td>\n<td>functions (<code>FUNCTION LOAD<\/code>, <code>FCALL<\/code>), multi-part AOF, <code>EXPIRE ... NX/XX/GT/LT<\/code>, sharded pub/sub<\/td>\n<\/tr>\n<tr>\n<td>7.2<\/td>\n<td><code>WAITAOF<\/code><\/td>\n<\/tr>\n<tr>\n<td>7.4<\/td>\n<td><code>HEXPIRE<\/code> and the other hash-field TTLs<\/td>\n<\/tr>\n<tr>\n<td>8.4<\/td>\n<td><code>SET ... IFEQ<\/code>, <code>DELEX<\/code>, <code>XREADGROUP ... CLAIM<\/code>, <code>CLUSTER MIGRATION<\/code><\/td>\n<\/tr>\n<tr>\n<td>8.6<\/td>\n<td><code>XADD ... IDMP<\/code>, LRM eviction, <code>HOTKEYS<\/code><\/td>\n<\/tr>\n<tr>\n<td>8.8<\/td>\n<td><code>INCREX<\/code>, <code>XNACK<\/code><\/td>\n<\/tr>\n<tr>\n<td>8.10<\/td>\n<td><code>BACKUP<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Valkey (BSD, forked from Redis 7.2.4 in 2024) runs everything up to 7.2; check the newer commands before relying on them there.<\/p>","recap":["One thread runs every command to completion: each command is atomic without locks, and one O(N) command, fork or starved VM delays every client.","Choose a type by the operation you need. Small collections are compact listpacks until a size threshold; a key that grows big turns its O(N) commands into outages.","Expiry removes keys whose deadline passed, lazily and by sampling; eviction removes keys Redis chooses when <code>maxmemory<\/code> is full. Data gets <code>noeviction<\/code> and TTLs, a cache <code>allkeys-lru<\/code>, in separate instances.","Cache-aside reads the cache first and deletes the key after a database commit; jittered TTLs and single-flight keep expiries from turning into stampedes.","A sequence of commands is safe only as one atomic step: MULTI/EXEC (no branching, no rollback), WATCH with a retry, or a Lua script. Pipelining only saves round trips.","Rate limits, idempotency keys and locks each check and record in one command or script. A lock is a lease, so correctness needs a fencing token that the resource checks.","Pub/sub delivers at most once to whoever listens now; a stream with a consumer group delivers at least once and lets another worker claim a crashed one's entries, so handlers must be idempotent.","RDB snapshots lose minutes, the AOF with everysec about a second on a machine crash and nothing on a process crash. Replication is asynchronous: WAIT counts copies, Sentinel promotes a replica.","Redis Cluster splits keys into 16,384 slots. Clients route by slot and follow MOVED and ASK; multi-key commands need one slot, which hash tags provide.","When Redis is slow, look for one slow command first (SLOWLOG, LATENCY, commandstats), then forks, big and hot keys, and the machine. SCAN, never KEYS; UNLINK for big keys."],"quiz":[{"q":"A rate limiter runs <code>INCR rl:card:7<\/code>, and if the result is 1, <code>EXPIRE rl:card:7 60<\/code>. A pod is killed between the two calls. What happens, and what fixes it?","options":["Nothing: Redis runs both commands as one step because they come from the same client","The counter has no TTL and never resets, so the card stays blocked; do both in one Lua script, or <code>INCREX ... EX 60 ENX<\/code> on Redis 8.8","Redis notices the missing EXPIRE and sets a default TTL","The INCR is rolled back when the connection drops"],"answer":1,"why":"Each command is atomic because one thread runs it to the end (lesson 1), but two commands are two steps, and a crash can fall between them (lesson 7). Nothing in Redis ties the INCR to the EXPIRE that should follow, and there is no rollback. A script runs the count and the deadline as one command, and Redis 8.8's INCREX does it natively.","from":null},{"q":"A per-merchant sorted set grows from 120 to 140 members, and <code>MEMORY USAGE<\/code> on it jumps about tenfold. Why?","options":["Past 128 members (<code>zset-max-listpack-entries<\/code>) Redis converts the compact listpack into a skip list plus a hash table, and never converts back","The members got longer","The sorted set was copied for a snapshot","Scores became doubles"],"answer":0,"why":"Small sorted sets live in a listpack, one compact block of memory. At 129 members (or a member over 64 bytes) Redis converts the key to a skip list and a hash table, with pointers and headers for every member: about 1 KB became 11 KB on the lab server (lesson 2). Scores are always doubles, and snapshots don't change a key's encoding.","from":null},{"q":"You must count distinct cards per merchant per day, about 10 million cards in all, within about 1%, in as little memory as possible. Which structure?","options":["A set of card ids per merchant per day","A sorted set scored by time","A HyperLogLog per merchant per day: at most 12 KB each, 0.81% standard error","A hash of card id to count"],"answer":2,"why":"A HyperLogLog estimates distinct counts in at most 12 KB whatever the count, with a 0.81% standard error, and PFMERGE gives the union across days (lesson 3). A set or hash stores every id, hundreds of megabytes at this scale. The price: it can't list or remove members.","from":null},{"q":"An idempotency store runs with <code>maxmemory-policy allkeys-lru<\/code>. Under memory pressure a 23-hour-old key disappears although its TTL was 24 hours, and a retried payment is charged twice. What removed it?","options":["Expiry: Redis expires keys early when memory is tight","A replica deleted it","The active expiry cycle sampled it by mistake","Eviction: allkeys-lru picked the key idle longest, whatever its TTL"],"answer":3,"why":"Expiry only removes keys whose deadline has passed, and never early. Eviction removes keys Redis chooses when <code>used_memory<\/code> reaches <code>maxmemory<\/code>, and under allkeys-lru the oldest unread key goes first: a 23-hour-old idempotency key is the perfect candidate (lesson 4). Data like this belongs on an instance with <code>noeviction<\/code>, a <code>maxmemory<\/code> and an alert.","from":null},{"q":"A merchant's row in Oracle has just been updated. What should the service do with the merchant's cached copy in Redis?","options":["<code>SET<\/code> the new value into the cache before the database commit","<code>SET<\/code> the new value into the cache after the commit","Commit, then <code>DEL<\/code> the cache key, and let the next read load it","Nothing: the TTL will fix it"],"answer":2,"why":"Two writers that each SET the cache can finish in the opposite order from their commits and leave the older value cached until the TTL ends (lesson 5). Deleting after the commit only ever removes data; the next reader loads what the database now says. The TTL still caps any race that remains, which is why every cache entry has one.","from":null},{"q":"Debit a prepaid card only if its balance covers the amount, atomically and in one round trip. Which tool fits?","options":["MULTI with GET, a check, then DECRBY","A pipeline of GET and DECRBY","A Lua script that reads the balance, checks it and decrements it","Two commands with WATCH but no retry"],"answer":2,"why":"MULTI queues commands and can't branch on a value read inside it, and it never rolls back (lesson 6). A pipeline only batches round trips; other clients' commands can run between its commands. WATCH works, but needs a retry loop and at least two round trips. A script runs the read, the test and the write as one command on the event loop.","from":null},{"q":"A payout worker holds a Redis lock with a 30-second lease, then stalls in a 40-second GC pause. Another worker takes the lock and writes. The first resumes and writes too. What stops the stale write?","options":["Releasing the lock with compare-and-delete","A longer lease","Redlock across five masters","A fencing token from the lock that the payout store checks, refusing any token lower than the highest it has seen"],"answer":3,"why":"Compare-and-delete stops the first worker from deleting the second's lock, but it doesn't stop its write. A longer lease or Redlock only moves the window; no lease can stop a holder that doesn't know it lost the lock (lesson 8). Only the resource can refuse the stale holder, and the fencing token is how it tells them apart.","from":null},{"q":"Settlement events must survive a worker restart and each be settled at least once, even when a worker crashes halfway through a batch. Pub/sub or Streams?","options":["Pub/sub: it is faster","A stream with a consumer group: entries stay pending until XACK, and XAUTOCLAIM hands a crashed worker's entries to another","Pub/sub with a longer client timeout","A stream read with XREAD and no group"],"answer":1,"why":"Pub/sub stores nothing: a message published while a subscriber is restarting is gone, at most once (lesson 9). A consumer group records every delivery in its pending entries list until the worker acknowledges it, and another worker can claim entries that sit idle too long. That is at least once, so settlement must be idempotent. Plain XREAD keeps the entries but tracks no deliveries.","from":null},{"q":"The machine running Redis loses power. Which configuration loses fewer acknowledged writes, and roughly how many?","options":["RDB with the default save points: nothing, since snapshots are on disk","They lose the same: both write to disk","The AOF with everysec: about the last second. RDB loses everything since the last snapshot, often minutes","The AOF with everysec: nothing, since every write is logged before the reply"],"answer":2,"why":"A snapshot holds the data as of its fork; with save points that is up to minutes old (lesson 10). The AOF passes every write to the kernel before replying, which protects against a process crash, but a power cut also empties the page cache, so writes not yet fsynced are lost: about one second under everysec. Only <code>always<\/code> loses nothing, at a large cost in throughput.","from":null},{"q":"The idempotency store will need 300 GB and 1 million commands a second, far more than one server. Sentinel or Cluster?","options":["Cluster: it splits the keys over many primaries by hash slot, each with its own replica and failover","Sentinel: it adds servers when memory runs low","Sentinel with more replicas, reading from all of them","Either: they are two names for the same thing"],"answer":0,"why":"Sentinel watches one primary that holds every key and promotes a replica when it fails; replicas copy everything, so they split neither the memory nor the writes (lessons 10 and 11). Cluster gives each primary a share of the 16,384 slots and fails each one over separately. The price is that multi-key commands, transactions and scripts need their keys in one slot.","from":null}]},{"id":"data","lab":"bigdata","title":"Big data: Spark and the lakehouse","short":"What survived from Hadoop and Hive, Parquet, the Spark execution model and shuffle, Iceberg tables, streaming, and when one laptop with DuckDB is enough.","lessons":["data-01","data-02","data-03","data-04","data-05","data-06","data-07","data-08","data-09","data-10","data-11","data-12"],"intro":"<p>By the end of this track you can look at a data job and say what it will cost before it runs: how many bytes it reads after skipping partitions and columns, how many stages and tasks Spark will run and where the shuffles fall, which join it will pick, and whether it needs a cluster at all. You can lay out payments data as Parquet in an Apache Iceberg table, correct it with <code>MERGE INTO<\/code>, keep it fast with compaction and snapshot expiry, stream into it from Kafka exactly once with event-time windows and watermarks, and choose between DuckDB, Spark, Trino and a streaming engine with numbers instead of habit.<\/p>\n<p>You need to read Kotlin or Java and have JDK 21 installed; the Gradle wrapper fetches everything else. You don't need a cluster, Hadoop or Docker. Spark 4.1 (the newest line both Iceberg 1.12 and Delta Lake 4.4 support), Iceberg and DuckDB run inside the test JVM on your laptop. No earlier track is required, though the operating systems track's page cache and the Kafka track's offsets come up as reminders.<\/p>\n<p>The labs live in <code>labs/bigdata<\/code>, one package per lesson (<code>sfz.bigdata.l01<\/code> to <code>l12<\/code>), in Kotlin. Each lab is a small model or a real Spark, Iceberg or DuckDB program that the tests check against generated, deterministic payments data: run <code>./gradlew :bigdata:test --tests 'sfz.bigdata.l05.*'<\/code> from the <code>labs<\/code> folder, and <code>./gradlew :bigdata:demo -Pmain=...<\/code> for the Try-it demos. The tests share one local Spark session (two worker threads, four shuffle partitions), so the first test of a run pays a few seconds of start-up. Timings in the lessons were measured on a busy laptop: trust the ratios and the shapes, not the milliseconds.<\/p>","cheatsheet":"<h2>Cost of a scan (lessons 1 and 12)<\/h2>\n<p><code>time = bytes read / bandwidth of the slowest stage<\/code> (disk, network or CPU decoding). 1 TB at 500 MB/s is 2,000 s. Two levers: more readers (split into blocks, run in parallel) and fewer bytes (columns, compression, skipping). Pull \"fewer bytes\" first.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Example: 4 TB, 3 years, 60 columns<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Partitions read<\/td>\n<td>30 of 1,095 days: 110 GB<\/td>\n<\/tr>\n<tr>\n<td>Columns read<\/td>\n<td>4 of 60: 7.3 GB<\/td>\n<\/tr>\n<tr>\n<td>One machine's speed<\/td>\n<td>min(cores x decode rate, storage rate): 3 GB/s laptop, about 1.5 GB/s VM from S3<\/td>\n<\/tr>\n<tr>\n<td>Users sharing it<\/td>\n<td>time x concurrent queries<\/td>\n<\/tr>\n<tr>\n<td>Working set<\/td>\n<td>join build side or groups; must fit in RAM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Route: fits one machine in time and memory: DuckDB. Otherwise a cluster sized by max(time / budget, working set / RAM): Trino if seconds-scale and interactive, Spark if a long batch job. Never-ending work: Structured Streaming or Flink.<\/p>\n<h2>What survived from Hadoop and Hive (lessons 2 and 3)<\/h2>\n<ul>\n<li>HDFS: files in 128 MiB blocks, 3 replicas, a NameNode holding the block map. MapReduce: map, partition by <code>hash(key) mod R<\/code>, shuffle to local disk, fetch and sort, reduce. A combiner pre-aggregates only for associative and commutative work; for an average carry <code>(sum, count)<\/code>.<\/li>\n<li>Hive: a table is a directory plus a schema in the metastore; partitions are <code>dt=2026-11-07/<\/code> folders. Pruning works only on the partition column. Folders written behind the metastore's back need <code>MSCK REPAIR TABLE<\/code>. Writes aren't atomic and small files cost an open each.<\/li>\n<\/ul>\n<h2>Parquet (lesson 4)<\/h2>\n<p>Row groups, each with one column chunk per column, made of pages; a footer at the end with offsets and min/max/null counts, then its 4-byte length and <code>PAR1<\/code>. Dictionary, RLE and delta encodings, then Snappy or Zstd. Min/max skip row groups only when data is sorted or clustered on the filter column. <code>PushedFilters<\/code> lists what Spark offered, not what was skipped; Spark writes <code>INT96<\/code> timestamps by default, and those skip nothing.<\/p>\n<h2>Spark execution (lessons 5 to 7)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Rule<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lazy plan<\/td>\n<td>transformations build a plan; actions (<code>count<\/code>, <code>collect<\/code>, <code>write<\/code>) run it, each time<\/td>\n<\/tr>\n<tr>\n<td>Narrow vs wide<\/td>\n<td><code>where<\/code>, <code>select<\/code>, <code>withColumn<\/code> chain in one task; <code>groupBy<\/code>, <code>join<\/code>, <code>distinct<\/code>, <code>repartition<\/code> need an <code>Exchange<\/code><\/td>\n<\/tr>\n<tr>\n<td>Stages<\/td>\n<td>one input: stages = Exchanges + 1; tasks = partitions; extra tasks wait in waves<\/td>\n<\/tr>\n<tr>\n<td>Failure<\/td>\n<td>a task is retried up to 4 times from lineage; lost shuffle files rerun their map tasks<\/td>\n<\/tr>\n<tr>\n<td>Shuffle<\/td>\n<td>each map task writes one file with a block per reducer: M x R blocks<\/td>\n<\/tr>\n<tr>\n<td><code>repartition(n)<\/code> vs <code>coalesce(n)<\/code><\/td>\n<td>shuffle to n even partitions vs merge without a shuffle (and the stage before runs as n tasks)<\/td>\n<\/tr>\n<tr>\n<td><code>spark.sql.shuffle.partitions<\/code><\/td>\n<td>200 by default; with AQE on, set it high and let AQE merge<\/td>\n<\/tr>\n<tr>\n<td>Joins<\/td>\n<td>sort-merge: shuffle both sides by key. Broadcast hash: copy the small side everywhere, under 10 MB by estimate, or force with <code>broadcast()<\/code><\/td>\n<\/tr>\n<tr>\n<td>AQE<\/td>\n<td>re-plans at each shuffle with real sizes: merges small partitions, switches to broadcast, splits skewed partitions (over 5x median and 256 MB)<\/td>\n<\/tr>\n<tr>\n<td>Skew<\/td>\n<td>one hot key, one slow task: broadcast, let AQE split, or salt the key<\/td>\n<\/tr>\n<tr>\n<td><code>cache()<\/code><\/td>\n<td>pays only when reused; cache after the filter, <code>unpersist()<\/code> after<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Read plans with <code>explain(\"formatted\")<\/code>: <code>Exchange hashpartitioning<\/code>, <code>BroadcastExchange<\/code>, <code>SortMergeJoin<\/code>, <code>AQEShuffleRead<\/code>, <code>InMemoryTableScan<\/code>.<\/p>\n<h2>Spark 4 for JVM engineers (lesson 8)<\/h2>\n<p>Spark Connect: the client sends unresolved plans over gRPC (port 15002) and gets Arrow batches; no SparkContext, no RDDs. ANSI mode is on: bad casts, overflow and division by zero fail; use <code>try_cast<\/code>, <code>try_add<\/code>, <code>try_divide<\/code> where null is intended. VARIANT holds parsed JSON (<code>parse_json<\/code>, <code>variant_get<\/code>). From Kotlin, prefer column expressions or SQL; typed lambdas hide logic from Catalyst.<\/p>\n<h2>File format, table format, catalog (lessons 9 and 10)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Example<\/th>\n<th>Holds<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>File format<\/td>\n<td>Parquet<\/td>\n<td>rows of one file, by column, with stats<\/td>\n<\/tr>\n<tr>\n<td>Table format<\/td>\n<td>Iceberg, Delta, Hudi<\/td>\n<td>which files make each version of a table, schemas, partition specs, snapshots<\/td>\n<\/tr>\n<tr>\n<td>Catalog<\/td>\n<td>Hadoop folder, JDBC, Hive Metastore, REST (Polaris, Unity Catalog)<\/td>\n<td>the pointer to each table's current metadata; the commit's compare-and-swap<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Iceberg: pointer, then <code>vN.metadata.json<\/code>, then a manifest list per snapshot, then manifests with per-file stats, then Parquet. A commit writes new files and swaps the pointer if it still names the base; the loser retries. <code>VERSION AS OF<\/code> / <code>TIMESTAMP AS OF<\/code> until snapshots expire. Columns have ids (rename is metadata only); <code>PARTITIONED BY (days(created_at))<\/code> is hidden partitioning.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Row-level change<\/th>\n<th>Writes<\/th>\n<th>Reads<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>copy-on-write (default)<\/td>\n<td>rewrites every file with a changed row<\/td>\n<td>plain files<\/td>\n<\/tr>\n<tr>\n<td>merge-on-read, v2<\/td>\n<td>new rows + position delete files (file, row)<\/td>\n<td>merge deletes<\/td>\n<\/tr>\n<tr>\n<td>merge-on-read, v3<\/td>\n<td>new rows + one deletion vector per data file (Puffin)<\/td>\n<td>one bitmap per file<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Maintenance, in order: <code>rewrite_data_files<\/code> (compaction, a <code>replace<\/code> snapshot), <code>expire_snapshots<\/code> (5 days and 1 snapshot kept by default; ends time travel), <code>remove_orphan_files<\/code> (3 days by default, refuses under 24 hours).<\/p>\n<h2>Streaming (lesson 11)<\/h2>\n<p>Count by event time, not processing time. <code>withWatermark(\"event_time\", \"10 minutes\")<\/code> on the window's column, before <code>groupBy(window(...))<\/code>. Watermark = latest event time seen minus the delay, applied from the next micro-batch. A window is final when the watermark reaches its end; an event is dropped only if its window has closed.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Output mode<\/th>\n<th>Writes<\/th>\n<th>State<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>append<\/td>\n<td>each row once, when final<\/td>\n<td>cleaned by watermark<\/td>\n<\/tr>\n<tr>\n<td>update<\/td>\n<td>rows changed in this batch<\/td>\n<td>cleaned by watermark<\/td>\n<\/tr>\n<tr>\n<td>complete<\/td>\n<td>the whole result, every batch<\/td>\n<td>never cleaned<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Exactly once = replayable source (Kafka offsets) + checkpoint (<code>offsets/<\/code>, <code>commits/<\/code>, <code>state/<\/code>) + idempotent or transactional sink (Iceberg records the batch id; <code>foreachBatch<\/code> must use it). Real-time Mode: Spark 4.1 stateless, 4.3 stateful, Kafka only. Flink: streaming-first, large keyed state.<\/p>\n<h2>Engines (lesson 12)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Engine<\/th>\n<th>Use it for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DuckDB<\/td>\n<td>anything one machine reads in time: ad hoc, reports, tests; reads Parquet and Iceberg in place<\/td>\n<\/tr>\n<tr>\n<td>Spark<\/td>\n<td>long batch jobs, backfills, big joins and shuffles, Structured Streaming<\/td>\n<\/tr>\n<tr>\n<td>Trino<\/td>\n<td>interactive SQL for many users over the lake and other sources<\/td>\n<\/tr>\n<tr>\n<td>ClickHouse<\/td>\n<td>sub-second queries on fresh events, in its own storage<\/td>\n<\/tr>\n<tr>\n<td>Flink<\/td>\n<td>streaming as the product: per-event latency, very large state<\/td>\n<\/tr>\n<tr>\n<td>Airflow 3<\/td>\n<td>orchestration; DAGs triggered when assets (tables) change<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","recap":["A scan costs the bytes it reads over the slowest stage's bandwidth. Read fewer bytes (columns, compression, partitions, min/max) before you add machines, and size every job by its bytes after pruning, not by the size of the table.","The ideas that survived Hadoop are blocks read in parallel, map then shuffle by key then reduce, and partitions as folders. Hive's metastore became the first catalog, and its non-atomic folders are why table formats exist.","Parquet stores each column apart with min/max per row group in a footer, so engines read only the columns and row groups a query can use, and only if the data is sorted or clustered on the filter column.","Spark builds a lazy plan, Catalyst optimizes it, and executors run one task per partition. Every wide step adds a shuffle and a stage. AQE re-plans at each shuffle with real sizes.","Most Spark tuning is about the shuffle: how many partitions, whether a join broadcasts its small side or sort-merges both, and whether one hot key turns one task into the whole job.","Spark 4 runs clients over Connect, fails bad data loudly in ANSI mode, and stores JSON as VARIANT.","An Iceberg table is Parquet files plus a tree of metadata, committed by a compare-and-swap in a catalog. That gives atomic commits, snapshots and time travel, safe schema and partition changes, and row-level corrections by copy-on-write or merge-on-read, kept healthy by compaction and snapshot expiry.","Streams are grouped by event time. A watermark decides when a window is final and bounds state, the output mode decides what each batch writes, and exactly once needs a replayable source, a checkpoint and an idempotent sink.","With one copy of the data in an open table format behind a catalog, each workload picks its engine by the numbers: DuckDB when one machine is enough, Trino for shared interactive SQL, Spark for heavy batch, a streaming engine for continuous work."],"quiz":[{"q":"A 5 TB payments table holds 2 years of daily partitions and 50 columns of similar size. An analyst's query reads 5 columns of the last 10 days. Which estimate should drive the choice of engine?","options":["5 TB, the size of the table","About 68 GB, the last 10 days","About 6.8 GB: 10 of 730 days and 5 of 50 columns, a few seconds on one machine","The number of rows, because engines process rows"],"answer":2,"why":"5 TB x 10 / 730 = 68 GB for the days, x 5 / 50 = 6.8 GB for the columns. At 2 to 3 GB/s that's a few seconds on one machine, so DuckDB is enough. Sizing by the table's 5 TB is the mistake lessons 1 and 12 both warn about; 68 GB forgets that Parquet reads only the columns a query uses.","from":null},{"q":"A MapReduce job computes the average amount per merchant. To shrink the shuffle you add a combiner. What must the map and combine steps emit?","options":["A (sum, count) pair per merchant, which the reducer adds up and divides at the end","The average of each map task's amounts, which the reducer averages again","Every amount unchanged, because averages can't be combined","The maximum amount, which bounds the average"],"answer":0,"why":"A combiner is safe only for associative and commutative work. An average of averages is wrong when map tasks see different numbers of rows; sums and counts add correctly, and the reducer divides once. Sending every amount is correct but throws away the combiner's saving.","from":null},{"q":"A Hive table is partitioned by a <code>dt<\/code> string column; an Iceberg table is <code>PARTITIONED BY (days(created_at))<\/code>. Both get <code>WHERE created_at &gt;= '2026-11-01' AND created_at &lt; '2026-11-02'<\/code>. What happens?","options":["Both prune to one day","Neither prunes, because the filter is on a timestamp","The Hive table prunes, Iceberg doesn't, because Iceberg has no partition folders","The Hive table reads every partition, because the filter isn't on <code>dt<\/code>; Iceberg derives the day from <code>created_at<\/code> and reads one"],"answer":3,"why":"In Hive the partition value lives only in the <code>dt<\/code> folder name, so only a filter on <code>dt<\/code> can skip folders. Iceberg's hidden partitioning records that each file's partition is <code>day(created_at)<\/code>, so a range on <code>created_at<\/code> becomes a range of days and the other days' files are skipped from the manifests.","from":null},{"q":"Which sentence puts Parquet, Iceberg and an Iceberg REST catalog such as Apache Polaris in the right roles?","options":["Parquet is the table format, Iceberg the file format, Polaris the query engine","Parquet stores rows by column inside one file; Iceberg lists which files make up each version of a table; Polaris holds each table's current-metadata pointer and swaps it on commit","Iceberg is a database that stores Parquet; Polaris is its backup","All three are query engines that read the same files"],"answer":1,"why":"A file format describes bytes inside one file (columns, row groups, footer statistics). A table format describes a table as a set of such files, with snapshots, schemas and partition specs. The catalog maps names to each table's current metadata and makes commits atomic with a compare-and-swap. None of them runs queries; Spark, Trino and DuckDB do.","from":null},{"q":"A job reads Parquet, filters by status, adds a column with <code>withColumn<\/code>, groups by merchant and counts. With one input and AQE off, how many stages does the count action run?","options":["1, because Spark fuses everything","3: one per transformation type","2: the narrow steps run in one stage, and the <code>groupBy<\/code> adds a shuffle that starts a second","4: one per step"],"answer":2,"why":"Filter and <code>withColumn<\/code> are narrow: each output partition depends on one input partition, so they chain inside the same task as the scan. <code>groupBy<\/code> is wide: rows with the same merchant must meet, so Spark inserts an <code>Exchange<\/code>, which ends a stage. For one input, stages = Exchanges + 1 = 2.","from":null},{"q":"A filter over 2,000 input partitions leaves little data, and you want 20 output files. With <code>coalesce(20)<\/code> the whole job got slow. Why, and what fixes it?","options":["<code>coalesce<\/code> has no shuffle, so it pulls the stage before it, the filter, down to 20 tasks; <code>repartition(20)<\/code> adds a shuffle but lets the filter keep 2,000 tasks","<code>coalesce<\/code> shuffles everything; use <code>repartition(20)<\/code>, which doesn't","20 files is too few; write 2,000 files","<code>coalesce<\/code> only works on cached data"],"answer":0,"why":"<code>coalesce(n)<\/code> merges partitions without a shuffle, so there's no stage boundary: the scan and filter run in the same 20 tasks, each reading 100 input partitions. <code>repartition(20)<\/code> costs a shuffle of the filtered (small) data, but the expensive scan keeps its 2,000-way parallelism. That's the trade lesson 6 measured.","from":null},{"q":"A join of 2 billion payments with a merchants table is planned as <code>SortMergeJoin<\/code> because the optimizer estimated the filtered merchants side at 40 MB. At run time it turns out to be 2 MB. What does Spark 4 do by default?","options":["Keeps the sort-merge join; plans never change once they start","Fails, because the estimate was wrong","Broadcasts the 2 billion payments instead","AQE sees the real 2 MB after the shuffle stage and switches the join to a broadcast hash join, skipping the shuffle of the big side"],"answer":3,"why":"The static plan is chosen from estimates, and after a filter the estimate is often the whole input, so it lands above the 10 MB broadcast threshold. AQE, on by default, re-plans at each shuffle with real sizes and converts the join to a broadcast hash join when one side turns out small. You can also force it with <code>broadcast()<\/code> when you know better than the estimate.","from":null},{"q":"After upgrading to Spark 4, a nightly job fails on <code>CAST(amount AS DECIMAL(12,2))<\/code> because some rows hold <code>\"12,50\"<\/code>. What's the right fix?","options":["Set <code>spark.sql.ansi.enabled=false<\/code> so bad casts return NULL again","Use <code>try_cast<\/code> for that column and route rows where it returns NULL to a quarantine table","Cast to STRING instead","Retry the job until it passes"],"answer":1,"why":"Spark 4 turned ANSI mode on, so an invalid cast fails the query instead of silently returning NULL. Switching ANSI off brings back silent data loss for every column. <code>try_cast<\/code> returns NULL on purpose for just this expression, and quarantining those rows keeps them visible. Retrying can't fix bad input.","from":null},{"q":"A correction feed updates a few hundred payments every 5 minutes in an Iceberg table of 512 MB files. Reads happen all day. Which setup fits, and what must come with it?","options":["Merge-on-read (deletion vectors on format v3), plus scheduled compaction and snapshot expiry","Copy-on-write, with no maintenance needed","Appending corrected rows and deduplicating in every query","A new table for every batch"],"answer":0,"why":"Copy-on-write would rewrite every 512 MB file that holds a changed row, every 5 minutes. Merge-on-read writes small files of new rows plus deletes, and readers merge them. Without compaction those pile up and reads slow down, and without expiry the old files never leave the bucket.","from":null},{"q":"A fraud rule counts authorizations per merchant per 5 minutes. The consumer was down from 10:10 to 10:20, then read the backlog in a minute. Which statement is right?","options":["Counting by processing time is safer, because it never waits for late data","Both give the same counts once the backlog is read","Counting by event time puts each authorization in the window it happened in, and a watermark decides when each window is final; counting by arrival makes the backlog a fake spike at 10:20","A watermark makes processing-time counts correct"],"answer":2,"why":"Processing time is when the consumer read the event, so an outage empties some windows and floods the next. Event time is when the card was used, carried in the event, so the counts match reality whenever the events arrive. The watermark is what makes event-time windows finish: latest event time minus the allowed delay. It doesn't fix processing-time counts.","from":null}]}],"lessons":{"net-01":{"id":"net-01","track":"net","n":1,"title":"What happens when you curl a URL","ready":true,"minutes":40,"goal":"By the end you can split one HTTPS request into DNS, connect, TLS and server time, name the four layers it passes through and the address each one uses, and find the Ethernet, IP and TCP headers inside a real captured frame.","quiz":[{"q":"<code>curl -w<\/code> prints <code>dns 0.004  connect 0.030  tls 0.058  first byte 0.250<\/code>. Roughly how long did one round trip plus the server's own work take?","options":["250 ms","192 ms","58 ms","26 ms"],"answer":1,"why":"The numbers are cumulative from the start. The request left when TLS finished at 58 ms and the first byte came back at 250 ms, so 192 ms covers one round trip plus the server's work. 250 ms is the tempting answer, but it charges the server for DNS, the TCP handshake and TLS too.","from":null},{"q":"A packet goes from your laptop through three routers to a server, with no NAT on the way. What is still the same when it arrives?","options":["The destination MAC address","The source MAC address","The destination IP address and port","The TTL"],"answer":2,"why":"Every router strips the Ethernet header and writes a new one for the next link, so both MACs change at each hop, and every router lowers the TTL by one. The IP addresses and ports go end to end. A NAT on the path would rewrite them, which is lesson 3.","from":null},{"q":"A team says their load balancer works at L4. What can it use to choose a backend?","options":["The URL path of the HTTP request","The <code>Authorization<\/code> header","The JSON body of the request","The client's IP address and port, and the destination port"],"answer":3,"why":"An L4 balancer works at the transport layer: it sees IP addresses and ports, and forwards the TCP connection without reading what's inside it. Paths, headers and bodies live at L7, so routing on them needs a balancer that ends the connection and parses the HTTP.","from":null},{"q":"A kernel receives a frame with EtherType <code>0x0800<\/code>, IP protocol <code>17<\/code> and destination port <code>53<\/code>. Where do the bytes go?","options":["To a UDP socket bound to port 53, most likely a DNS server","To a TCP socket listening on port 53","Into the ARP cache","The kernel looks at the payload to work out what protocol it is"],"answer":0,"why":"Each header names what's inside it. <code>0x0800<\/code> says IPv4, protocol 17 says UDP (6 would be TCP) and port 53 picks the program, usually DNS. The kernel follows those fields and never inspects the payload to guess.","from":null},{"q":"Your service writes a 4,000-byte JSON body to a TCP socket in one <code>write()<\/code> call, over Ethernet. What does the server's code see?","options":["Three packets that it must join back together","One 4,000-byte packet, because it was one write","A stream of 4,000 bytes, which may come back from one <code>read()<\/code> or from several","An error, because the write is bigger than the MTU"],"answer":2,"why":"TCP cuts the bytes into segments of at most 1,460 bytes of data and puts them back in order at the receiver, so the application only sees a byte stream. A single <code>read()<\/code> can return part of it. That is why every protocol on TCP needs its own way to mark where a message ends, such as <code>Content-Length<\/code> in HTTP.","from":null}],"cards":[{"front":"What does <code>%{time_connect}<\/code> in <code>curl -w<\/code> measure?","back":"<p>Seconds from the start until the TCP handshake finished. It includes DNS time, so subtract <code>time_namelookup<\/code> to get the handshake alone.<\/p>"},{"front":"Which addresses change at every router hop?","back":"<p>The MAC addresses. Each router writes a new Ethernet header for the next link. IP addresses and ports stay the same unless a NAT rewrites them.<\/p>"},{"front":"The four layers of the internet stack, top to bottom?","back":"<p>Application (HTTP, DNS), transport (TCP, UDP), internet (IP), link (Ethernet, Wi-Fi).<\/p>"},{"front":"Which field in each header says what's inside it?","back":"<p>Ethernet: EtherType (<code>0x0800<\/code> = IPv4). IP: protocol (6 = TCP, 17 = UDP). TCP or UDP: the destination port picks the program.<\/p>"},{"front":"Segment, packet, frame: which layer sends which?","back":"<p>TCP sends segments, IP sends packets, Ethernet sends frames. A frame is the whole thing on the wire, all headers included.<\/p>"},{"front":"Why is the TCP MSS 1,460 on Ethernet?","back":"<p>The MTU is 1,500 bytes of payload per frame. Take off 20 bytes of IP header and 20 of TCP header.<\/p>"},{"front":"L4 versus L7 load balancer?","back":"<p>L4 forwards TCP or UDP by addresses and ports without reading the data. L7 ends the connection and reads the HTTP (paths, headers) to route it.<\/p>"}],"terms":[{"term":"Encapsulation","plain":"Each layer wrapping the data from the layer above in its own header."},{"term":"MAC address","plain":"A 48-bit address of a network card, used only on one link."},{"term":"IP address","plain":"The address of a machine, carried end to end across networks."},{"term":"Port","plain":"A 16-bit number that picks one program on a machine."},{"term":"Default gateway","plain":"The router a machine hands every packet that is not for its own network."},{"term":"MTU","plain":"The largest payload one frame can carry: 1,500 bytes on Ethernet."},{"term":"Round trip time (RTT)","plain":"How long a packet takes to reach the other end
